*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#0B1722; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent}
body{display:grid; place-items:center}
img{user-select:none; -webkit-user-drag:none}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u));
  overflow:hidden; isolation:isolate}
.stage__bg{position:absolute; left:0; top:0; width:calc(1920*var(--u));
  height:calc(1200*var(--u)); max-width:none; display:block; z-index:0}

/* ---------- 상단 크롬 — 원본에서 오려낸 종이 버튼 ---------- */
.ibtn-img{position:absolute; z-index:20; padding:0; border:0; background:none;
  cursor:pointer; display:block; transition:transform var(--t-fast) var(--e-out)}
.ibtn-img img{width:100%; height:100%; display:block}
@media (hover:hover){.ibtn-img:hover{transform:scale(1.05)}}
.ibtn-img:active{transform:scale(.92)}
.ibtn-img:focus-visible{outline:none}

/* §11.4 상단 아이콘 — 구워진 아이콘 대신 빈 원판 + SVG (§10-35). 세 아이콘은 뒤로 셰브론 크기(잉크 ≈ 40u)에 맞춘다 */
.ibtn-img .ico{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  fill:#6C4689; pointer-events:none}
.ibtn-img .ico--back{width:41%; height:41%}
.ibtn-img .ico--sound{width:57%; height:57%}
.ibtn-img .ico .wave{fill:none; stroke:#6C4689; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round}
/* 좌표·크기는 스크립트가 POS(원본에서 오려낸 위치 × 0.9375)로 넣는다 */
.at{position:absolute; left:calc(var(--x)*var(--u)); top:calc(var(--y)*var(--u));
  width:calc(var(--w)*var(--u)); height:calc(var(--h)*var(--u))}

/* 언어 토글 — 원본 원판에서 글자만 지우고 살아 있는 글자를 얹는다 */
.lang-face{position:absolute; inset:0; display:grid; place-items:center;
  color:var(--c-primary); font-family:var(--ff); font-weight:800; letter-spacing:-.02em}
/* §4.2 · §11.4 — 활성 47u · 비활성 35u + opacity .5, 간격 5u ('A' 높이 ≈ 뒤로 셰브론) */
.lang-face .on{font-size:calc(47*var(--u)); color:#6C4689; opacity:1}
.lang-face .off{font-size:calc(35*var(--u)); color:#6C4689;
  opacity:.5}
.lang-face i,.lang-face b{font-family:var(--ff); font-style:normal; font-weight:800;
  font-synthesis:none; transition:font-size var(--t-fast), opacity var(--t-fast)}
.lang-face span{display:flex; align-items:baseline; gap:calc(5*var(--u))}

/* 사운드 — 재생 중 살짝 흔들린다 */
#btnSay.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 반응형: 가장자리 크롬 (RESPONSIVE.css 의 .pp-edge-* 컨테이너 안) ---------- */
.pp-edge-tl>.ibtn-img,.pp-edge-tr>.ibtn-img{position:relative; flex:none}
.edge-sized{width:calc(var(--w)*var(--u)); height:calc(var(--h)*var(--u))}

/* ---------- 반짝이 튀기기 — 흙 대신 별가루 ---------- */
.spark-bit{position:absolute; z-index:28; width:var(--s); height:var(--s);
  background:var(--c); pointer-events:none; border-radius:50%;
  animation:bitFly .78s var(--e-out) forwards}
.spark-bit.star{border-radius:0;
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes bitFly{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
  15%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05) rotate(var(--rot))}}

/* ---------- 소년 — 원본에서 오려낸 레이어 ----------
   .boy-slot 이 자리·브리핑 이동(transform)을 맡고, 안쪽 .boy 가 반응 모션(transform)을 맡는다.
   둘을 나눠야 등장 이동과 들썩임 애니메이션이 서로 덮어쓰지 않는다 (DESIGN.md §1) */
.boy-slot{position:absolute; z-index:14; transform-origin:50% 100%;
  transition:transform .62s var(--e-out)}
.boy{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; transition:transform var(--t-fast) var(--e-out)}
.boy img{width:100%; height:100%; display:block}
.boy:active{transform:scale(.96)}
.boy:focus-visible{outline:none}
.boy.is-cheer{animation:boyHop .9s var(--e-out) 2}
@keyframes boyHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-42*var(--u))) rotate(-3deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-20*var(--u))) rotate(2deg)}}
.boy.is-huh{animation:boyHuh .8s var(--e-out)}
@keyframes boyHuh{0%,100%{transform:rotate(0)}
  25%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}

/* ---------- 오프닝 브리핑 (B-2_04 방식 · DESIGN.md §8.4) ----------
   진입하면 소년이 화면 가운데 아래로 나오며 커지고, 종이 말풍선에 문제를 띄워 읽어 준다.
   그동안 게임 화면은 딤으로 덮이고 잠긴다. 음성이 끝나면(또는 탭) 소년은 왼쪽 아래로 돌아간다.
   소년 중심 x 193u → 960u : translateX 767u / scale 1.18 → 머리 top ≈ 625u
   말풍선 박스 바닥 = 머리 top − 93u = 532u → 말풍선 top = 296u */
.veil{position:absolute; inset:0; z-index:12; background:rgba(0,0,0,.42);  /* 2026-09-23: 딤 검정 42% 통일 */
  opacity:0; visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
body.is-briefing .boy-slot{z-index:16;
  transform:translateX(calc(767*var(--u))) scale(1.18)}
body.is-briefing .boy{animation:boyTalk 1.5s var(--e-out) .5s infinite}
@keyframes boyTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-12*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}

/* 종이 말풍선 — 크림 종이 한 장 + 한 톤 어두운 종이 한 장을 겹쳐 두께를 만든다.
   CSS 그림자는 쓰지 않는다. 외곽은 가위로 오린 듯 미세하게 울퉁불퉁한 path 를 mask 로 쓴다.
   닥종이 grain(--paper-grain)은 원본 카드 면에서 뽑은 것 — overlay 로 면에 입힌다 */
.talk{position:absolute; left:50%; top:calc(296*var(--u)); z-index:17;
  width:calc(1080*var(--u)); height:calc(310*var(--u)); margin-left:calc(-540*var(--u));
  pointer-events:none; opacity:0; visibility:hidden;
  transform:translateY(calc(26*var(--u))) rotate(-1.4deg) scale(.94); transform-origin:50% 100%;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow),
             transform .5s var(--e-pop)}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none;
  transition-delay:.28s}
/* 두께감 — 원본 숫자 배지처럼 종이가 살짝 떠 있는 짧고 부드러운 그림자 (오프셋 종이 대신).
   mask 는 filter 뒤에 적용되므로 그림자는 바깥 .talk__paper 에 건다. 칩에는 걸지 않는다 */
.talk__paper{position:absolute; inset:0;
  filter:drop-shadow(0 calc(5*var(--u)) calc(5*var(--u)) rgba(46,28,10,.34))
         drop-shadow(0 calc(1.5*var(--u)) calc(1.5*var(--u)) rgba(46,28,10,.22))}
.talk__sheet{position:absolute; inset:0;

.talk__tag{position:absolute; left:calc(112*var(--u)); top:calc(-56*var(--u)); z-index:3;

/* ---------- 가이드 팝업 (DESIGN.md §8.5 형태를 이 화면 색으로) ---------- */
.guide{position:absolute; inset:0; z-index:35; display:grid; place-items:center;
  background:rgba(0,0,0,.42); opacity:0; pointer-events:none;
  transition:opacity var(--t-base) var(--e-out)}
.guide.on{opacity:1; pointer-events:auto}
/* 가이드 시트 공통 규격 1200×700u · 내용 무조건 가운데(flex 열) — DESIGN.md §8.5 · §11.9 [stated] */
.guide__sheet{position:relative; width:calc(1200*var(--u)); height:calc(700*var(--u));
  padding:calc(54*var(--u)) calc(60*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(26*var(--u)); text-align:center;
  transform:scale(.88); transition:transform var(--t-slow) var(--e-pop)}
.guide.on .guide__sheet{transform:none}
.guide__sheet > :not(.guide__paper):not(.guide__close){position:relative; z-index:1}
/* 찢은 종이 시트 — 문제판 크림 종이와 같은 결.
   .guide__rim  : 찢긴 자리의 흰 섬유(시트보다 살짝 크게, 거칠게)
   .guide__face : 크림 종이 면 + 닥종이 grain
   mask 는 filter 뒤에 적용되므로 들뜸 그림자는 바깥 .guide__paper 에 건다 */
.guide__paper{position:absolute; inset:0; z-index:0; pointer-events:none;
  filter:drop-shadow(0 calc(8*var(--u)) calc(9*var(--u)) rgba(10,20,26,.42))
         drop-shadow(0 calc(2*var(--u)) calc(2*var(--u)) rgba(10,20,26,.28))}
.guide__rim,.guide__face{position:absolute;
  -webkit-mask-size:100% 100%; mask-size:100% 100%;

/* DESIGN.css 의 :hover/:active 는 background 단축 속성이라 결을 지운다 — 같은 특이도로 결을 다시 깐다 */
.guide__close:hover,.guide__close:active{background-image:var(--felt); background-size:100% 100%;
  background-position:center; background-blend-mode:overlay}
@media (hover:hover){.guide__close:hover{transform:scale(1.05); background-color:#57318A}}
.guide__close:active{transform:scale(.92); background-color:var(--c-primary-dark)}
.guide__close:focus-visible{outline:none}
.guide__close svg{width:44%; height:44%; fill:none; stroke:currentColor;
  stroke-width:4.6; stroke-linecap:round; overflow:visible}
/* 스텝 — 글자색 #1F2937(--pp-ink) · 번호 #4A3210 on #E7B23C 로 전 화면 통일 [stated] */
.gstep{display:flex; align-items:center; justify-content:center; gap:calc(18*var(--u));
  font-size:calc(44*var(--u)); font-weight:800; color:#1F2937}
.gstep i{flex:none; display:grid; place-items:center; width:calc(64*var(--u)); height:calc(64*var(--u));
  border-radius:50%; background:#E7B23C; color:#4A3210; font-style:normal;
  font-size:calc(37*var(--u))}
.gstep b{white-space:nowrap}
.gdemo{display:flex; justify-content:center; gap:calc(16*var(--u)); align-items:center}
.gdemo img{height:calc(132*var(--u)); border-radius:calc(16*var(--u));
  box-shadow:0 calc(5*var(--u)) calc(9*var(--u)) rgba(20,35,45,.26)}
.gdemo img.pick{animation:gPick 2.4s var(--e-out) infinite}
@keyframes gPick{0%,60%,100%{transform:translateY(0)}20%,45%{transform:translateY(calc(-20*var(--u)))}}
.garrow{width:calc(44*var(--u)); fill:var(--ng-teal)}
.gtrack{display:flex; gap:calc(14*var(--u))}
.gtrack span{width:calc(150*var(--u)); height:calc(120*var(--u)); border-radius:calc(18*var(--u));
  background:rgba(18,48,64,.12); display:grid; place-items:center;
  overflow:hidden; background-size:100% 100%; background-position:center; background-repeat:no-repeat}
.gtrack span.filled{background-color:var(--ng-green)}
/* 놓을 칸 — 크림 시트 위에서 구분될 만큼만: 옅은 금빛 면 + 얇은 골드 테두리 + 은은한 번짐 */
.gtrack span.lit{
  background:radial-gradient(ellipse at 50% 45%, #FFEBB0 0%, #FFD97A 100%);
  box-shadow:inset 0 0 0 calc(3*var(--u)) #EDB94A,
             0 0 calc(10*var(--u)) calc(1*var(--u)) rgba(255,200,80,.30);
  animation:litPulse 1.7s ease-in-out infinite}
@keyframes litPulse{
  0%,100%{box-shadow:inset 0 0 0 calc(3*var(--u)) #EDB94A, 0 0 calc(8*var(--u)) calc(1*var(--u)) rgba(255,200,80,.22)}
  50%{box-shadow:inset 0 0 0 calc(3*var(--u)) #EDB94A, 0 0 calc(14*var(--u)) calc(2*var(--u)) rgba(255,200,80,.42)}}
.gtrack img{height:calc(96*var(--u))}

/* ---------- 완료 팝업 (DESIGN.md §8.3) ---------- */
/* §8.3 완료 화면 규격 — 딤 rgba(0,0,0,.42) · z 60 · gap 44u · 그림 그림자 · 문구 흰색 54u */
.win{position:absolute; inset:0; z-index:60; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.42);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(900*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u)));
  transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(268*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg,
    rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
          mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle, rgba(255,232,148,.85) 0%,
    rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}
.win__art{position:relative; z-index:2; width:calc(340*var(--u)); height:auto; display:block;
  filter:drop-shadow(0 calc(12*var(--u)) calc(20*var(--u)) rgba(80,40,10,.28));
}
.win.on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-3.5%) rotate(-1.5deg)}
  60%{transform:translateY(-1.5%) rotate(1.5deg)}}
/* 완료 화면 버튼 — 이 화면 오브젝트(카드·캐릭터)와 같은 닥종이 결을 면에 입힌다.
   모양·크기·색은 DESIGN.css §8.3 을 그대로 쓰고, mask 안쪽 면에만 grain 을 overlay 한다.
   ::after = 윗면 / ::before = 두께. grain 은 무채색이라 색은 --face 계열이 그대로 정한다.

/* 닫기 버튼과 같은 규칙: 마우스오버는 한 단 어둡게, 누르면 더 어둡게 */
.win__actions .btn--retry{--face-hover:#57318A; --face-press:#4A2874}
.win__actions .btn--exit{--face-hover:#EC8F00; --face-press:#B86F00}
.win__actions .btn-bar::before,
.win__actions .btn-bar::after,
.win__actions .btn-bar:hover::after,
.win__actions .btn-bar:active::after{
  background-image:var(--felt); background-size:100% 100%;
  background-repeat:no-repeat; background-position:center; background-blend-mode:soft-light}
.win__actions .btn-bar::before{background-color:var(--face-active)}
.win__actions .btn-bar::after{background-color:var(--face)}
@media (hover:hover){
  .win__actions .btn-bar:hover::after{background-color:var(--face-hover)}
}
.win__actions .btn-bar:active::after{background-color:var(--face-press)}

.win__stack .win__actions{position:relative; z-index:3}
.win__sparks{position:absolute; left:50%; top:calc(20*var(--u)); transform:translateX(-50%);
  width:calc(600*var(--u)); height:calc(512*var(--u)); z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s);
  background:var(--c); opacity:0; animation:twinkle 2.4s var(--e-out) infinite;
  animation-delay:var(--d);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}
  35%{opacity:1; transform:scale(1) rotate(35deg)}
  70%{opacity:.35; transform:scale(.75) rotate(70deg)}}
.win__confetti{position:absolute; left:50%; top:calc(150*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h);
  background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}
  12%{opacity:1}70%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}


/* ============================================================
   B-3_03 DECOMPOSITION — 탱그램 조각으로 동물 만들기 (B-3_02 틀 · DESIGN.md §11 종이 테마)
   크림 판(배경 이미지) 안: 왼쪽 = 동물 그림자 + 같은 색 자리, 오른쪽 = 조각 트레이 → 완성 후 「나는 누구일까요?」
   ============================================================ */
:root{ --ink:#1F2937; --lift-s:drop-shadow(0 calc(3*var(--u)) calc(3*var(--u)) rgba(46,28,10,.36)) drop-shadow(0 calc(1*var(--u)) calc(1*var(--u)) rgba(46,28,10,.24));
  --lift-m:drop-shadow(0 calc(5*var(--u)) calc(5*var(--u)) rgba(46,28,10,.34)) drop-shadow(0 calc(1.5*var(--u)) calc(1.5*var(--u)) rgba(46,28,10,.22)) }
/* 동물 그림자 + 같은 색 자리 */
.field{position:absolute; z-index:6; pointer-events:none; overflow:visible}
.field svg{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible}
.field .sil{fill:rgba(62,36,14,.30); stroke:rgba(62,36,14,.30); stroke-width:1.2; stroke-linejoin:round}
.field .slot{fill:var(--c); fill-opacity:.22; stroke:rgba(106,75,51,.38); stroke-opacity:1; stroke-width:calc(3.4*var(--u));
  vector-effect:non-scaling-stroke; stroke-dasharray:calc(11*var(--u)) calc(9*var(--u)); stroke-linejoin:round;
  transition:opacity .25s var(--e-out)}
.field .slot.is-next{animation:slotGlow 1.1s ease-in-out infinite}
.field .slot.is-filled{opacity:0}
@keyframes slotGlow{0%,100%{fill-opacity:.22; stroke-width:calc(3.4*var(--u))}50%{fill-opacity:.5; stroke-width:calc(5*var(--u))}}
/* 조각 */
.tp{position:absolute; z-index:10; left:calc(var(--cx)*var(--u)); top:calc(var(--cy)*var(--u));
  width:calc(var(--pw)*var(--u)); height:calc(var(--ph)*var(--u));
  transform:translate(-50%,-50%) scale(var(--s)); transform-origin:50% 50%;
  touch-action:none; user-select:none; -webkit-user-select:none; pointer-events:none;
  filter:none;
  transition:left .38s var(--e-pop), top .38s var(--e-pop), transform .26s var(--e-out), filter .2s linear}
.tp svg{position:absolute; left:50%; top:50%; translate:-50% -50%; transform-origin:50% 50%; display:block; overflow:visible; pointer-events:none; transition:opacity .16s linear}
.tp .sv-src polygon{pointer-events:auto; cursor:grab}
.tp .sv-dst{opacity:0}
.tp.is-placed .sv-dst{opacity:1}
.tp.is-placed .sv-src{opacity:0}
.tp .sv-src{transition:opacity .16s linear, transform .3s cubic-bezier(.25,.8,.3,1)}
.tp.is-drag .sv-src{transition:opacity .16s linear, transform .22s cubic-bezier(.25,.8,.3,1)}
.tp.is-drag .sv-src polygon{cursor:grabbing}
.tp polygon{fill:var(--c); stroke:var(--c); stroke-width:.35; stroke-linejoin:round}
@media (hover:hover){.tp:not(.is-placed):not(.is-drag):hover{transform:translate(-50%,-50%) scale(calc(var(--s)*1.06))}}
.tp.is-drag{z-index:25; cursor:grabbing; transition:transform .16s var(--e-out), filter .2s linear;
  filter:var(--lift-m)}
.tp.is-placed{z-index:9; pointer-events:none; cursor:default; transform:translate(-50%,-50%) scale(1); filter:none}
.tp.is-hint{animation:tpHint 1s ease-in-out infinite}
@keyframes tpHint{0%,100%{transform:translate(-50%,-50%) scale(var(--s))}50%{transform:translate(-50%,-50%) scale(calc(var(--s)*1.1)) rotate(-3deg)}}
.field.is-done ~ .tp.is-placed{transition:transform .5s var(--e-pop)}
.group{position:absolute; z-index:9; pointer-events:none}
.group.is-hop{animation:grpHop .9s var(--e-out) 2}
@keyframes grpHop{0%,100%{transform:none}35%{transform:translateY(calc(-30*var(--u))) rotate(-2deg)}65%{transform:translateY(0) rotate(.8deg)}}
/* 이름표 */
.nameTag{position:absolute; z-index:12; left:calc(710*var(--u)); top:calc(var(--pt)*var(--u)); transform:translate(-50%,calc(-30%)) scale(.9);
  padding:calc(14*var(--u)) calc(56*var(--u)); border-radius:calc(36*var(--u)); background:var(--ng-cream) var(--paper-grain) center/100% 100% no-repeat; background-blend-mode:overlay; filter:var(--lift-m);
  font-size:calc(70*var(--u)); font-weight:800; letter-spacing:-.01em; color:#12905A; opacity:0; white-space:nowrap;
  transition:opacity .3s var(--e-out), transform .45s var(--e-pop)}
.nameTag.on{opacity:1; transform:translate(-50%,-50%) scale(1)}
/* 나는 누구일까요? — 트레이 자리에 문제 칩 + 보기 3장 */
.ask{position:absolute; z-index:11; left:calc(997*var(--u)); top:calc(var(--pt)*var(--u)); width:calc(650*var(--u)); height:calc(650*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(26*var(--u));
  opacity:0; visibility:hidden; transform:translateY(calc(24*var(--u))) scale(.94);
  transition:opacity .35s var(--e-out), transform .5s var(--e-pop), visibility .35s}
.ask.on{opacity:1; visibility:visible; transform:none}
.ask__chip{width:calc(380*var(--u)); height:calc(100*var(--u)); display:grid; place-items:center; border-radius:calc(30*var(--u));
  background:#E7B23C var(--paper-grain) center/100% 100% no-repeat; background-blend-mode:overlay; color:#4A3210; font-size:calc(40*var(--u)); font-weight:800;
  filter:var(--lift-s); white-space:nowrap}
.opt{position:relative; width:calc(440*var(--u)); height:calc(124*var(--u)); padding:0; border:0; cursor:pointer;
  border-radius:calc(44*var(--u)); background:var(--ng-cream) var(--paper-grain) center/100% 100% no-repeat; background-blend-mode:overlay;
  color:var(--ink); font-family:var(--ff); font-size:calc(58*var(--u)); font-weight:800; letter-spacing:-.01em;
  filter:var(--lift-m); transition:transform .18s var(--e-out), background-color .2s, opacity .3s}
@media (hover:hover){.opt:hover{transform:translateY(calc(-8*var(--u))) scale(1.03)}}
.opt:active{transform:scale(.96)}
.opt:focus-visible{outline:none}
.opt.is-ok{background-color:#CFE8B8; animation:optOk .6s var(--e-pop)}
.opt.is-no{background-color:#F2C6B8; animation:cardShake .42s var(--e-out)}
.opt.is-off{opacity:.28; pointer-events:none}
@keyframes optOk{0%{transform:scale(.94)}60%{transform:scale(1.07)}100%{transform:scale(1.03)}}
@keyframes cardShake{0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(calc(-16*var(--u))) rotate(-3deg)}45%{transform:translateX(calc(14*var(--u))) rotate(2.5deg)}70%{transform:translateX(calc(-8*var(--u))) rotate(-1.5deg)}}
/* 가이드 데모 */
.gdemo{gap:calc(30*var(--u)); align-items:center; height:calc(150*var(--u))}
.gdemo svg,.gtrack svg{height:calc(120*var(--u)); width:auto; overflow:visible; filter:var(--lift-s)}
.gdemo svg.pick{animation:gPick 2.4s var(--e-out) infinite}
.gtrack{gap:calc(30*var(--u)); height:calc(150*var(--u)); align-items:center}
.gtrack span{width:calc(130*var(--u)); height:calc(130*var(--u)); border-radius:calc(18*var(--u)); background:none; overflow:visible; display:grid; place-items:center}
.gtrack span svg{filter:none}
.gtrack span.lit svg .gs{animation:gsPulse 1.2s ease-in-out infinite}
.gtrack span .gp{opacity:0}
.gtrack span.lit .gp{animation:gpDrop 2.4s var(--e-out) infinite; filter:var(--lift-s)}
.gtrack span.lit{background:none; box-shadow:none; animation:none}
@keyframes gsPulse{0%,100%{fill-opacity:.16}50%{fill-opacity:.55}}
@keyframes gpDrop{0%,25%{opacity:0; transform:translateY(calc(-60*var(--u)))}50%,85%{opacity:1; transform:none}100%{opacity:0}}
/* 완료 팝업 — 동물 3마리가 차례로 폴짝 */
.win__rays,.win__glow{top:calc(134*var(--u))}
.win__sparks{top:calc(-122*var(--u))}
.win__confetti{top:calc(18*var(--u))}
.win__strip{position:relative; z-index:2; display:flex; gap:calc(40*var(--u)); align-items:center; justify-content:center}
.win__chip{width:calc(228*var(--u)); height:calc(228*var(--u)); border-radius:50%; display:flex; align-items:center; justify-content:center; box-sizing:border-box;
  background:radial-gradient(circle at 36% 30%, #FFFAE8 0%, #FBEBC4 100%);
  box-shadow:inset 0 0 0 calc(9*var(--u)) #2FA39A, 0 calc(12*var(--u)) calc(26*var(--u)) rgba(20,12,4,.38)}
.win__chip svg{width:auto; display:block; overflow:visible; filter:drop-shadow(0 calc(4*var(--u)) calc(5*var(--u)) rgba(60,36,10,.26))}
.win.on .win__chip{animation:animalHop .9s var(--e-out) calc(.3s + var(--i)*.18s) 2}
@keyframes animalHop{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(calc(-34*var(--u))) rotate(-2deg)}65%{transform:translateY(0) rotate(.6deg)}}

/* 완료 팝업이 뜨면 게임판은 비운다 — 딤 뒤에 보기 카드가 비치지 않게 */
#play,#ask,#nameTag{transition:opacity .4s var(--e-out)}
body.is-won #nameTag,body.is-won .spark-bit{opacity:0}

/* 판 두 장 — 왼쪽 작업 판(청록 테두리 + 갈색 종이 · B-3_02 칸과 같은 규칙), 오른쪽 조각 트레이(청록 펠트 카드 · §11.7) */
.panel{position:absolute; z-index:5; pointer-events:none; border-radius:calc(34*var(--u))}
.panel--work{left:calc(303*var(--u)); top:calc(var(--pt)*var(--u)); width:calc(650*var(--u)); height:calc(650*var(--u)); box-sizing:border-box;
  border-radius:calc(22*var(--u)); box-shadow:inset 0 0 0 calc(10*var(--u)) #2FA39A;
  background:linear-gradient(rgba(255,243,214,.2),rgba(255,243,214,.2)), var(--zface) 50% 50% / calc(1420*var(--u)) calc(720*var(--u)) no-repeat}
.panel--tray{left:calc(997*var(--u)); top:calc(var(--pt)*var(--u)); width:calc(650*var(--u)); height:calc(650*var(--u));
  background:#FCF9EE; border:calc(6*var(--u)) dashed #0C8998; box-sizing:border-box; filter:var(--lift-m);
  transition:filter .3s, background-color .4s}
.panel--tray.is-ask{background:#2F8E97 url(../img_png/paper/card-felt-teal.webp) center/100% 100% no-repeat; border-color:transparent}
/* 남은 조각 판 — 원본 B-2_03 의 카운터 나무판 */
.plank{position:absolute; z-index:12; left:calc(1360*var(--u)); top:calc(var(--pt)*var(--u)); width:calc(270*var(--u)); height:calc(84*var(--u));
  transform:translate(-50%,-52%); background:url(../img_png/paper/counter-plank-hf.webp) center/100% 100% no-repeat; filter:var(--lift-s);
  display:grid; place-items:center; transition:opacity .3s var(--e-out)}
.plank span{font-size:calc(46*var(--u)); font-weight:800; color:#FFD23F; letter-spacing:.04em; text-shadow:0 calc(3*var(--u)) 0 rgba(46,28,10,.55); padding-top:calc(4*var(--u))}
.plank.off{opacity:0}
.panel,.plank{transition:opacity .4s var(--e-out)}

/* 번호 배지(골드 종이 원판, §11.6) · 테두리에 걸친 문제 칩(§11.8) · 힌트 손가락(원본 B-2_03) */
.badge{position:absolute; z-index:13; pointer-events:none; width:calc(92*var(--u)); height:calc(92*var(--u)); top:calc(var(--pt)*var(--u) - 46*var(--u));
  filter:var(--lift-s); transition:opacity .3s var(--e-out)}
.badge img{width:100%; height:100%; display:block}
.hang{position:absolute; z-index:13; pointer-events:none; top:calc(var(--pt)*var(--u)); transition:opacity .3s var(--e-out)}
.hang .talk__tag{left:0; top:calc(-50*var(--u)); transform:scale(.8); transform-origin:0 50%}
.hang.off{opacity:0}
.hand{position:absolute; z-index:40; left:0; top:0; width:calc(130*var(--u)); aspect-ratio:534/717; opacity:0; pointer-events:none;
  filter:drop-shadow(0 calc(6*var(--u)) calc(6*var(--u)) rgba(46,28,10,.35))}
.hand img{display:block; width:100%; height:100%}

/* 작업 판 — 재단 매트처럼 옅은 모눈 */
.panel--work,.panel--tray{transition:left .5s var(--e-out), opacity .4s var(--e-out)}

/* ---------- 상단 동물 이름 버튼 16개 (첨부 PATTERN 칩 = .talk__tag 의 금빛 종이 조각) ---------- */
.aset{position:absolute; z-index:12; left:calc(972*var(--u)); top:calc(168*var(--u)); width:calc(1280*var(--u)); transform:translateX(-50%);
  display:flex; flex-wrap:wrap; justify-content:center; gap:calc(14*var(--u)) calc(14*var(--u)); transition:opacity .3s var(--e-out)}
/* DESIGN.md §3.2·§3.8 — mask 모양 버튼은 두께 층(::before)과 윗면(::after)을 같은 mask 로 겹친다.
   face / hover / active 3단계, hover 는 면만 밝게(두께 유지), 눌림은 윗면 lift×.66 · 두께 층 lift×.34 */
.abtn{flex:0 0 calc(196*var(--u)); --lift:5; --face:#F0B82D; --face-hover:#FFC94A; --face-active:#A8741A; --face-press:#D9A021; position:relative; isolation:isolate; height:calc(56*var(--u)); padding:0; border:0; background:none; cursor:pointer; font-family:var(--ff);
  -webkit-tap-highlight-color:transparent; outline:none; transition:transform .18s var(--e-out)}
.abtn::before,.abtn::after{content:''; position:absolute; inset:0; -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; z-index:-1}
.abtn::before{background:var(--face-active); transform:translateY(calc(var(--lift)*var(--u))); transition:transform .18s var(--e-out)}
.abtn::after{background-color:var(--face); background-image:var(--paper-grain); background-size:calc(460*var(--u)) calc(160*var(--u)); background-position:center; background-blend-mode:overlay; transition:background-color .18s, transform .18s var(--e-out)}
.abtn span{position:relative; z-index:1; display:flex; align-items:center; justify-content:center; height:100%;
  font-size:calc(29*var(--u)); font-weight:800; line-height:1; letter-spacing:.01em; color:#4A3210; white-space:nowrap; padding-top:calc(2*var(--u))}
.abtn:not(:disabled):hover::after{background-color:var(--face-hover)}
.abtn:not(:disabled):active::after{background-color:var(--face-press); transform:translateY(calc(var(--lift)*.66*var(--u)))}
.abtn:not(:disabled):active::before{transform:translateY(calc(var(--lift)*.34*var(--u)))}
.abtn:not(:disabled):active span{transform:translateY(calc(var(--lift)*.66*var(--u)))}
.abtn.is-cur{transform:scale(1.07); --face:#F2B92E}
.abtn:disabled{cursor:default}
body.is-won .aset{pointer-events:none}

/* 예시 이미지 카드 — 모눈종이 오른쪽 위 */
.exam{position:absolute; z-index:7; top:calc(var(--pt)*var(--u) + 24*var(--u)); width:calc(160*var(--u)); height:calc(188*var(--u)); padding:calc(10*var(--u));
  box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:space-between; transform:rotate(2.5deg);
  background:#fff var(--paper-grain) center/100% 100% no-repeat; background-blend-mode:overlay; border-radius:calc(16*var(--u)); border:calc(3*var(--u)) dashed #0C8998;
  filter:var(--lift-s); pointer-events:none; transition:opacity .3s var(--e-out)}
.exam #examImg{flex:1; width:100%; min-height:0; display:grid; place-items:center}
.exam #examImg svg{max-width:100%; max-height:100%}
.exam b{font-size:calc(24*var(--u)); font-weight:800; color:#0C7080; line-height:1; padding-top:calc(4*var(--u))}

.exam.off{opacity:0}

/* 삭제 요청: 번호 배지 · 문제 칩 · 예시 카드 · 남은 조각 판 · 오른쪽 판(박스+점선) */

<script>
(() => {
'use strict';
/* ============================================================
   1. 효과음 — WebAudio 합성 (B-2_06 SFX 모듈과 같은 값)
   ============================================================ */
/* 음소거 — 사운드 버튼 토글 (DESIGN.md §4.1 · §11.4, 2026-09-22) */
const MUTE = {on:false};
const SFX = (() => {
  let C = null, bgmBus = null, bgmOn = false, bgmAt = 0, bgmTm = null, noiseBuf = null;
  const ac = () => {
    if(MUTE.on) return null;           /* 음소거 중에는 새 소리를 만들지 않는다 */
    if(!C){
      try{ const AC = window.AudioContext || window.webkitAudioContext; C = new AC() }catch(e){ return null }
    }
    if(C.state === 'suspended') C.resume();
    return C;
  };
  function voice(freq, at, dur, o){
    o = o || {}; const c = ac(); if(!c) return;
    const t0 = c.currentTime + at, bus = o.bus || c.destination;
    const g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(o.cut || 5200, t0);
    const peak = o.gain || .12, atk = o.atk || .006;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    const osc = (type, mul, det) => {
      const s = c.createOscillator();
      s.type = type; s.frequency.setValueAtTime(freq * mul, t0);
      if(det) s.detune.setValueAtTime(det, t0);
      s.connect(g); s.start(t0); s.stop(t0 + dur + .04);
    };
    osc(o.type || 'sine', 1, 0);
    if(o.h2) osc('sine', 2, 4);
    g.connect(f); f.connect(bus);
  }
  const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));
  function swoosh(at, dur, f0, f1, gain){
    const c = ac(); if(!c) return;
    if(!noiseBuf){
      const n = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  }
  /* 오답 — 짧은 타격 뒤 음정이 크게 내려가는 두꺼운 경고음 */
  function wrongHit(){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime;
    const master = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.setValueAtTime(1.25, t0);
    lp.frequency.setValueAtTime(1800, t0);
    lp.frequency.exponentialRampToValueAtTime(620, t0 + .44);
    master.gain.setValueAtTime(.0001, t0);
    master.gain.exponentialRampToValueAtTime(.16, t0 + .008);
    master.gain.setValueAtTime(.14, t0 + .09);
    master.gain.exponentialRampToValueAtTime(.0001, t0 + .46);
    [
      {type:'square',   from:330, to:185, det:-5},
      {type:'sawtooth', from:220, to:110, det: 5}
    ].forEach(v => {
      const o = c.createOscillator();
      o.type = v.type; o.detune.setValueAtTime(v.det, t0);
      o.frequency.setValueAtTime(v.from, t0);
      o.frequency.exponentialRampToValueAtTime(v.to, t0 + .4);
      o.connect(master); o.start(t0); o.stop(t0 + .48);
    });
    master.connect(lp); lp.connect(c.destination);
    swoosh(0, .18, 1500, 260, .11);
    voice(98, .17, .32, {type:'triangle', gain:.13, atk:.004, cut:760, h2:true});
  }
  const C3=130.81, C4=261.63, G4=392, C5=523.25, E5=659.25, G5=784,
        C6=1046.5, E6=1318.5, G6=1568, C7=2093, E7=2637, G7=3136,
        A4=440, B4=493.88, D5=587.33, F5=698.46, A5=880, B5=987.77, D6=1174.7,
        F3=174.61, G3=196;
  const marimba = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'triangle', gain:gain, atk:.004, cut:4200, h2:true});
  const bell = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', gain:gain, atk:.004, cut:8000, h2:true});
  const BEAT = .28;
  const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
               [G5,2,.5],[E5,2.5,.5],[F5,3,1],[E5,4,.5],[D5,4.5,.5],
               [C5,5,.5],[E5,5.5,.5],[G5,6,1],[C5,7,1]];
  const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
  function bgmTone(freq, at, dur, type, gain){
    const c = ac(); if(!c || !bgmBus) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(bgmBus); o.start(at); o.stop(at + dur + .05);
  }
  function bgmLoop(){
    const c = ac(); if(!c || !bgmOn) return;
    if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;
    MEL.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'triangle', .055));

    bgmAt += 8 * BEAT;
    bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);
  }
  return {
    ctx(){ return C },
    unlock(){ ac() },
    tap(){ marimba(G5, 0, .14, .09) },
    step(i){ marimba([C5,D5,E5,G5,A5,C6][Math.min(i,5)], 0, .26, .11) },
    good(){ [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
            chord([C5,G5], .02, .5, {type:'triangle', gain:.05}) },

      [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(m => bell(m[0],m[1],m[2],.045));
    },
    bgmStart(delay){
      const c = ac(); if(!c) return;
      if(bgmOn) return;
      bgmOn = true;
      bgmBus = c.createGain(); bgmBus.gain.setValueAtTime(.9, c.currentTime);
      bgmBus.connect(c.destination);
      bgmAt = c.currentTime + (delay === undefined ? .35 : delay);
      bgmLoop();
    },
    bgmStop(){
      const c = ac(); bgmOn = false;
      if(bgmTm){ clearTimeout(bgmTm); bgmTm = null }
      if(bgmBus && c){
        const bus = bgmBus; bgmBus = null;
        try{
          const t0 = c.currentTime;
          bus.gain.setValueAtTime(bus.gain.value, t0);
          bus.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
        }catch(e){}
        setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
      }
    }
  };
})();

  let s = '<svg viewBox="-2 -2 ' + (a.w + 4) + ' ' + (a.h + 4) + '" class="' + (cls || '') + '" aria-hidden="true">';
  for(const c in a.pieces) s += '<polygon points="' + polyStr(a.pieces[c]) + '" fill="' + COL[c] + '" stroke="' + COL[c] + '" stroke-width=".9" stroke-linejoin="round"/>';
  return s + '</svg>';
}

/* ---------- 라운드 만들기 ---------- */
function buildRound(){
  drag = null; paintSet();
  clearTimeout(hintTm);
  pieces.forEach(p => p.el.remove()); pieces = [];
  if(field) field.remove(); if(group) group.remove(); group = null;
  nameEl.classList.remove('on'); askEl.classList.remove('on'); document.getElementById('trayCard').classList.remove('is-ask');
  placed = 0; wrongN = 0; locked = false; cntEl.textContent = '0 / 7'; document.getElementById('plank').classList.remove('off');
  const key = ROUNDS[round], a = ANIMALS[key];
  const S = PANEL.S, GAP = PANEL.gap, BX = 1015.5, PT = PANEL.top;
  const x0 = BX - (2 * S + GAP) / 2, tx0 = x0 + S + GAP, cxz = x0 + S / 2, cyz = PT + S / 2;
  const k = Math.min(ZONE.maxW / a.w, ZONE.maxH / a.h, ZONE.kMax);
  const ox = cxz - a.w * k / 2 + ZONE.dx, oy = cyz - a.h * k / 2 + ZONE.dy;
  geo = {key, a, k, ox, oy};
  workEl.style.left = cu(x0);
  trayEl.style.left = cu(tx0);
  plankEl.style.left = cu(tx0 + S / 2);
  askEl.style.left = cu(tx0);
  nameEl.style.left = cu(cxz);
  badgeEl.style.left = cu(x0 - 30); badgeEl.querySelector('img').src = BADGES[round % BADGES.length];
  hangEl.style.left = cu(x0 + 78); hangEl.classList.remove('off');
  examEl.style.left = cu(x0 + S - 22 - 160); examImg.innerHTML = animalSvg(key);
  hintN = 0; examEl.classList.remove('off');
  /* 그림자 + 같은 색 자리 */
  field = document.createElement('div'); field.className = 'field';
  field.style.cssText = 'left:' + cu(ox) + ';top:' + cu(oy) + ';width:' + cu(a.w * k) + ';height:' + cu(a.h * k);
  let h = '<svg viewBox="0 0 ' + a.w + ' ' + a.h + '" aria-hidden="true"><g>';
  for(const c in a.pieces) h += '<polygon class="sil" points="' + polyStr(a.pieces[c]) + '"/>';
  h += '</g><g>';
  for(const c in a.pieces) h += '<polygon class="slot" data-c="' + c + '" style="--c:' + COL[c] + '" points="' + polyStr(a.pieces[c]) + '"/>';
  field.innerHTML = h + '</g></svg>';
  playEl.appendChild(field);
  /* 오른쪽 판 — 워크시트 정사각형(조각 7개)을 그대로. 동물 조각과 같은 크기 비율로 환산 */
  let area = 0; for(const c in a.pieces){ const q = a.pieces[c]; let s2 = 0; q.forEach((pt, i) => { const n = q[(i + 1) % q.length]; s2 += pt[0] * n[1] - n[0] * pt[1] }); area += Math.abs(s2) / 2 }
  const f = Math.sqrt(area) / SQ_SIDE;                      /* 정사각형 1단위 = 동물 그림의 몇 px */
  const sRest = (SQ_SHOW / SQ_SIDE) / (f * k);              /* 오른쪽 판에서 보이는 배율 */
  Object.keys(a.pieces).forEach(c => {
    const pts = a.pieces[c], bb = bboxOf(pts), pad = 2;
    const sp = SQ[c].map(q => [(q[0] - SQ_OFF) * f, (q[1] - SQ_OFF) * f]), sb = bboxOf(sp);
    const bw = bb.x1 - bb.x0, bh = bb.y1 - bb.y0, sw = sb.x1 - sb.x0, sh = sb.y1 - sb.y0;
    const pw = (Math.max(bw, sw) + pad * 2) * k, ph = (Math.max(bh, sh) + pad * 2) * k;
    const cx = tx0 + S / 2 - PANEL.pull + ((sb.x0 + sb.x1) / 2 / f - SQ_SIDE / 2) * (SQ_SHOW / SQ_SIDE);
    const cy = cyz + ((sb.y0 + sb.y1) / 2 / f - SQ_SIDE / 2) * (SQ_SHOW / SQ_SIDE);
    const el = document.createElement('div'); el.className = 'tp'; el.dataset.c = c;
    el.setAttribute('role', 'button'); el.setAttribute('aria-label', c);
    el.style.cssText = '--c:' + COL[c] + ';--pw:' + pw + ';--ph:' + ph + ';--s:' + sRest.toFixed(3) + ';--cx:' + cx.toFixed(1) + ';--cy:' + cy.toFixed(1);
    const sv = (cls, bx, w, h) => '<svg class="' + cls + '" viewBox="' + (bx.x0 - pad) + ' ' + (bx.y0 - pad) + ' ' + (w + pad * 2) + ' ' + (h + pad * 2) + '" style="width:' + cu((w + pad * 2) * k) + ';height:' + cu((h + pad * 2) * k) + '"><polygon points="';
    el.innerHTML = sv('sv-src', sb, sw, sh) + polyStr(sp) + '"/></svg>' + sv('sv-dst', bb, bw, bh) + polyStr(pts) + '"/></svg>';
    const mean = q => [q.reduce((a, v) => a + v[0], 0) / q.length, q.reduce((a, v) => a + v[1], 0) / q.length];
    const ms = mean(sp), md = mean(pts); let best = {r:1, th:0, err:1e18};
    for(const r of [1, -1]){
      const A = sp.map(v => [(v[0] - ms[0]) * r, v[1] - ms[1]]), B = pts.map(v => [v[0] - md[0], v[1] - md[1]]);
      for(let i = 0; i < A.length; i++) for(let jx = 0; jx < B.length; jx++){
        const a1 = Math.atan2(A[(i + 1) % A.length][1] - A[i][1], A[(i + 1) % A.length][0] - A[i][0]);
        const b1 = Math.atan2(B[(jx + 1) % B.length][1] - B[jx][1], B[(jx + 1) % B.length][0] - B[jx][0]);
        for(const th of [b1 - a1, b1 - a1 + Math.PI]){ const co = Math.cos(th), si = Math.sin(th);
        let err = 0; for(const v of A){ const x = v[0] * co - v[1] * si, y = v[0] * si + v[1] * co; err += Math.min(...B.map(w => (w[0] - x) ** 2 + (w[1] - y) ** 2)) }
        if(err < (r === -1 ? best.err * 0.3 : best.err)) best = {r, th:Math.atan2(Math.sin(th), Math.cos(th)), err} }
      }
    }
    const mo = {r:best.r, th:best.th,
      e:[(ms[0] - (sb.x0 + sb.x1) / 2) * k, (ms[1] - (sb.y0 + sb.y1) / 2) * k],
      d:[(md[0] - (bb.x0 + bb.x1) / 2) * k, (md[1] - (bb.y0 + bb.y1) / 2) * k]};
    const p = {el, c, s:sRest, mo, home:{x:cx, y:cy}, target:{x:ox + (bb.x0 + bw / 2) * k, y:oy + (bb.y0 + bh / 2) * k},
               slot:field.querySelector('.slot[data-c="' + c + '"]'), ok:false};
    el.addEventListener('pointerdown', e => onDown(e, p));
    el.addEventListener('pointermove', e => onMove(e, p));
    el.addEventListener('pointerup', e => onUp(e, p));
    el.addEventListener('pointercancel', e => onUp(e, p));
    playEl.appendChild(el); pieces.push(p);
  });
  armHint();
}

/* ---------- 끌기 ---------- */
const toU = (e) => { const r = stage.getBoundingClientRect(), u = U(); return {x:(e.clientX - r.left) / u, y:(e.clientY - r.top) / u} };
function setPos(p, x, y){ p.el.style.setProperty('--cx', x.toFixed(1)); p.el.style.setProperty('--cy', y.toFixed(1)) }
function onDown(e, p){
  if(locked || briefing || p.ok || drag) return;
  SFX.unlock(); SFX.tap();
  drag = {p, id:e.pointerId};
  try{ p.el.setPointerCapture(e.pointerId) }catch(err){}
  p.el.classList.remove('is-hint'); p.el.classList.add('is-drag');
  p.el.style.transition = 'transform .16s var(--e-out), filter .2s linear';   /* 위치는 손가락을 바로 따라간다 */
  pieces.forEach(q => q.slot.classList.remove('is-next')); p.slot.classList.add('is-next');
  const m = toU(e); setPos(p, m.x, m.y - 20); morph(p, m.x, m.y - 20);
  clearTimeout(hintTm);
  if(handEl.getAnimations) handEl.getAnimations().forEach(x => x.cancel());
}
/* 끌 때 모양 변화는 정답 자리에 가까워질수록 서서히 — 거리 0~560u 구간에서 회전·크기·뒤집힘이 함께 진행 */
function morph(p, x, y){
  const d = Math.hypot(x - p.target.x, y - p.target.y);
  const d0 = Math.max(360, Math.hypot(p.home.x - p.target.x, p.home.y - p.target.y));   /* 집은 자리→정답 자리 전체 이동 거리 */
  let t = Math.min(1, Math.max(0, 1 - d / d0)); t = t * t * (3 - 2 * t);   /* 집는 순간 0, 도착 1 — 이동 전체에 걸쳐 천천히(기존: 마지막 560u에서 급변) */
  const mo = p.mo, th = mo.th * t, co = Math.cos(th), si = Math.sin(th), sx = mo.r === -1 ? 1 - 2 * (() => { const q = Math.min(1, Math.max(0, (t - .35) / .65)); return q * q * (3 - 2 * q) })() : 1;   /* 뒤집힘은 후반에 천천히 */
  /* M = R(th)·diag(sx,1), a = e + t(d-e) - M e */
  const Me = [co * sx * mo.e[0] - si * mo.e[1], si * sx * mo.e[0] + co * mo.e[1]];
  const ax = mo.e[0] + t * (mo.d[0] - mo.e[0]) - Me[0], ay = mo.e[1] + t * (mo.d[1] - mo.e[1]) - Me[1];
  const sv = p.el.querySelector('.sv-src');
  sv.style.transform = 'translate(calc(' + ax.toFixed(2) + '*var(--u)),calc(' + ay.toFixed(2) + '*var(--u))) rotate(' + th.toFixed(4) + 'rad) scale(' + sx.toFixed(3) + ',1)';
  p.el.style.transform = 'translate(-50%,-50%) scale(' + (p.s + (1.04 - p.s) * t).toFixed(3) + ')';
}
function morphClear(p){ p.el.querySelector('.sv-src').style.transform = ''; p.el.style.transform = '' }
function onMove(e, p){
  if(!drag || drag.p !== p) return;
  const m = toU(e); setPos(p, m.x, m.y - 20); morph(p, m.x, m.y - 20);
}
function onUp(e, p){
  if(!drag || drag.p !== p) return;
  drag = null;
  p.el.style.transition = '';
  p.el.classList.remove('is-drag');
  p.slot.classList.remove('is-next');
  const m = toU(e), cx = m.x, cy = m.y - 20;
  if(Math.hypot(cx - p.target.x, cy - p.target.y) <= SNAP){ morph(p, p.target.x, p.target.y); p.el.style.transform = ''; snapIn(p) }
  else { morphClear(p); setPos(p, p.home.x, p.home.y); SFX.tap(); armHint() }
}
function snapIn(p){
  p.ok = true; placed++; done++; cntEl.textContent = placed + ' / 7';
  setPos(p, p.target.x, p.target.y);
  p.el.classList.add('is-placed');
  p.slot.classList.add('is-filled');
  SFX.step(placed - 1); paintStars();
  burstAt(p.el);
  if(placed === pieces.length){
    locked = true; clearTimeout(hintTm);
    { const ep = epoch; setTimeout(() => { if(ep === epoch) assembled() }, 650) }
  } else armHint();
}
/* 한참 만지지 않으면 — 손가락이 남은 조각을 자리까지 끌어 보여 준다 (최대 3번) */
function armHint(){
  clearTimeout(hintTm);
  hintTm = setTimeout(() => {
    if(locked || briefing || drag || hintN >= MAX_HINTS) return;
    const p = pieces.find(q => !q.ok); if(!p) return;
    hintN++;
    p.el.classList.add('is-hint'); p.slot.classList.add('is-next');
    handShow(p.home, p.target);
    setTimeout(() => { p.el.classList.remove('is-hint'); p.slot.classList.remove('is-next') }, 3000);
    armHint();
  }, IDLE_MS);
}
function handShow(a, b){
  const u = U(), tipX = 47, T = (pt, dy) => 'translate(' + ((pt.x - tipX) * u) + 'px,' + ((pt.y + (dy||0)) * u) + 'px)';
  if(handEl.getAnimations) handEl.getAnimations().forEach(x => x.cancel());
  handEl.animate([
    {opacity:0, transform:T(a, 40), offset:0},
    {opacity:1, transform:T(a, 10), offset:.15},
    {opacity:1, transform:T(a, 10), offset:.28},
    {opacity:1, transform:T(b, 10), offset:.72},
    {opacity:1, transform:T(b, 10), offset:.86},
    {opacity:0, transform:T(b, 40), offset:1}
  ], {duration:2800, easing:'ease-in-out', fill:'none'});
}

/* ---------- 완성 → 「나는 누구일까요?」 ---------- */
function assembled(){
  SFX.good(); react('cheer');
  { const bi = built.indexOf(geo.key); if(bi >= 0) built.splice(bi, 1); built.push(geo.key) }
  /* 조각 7개를 한 덩어리로 묶어 폴짝 */
  const a = geo.a, k = geo.k;
  group = document.createElement('div'); group.className = 'group is-hop';
  group.style.cssText = 'left:' + cu(geo.ox) + ';top:' + cu(geo.oy) + ';width:' + cu(a.w * k) + ';height:' + cu(a.h * k);
  pieces.forEach(p => { group.appendChild(p.el); p.el.style.left = cu(p.target.x - geo.ox); p.el.style.top = cu(p.target.y - geo.oy) });
  playEl.appendChild(group);
  burstAt(group);
  { const ep = epoch; setTimeout(() => { if(ep === epoch) showPop() }, 1300) }
}
/* 완성 팝업 — 「THIS IS A / 동물 그림 / 이름」 카드. 탭하면 다음, 가만히 둬도 넘어간다 */
const popEl = document.getElementById('pop');
let popTm = null, popAt = 0;
function showPop(){
  const key = geo.key, t = I18N[lang];
  document.getElementById('popChip').textContent = t.popA;
  document.getElementById('popImg').innerHTML = animalSvg(key, 'anim');
  document.getElementById('popName').textContent = t.name[key];
  popEl.dataset.key = key; popAt = Date.now();
  popEl.classList.add('on');
  SFX.good(); say(lang, 'said:' + key);
  const ep = epoch; clearTimeout(popTm); popTm = setTimeout(() => { if(ep === epoch) popNext() }, 4200);
}
function popNext(){
  if(!popEl.classList.contains('on')) return;
  clearTimeout(popTm); popEl.classList.remove('on');
  round++;
  if(round >= ROUNDS.length) finish(); else buildRound();
}
function popHide(){ clearTimeout(popTm); popEl.classList.remove('on') }
popEl.addEventListener('click', () => { if(Date.now() - popAt > 700) popNext() });
function showAsk(){
  wrongN = 0; examEl.classList.add('off'); plankEl.classList.add('off'); hangEl.classList.add('off'); trayEl.classList.add('is-ask');
  const wrap = document.getElementById('askOpts'); wrap.innerHTML = '';
  shuffle(ROUNDS).forEach(key => {
    const b = document.createElement('button'); b.className = 'opt'; b.dataset.key = key;
    b.textContent = I18N[lang].name[key];
    b.addEventListener('click', () => pickOpt(b, key));
    wrap.appendChild(b);
  });
  document.getElementById('askChip').textContent = I18N[lang].ask;
  askEl.classList.add('on'); locked = false; asking = true;
  say(lang, 'ask');
}
let asking = false;
function pickOpt(b, key){
  if(!asking || briefing) return;
  SFX.unlock();
  if(key !== ROUNDS[round]){
    wrongN++; b.classList.remove('is-no'); void b.offsetWidth; b.classList.add('is-no');
    SFX.bad(); react('huh'); say(lang, 'name:' + key, {end(){ if(asking) say(lang, 'wrong') }});
    if(wrongN >= 2){ const w = [].find.call(document.querySelectorAll('.opt'), x => x.dataset.key !== ROUNDS[round] && !x.classList.contains('is-no') && !x.classList.contains('is-off')); if(w) w.classList.add('is-off') }
    return;
  }
  asking = false; locked = true; done++; paintStars();
  b.classList.add('is-ok'); SFX.good(); react('cheer'); burstAt(group || field);
  nameEl.textContent = I18N[lang].name[key] + '!'; nameEl.classList.add('on');
  say(lang, 'said:' + key);   /* 정답 — 이름이 들어간 문장("기린이야!")으로 읽는다 */
  { const ep = epoch; setTimeout(() => {
    if(ep !== epoch) return;
    round++;
    if(round >= ROUNDS.length) finish(); else buildRound();
  }, 2300) }
}

/* 반짝이 별가루 — 놓인 자리에서 위로 퍼진다 */
function burstAt(el){
  const colors = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#BFE3D8'];
  const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const cx = r.left - sr.left + r.width/2, cy = r.top - sr.top + r.height*0.5;
  const u = U(), N = 16;
  for(let i = 0; i < N; i++){
    const e2 = document.createElement('i');
    e2.className = 'spark-bit' + (i % 3 ? ' star' : '');
    const a = -Math.PI * (0.06 + 0.88 * (i / (N - 1)));
    const rad = (110 + (i % 4) * 34) * u;
    e2.style.cssText =
      'left:' + cx + 'px; top:' + cy + 'px;' +
      '--s:' + Math.round((9 + (i % 5) * 4) * u) + 'px;' +
      '--c:' + colors[i % colors.length] + ';' +
      '--dx:' + (Math.cos(a) * rad).toFixed(1) + 'px;' +
      '--dy:' + (Math.sin(a) * rad).toFixed(1) + 'px;' +
      '--rot:' + (i * 47 % 360) + 'deg;' +
      'animation-delay:' + (i * 14) + 'ms';
    stage.appendChild(e2);
    setTimeout(() => e2.remove(), 900);
  }
}

/* 소년 반응 */
let reactTm = null;
function react(kind){
  boyEl.classList.remove('is-cheer','is-huh');
  void boyEl.offsetWidth;
  boyEl.classList.add(kind === 'cheer' ? 'is-cheer' : 'is-huh');
  clearTimeout(reactTm);
  reactTm = setTimeout(() => boyEl.classList.remove('is-cheer','is-huh'), 1900);
}

/* 완료 팝업의 동물 3마리 */
const winStrip = document.getElementById('winStrip');
const built = [];                       /* 완성한 동물 — 완료 화면에는 최근 5마리만 */
function buildWinStrip(){
  winStrip.innerHTML = '';
  let pick = built.slice(-5);
  const last = pick.length ? SHEET.indexOf(pick[pick.length - 1]) : SHEET.length - 1;
  for(let n = 1; pick.length < 5 && n <= SHEET.length; n++){ const k = SHEET[(last - n + SHEET.length * 2) % SHEET.length]; if(pick.indexOf(k) < 0) pick.unshift(k) }
  pick.forEach((key, i) => {
    const chip = document.createElement('div'); chip.className = 'win__chip'; chip.style.setProperty('--i', i);
    chip.innerHTML = animalSvg(key); const sv = chip.firstChild, a = ANIMALS[key];
    sv.style.height = 'calc(' + Math.round(Math.min(146, 174 * a.h / a.w)) + '*var(--u))';
    winStrip.appendChild(chip);
  });
}

(function buildSparks(){
  const box = document.getElementById('winSparks');
  const COLORS = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#BFE3D8','#F7C8A0'];
  let seed = 20260921;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const N = 18;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + rnd() * .18;
    const rad = .40 + rnd() * .16;
    const el = document.createElement('i');
    el.className = 'spark';
    el.style.cssText =
      '--x:' + (50 + Math.cos(ang) * rad * 116) + '%;' +
      '--y:' + (50 + Math.sin(ang) * rad * 136) + '%;' +
      '--s:calc(' + (14 + Math.round(rnd() * 22)) + '*var(--u));' +
      '--c:' + COLORS[i % COLORS.length] + ';' +
      '--d:' + (rnd() * 2.2).toFixed(2) + 's';
    box.appendChild(el);
  }
})();
(function buildConfetti(){
  const box = document.getElementById('winConf');
  const C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#FFF6DF'];
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 250;
    const el = document.createElement('i');
    el.className = 'conf';
    el.style.cssText =
      '--w:calc(' + (12 + Math.round(rnd()*12)) + '*var(--u));' +
      '--h:calc(' + (16 + Math.round(rnd()*18)) + '*var(--u));' +
      '--c:' + C[i % C.length] + ';' +
      '--r:' + (rnd() < .4 ? '50%' : 'calc(4*var(--u))') + ';' +
      '--dx:calc(' + (Math.cos(ang)*dist).toFixed(0) + '*var(--u));' +
      '--dy:calc(' + (Math.sin(ang)*dist - 60).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd()*900 - 450) + 'deg;' +
      '--d:' + (rnd()*.35).toFixed(2) + 's';
    box.appendChild(el);
  }
})();



function finish(){
  SFX.clear(); buildWinStrip();
  document.body.classList.add('is-won');
  winEl.classList.add('on');
  setTimeout(() => SFX.fanfare(), 120);
  setTimeout(() => SFX.bgmStart(0), 3400);
  setTimeout(() => say(lang, 'win'), 900);
}
function resetGame(){
  SFX.bgmStop();
  winEl.classList.remove('on'); document.body.classList.remove('is-won');
  built.length = 0; epoch++; popHide(); round = 0; done = 0; asking = false; paintStars(); buildRound();
}

/* ============================================================
   6. 음성 — 모든 문장을 Pixie 녹음본 mp3 로 (DESIGN.md '생성 보이스 레지스트리')
      파일: audio/voice-q/q_b3_03_dec_{key}_{lang}.mp3 (녹음본이 없으면 TTS 로 읽는다)
      녹음본을 읽지 못하면 같은 문장을 TTS 로 읽는다
   ============================================================ */
let speakTm = null;
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
/* 문제음성 녹음본 — 상대 경로(HTML 과 같은 폴더 기준) */
const VOICE_DIR = '../audio/voice-q/';
function voiceSrc(l, key){
  return VOICE_DIR + 'q_b3_03_dec_' + key.replace(':','_') + '_' + l + '.mp3';
}
let qAudio = null;
function stopVoice(){
  if(qAudio){ qAudio.onended = qAudio.onerror = qAudio.onplaying = null; qAudio.pause(); qAudio = null }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function speakTTS(l, text, hooks){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (l === 'ko') ? 'ko-KR' : 'en-US';
    u.rate = (l === 'ko') ? 1 : .95;
    u.pitch = 1.15;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.indexOf(l) === 0);
    if(v) u.voice = v;
    sayFlag(true);
    clearTimeout(speakTm);
    u.onstart = () => { if(hooks.start) hooks.start() };
    u.onend = () => { sayFlag(false); if(hooks.end) hooks.end() };
    u.onerror = () => { sayFlag(false); if(hooks.end) hooks.end() };
    speakTm = setTimeout(() => sayFlag(false), 12000);
    speechSynthesis.speak(u);
  }catch(e){ sayFlag(false) }
}
/* 녹음본 재생. 파일을 못 읽으면 TTS 로 넘기고,
   자동재생 차단(NotAllowedError)이면 조용히 멈춘다 — 브리핑의 첫 탭 재시도가 다시 부른다 */
function playVoiceFile(src, l, text, hooks){
  const a = new Audio(src);
  qAudio = a;
  let fell = false;
  const fallback = () => {
    if(fell || qAudio !== a) return;
    fell = true; qAudio = null;
    speakTTS(l, text, hooks);
  };
  a.onplaying = () => {
    if(qAudio !== a) return;
    sayFlag(true);
    clearTimeout(speakTm);
    speakTm = setTimeout(() => sayFlag(false), 15000);
    if(hooks.start) hooks.start();
  };
  a.onended = () => {
    if(qAudio !== a) return;
    qAudio = null; sayFlag(false);
    if(hooks.end) hooks.end();
  };
  a.onerror = fallback;
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    if(err && err.name === 'NotAllowedError'){ if(qAudio === a) qAudio = null; sayFlag(false); return }
    fallback();
  });
}
function say(l, key, hooks){
  l = l || lang;
  const t = I18N[l];
  let text;
  if(key && key.indexOf('said:') === 0) text = t.said[key.slice(5)];
  else if(key && key.indexOf('name:') === 0) text = t.name[key.slice(5)];
  else text = t[key || 'instr'];
  if(!text || MUTE.on) return;
  hooks = hooks || {};
  stopVoice();
  const src = voiceSrc(l, key || 'instr');
  if(src){ playVoiceFile(src, l, text, hooks); return }
  speakTTS(l, text, hooks);
}



function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.getElementById('lgEn').className = ko ? 'off' : 'on';
  document.getElementById('lgKo').className = ko ? 'on'  : 'off';
  document.getElementById('btnLang').dataset.next = ko ? 'en' : 'ko';
  document.getElementById('btnLang').setAttribute('aria-label', ko ? 'English' : '한국어');
  if(typeof paintMute === 'function') paintMute();
  document.getElementById('stepA').textContent = t.stepA;
  document.getElementById('stepB').textContent = t.stepB;

  document.getElementById('talkTag').textContent = t.tag;
  document.getElementById('talkLine').textContent = t.instr;
  document.getElementById('askChip').textContent = t.ask;
  document.getElementById('chipTxt').textContent = t.chip;
  [].forEach.call(document.querySelectorAll('.opt'), b => { b.textContent = t.name[b.dataset.key] });
  if(nameEl.classList.contains('on')) nameEl.textContent = t.name[ROUNDS[round]] + '!';
  document.querySelector('#retry span').textContent = t.retry; document.querySelector('#exit span').textContent = t.exit;
  paintSet(); examTxt.textContent = t.exam;
  if(popEl.classList.contains('on')){ document.getElementById('popChip').textContent = t.popA; document.getElementById('popName').textContent = t.name[popEl.dataset.key] }
  document.documentElement.lang = lang;
}

/* ============================================================
   7. 브리핑 · 가이드 · 상단 버튼
   ============================================================ */
/* 브리핑 — B-2_04 흐름.
   진입 즉시 소년이 가운데로 나와 말풍선을 띄우고 문제를 읽는다.
   끝나는 조건: 음성이 끝남 / 음성이 시작되지 않으면 7s / 900ms 이후 아무 데나 탭.
   브라우저가 첫 탭 전 음성을 막는 경우, 첫 탭은 브리핑을 끝내지 않고 읽기를 시작한다 */
let briefing = true, briefTm = null, skipArmed = false, voiceOn = false, retried = false;
function briefSay(){
  voiceOn = false;
  say(lang, 'instr', {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false;
  document.body.classList.add('is-briefing');
  
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
  briefSay();
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm);
  document.body.classList.remove('is-briefing');
  armHint();
}
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.ibtn-img, .boy, .guide, .win, .tp, .opt')) return;
  if(!voiceOn && !retried && !qAudio && !('speechSynthesis' in window && speechSynthesis.speaking)){
    retried = true;
    clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
    briefSay(); return;
  }
  if(skipArmed) endBriefing();
});

function openGuide(){
  guideEl.classList.add('on');
  say(lang, 'guide');
}
function closeGuide(){ guideEl.classList.remove('on') }
boyEl.addEventListener('click', () => {
  SFX.tap();
  if(briefing){ briefSay(); return }
  openGuide();
});
document.getElementById('guideClose').addEventListener('click', () => { SFX.tap(); closeGuide() });
guideEl.addEventListener('pointerdown', e => { if(e.target === guideEl) closeGuide() });

/* 사운드 버튼 = 음소거 토글. 안내 다시 듣기는 소년을 누르면 된다 */
function paintMute(){
  const SAY_LABEL = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', SAY_LABEL[lang][MUTE.on ? 'on' : 'off']);
  btnSay.querySelectorAll('.wave:not(.x)').forEach(p => p.style.display = MUTE.on ? 'none' : '');
  btnSay.querySelector('.x').style.display = MUTE.on ? '' : 'none';
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){
    SFX.tap();
    MUTE.on = true;
    stopVoice();
    sayFlag(false);
    const c = SFX.ctx(); if(c && c.state === 'running') c.suspend();
  }else{
    MUTE.on = false;
    const c = SFX.ctx(); if(c && c.state === 'suspended') c.resume();
    if(winEl.classList.contains('on')){ SFX.bgmStop(); SFX.bgmStart(0) }
    SFX.tap();
  }
  paintMute();
});
document.getElementById('btnLang').addEventListener('click', e => {
  SFX.unlock(); SFX.tap();
  lang = e.currentTarget.dataset.next;
  applyLang();
  if(briefing) briefSay(); else say(lang, 'instr');
});
const leave = () => { SFX.tap(); location.href = 'B-3_00.submain.html' };
document.getElementById('btnBack').addEventListener('click', leave);
document.getElementById('exit').addEventListener('click', leave);
document.getElementById('retry').addEventListener('click', () => { SFX.tap(); resetGame() });



/* 가이드 데모 그림 — ① 조각을 끌어요 ② 같은 색 모양에 놓아요 */
(function buildGuideDemo(){
  const d = document.getElementById('gdemo'), tr = document.getElementById('gtrack');
  const SH = {tri:'0,0 60,0 0,60', sq:'0,0 44,0 44,44 0,44', para:'0,0 36,0 62,26 26,26'};
  const demo = [['tri','red'], ['sq','green'], ['para','purple']];
  const svg = (shape, col, extra) => '<svg viewBox="-4 -4 70 70" ' + (extra || '') + '><polygon points="' + SH[shape] + '" fill="' + COL[col] + '" stroke="' + COL[col] + '" stroke-width="1" stroke-linejoin="round"/></svg>';
  demo.forEach(([sh, c], i) => { d.insertAdjacentHTML('beforeend', svg(sh, c, i === 0 ? 'class="pick"' : '')) });
  demo.forEach(([sh, c], i) => {
    const sp = document.createElement('span'); if(i === 0) sp.className = 'lit';
    sp.innerHTML = '<svg viewBox="-4 -4 70 70" style="position:absolute"><polygon class="gs" points="' + SH[sh] + '" fill="' + COL[c] + '" fill-opacity=".16" stroke="' + COL[c] + '" stroke-width="2.4" stroke-dasharray="6 5" stroke-linejoin="round"/></svg>' +
      (i === 0 ? '<svg class="gp" viewBox="-4 -4 70 70" style="position:absolute"><polygon points="' + SH[sh] + '" fill="' + COL[c] + '" stroke="' + COL[c] + '" stroke-width="1" stroke-linejoin="round"/></svg>' : '');
    tr.appendChild(sp);
  });
})();

/* 첫 사용자 제스처에서 소리를 열고 문제를 읽어 준다 */
if('speechSynthesis' in window) speechSynthesis.getVoices();

applyLang();
paintStars();
buildRound();
startBriefing();
})();

<script>
/* 문제풀이 BGM — 개념별 공용 곡(puzzle-decomposition-blocks-loop). 첫 입력부터 반복 재생(자동재생 정책), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
(() => {
  const a = new Audio('../audio/bgm/puzzle-decomposition-blocks-loop.mp3');
  a.loop = true; a.preload = 'auto'; a.volume = .22;
  const $ = id => document.getElementById(id);
  const muted = () => { const b = $('btnSay') || document.querySelector('button[class*="soundButton"]'); return !!b && b.getAttribute('aria-pressed') === 'true' };
  const done = () => document.body.classList.contains('is-done') || !!document.querySelector('#win.on, [class*="_win_"]');
  let armed = false;
  const sync = () => {
    if(!armed) return;
    if(muted() || done() || document.hidden) a.pause();
    else if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}) }
  };
  let raf = 0; const soon = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; sync() }) };
  ['pointerdown','keydown'].forEach(t => window.addEventListener(t, () => { armed = true; sync() }, {passive:true}));
  document.addEventListener('visibilitychange', sync);
  new MutationObserver(soon).observe(document.body, {attributes:true, attributeFilter:['class','aria-pressed'], childList:true, subtree:true});
})();
</script>
