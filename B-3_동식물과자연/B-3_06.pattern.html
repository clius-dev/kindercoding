*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#0B1722; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent}
body{display:grid; place-items:center}
img{user-select:none; -webkit-user-drag:none}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u));
  overflow:hidden; isolation:isolate}
.stage__bg{position:absolute; left:0; top:0; width:calc(1920*var(--u));
  height:calc(1200*var(--u)); max-width:none; display:block; z-index:0}

/* ---------- 상단 크롬 — 원본에서 오려낸 종이 버튼 ---------- */
.ibtn-img{position:absolute; z-index:20; padding:0; border:0; background:none;
  cursor:pointer; display:block; transition:transform var(--t-fast) var(--e-out)}
.ibtn-img img{width:100%; height:100%; display:block}
@media (hover:hover){.ibtn-img:hover{transform:scale(1.05)}}
.ibtn-img:active{transform:scale(.92)}
.ibtn-img:focus-visible{outline:none}

/* §11.4 상단 아이콘 — 구워진 아이콘 대신 빈 원판 + SVG (§10-35). 세 아이콘은 뒤로 셰브론 크기(잉크 ≈ 40u)에 맞춘다 */
.ibtn-img .ico{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  fill:#6C4689; pointer-events:none}
.ibtn-img .ico--back{width:41%; height:41%}
.ibtn-img .ico--sound{width:57%; height:57%}
.ibtn-img .ico .wave{fill:none; stroke:#6C4689; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round}
/* 좌표·크기는 스크립트가 POS(원본에서 오려낸 위치 × 0.9375)로 넣는다 */
.at{position:absolute; left:calc(var(--x)*var(--u)); top:calc(var(--y)*var(--u));
  width:calc(var(--w)*var(--u)); height:calc(var(--h)*var(--u))}

/* 언어 토글 — 원본 원판에서 글자만 지우고 살아 있는 글자를 얹는다 */
.lang-face{position:absolute; inset:0; display:grid; place-items:center;
  color:var(--c-primary); font-family:var(--ff); font-weight:800; letter-spacing:-.02em}
/* §4.2 · §11.4 — 활성 47u · 비활성 35u + opacity .5, 간격 5u ('A' 높이 ≈ 뒤로 셰브론) */
.lang-face .on{font-size:calc(47*var(--u)); color:#6C4689; opacity:1}
.lang-face .off{font-size:calc(35*var(--u)); color:#6C4689;
  opacity:.5}
.lang-face i,.lang-face b{font-family:var(--ff); font-style:normal; font-weight:800;
  font-synthesis:none; transition:font-size var(--t-fast), opacity var(--t-fast)}
.lang-face span{display:flex; align-items:baseline; gap:calc(5*var(--u))}

/* 사운드 — 재생 중 살짝 흔들린다 */
#btnSay.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 반응형: 가장자리 크롬 (RESPONSIVE.css 의 .pp-edge-* 컨테이너 안) ---------- */
.pp-edge-tl>.ibtn-img,.pp-edge-tr>.ibtn-img{position:relative; flex:none}
.edge-sized{width:calc(var(--w)*var(--u)); height:calc(var(--h)*var(--u))}

/* ---------- 문제판 — 워크시트(PATTERN RECOGNITION, Step B-3) 그대로: 흰 칸 · 청록 선 · 점선 CUT 줄 ----------
   배치(u): 판 x300~1850 · y168~1078. 패턴 3줄(칸 140u × 10 = 1400u) x375 · 줄 피치 220u, CUT 줄 y905.
   소년(x50~335) 옆 여백 확보 */
:root{--wk-teal:#1E9FB4; --wk-ink:#14246B; --wk-hl:#E7B23C}
.rows{position:absolute; inset:0; z-index:6; pointer-events:none}
.row{position:absolute; left:calc(340*var(--u)); width:calc(1280*var(--u)); height:calc(128*var(--u)); pointer-events:auto}
.row--1{top:calc(264*var(--u))} .row--2{top:calc(498*var(--u))} .row--3{top:calc(732*var(--u))}

.obj{position:relative; display:block; filter:var(--pp-lift-s, drop-shadow(0 calc(2*var(--u)) calc(2*var(--u)) rgba(46,28,10,.26)));

@keyframes rowHop{0%,100%{transform:translateY(0)}35%{transform:translateY(calc(-14*var(--u)))}65%{transform:translateY(0)}80%{transform:translateY(calc(-5*var(--u)))}}

.tray{position:absolute; z-index:6; left:calc(340*var(--u)); top:calc(926*var(--u)); width:calc(1280*var(--u)); height:calc(128*var(--u))}
.tray__grid{position:absolute; inset:0; display:flex; justify-content:space-between}
.slot{position:relative; width:calc(128*var(--u)); height:calc(128*var(--u))}
/* CUT 카드 — DESIGN.md §11.3 · §11.7: 빈 틸 펠트 판(--pp-tx-card, 원본 해상도 그대로) + 들뜸 그림자 --pp-lift-s (box-shadow 두께 금지) */
.slot::before{content:""; position:absolute; left:calc(4*var(--u)); top:calc(8*var(--u)); width:calc(120*var(--u)); height:calc(112*var(--u));
  background:url("../img_png/paper/card-felt-teal.webp") center/100% 100% no-repeat;
  filter:var(--pp-lift-s, drop-shadow(0 calc(3*var(--u)) calc(3*var(--u)) rgba(46,28,10,.36)) drop-shadow(0 calc(1*var(--u)) calc(1*var(--u)) rgba(46,28,10,.24)))}
.tile{position:absolute; inset:0; display:grid; place-items:center; cursor:grab;
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  transition:transform .18s var(--e-out)}
.slot .tile.is-lifted{opacity:0}
.slot .tile.is-sel{transform:translateY(calc(-6*var(--u))) scale(1.07)}
.slot .tile.is-sel .obj{filter:var(--pp-lift-m, drop-shadow(0 calc(5*var(--u)) calc(5*var(--u)) rgba(46,28,10,.3))) drop-shadow(0 0 calc(5*var(--u)) var(--wk-hl)) drop-shadow(0 0 calc(2*var(--u)) var(--wk-hl))}
.slot .tile.is-hint{animation:ph-hint-shake .62s ease-in-out 3}
.ghost{position:fixed; inset:auto; z-index:90; margin:0; pointer-events:none; cursor:grabbing;
  transform:translate(-50%,-50%) scale(1.12) rotate(-2deg); filter:var(--pp-lift-l, drop-shadow(0 calc(10*var(--u)) calc(10*var(--u)) rgba(0,0,0,.3)))}
.ghost .obj{filter:none}
.ghost.is-fly{transition:left .26s var(--e-out), top .26s var(--e-out), transform .26s var(--e-out)}
.fx{position:fixed; inset:0; z-index:70; pointer-events:none}
.fx .bit{position:absolute; border-radius:50%; animation:ph-spark .5s ease-out 1 both}
@keyframes ph-spark{0%{transform:translate(-50%,-50%) scale(.4); opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9); opacity:0}}
@keyframes ph-hint-shake{0%,100%{transform:translate(0)}14%{transform:translate(-8%)}38%{transform:translate(7%)}62%{transform:translate(-6%)}84%{transform:translate(4%)}}

/* ---------- 소년 — 원본에서 오려낸 레이어 ----------
   .boy-slot 이 자리·브리핑 이동(transform)을 맡고, 안쪽 .boy 가 반응 모션(transform)을 맡는다.
   둘을 나눠야 등장 이동과 들썩임 애니메이션이 서로 덮어쓰지 않는다 (DESIGN.md §1) */
.boy-slot{position:absolute; z-index:14; transform-origin:50% 100%;
  transition:transform .62s var(--e-out)}
.boy{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; transition:transform var(--t-fast) var(--e-out)}
.boy img{width:100%; height:100%; display:block}
.boy:active{transform:scale(.96)}
.boy:focus-visible{outline:none}
.boy.is-cheer{animation:boyHop .9s var(--e-out) 2}
@keyframes boyHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-42*var(--u))) rotate(-3deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-20*var(--u))) rotate(2deg)}}
.boy.is-huh{animation:boyHuh .8s var(--e-out)}
@keyframes boyHuh{0%,100%{transform:rotate(0)}
  25%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}

/* ---------- 오프닝 브리핑 (B-2_04 방식 · DESIGN.md §8.4) ----------
   진입하면 소년이 화면 가운데 아래로 나오며 커지고, 종이 말풍선에 문제를 띄워 읽어 준다.
   그동안 게임 화면은 딤으로 덮이고 잠긴다. 음성이 끝나면(또는 탭) 소년은 왼쪽 아래로 돌아간다.
   소년 중심 x 193u → 960u : translateX 767u / scale 1.18 → 머리 top ≈ 625u
   말풍선 박스 바닥 = 머리 top − 93u = 532u → 말풍선 top = 296u */
.veil{position:absolute; inset:0; z-index:12; background:rgba(0,0,0,.42);  /* 2026-09-23: 딤 검정 42% 통일 */
  opacity:0; visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
body.is-briefing .boy-slot{z-index:16;
  transform:translateX(calc(767*var(--u))) scale(1.18)}
body.is-briefing .boy{animation:boyTalk 1.5s var(--e-out) .5s infinite}
@keyframes boyTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-12*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}

/* 종이 말풍선 — 크림 종이 한 장 + 한 톤 어두운 종이 한 장을 겹쳐 두께를 만든다.
   CSS 그림자는 쓰지 않는다. 외곽은 가위로 오린 듯 미세하게 울퉁불퉁한 path 를 mask 로 쓴다.
   닥종이 grain(--paper-grain)은 원본 카드 면에서 뽑은 것 — overlay 로 면에 입힌다 */
.talk{position:absolute; left:50%; top:calc(296*var(--u)); z-index:17;
  width:calc(1080*var(--u)); height:calc(310*var(--u)); margin-left:calc(-540*var(--u));
  pointer-events:none; opacity:0; visibility:hidden;
  transform:translateY(calc(26*var(--u))) rotate(-1.4deg) scale(.94); transform-origin:50% 100%;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow),
             transform .5s var(--e-pop)}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none;
  transition-delay:.28s}
/* 두께감 — 원본 숫자 배지처럼 종이가 살짝 떠 있는 짧고 부드러운 그림자 (오프셋 종이 대신).
   mask 는 filter 뒤에 적용되므로 그림자는 바깥 .talk__paper 에 건다. 칩에는 걸지 않는다 */

/* ---------- 가이드 팝업 (DESIGN.md §8.5 형태를 이 화면 색으로) ---------- */
.guide{position:absolute; inset:0; z-index:35; display:grid; place-items:center;
  background:rgba(0,0,0,.42); opacity:0; pointer-events:none;
  transition:opacity var(--t-base) var(--e-out)}
.guide.on{opacity:1; pointer-events:auto}
/* 가이드 시트 공통 규격 1200×700u · 내용 무조건 가운데(flex 열) — DESIGN.md §8.5 · §11.9 [stated] */
.guide__sheet{position:relative; width:calc(1200*var(--u)); height:calc(700*var(--u));
  padding:calc(54*var(--u)) calc(60*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(26*var(--u)); text-align:center;
  transform:scale(.88); transition:transform var(--t-slow) var(--e-pop)}
.guide.on .guide__sheet{transform:none}
.guide__sheet > :not(.guide__paper):not(.guide__close){position:relative; z-index:1}
/* 찢은 종이 시트 — 문제판 크림 종이와 같은 결.
   .guide__rim  : 찢긴 자리의 흰 섬유(시트보다 살짝 크게, 거칠게)
   .guide__face : 크림 종이 면 + 닥종이 grain
   mask 는 filter 뒤에 적용되므로 들뜸 그림자는 바깥 .guide__paper 에 건다 */
.guide__paper{position:absolute; inset:0; z-index:0; pointer-events:none;
  filter:drop-shadow(0 calc(8*var(--u)) calc(9*var(--u)) rgba(10,20,26,.42))
         drop-shadow(0 calc(2*var(--u)) calc(2*var(--u)) rgba(10,20,26,.28))}
.guide__rim,.guide__face{position:absolute;
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat}

/* DESIGN.css 의 :hover/:active 는 background 단축 속성이라 결을 지운다 — 같은 특이도로 결을 다시 깐다 */
.guide__close:hover,.guide__close:active{background-image:var(--felt); background-size:100% 100%;
  background-position:center; background-blend-mode:overlay}
@media (hover:hover){.guide__close:hover{transform:scale(1.05); background-color:#57318A}}
.guide__close:active{transform:scale(.92); background-color:var(--c-primary-dark)}
.guide__close:focus-visible{outline:none}
.guide__close svg{width:44%; height:44%; fill:none; stroke:currentColor;
  stroke-width:4.6; stroke-linecap:round; overflow:visible}
/* 스텝 — 글자색 #1F2937(--pp-ink) · 번호 #4A3210 on #E7B23C 로 전 화면 통일 [stated] */
.gstep{display:flex; align-items:center; justify-content:center; gap:calc(18*var(--u));
  font-size:calc(44*var(--u)); font-weight:800; color:#1F2937}
.gstep i{flex:none; display:grid; place-items:center; width:calc(64*var(--u)); height:calc(64*var(--u));
  border-radius:50%; background:#E7B23C; color:#4A3210; font-style:normal;
  font-size:calc(37*var(--u))}
.gstep b{white-space:nowrap}
.gdemo{display:flex; justify-content:center; gap:calc(16*var(--u)); align-items:center}
.gdemo img{height:calc(132*var(--u)); border-radius:calc(16*var(--u));
  box-shadow:0 calc(5*var(--u)) calc(9*var(--u)) rgba(20,35,45,.26)}
.gdemo img.pick{animation:gPick 2.4s var(--e-out) infinite}
@keyframes gPick{0%,60%,100%{transform:translateY(0)}20%,45%{transform:translateY(calc(-20*var(--u)))}}
.garrow{width:calc(44*var(--u)); fill:var(--ng-teal)}
.gtrack{display:flex; gap:calc(14*var(--u))}
.gtrack span{width:calc(150*var(--u)); height:calc(120*var(--u)); border-radius:calc(18*var(--u));
  background:rgba(18,48,64,.12); display:grid; place-items:center;
  overflow:hidden; background-size:100% 100%; background-position:center; background-repeat:no-repeat}
.gtrack span.filled{background-color:var(--ng-green)}
/* 놓을 칸 — 크림 시트 위에서 구분될 만큼만: 옅은 금빛 면 + 얇은 골드 테두리 + 은은한 번짐 */
.gtrack span.lit{
  background:radial-gradient(ellipse at 50% 45%, #FFEBB0 0%, #FFD97A 100%);
  box-shadow:inset 0 0 0 calc(3*var(--u)) #EDB94A,
             0 0 calc(10*var(--u)) calc(1*var(--u)) rgba(255,200,80,.30);
  animation:litPulse 1.7s ease-in-out infinite}
@keyframes litPulse{
  0%,100%{box-shadow:inset 0 0 0 calc(3*var(--u)) #EDB94A, 0 0 calc(8*var(--u)) calc(1*var(--u)) rgba(255,200,80,.22)}
  50%{box-shadow:inset 0 0 0 calc(3*var(--u)) #EDB94A, 0 0 calc(14*var(--u)) calc(2*var(--u)) rgba(255,200,80,.42)}}
.gtrack img{height:calc(96*var(--u))}


.gdemo span{width:calc(130*var(--u)); height:calc(122*var(--u)); display:grid; place-items:center;
  background:url("../img_png/paper/card-felt-teal.webp") center/100% 100% no-repeat;
  filter:var(--pp-lift-s, drop-shadow(0 calc(2*var(--u)) calc(2*var(--u)) rgba(46,28,10,.26)))}
.gdemo span.pick{animation:gPick 2.4s var(--e-out) infinite}

.gtrack span.lit::after{content:""; position:absolute; inset:calc(8*var(--u)); border-radius:calc(14*var(--u));

/* ---------- 완료 팝업 (DESIGN.md §8.3) ---------- */
/* §8.3 완료 화면 규격 — 딤 rgba(0,0,0,.42) · z 60 · gap 44u · 그림 그림자 · 문구 흰색 54u */
.win{position:absolute; inset:0; z-index:60; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.42);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(900*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u)));
  transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(268*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg,
    rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
          mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle, rgba(255,232,148,.85) 0%,
    rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}
.win__art{position:relative; z-index:2; width:calc(600*var(--u)); height:auto; display:block;
  filter:drop-shadow(0 calc(12*var(--u)) calc(20*var(--u)) rgba(80,40,10,.28));
}
.win.on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
body.is-won .boy-slot{opacity:0; visibility:hidden; pointer-events:none}   /* 완료 화면에서는 왼쪽 소년 숨김 */
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-3.5%) rotate(-1.5deg)}
  60%{transform:translateY(-1.5%) rotate(1.5deg)}}

/* 닫기 버튼과 같은 규칙: 마우스오버는 한 단 어둡게, 누르면 더 어둡게 */
.win__actions .btn--retry{--face-hover:#57318A; --face-press:#4A2874}
.win__actions .btn--exit{--face-hover:#EC8F00; --face-press:#B86F00}
.win__actions .btn-bar::before,
.win__actions .btn-bar::after,
.win__actions .btn-bar:hover::after,
.win__actions .btn-bar:active::after{
  background-image:var(--felt); background-size:100% 100%;
  background-repeat:no-repeat; background-position:center; background-blend-mode:soft-light}
.win__actions .btn-bar::before{background-color:var(--face-active)}
.win__actions .btn-bar::after{background-color:var(--face)}
@media (hover:hover){
  .win__actions .btn-bar:hover::after{background-color:var(--face-hover)}
}
.win__actions .btn-bar:active::after{background-color:var(--face-press)}

.win__stack .win__actions{position:relative; z-index:3}
.win__sparks{position:absolute; left:50%; top:calc(20*var(--u)); transform:translateX(-50%);
  width:calc(600*var(--u)); height:calc(512*var(--u)); z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s);
  background:var(--c); opacity:0; animation:twinkle 2.4s var(--e-out) infinite;
  animation-delay:var(--d);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}
  35%{opacity:1; transform:scale(1) rotate(35deg)}
  70%{opacity:.35; transform:scale(.75) rotate(70deg)}}
.win__confetti{position:absolute; left:50%; top:calc(150*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h);
  background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}
  12%{opacity:1}70%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

<script>
(() => {
'use strict';
/* ============================================================
   1. 효과음 — WebAudio 합성 (B-2_06 SFX 모듈과 같은 값)
   ============================================================ */
/* 음소거 — 사운드 버튼 토글 (DESIGN.md §4.1 · §11.4, 2026-09-22) */
const MUTE = {on:false};
const SFX = (() => {
  let C = null, bgmBus = null, bgmOn = false, bgmAt = 0, bgmTm = null, noiseBuf = null;
  const ac = () => {
    if(MUTE.on) return null;           /* 음소거 중에는 새 소리를 만들지 않는다 */
    if(!C){
      try{ const AC = window.AudioContext || window.webkitAudioContext; C = new AC() }catch(e){ return null }
    }
    if(C.state === 'suspended') C.resume();
    return C;
  };
  function voice(freq, at, dur, o){
    o = o || {}; const c = ac(); if(!c) return;
    const t0 = c.currentTime + at, bus = o.bus || c.destination;
    const g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(o.cut || 5200, t0);
    const peak = o.gain || .12, atk = o.atk || .006;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    const osc = (type, mul, det) => {
      const s = c.createOscillator();
      s.type = type; s.frequency.setValueAtTime(freq * mul, t0);
      if(det) s.detune.setValueAtTime(det, t0);
      s.connect(g); s.start(t0); s.stop(t0 + dur + .04);
    };
    osc(o.type || 'sine', 1, 0);
    if(o.h2) osc('sine', 2, 4);
    g.connect(f); f.connect(bus);
  }
  const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));
  function swoosh(at, dur, f0, f1, gain){
    const c = ac(); if(!c) return;
    if(!noiseBuf){
      const n = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  }
  /* 오답 — 짧은 타격 뒤 음정이 크게 내려가는 두꺼운 경고음 */
  function wrongHit(){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime;
    const master = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.setValueAtTime(1.25, t0);
    lp.frequency.setValueAtTime(1800, t0);
    lp.frequency.exponentialRampToValueAtTime(620, t0 + .44);
    master.gain.setValueAtTime(.0001, t0);
    master.gain.exponentialRampToValueAtTime(.16, t0 + .008);
    master.gain.setValueAtTime(.14, t0 + .09);
    master.gain.exponentialRampToValueAtTime(.0001, t0 + .46);
    [
      {type:'square',   from:330, to:185, det:-5},
      {type:'sawtooth', from:220, to:110, det: 5}
    ].forEach(v => {
      const o = c.createOscillator();
      o.type = v.type; o.detune.setValueAtTime(v.det, t0);
      o.frequency.setValueAtTime(v.from, t0);
      o.frequency.exponentialRampToValueAtTime(v.to, t0 + .4);
      o.connect(master); o.start(t0); o.stop(t0 + .48);
    });
    master.connect(lp); lp.connect(c.destination);
    swoosh(0, .18, 1500, 260, .11);
    voice(98, .17, .32, {type:'triangle', gain:.13, atk:.004, cut:760, h2:true});
  }
  const C3=130.81, C4=261.63, G4=392, C5=523.25, E5=659.25, G5=784,
        C6=1046.5, E6=1318.5, G6=1568, C7=2093, E7=2637, G7=3136,
        A4=440, B4=493.88, D5=587.33, F5=698.46, A5=880, B5=987.77, D6=1174.7,
        F3=174.61, G3=196;
  const marimba = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'triangle', gain:gain, atk:.004, cut:4200, h2:true});
  const bell = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', gain:gain, atk:.004, cut:8000, h2:true});
  const BEAT = .28;
  const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
               [G5,2,.5],[E5,2.5,.5],[F5,3,1],[E5,4,.5],[D5,4.5,.5],
               [C5,5,.5],[E5,5.5,.5],[G5,6,1],[C5,7,1]];
  const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
  function bgmTone(freq, at, dur, type, gain){
    const c = ac(); if(!c || !bgmBus) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(bgmBus); o.start(at); o.stop(at + dur + .05);
  }
  function bgmLoop(){
    const c = ac(); if(!c || !bgmOn) return;
    if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;
    MEL.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'triangle', .055));
    BASS.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'sine', .045));
    bgmAt += 8 * BEAT;
    bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);
  }
  return {
    ctx(){ return C },
    unlock(){ ac() },
    tap(){ marimba(G5, 0, .14, .09) },
    hint(){ bell(E6, 0, .3, .07); bell(G6, .11, .4, .06) },
    step(i){ marimba([C5,D5,E5,G5,A5,C6][Math.min(i,5)], 0, .26, .11) },
    good(){ [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
            chord([C5,G5], .02, .5, {type:'triangle', gain:.05}) },
    bad(){ wrongHit() },
    clear(){ swoosh(0, .5, 700, 5200, .1);
             [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12)) },
    fanfare(){
      [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(m => marimba(m[0],m[1],m[2],.12));
      [[G5,.5,.14],[A5,.62,.14],[B5,.74,.14],[C6,.86,.3]]
        .forEach(m => marimba(m[0],m[1],m[2],.12));
      chord([C5,E5,G5,C6], 1.2, 1.1, {type:'triangle', gain:.07});
      [[E6,2.35,.4],[D6,2.6,.4],[C6,2.85,.55]]
        .forEach(m => bell(m[0],m[1],m[2],.10));
      chord([C5,E5,G5,C6], 3.5, 1.5, {type:'triangle', gain:.08});
      voice(C4, 3.5, 1.5, {type:'sine', gain:.07});
      [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(m => bell(m[0],m[1],m[2],.045));
    },
    bgmStart(delay){
      const c = ac(); if(!c) return;
      if(bgmOn) return;
      bgmOn = true;
      bgmBus = c.createGain(); bgmBus.gain.setValueAtTime(.9, c.currentTime);
      bgmBus.connect(c.destination);
      bgmAt = c.currentTime + (delay === undefined ? .35 : delay);
      bgmLoop();
    },
    bgmStop(){
      const c = ac(); bgmOn = false;
      if(bgmTm){ clearTimeout(bgmTm); bgmTm = null }
      if(bgmBus && c){
        const bus = bgmBus; bgmBus = null;
        try{
          const t0 = c.currentTime;
          bus.gain.setValueAtTime(bus.gain.value, t0);
          bus.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
        }catch(e){}
        setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
      }
    }
  };
})();

  const o = document.createElement('span'); o.className = 'obj';
  o.style.setProperty('--w', (ic.w * k).toFixed(1)); o.style.setProperty('--h', (ic.h * k).toFixed(1));
  const im = new Image(); im.alt = ''; im.src = ic.src; im.draggable = false; o.appendChild(im);
  return o;
}
function makeTile(kind){
  const t = document.createElement('div'); t.className = 'tile'; t.dataset.kind = kind;
  t.appendChild(paperObj(kind, .88));
  return t;
}

/* ---------- 판 짓기 ---------- */
const cells = [], rowEls = [];
function buildBoards(){
  rowsEl.innerHTML = ''; cells.length = 0; rowEls.length = 0;
  ROWS.forEach((R, r) => {
    const sec = document.createElement('section'); sec.className = 'row row--' + (r + 1); sec.dataset.row = r;
    const grid = document.createElement('div'); grid.className = 'grid';
    for(let c = 0; c < COLS; c++){
      const kind = R.seq[c % R.seq.length], blank = R.blank.indexOf(c) >= 0;
      const cell = document.createElement('div'); cell.className = 'cell' + (blank ? ' is-blank' : '');
      if(blank){
        const rec = {row:r, col:c, kind, el:cell, filled:false};
        cell.dataset.idx = cells.length; cells.push(rec);
      }else{
        const p = document.createElement('div'); p.className = 'pic'; p.appendChild(paperObj(kind)); cell.appendChild(p);
      }
      grid.appendChild(cell);
    }
    sec.appendChild(grid);
    const lb = document.createElement('span'); lb.className = 'row__lb'; sec.appendChild(lb);
    rowsEl.appendChild(sec); rowEls.push(sec);
  });
}
function buildTray(){
  trayGrid.innerHTML = '';
  TRAY.forEach(kind => {
    const s = document.createElement('div'); s.className = 'slot';
    s.appendChild(makeTile(kind)); trayGrid.appendChild(s);
  });
}

/* ---------- 소년 반응 ---------- */
function react(kind){
  boyEl.classList.remove('is-cheer', 'is-huh'); void boyEl.offsetWidth;
  boyEl.classList.add(kind === 'cheer' ? 'is-cheer' : 'is-huh');
  later(() => boyEl.classList.remove('is-cheer', 'is-huh'), 1900);
}

/* ---------- 드래그 · 탭 붙이기 (B-1_06 과 같은 방식) ---------- */
let drag = null, sel = null, overCell = null;
function setOver(cell){
  if(overCell === cell) return;
  if(overCell) overCell.el.classList.remove('is-over');
  overCell = cell;
  if(cell) cell.el.classList.add('is-over');
}
function cellAt(x, y){
  const el = document.elementFromPoint(x, y), c = el && el.closest ? el.closest('.cell.is-blank') : null;
  return c ? cells[+c.dataset.idx] : null;
}
function bitsAt(x, y, color){
  for(let i = 0; i < 7; i++){
    const a = (-90 + i * 51 + Math.random() * 20) * Math.PI / 180, m = 16 * (2.4 + Math.random() * 1.3), sz = 8 + Math.random() * 4;
    const b = document.createElement('i'); b.className = 'bit';
    b.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + sz + 'px;height:' + sz + 'px;background:' + color +
      ';--dx:' + (Math.cos(a) * m).toFixed(1) + 'px;--dy:' + (Math.sin(a) * m).toFixed(1) + 'px;animation-delay:' + (i * 16) + 'ms';
    fx.appendChild(b); later(() => b.remove(), 700);
  }
}
function makeGhost(tile){
  const r = tile.getBoundingClientRect(), g = tile.cloneNode(true);
  g.className = 'tile ghost'; g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
  g.style.left = (r.left + r.width / 2) + 'px'; g.style.top = (r.top + r.height / 2) + 'px';
  fx.appendChild(g); return {g, r};
}
function flyTo(g, rect, fromW, done){
  g.classList.add('is-fly');
  g.style.left = (rect.left + rect.width / 2) + 'px'; g.style.top = (rect.top + rect.height / 2) + 'px';
  g.style.transform = 'translate(-50%,-50%) scale(' + (rect.width / fromW) + ')';
  later(() => { g.remove(); if(done) done() }, 280);
}
function putBack(tile, g, fromW){
  flyTo(g, tile.parentNode.getBoundingClientRect(), fromW, () => tile.classList.remove('is-lifted'));
}
function deselect(){ if(sel){ sel.classList.remove('is-sel'); sel = null } }

function attempt(tile, cell, g, fromW){
  if(!g){ const m = makeGhost(tile); g = m.g; fromW = m.r.width; tile.classList.add('is-lifted') }
  const kind = tile.dataset.kind;
  if(cell.filled){ putBack(tile, g, fromW); return }
  if(cell.kind !== kind){
    SFX.bad(); react('huh');
    cell.el.classList.remove('is-bad'); void cell.el.offsetWidth; cell.el.classList.add('is-bad');
    later(() => cell.el.classList.remove('is-bad'), 460);
    putBack(tile, g, fromW); return;
  }
  locked = true; clearIdle(); deselect();
  const cr = cell.el.getBoundingClientRect();
  flyTo(g, cr, fromW, () => {
    const p = document.createElement('div'); p.className = 'pic'; p.appendChild(paperObj(kind));
    cell.el.appendChild(p); cell.el.classList.add('is-new'); cell.filled = true;
    later(() => cell.el.classList.remove('is-new'), 520);
    const slot = tile.parentNode; tile.remove(); slot.classList.add('is-empty');
    placed++; rowLeft[cell.row]--; paintStars();
    bitsAt(cr.left + cr.width / 2, cr.top + cr.height / 2, ['#6FC6BA','#E7B23C','#F291B9','#94C13D'][placed % 4]);
    SFX.good(); SFX.step(placed - 1);
    locked = false;
    if(placed >= NEED){ phase = 'done'; locked = true; rowDone(cell.row, true); later(finish, TIMING.finishDelay); return }
    if(rowLeft[cell.row] <= 0) rowDone(cell.row, false);
    armIdle();
  });
}
function rowDone(r, last){
  const sec = rowEls[r];
  [...sec.querySelectorAll('.obj')].forEach((o, k) => o.style.setProperty('--k', k));
  sec.classList.add('is-done');
  later(() => sec.classList.remove('is-done'), 1500);
  if(last) return;
  later(() => { SFX.clear(); react('cheer'); speak('praise_' + (r + 1), I18N[lang].praise[r]) }, 200);
}

trayGrid.addEventListener('pointerdown', e => {
  const tile = e.target.closest ? e.target.closest('.tile') : null;
  SFX.unlock();
  if(!tile || phase !== 'play' || locked || drag) return;
  e.preventDefault(); clearIdle(); clearHints();
  const m = makeGhost(tile);
  drag = {tile, g:m.g, w:m.r.width, id:e.pointerId, sx:e.clientX, sy:e.clientY, moved:false, touch:e.pointerType === 'touch', up:m.r.height * .38};
  tile.classList.add('is-lifted'); SFX.tap();
  speak('name_' + tile.dataset.kind, NAMES[lang][tile.dataset.kind]);   /* 고른 동물 이름을 지금 언어로 읽어 준다 */
  movePos(e);
});
function movePos(e){
  const d = drag, x = e.clientX, y = e.clientY - (d.touch ? d.up : 0);
  d.g.style.left = x + 'px'; d.g.style.top = y + 'px'; d.x = x; d.y = y;
}
window.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  if(!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
  movePos(e);
  if(drag.moved){ const c = cellAt(drag.x, drag.y); setOver(c && !c.filled ? c : null) }
});
function endDrag(e){
  if(!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; setOver(null);
  if(e.type === 'pointercancel'){ d.g.remove(); d.tile.classList.remove('is-lifted'); return }
  if(!d.moved){   /* 탭 — 카드를 고르고 빈칸을 누르면 붙는다 */
    d.g.remove(); d.tile.classList.remove('is-lifted');
    if(sel === d.tile){ deselect() } else { deselect(); sel = d.tile; sel.classList.add('is-sel') }
    armIdle(); return;
  }
  const c = cellAt(d.x, d.y);
  if(c) attempt(d.tile, c, d.g, d.w); else putBack(d.tile, d.g, d.w);
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
rowsEl.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('.cell.is-blank') : null;
  if(!el || !sel || phase !== 'play' || locked) return;
  const tile = sel; deselect(); attempt(tile, cells[+el.dataset.idx], null, 0);
});

/* 한참 가만히 있으면 안 붙인 빈칸 하나가 반짝이고 맞는 카드도 흔들린다 */
let idleTm = null, lastHint = null, hintTm = null;
function clearHints(){
  clearTimeout(hintTm);
  cells.forEach(c => c.el.classList.remove('is-hint'));
  trayGrid.querySelectorAll('.is-hint').forEach(t => t.classList.remove('is-hint'));
}
function clearIdle(){ clearTimeout(idleTm); idleTm = null }
function armIdle(){
  clearIdle();
  idleTm = setTimeout(() => {
    if(phase !== 'play' || locked || drag) return;
    const left = cells.filter(c => !c.filled);
    if(!left.length) return;
    const pool = left.filter(c => c !== lastHint), pick = pool.length ? pool : left, c = pick[Math.floor(Math.random() * pick.length)];
    lastHint = c; SFX.hint(); clearHints();
    c.el.classList.add('is-hint');
    const t = [...trayGrid.querySelectorAll('.tile')].find(t => t.dataset.kind === c.kind && !t.classList.contains('is-lifted'));
    if(t){ void t.offsetWidth; t.classList.add('is-hint') }
    hintTm = setTimeout(clearHints, 2400);
    armIdle();
  }, TIMING.idleHint);
}

/* ============================================================
   5. 완료 화면 (DESIGN.md §8.3)
   ============================================================ */
(function buildSparks(){
  const box = document.getElementById('winSparks');
  const COLORS = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#BFE3D8','#F7C8A0'];
  let seed = 20260921;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const N = 18;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + rnd() * .18;
    const rad = .40 + rnd() * .16;
    const el = document.createElement('i');
    el.className = 'spark';
    el.style.cssText =
      '--x:' + (50 + Math.cos(ang) * rad * 116) + '%;' +
      '--y:' + (50 + Math.sin(ang) * rad * 136) + '%;' +
      '--s:calc(' + (14 + Math.round(rnd() * 22)) + '*var(--u));' +
      '--c:' + COLORS[i % COLORS.length] + ';' +
      '--d:' + (rnd() * 2.2).toFixed(2) + 's';
    box.appendChild(el);
  }
})();
(function buildConfetti(){
  const box = document.getElementById('winConf');
  const C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#FFF6DF'];
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 250;
    const el = document.createElement('i');
    el.className = 'conf';
    el.style.cssText =
      '--w:calc(' + (12 + Math.round(rnd()*12)) + '*var(--u));' +
      '--h:calc(' + (16 + Math.round(rnd()*18)) + '*var(--u));' +
      '--c:' + C[i % C.length] + ';' +
      '--r:' + (rnd() < .4 ? '50%' : 'calc(4*var(--u))') + ';' +
      '--dx:calc(' + (Math.cos(ang)*dist).toFixed(0) + '*var(--u));' +
      '--dy:calc(' + (Math.sin(ang)*dist - 60).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd()*900 - 450) + 'deg;' +
      '--d:' + (rnd()*.35).toFixed(2) + 's';
    box.appendChild(el);
  }
})();


function finish(){
  SFX.clear(); document.body.classList.add('is-won'); winEl.classList.add('on'); winEl.setAttribute('aria-hidden', 'false');
  setTimeout(() => SFX.fanfare(), 120);
  setTimeout(() => SFX.bgmStart(0), 3400);
  setTimeout(() => winSay(), 900);
}
function resetGame(){
  SFX.bgmStop(); stopVoice(); clearLater(); clearIdle(); clearHints();
  document.body.classList.remove('is-won'); winEl.classList.remove('on'); winEl.setAttribute('aria-hidden', 'true');
  startGame();
}

/* ============================================================
   6. 음성 — Pixie 녹음본(../audio/voice-q/q_b3_06_*) 우선, 없으면 TTS
   ============================================================ */
let curAudio = null, voiceTok = 0;
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
function stopTts(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel() }catch(e){} }
function stopVoice(){
  voiceTok++;
  if(curAudio){ curAudio.onended = curAudio.onerror = null; try{ curAudio.pause() }catch(e){} curAudio = null }
  stopTts(); sayFlag(false);
}
function tts(text, hooks, tok){
  hooks = hooks || {};
  if(!text || !('speechSynthesis' in window)){ if(hooks.blocked) hooks.blocked(); return false }
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ko' ? 'ko-KR' : 'en-US'; u.rate = lang === 'ko' ? 1.02 : .94; u.pitch = 1.13;
    u.onstart = () => { if(tok === voiceTok){ sayFlag(true); if(hooks.start) hooks.start() } };
    u.onend = u.onerror = () => { if(tok === voiceTok){ sayFlag(false); if(hooks.end) hooks.end() } };
    speechSynthesis.speak(u); return true;
  }catch(e){ if(hooks.blocked) hooks.blocked(); return false }
}
function speak(key, text, hooks){
  hooks = hooks || {};
  stopVoice();
  if(MUTE.on){ if(hooks.end) setTimeout(hooks.end, 1200); return false }
  const tok = voiceTok, a = new Audio('../audio/voice-q/q_b3_06_' + key + '_' + lang + '.mp3');
  curAudio = a; a.preload = 'auto';
  let done = false;
  const fin = () => { if(done || tok !== voiceTok) return; done = true; curAudio = null; sayFlag(false); if(hooks.end) hooks.end() };
  const fallback = () => { if(done || tok !== voiceTok) return; done = true; curAudio = null; tts(text, hooks, tok) };
  a.addEventListener('ended', fin);
  a.addEventListener('error', fallback);
  a.addEventListener('playing', () => { if(tok === voiceTok){ sayFlag(true); if(hooks.start) hooks.start() } });
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    if(tok !== voiceTok || done) return;
    if(err && err.name === 'NotAllowedError'){ done = true; curAudio = null; if(hooks.blocked) hooks.blocked() }
    else fallback();
  });
  return true;
}
const winSay = () => speak('win', I18N[lang].win);

function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.documentElement.lang = lang;
  $('lgEn').className = ko ? 'off' : 'on'; $('lgKo').className = ko ? 'on' : 'off';
  $('btnLang').dataset.next = ko ? 'en' : 'ko'; $('btnLang').setAttribute('aria-label', ko ? 'English' : '한국어');
  $('btnBack').setAttribute('aria-label', ko ? '뒤로 가기' : 'Back');
  boyEl.setAttribute('aria-label', ko ? '안내 다시 듣기' : 'Hear it again');
  rowEls.forEach((s, i) => { s.setAttribute('aria-label', t.label[i]); s.querySelector('.row__lb').textContent = t.label[i] });
  $('talkTag').textContent = t.tag; $('talkLine').textContent = t.brief;
$('stepA').textContent = t.stepA; $('stepB').textContent = t.stepB;
  document.querySelector('#retry span').textContent = t.retry; document.querySelector('#exit span').textContent = t.exit;
  paintMute();
}

/* ============================================================
   7. 브리핑 · 상단 버튼
   끝나는 조건: 음성 종료 / 음성이 시작되지 않으면 7s / 0.9s 가드 이후 아무 데나 탭
   ============================================================ */
let briefing = true, briefTm = null, skipArmed = false, voiceOn = false, retried = false;
function briefSay(){
  voiceOn = false;
  speak('brief', I18N[lang].brief, {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) },
    blocked(){ voiceOn = false }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false; retried = false; document.body.classList.add('is-briefing');
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, MUTE.on ? 3500 : 7000);
  setTimeout(briefSay, 350);
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm); stopVoice();
  document.body.classList.remove('is-briefing');
  phase = 'play'; armIdle();
}
function startGame(){
  stopVoice(); clearIdle(); clearTimeout(briefTm); drag = null; sel = null; overCell = null;
  placed = 0; locked = false; phase = 'brief'; lastHint = null;
  rowLeft = ROWS.map(r => r.blank.length);
  buildBoards(); buildTray(); applyLang(); paintStars();
  startBriefing();
}
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.ibtn-img, .boy, .guide, .win')) return;
  if(!voiceOn && !retried && !(curAudio || ('speechSynthesis' in window && speechSynthesis.speaking))){
    retried = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000); briefSay(); return;
  }
  if(skipArmed) endBriefing();
}, true);

/* 소년 — 누르면 지금 상황을 다시 말해 준다 */
boyEl.addEventListener('click', () => {
  SFX.tap();
  if(briefing){ briefSay(); return }
  if(phase === 'done'){ winSay(); return }
  openGuide();
});
const guideEl = $('guide');
function openGuide(){ guideEl.classList.add('on'); speak('guide', I18N[lang].guide) }
function closeGuide(){ guideEl.classList.remove('on') }
$('guideClose').addEventListener('click', () => { SFX.tap(); closeGuide() });
guideEl.addEventListener('pointerdown', e => { if(e.target === guideEl) closeGuide() });
(function buildGuideDemo(){
  const d = $('gdemo'), tr = $('gtrack');
  const mk = (cls, kind) => { const sp = document.createElement('span'); if(cls) sp.className = cls;
    if(kind){ const im = document.createElement('img'); im.alt = ''; im.src = ICON[kind].src; sp.appendChild(im) } return sp };
  d.append(mk('pick', 'dog'), mk('', 'cat'), mk('', 'bird'));
  tr.append(mk('filled', 'cat'), mk('filled', 'dog'), mk('lit'));
})();

function paintMute(){
  const L = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', L[lang][MUTE.on ? 'on' : 'off']);
  btnSay.querySelectorAll('.wave:not(.x)').forEach(p => p.style.display = MUTE.on ? 'none' : '');
  btnSay.querySelector('.x').style.display = MUTE.on ? '' : 'none';
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){
    SFX.tap(); MUTE.on = true; stopVoice();
    const c = SFX.ctx(); if(c && c.state === 'running') c.suspend();
  }else{
    MUTE.on = false;
    const c = SFX.ctx(); if(c && c.state === 'suspended') c.resume();
    if(winEl.classList.contains('on')){ SFX.bgmStop(); SFX.bgmStart(0) }
    SFX.tap();
  }
  paintMute();
});
$('btnLang').addEventListener('click', e => {
  SFX.unlock(); SFX.tap();
  lang = e.currentTarget.dataset.next; applyLang();
  if(briefing) briefSay();
  else if(phase === 'done') winSay();
  else speak('brief', I18N[lang].brief);
});
const leave = () => { SFX.tap(); location.href = 'B-3_00.submain.html' };
$('btnBack').addEventListener('click', leave);
$('exit').addEventListener('click', leave);
$('retry').addEventListener('click', () => { SFX.tap(); resetGame() });

if('speechSynthesis' in window) speechSynthesis.getVoices();
startGame();
})();
</script>

<script>
/* 문제풀이 BGM — 개념별 공용 곡(puzzle-pattern-groove-loop). 첫 입력부터 반복 재생(자동재생 정책), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
(() => {
  const a = new Audio('../audio/bgm/puzzle-pattern-groove-loop.mp3');
  a.loop = true; a.preload = 'auto'; a.volume = .22;
  const $ = id => document.getElementById(id);
  const muted = () => { const b = $('btnSay') || document.querySelector('button[class*="soundButton"]'); return !!b && b.getAttribute('aria-pressed') === 'true' };
  const done = () => document.body.classList.contains('is-done') || !!document.querySelector('#win.on, [class*="_win_"]');
  let armed = false;
  const sync = () => {
    if(!armed) return;
    if(muted() || done() || document.hidden) a.pause();
    else if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}) }
  };
  let raf = 0; const soon = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; sync() }) };
  ['pointerdown','keydown'].forEach(t => window.addEventListener(t, () => { armed = true; sync() }, {passive:true}));
  document.addEventListener('visibilitychange', sync);
  new MutationObserver(soon).observe(document.body, {attributes:true, attributeFilter:['class','aria-pressed'], childList:true, subtree:true});
})();
</script>
