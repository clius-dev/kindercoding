<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAIN · 노리팩토리 — 생활주제 12</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="DESIGN.css">
<style>
/* ============================================================
   A-0_00 MAIN — 생활주제 12개 메인 메뉴 (앱 최상위)
   DESIGN.md §1(컬러) · §2.3(스티커 타이틀) · §4(아이콘 버튼) · §9.1.1(프레임)
   기준 아트보드 1920×1200 가로. 12개가 스크롤 없이 한 화면에 모두 보인다(4열×3행).
   선택 동작은 B-2_00.home 과 같은 「확대 → 로딩 → 이동」.
   ============================================================ */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--ff);color:#FFFDF2;overflow:hidden;background:#2B2038}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit}
[hidden]{display:none!important}

.app{position:fixed;inset:0;overflow:hidden;user-select:none;background:#2B2038}

/* ---- 배경 : 진한 보라 바탕 + 부드러운 후광 (홈 #2B2038 과 같은 계열) ---- */
.app__deco{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 16% 18%, rgba(148,99,214,.30), transparent 46%),
    radial-gradient(circle at 86% 12%, rgba(69,181,232,.22), transparent 44%),
    radial-gradient(circle at 78% 92%, rgba(242,120,155,.20), transparent 46%),
    radial-gradient(circle at 10% 88%, rgba(55,195,180,.18), transparent 44%);
}
.app__deco i{
  position:absolute;display:block;border-radius:50%;
  background:#FFFDF2;opacity:.16;
}
.app__deco i:nth-child(1){left:12%;top:28%;width:calc(10 * var(--u));height:calc(10 * var(--u))}
.app__deco i:nth-child(2){left:31%;top:12%;width:calc(7 * var(--u));height:calc(7 * var(--u))}
.app__deco i:nth-child(3){left:68%;top:22%;width:calc(9 * var(--u));height:calc(9 * var(--u))}
.app__deco i:nth-child(4){left:92%;top:52%;width:calc(8 * var(--u));height:calc(8 * var(--u))}
.app__deco i:nth-child(5){left:6%;top:62%;width:calc(7 * var(--u));height:calc(7 * var(--u))}
.app__deco i:nth-child(6){left:55%;top:95%;width:calc(9 * var(--u));height:calc(9 * var(--u))}

/* ---- 상단바 : 왼쪽 로고 / 오른쪽 내 정보 ---------------------------- */
/* 좌우·상단 여백은 DESIGN.css 의 .topbar(28u 거터) 규칙을 그대로 쓴다 */
.topbar{
  position:absolute;z-index:4;
  height:calc(104 * var(--u));
  display:flex;align-items:center;justify-content:space-between;
}

.brand{display:flex;align-items:center;gap:calc(16 * var(--u))}
.brand__mark{
  position:relative;display:grid;place-items:center;
  width:calc(84 * var(--u));height:calc(84 * var(--u));
  border-radius:var(--r-blob-a);background:#FFFDF2;
}
.brand__mark svg{width:56%;height:56%;display:block}
.brand__name{
  font-size:calc(46 * var(--u));font-weight:900;letter-spacing:-.04em;
  color:#FFFDF2;line-height:1;
  text-shadow:0 calc(4 * var(--u)) 0 rgba(0,0,0,.22);
}

/* 내 정보 — 흰 면 알약 + 아바타. 상단 크롬 v1.8(흰 면 + 보라 아이콘)을 따른다 */
.me{
  display:flex;align-items:center;gap:calc(14 * var(--u));
  height:calc(92 * var(--u));padding:calc(8 * var(--u)) calc(30 * var(--u)) calc(8 * var(--u)) calc(8 * var(--u));
  border-radius:var(--r-pill);background:#FFFFFF;color:var(--c-primary);
  font-size:calc(32 * var(--u));font-weight:800;letter-spacing:-.02em;
  transition:background var(--t-fast),transform var(--t-fast) var(--e-out);
}
.me__ava{
  width:calc(76 * var(--u));height:calc(76 * var(--u));border-radius:50%;
  background:var(--c-primary-100);display:grid;place-items:center;overflow:hidden;
}
.me__ava svg{width:100%;height:100%;display:block}
@media (hover:hover){.me:hover{background:#F3ECFC}}
.me:active{background:#E4D9F6;transform:scale(.95)}
.me:focus-visible{outline:none}

/* ---- 그리드 : 4열 × 3행 ------------------------------------------- */
.grid{
  position:absolute;z-index:2;
  left:calc(56 * var(--u));right:calc(56 * var(--u));
  top:calc(168 * var(--u));bottom:calc(44 * var(--u));
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:calc(26 * var(--u));
}

/* ---- 카드 ---------------------------------------------------------- */
.card{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(18 * var(--u)) calc(22 * var(--u)) calc(22 * var(--u));
  border-radius:calc(46 * var(--u));
  background:var(--face);
  box-shadow:0 calc(12 * var(--u)) 0 var(--deep);
  transition:transform var(--t-fast) var(--e-out),box-shadow var(--t-fast) var(--e-out),filter var(--t-base) var(--e-out);
}
@media (hover:hover){.card:hover{filter:brightness(1.05)}}
.card:active{transform:translateY(calc(8 * var(--u)));box-shadow:0 calc(4 * var(--u)) 0 var(--deep)}
.card:focus-visible{outline:calc(6 * var(--u)) solid var(--c-star);outline-offset:calc(-12 * var(--u))}

/* 카드 안쪽 상단의 옅은 면 — 아트가 앉을 자리를 한 톤 밝게 */
.card::before{
  content:'';position:absolute;z-index:0;left:50%;top:calc(-46 * var(--u));
  width:calc(300 * var(--u));height:calc(300 * var(--u));margin-left:calc(-150 * var(--u));
  border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none;
}

.card__art{
  position:relative;z-index:1;
  width:calc(152 * var(--u));height:calc(152 * var(--u));
  display:grid;place-items:center;
}
.card__art svg{width:100%;height:100%;display:block;overflow:visible}

/* 타이틀 — 홈(B-2_00)과 같은 스티커 변형. DESIGN.css .intro-title__main--sticker */
.card__title{
  position:relative;z-index:2;
  --tt-size:42;
  margin-top:calc(16 * var(--u));
  white-space:nowrap;
}
.card__en{
  position:relative;z-index:2;
  margin-top:calc(12 * var(--u));
  font-size:calc(21 * var(--u));font-weight:800;letter-spacing:.09em;
  color:#FFFDF2;opacity:.9;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 calc(3 * var(--u)) 0 rgba(0,0,0,.18);
}

/* 아직 화면이 없는 주제 — 홈의 SOON 배지와 같은 바 모양 */
.card__soon{
  position:absolute;z-index:3;top:calc(14 * var(--u));right:calc(14 * var(--u));
  display:grid;place-items:center;min-width:calc(126 * var(--u));height:calc(42 * var(--u));
  padding:0 calc(22 * var(--u));
  color:var(--tt-stroke);font-size:calc(19 * var(--u));font-weight:800;letter-spacing:.08em;
}
.card__soon::before{
  content:'';position:absolute;inset:0;z-index:-1;background:#FFFDF2;
  -webkit-mask:var(--shape-bar-title) center/100% 100% no-repeat;
          mask:var(--shape-bar-title) center/100% 100% no-repeat;
}
.card.is-soon .card__art{opacity:.78}

/* ---- 확대 → 로딩 오버레이 (홈과 동일한 연출) ----------------------- */
.zoom{
  position:fixed;z-index:20;border-radius:calc(46 * var(--u));
  background:var(--face);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:left .46s var(--e-out),top .46s var(--e-out),width .46s var(--e-out),
             height .46s var(--e-out),border-radius .46s var(--e-out);
}
.zoom__title{--tt-size:110;white-space:nowrap}
.zoom__en{
  margin-top:calc(18 * var(--u));
  font-size:calc(30 * var(--u));font-weight:800;letter-spacing:.12em;
  color:#FFFDF2;opacity:.9;text-transform:uppercase;
}
.zoom__load{margin-top:calc(54 * var(--u));display:flex;gap:calc(18 * var(--u));opacity:0;transition:opacity .3s .34s}
.zoom.is-full .zoom__load{opacity:1}
.zoom__load i{
  width:calc(24 * var(--u));height:calc(24 * var(--u));border-radius:50%;background:#FFFDF2;
  animation:ld 1s var(--e-out) infinite;
}
.zoom__load i:nth-child(2){animation-delay:.14s}
.zoom__load i:nth-child(3){animation-delay:.28s}
@keyframes ld{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(calc(-20 * var(--u)));opacity:1}}

.zoom__soon{margin-top:calc(48 * var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(34 * var(--u))}
.zoom__soon p{margin:0;font-size:calc(40 * var(--u));font-weight:700;color:#FFFDF2}

/* ---- 내 정보 시트 --------------------------------------------------- */
.sheet{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:var(--c-scrim);opacity:0;transition:opacity var(--t-base);
}
.sheet.is-on{opacity:1}
.sheet__box{
  width:calc(620 * var(--u));padding:calc(56 * var(--u)) calc(48 * var(--u));
  border-radius:calc(48 * var(--u));background:#FFFDF2;color:var(--c-primary-ink);
  display:flex;flex-direction:column;align-items:center;gap:calc(22 * var(--u));
  box-shadow:var(--sh-float);
  transform:scale(.9);transition:transform var(--t-base) var(--e-pop);
}
.sheet.is-on .sheet__box{transform:scale(1)}
.sheet__ava{width:calc(150 * var(--u));height:calc(150 * var(--u));border-radius:50%;background:var(--c-primary-100);overflow:hidden}
.sheet__ava svg{width:100%;height:100%;display:block}
.sheet__box h3{margin:0;font-size:calc(46 * var(--u));font-weight:900;letter-spacing:-.03em}
.sheet__box p{margin:0;font-size:calc(30 * var(--u));font-weight:700;color:var(--c-gray-2)}
.sheet .btn-bar{margin-top:calc(12 * var(--u));--bb-w:280;--bb-h:98;font-size:calc(34 * var(--u));
  --face:var(--c-primary-light);--face-hover:#A57BE0;--face-active:var(--c-primary-dark)}

/* ---- 세로 모드 안내 ------------------------------------------------- */
.rotate-gate{display:none;background:var(--c-primary);color:#fff;text-align:center;padding:8vw;gap:4vh}
.rotate-gate strong{font-size:clamp(20px,5vw,34px);font-weight:800}
.rotate-gate span{font-size:clamp(14px,3.4vw,22px);opacity:.85}
.rotate-gate svg{width:clamp(64px,18vw,120px);fill:#fff;opacity:.9}
</style>
</head>
<body>
<main class="app" id="app">

  <!-- 세로 모드 — 앱은 가로 전용 (DESIGN.md §9.1.1) -->
  <div class="rotate-gate">

  <!-- 12개 생활주제 -->
  <div class="grid" id="grid"></div>

</main>

/* ---- 렌더 ---------------------------------------------------------- */
const grid = document.getElementById('grid');

grid.innerHTML = THEMES.map((t, i) => `
  <button class="card${t.href ? '' : ' is-soon'}" type="button" data-i="${i}"
          style="--face:${t.face};--deep:${t.deep};--tt-fill:${CREAM};--tt-stroke:${t.stroke};--tt-shadow:${t.deep};--tt-rim:${t.rim}">
    ${t.href ? '' : '<span class="card__soon">SOON</span>'}
    <span class="card__art">${t.art}</span>
    <h2 class="intro-title__main intro-title__main--sticker card__title">${t.ko}</h2>
    <span class="card__en">${t.en}</span>
  </button>`).join('');

/* 타이틀 오토핏 — 12개가 같은 크기를 쓴다. 가장 긴 주제어(어린이집과 친구)에 맞춰
   한 줄로 들어가는 최대 크기를 구한다. 외곽선(§2.3, 글자 크기의 17.3%)은 폭에 더한다. */
const ruler = document.createElement('div');
ruler.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;' +
  'font:900 100px var(--ff);letter-spacing:-.045em';
document.body.appendChild(ruler);

const probe = document.createElement('div');
probe.style.cssText = 'position:absolute;left:-9999px;width:calc(100 * var(--u))';
document.body.appendChild(probe);

const TT_MAX = 44;   /* 카드 타이틀 기준 크기(u) 상한 */

function fitTitles(){
  const card  = grid.querySelector('.card');
  const avail = card.clientWidth - 44;                       /* 좌우 여백 22u씩 */
  const upx   = probe.getBoundingClientRect().width / 100;   /* 1u 의 실제 px */
  let size = TT_MAX;

  THEMES.forEach(t => {
    ruler.textContent = t.ko;
    const w100 = ruler.getBoundingClientRect().width + 17.3; /* 100px 기준 + 외곽선 */
    size = Math.min(size, Math.floor(avail / (w100 / 100) / upx));
  });

  grid.querySelectorAll('.card__title').forEach(h => h.style.setProperty('--tt-size', Math.max(24, size)));
}

fitTitles();
addEventListener('resize', fitTitles);

/* ---- 선택 : 카드 확대 → 로딩 → 이동 (B-2_00.home 과 같은 연출) ------ */
let busy = false;

grid.addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (!c || busy) return;
  open(+c.dataset.i, c);
});

function open(i, c){
  busy = true;
  const t = THEMES[i];
  const r = c.getBoundingClientRect();

  const z = document.createElement('div');
  z.className = 'zoom';
  z.style.cssText =
    `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;` +
    `--face:${t.face};--tt-fill:${CREAM};--tt-stroke:${t.stroke};--tt-shadow:${t.deep};--tt-rim:${t.rim}`;
  z.innerHTML = `
    <h2 class="intro-title__main intro-title__main--sticker zoom__title">${t.ko}</h2>
    <span class="zoom__en">${t.en}</span>
    ${t.href
      ? '<div class="zoom__load"><i></i><i></i><i></i></div>'
      : `<div class="zoom__soon"><p>아직 준비 중이에요</p>
           <button class="btn-bar" type="button" id="back"
                   style="--face:${CREAM};--face-hover:#FFFFFF;--face-active:${t.rim};--ink:${t.stroke}">돌아가기</button>
         </div>`}`;
  document.getElementById('app').appendChild(z);

  requestAnimationFrame(() => {
    z.style.cssText += ';left:0;top:0;width:100%;height:100%;border-radius:0';
    z.classList.add('is-full');
  });

  if (t.href){
    setTimeout(() => { location.href = t.href; }, 1150);
  } else {
    z.querySelector('#back').addEventListener('click', () => {
      z.style.cssText += `;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:calc(46 * var(--u))`;
      z.classList.remove('is-full');
      setTimeout(() => { z.remove(); busy = false; }, 480);
    });
  }
}

/* ---- 내 정보 -------------------------------------------------------- */
document.getElementById('me').addEventListener('click', () => {
  const s = document.createElement('div');
  s.className = 'sheet';
  s.innerHTML = `
    <div class="sheet__box">
      <span class="sheet__ava">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="24" fill="#E2DAEE"/>
          <circle cx="24" cy="19" r="8.4" fill="#6B3FA0"/>
          <path d="M8 44a16 16 0 0 1 32 0z" fill="#6B3FA0"/>
        </svg>
      </span>
      <h3>내 정보</h3>
      <p>학습 기록과 프로필 화면은 준비 중이에요</p>
      <button class="btn-bar" type="button">닫기</button>
    </div>`;
  document.body.appendChild(s);
  requestAnimationFrame(() => s.classList.add('is-on'));

  const close = () => { s.classList.remove('is-on'); setTimeout(() => s.remove(), 300); };
  s.querySelector('.btn-bar').addEventListener('click', close);
  s.addEventListener('click', e => { if (e.target === s) close(); });
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const s = document.querySelector('.sheet');
  if (s){ s.classList.remove('is-on'); setTimeout(() => s.remove(), 300); }
});
</script>
