<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Step B-2 · ABSTRACTION — Shadows &amp; Colors (Paper Garden)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css">
<link rel="stylesheet" href="DESIGN.css" type="text/css">
<link rel="preload" href="img_png/B-2_05-stage-bg-garden-v4.webp" as="image">
<style>
/* ============================================================
   B-2_05 ABSTRACTION v2 — 종이 콜라주 테마 (DESIGN.md §11)
   B-2_02.sequencing_v4 · B-2_03.decomposition_v2 와 같은 크롬·질감·브리핑·완료 화면.
   꽃·실루엣·색 에셋은 원본(B-2_05) 그대로 쓰고, 면에 --pp-tx-felt 결만 overlay 로 입힌다.
   좌표는 전부 아트보드 1920×1200u.
   ============================================================ */
:root{
  --design-w:1920; --design-h:1200;
  /* 이 화면 — 연결선 · 포트 (종이 팔레트 안에서) */
  --abs-line:#76905F;          /* = --pp-green 잔디 펠트 그린. 연결된 점과 같은 색 */
  --abs-port:#E7B23C;          /* = --pp-gold. 번호 배지와 같은 골드 종이 */
  --abs-port-on:#76905F;       /* 연결된 점 — 선과 같은 색 */
  --abs-ring:#FFFFFF;          /* 점 테두리 — 흰 종이 5u 인라인 */
  --sil-idle:#CDCCCC;          /* 제공 에셋 원본 색 (§9.10) */
  --sil-half:#F0E2C4;          /* 꽃에만 이어진 실루엣 — 크림 종이 */
  --tile-w:168; --tile-h:157;  /* card-felt-teal 512×478 비율 */
}
/* DESIGN.css 의 --pp-edge:var(--sp-gutter, …) 는 --sp-gutter 가 단위 없는 28 이라 무효값이 된다
   (right/top 이 auto 로 떨어짐) — 이 화면에서 길이로 다시 잡는다. DESIGN.md §10 확인 항목 */
.stage.theme-paper{--pp-edge:calc(28 * var(--u))}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#0F2418; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; touch-action:none}
body{display:grid; place-items:center}
img{user-select:none; -webkit-user-drag:none}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u));
  overflow:hidden; isolation:isolate}
.stage__bg{position:absolute; left:0; top:0; width:100%; height:100%; display:block; z-index:0}

/* ---------- 상단 크롬 §11.2 · §11.4 ---------- */
.pp-edge-tl,.pp-edge-tr,.pp-edge-tc{z-index:20}
.pp-ibtn svg{fill:currentColor}
.pp-ibtn--sound .sound-wave{fill:none; stroke:currentColor; stroke-width:2.8;
  stroke-linecap:round; stroke-linejoin:round}
#btnSay.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 연결선 ---------- */
.links{position:absolute; inset:0; z-index:3; width:100%; height:100%; overflow:visible; pointer-events:none}
.links .ln{fill:none; stroke-linecap:round; pointer-events:none}
.links .ln--core{stroke:var(--abs-line); stroke-width:10}
.links .hit{stroke:transparent; stroke-width:44; fill:none; cursor:pointer; pointer-events:stroke}
.links .ln--draft{stroke:var(--abs-line); stroke-width:10; opacity:.85;
  stroke-dasharray:22 16; animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-38}}
.links g.is-gone{animation:lnGone .3s var(--e-out) forwards}
@keyframes lnGone{to{opacity:0}}

/* ---------- 포트 — 흰 종이 테두리 + 골드 종이 점 ----------
   글로우 없음. 흰 종이 링 5u 는 인라인(안쪽 정렬) — 점 36u, 링이 안쪽을 차지해 색 점은 26u.
   흰 면에 overlay 는 결이 사라져 hard-light 로 결의 어두운 쪽만 살린다.
   연결되면 안쪽 점만 선과 같은 색으로 바뀐다 */
.port{position:absolute; z-index:4; width:calc(36 * var(--u)); height:calc(36 * var(--u));
  margin:calc(-18 * var(--u)) 0 0 calc(-18 * var(--u)); border-radius:50%; pointer-events:none;
  background:var(--abs-ring) var(--pp-tx-felt) center/calc(96 * var(--u)) repeat;
  background-blend-mode:hard-light;
  transition:transform var(--t-fast) var(--e-pop)}
.port::after{content:''; position:absolute; inset:calc(5 * var(--u)); border-radius:50%;
  background:var(--abs-port) var(--pp-tx-felt) center/calc(96 * var(--u)) repeat;
  background-blend-mode:overlay;
  transition:background-color var(--t-fast)}
.port.is-on{transform:scale(1.12)}
.port.is-on::after{background-color:var(--abs-port-on)}

/* ---------- 타일 — 틸 펠트 카드 §11.7 ---------- */
.tile{position:absolute; z-index:6; padding:0; border:0; cursor:pointer;
  width:calc(var(--tile-w) * var(--u)); height:calc(var(--tile-h) * var(--u));
  margin:calc(var(--tile-h) * var(--u) / -2) 0 0 calc(var(--tile-w) * var(--u) / -2);
  background:var(--pp-tx-card) center/100% 100% no-repeat;
  display:grid; place-items:center; overflow:visible;
  transition:transform .2s var(--e-out)}
.tile:focus-visible{outline:none}
@media (hover:hover){.tile:hover{transform:translateY(calc(-8 * var(--u))) scale(1.03)}}
.tile:active{transform:translateY(calc(-3 * var(--u))) scale(.97)}
.tile.is-armed{transform:translateY(calc(-12 * var(--u))) scale(1.05); z-index:7}
/* 고른 카드 · 힌트 — 선이 아니라 번지는 빛 (.pp-slot.is-next 와 같은 빛) */
.tile::after{content:''; position:absolute; inset:calc(-4 * var(--u));
  border-radius:calc(30 * var(--u)); pointer-events:none; opacity:0; z-index:-1;
  box-shadow:0 0 calc(40 * var(--u)) calc(10 * var(--u)) rgba(255,205,90,.62);
  background:radial-gradient(ellipse at 50% 50%, rgba(255,229,155,.55) 0%, rgba(255,214,102,0) 75%)}
.tile.is-armed::after{opacity:1}
.tile.is-hint::after{animation:ppNext 1.2s ease-in-out 3}
.tile.is-shake{animation:cardShake .42s var(--e-out)}
@keyframes cardShake{0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(calc(-16*var(--u))) rotate(-4deg)}
  45%{transform:translateX(calc(14*var(--u))) rotate(3.5deg)}
  70%{transform:translateX(calc(-8*var(--u))) rotate(-2deg)}}
.tile__art{position:relative; width:calc(118 * var(--u)); height:calc(118 * var(--u));
  display:grid; place-items:center}
.tile__art > *{grid-area:1/1}

/* 종이 오브젝트 — 원본 그림 + 펠트 결(overlay)을 그림 모양으로 오려 얹는다.
   결은 무채색이라 색은 원본 그대로. 들뜸 그림자는 mask 바깥 층(.obj)에 건다 (§11.3) */
.obj{position:relative; display:block; width:100%; height:100%; isolation:isolate;
  filter:var(--pp-lift-s)}
.obj > img,.obj > svg{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain}
.obj__tx{position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.95;
  background:var(--pp-tx-felt) 0 0/calc(96 * var(--u)) repeat;
  -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat}

/* 실루엣 — 상태에 따라 fill 만 바꾼다 */
.sil path{fill:var(--sil-idle); stroke:none; transition:fill var(--t-base) var(--e-out)}
.tile.is-outlined .sil path{fill:var(--sil-half)}
.tile--sil .obj--sil{transition:opacity var(--t-base)}
.tile.is-bloomed .obj--sil{opacity:0}
.tile--sil .obj--flw{opacity:0; transform:scale(.6);
  transition:opacity var(--t-base), transform var(--t-base) var(--e-pop)}
.tile.is-bloomed .obj--flw{opacity:1; transform:scale(1)}
.tile.is-bloomed{animation:bloomPop .52s var(--e-pop)}
@keyframes bloomPop{0%{transform:scale(1)}22%{transform:scale(.94)}55%{transform:scale(1.06)}100%{transform:scale(1)}}

/* 색 — 펠트 색 조각 */
.chip{width:calc(112 * var(--u)); height:calc(104 * var(--u)); border-radius:calc(22 * var(--u));
  background:var(--face) var(--pp-tx-felt) 0 0/calc(96 * var(--u)) repeat;
  background-blend-mode:overlay; filter:var(--pp-lift-s)}

/* 반짝이 — v4 와 같은 별가루 */
.spark-bit{position:absolute; z-index:28; width:var(--s); height:var(--s);
  background:var(--c); pointer-events:none; border-radius:50%;
  animation:bitFly .78s var(--e-out) forwards}
.spark-bit.star{border-radius:0;
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes bitFly{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
  15%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05) rotate(var(--rot))}}

/* ---------- 소년 — v4 와 같은 자리 · 같은 브리핑 이동 ---------- */
.boy-slot{position:absolute; z-index:14; transform-origin:50% 100%;
  left:calc(50.7 * var(--u)); top:calc(709.3 * var(--u));
  width:calc(284.8 * var(--u)); height:calc(470.3 * var(--u));
  transition:transform .62s var(--e-out)}
.boy{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; transition:transform var(--t-fast) var(--e-out)}
.boy img{width:100%; height:100%; display:block}
.boy:active{transform:scale(.96)}
.boy:focus-visible{outline:none}
.boy.is-cheer{animation:boyHop .9s var(--e-out) 2}
@keyframes boyHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-42*var(--u))) rotate(-3deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-20*var(--u))) rotate(2deg)}}
.boy.is-huh{animation:boyHuh .8s var(--e-out)}
@keyframes boyHuh{0%,100%{transform:rotate(0)}
  25%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}

/* ---------- 브리핑 §8.4 · §11.8 ----------
   소년 중심 x 193u → 960u : translateX 767u / scale 1.18 → 머리 top ≈ 625u
   말풍선 박스 바닥 = 머리 top − 93u = 532u → 말풍선 top = 296u (v4 와 같은 값) */
.veil{position:absolute; inset:0; z-index:12; background:var(--pp-veil);
  opacity:0; visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
body.is-briefing .boy-slot{z-index:16; transform:translateX(calc(767*var(--u))) scale(1.18)}
body.is-briefing .boy{animation:boyTalk 1.5s var(--e-out) .5s infinite}
@keyframes boyTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-12*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}
.talk{top:calc(296*var(--u)); z-index:17; opacity:0; visibility:hidden;
  transform:translateY(calc(26*var(--u))) rotate(-1.4deg) scale(.94); transform-origin:50% 100%;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow), transform .5s var(--e-pop)}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none; transition-delay:.28s}

/* ---------- 완료 화면 §8.3 (v4 와 같은 값 · 일러스트만 꽃다발) ---------- */
.win{position:absolute; inset:0; z-index:60; display:flex; align-items:center;
  justify-content:center; background:var(--pp-scrim);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(1040*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u)));
  transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(200*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg, rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
          mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle, rgba(255,232,148,.85) 0%, rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}
/* 꽃다발 아치 — 가운데가 가장 높다. 박스가 내용을 감싸야 아래 gap 이 실제 간격이 된다 */
.win__art{position:relative; z-index:2; width:calc(1040*var(--u)); height:calc(378*var(--u))}
.win__art .obj{position:absolute; width:calc(188*var(--u)); height:calc(188*var(--u));
  filter:drop-shadow(0 calc(10*var(--u)) calc(14*var(--u)) rgba(46,28,10,.34))}
.win.on .win__art .obj{animation:bloomIn .5s var(--e-pop) backwards, sway 3.2s ease-in-out .6s infinite}
@keyframes bloomIn{from{transform:scale(.3) rotate(-24deg); opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(calc(-8*var(--u)))}}
.win__line{position:relative; z-index:3; color:#fff; font-weight:800;
  font-size:calc(54*var(--u)); line-height:1.15;
  text-shadow:0 calc(5*var(--u)) 0 rgba(0,0,0,.22)}
.win__stack .win__actions{position:relative; z-index:3}
.win__sparks{position:absolute; left:50%; top:calc(-40*var(--u)); transform:translateX(-50%);
  width:calc(760*var(--u)); height:calc(480*var(--u)); z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s);
  background:var(--c); opacity:0; animation:twinkle 2.4s var(--e-out) infinite;
  animation-delay:var(--d);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}
  35%{opacity:1; transform:scale(1) rotate(35deg)}
  70%{opacity:.35; transform:scale(.75) rotate(70deg)}}
.win__confetti{position:absolute; left:50%; top:calc(80*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h);
  background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}
  12%{opacity:1}70%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body class="is-briefing">

<main class="stage theme-paper" id="stage">
  <img class="stage__bg" id="bg" alt="" src="img_png/B-2_05-stage-bg-garden-v4.webp" onerror="this.onerror=null;this.src='img_png/B-2_03-stage-bg-spring-v3.webp'">

  <!-- 상단 크롬 §11.2 · §11.4 -->
  <div class="pp-edge-tl">
    <button class="pp-ibtn" id="btnBack" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.1 2.9a2.4 2.4 0 0 0-3.4 0L4.6 11a1.4 1.4 0 0 0 0 2l8.1 8.1a2.4 2.4 0 1 0 3.4-3.4L10.1 12l6-6a2.4 2.4 0 0 0 0-3.1Z"/></svg>
    </button>
  </div>
  <div class="pp-edge-tr">
    <button class="pp-ibtn pp-ibtn--lang" id="btnLang" data-next="ko" aria-label="한국어">
      <span class="lg"><b id="lgEn" class="on">A</b><i id="lgKo" class="off">한</i></span>
    </button>
    <button class="pp-ibtn pp-ibtn--sound" id="btnSay" aria-label="Sound off" aria-pressed="false">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <path d="M3.5 10.2h4.1l5.3-4.3c.9-.7 2.2-.1 2.2 1.1v14c0 1.2-1.3 1.8-2.2 1.1l-5.3-4.3H3.5c-.8 0-1.5-.7-1.5-1.5v-4.6c0-.8.7-1.5 1.5-1.5Z"/>
        <path class="sound-wave" d="M18.2 10.7a4.6 4.6 0 0 1 0 6.6"/>
        <path class="sound-wave" d="M21.7 7.5a8.8 8.8 0 0 1 0 13"/>
        <path class="sound-wave sound-x" d="M18.4 10.4l6 6.8M24.4 10.4l-6 6.8"/>
      </svg>
    </button>
  </div>

  <!-- 진행 별 §11.5 — 줄 하나(그림자→꽃→색)를 완성할 때마다 1개 -->
  <div class="pp-edge-tc"><div class="pp-stars" id="stars" aria-hidden="true"></div></div>

  <!-- 문제판 — 배경의 크림 판 위에 3열 × 5줄 -->
  <div id="board" style="position:absolute; inset:0; z-index:5">
    <svg class="links" id="links" viewBox="0 0 1920 1200" preserveAspectRatio="none"></svg>
  </div>

  <!-- 브리핑 딤 + 종이 말풍선 §11.8 -->
  <div class="veil" id="veil" aria-hidden="true"></div>
  <div class="pp-talk talk" id="talk" aria-live="polite">
    <div class="pp-talk__paper"><div class="pp-talk__sheet"></div></div>
    <span class="pp-tag" id="talkTag">QUESTION</span>
    <p class="pp-talk__line" id="talkLine"></p>
  </div>

  <!-- 소년 — 브리핑 때 가운데로 나와 설명, 이후 누르면 문제를 다시 읽어 준다 -->
  <div class="boy-slot" id="boySlot">
    <button class="boy" id="boy" aria-label="Listen again"><img alt="" src="img_png/B-2_02-boy-v5.webp"></button>
  </div>

  <!-- 완료 화면 §8.3 -->
  <div class="win" id="win">
    <div class="win__stack">
      <div class="win__rays"></div>
      <div class="win__glow"></div>
      <div class="win__art" id="winArt"></div>
      <div class="win__sparks" id="winSparks"></div>
      <div class="win__confetti" id="winConf"></div>
      <div class="win__line" id="winLine">You found every flower's color!</div>
      <div class="win__actions">
        <button class="btn-bar btn--retry" id="retry"><span>PLAY AGAIN</span></button>
        <button class="btn-bar btn--exit" id="exit"><span>EXIT</span></button>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
'use strict';
/* ============================================================
   1. 효과음 — B-2_02.sequencing_v4 SFX 모듈 그대로 (다른 화면과 소리가 같아야 한다)
   ============================================================ */
const MUTE = {on:false};
const SFX = (() => {
  let C = null, bgmBus = null, bgmOn = false, bgmAt = 0, bgmTm = null, noiseBuf = null;
  const ac = () => {
    if(MUTE.on) return null;           /* 음소거 중에는 새 소리를 만들지 않는다 */
    if(!C){
      try{ const AC = window.AudioContext || window.webkitAudioContext; C = new AC() }catch(e){ return null }
    }
    if(C.state === 'suspended') C.resume();
    return C;
  };
  function voice(freq, at, dur, o){
    o = o || {}; const c = ac(); if(!c) return;
    const t0 = c.currentTime + at, bus = o.bus || c.destination;
    const g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(o.cut || 5200, t0);
    const peak = o.gain || .12, atk = o.atk || .006;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    const osc = (type, mul, det) => {
      const s = c.createOscillator();
      s.type = type; s.frequency.setValueAtTime(freq * mul, t0);
      if(det) s.detune.setValueAtTime(det, t0);
      s.connect(g); s.start(t0); s.stop(t0 + dur + .04);
    };
    osc(o.type || 'sine', 1, 0);
    if(o.h2) osc('sine', 2, 4);
    g.connect(f); f.connect(bus);
  }
  const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));
  function swoosh(at, dur, f0, f1, gain){
    const c = ac(); if(!c) return;
    if(!noiseBuf){
      const n = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  }
  /* 오답 — 짧은 타격 뒤 음정이 크게 내려가는 두꺼운 경고음 */
  function wrongHit(){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime;
    const master = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.setValueAtTime(1.25, t0);
    lp.frequency.setValueAtTime(1800, t0);
    lp.frequency.exponentialRampToValueAtTime(620, t0 + .44);
    master.gain.setValueAtTime(.0001, t0);
    master.gain.exponentialRampToValueAtTime(.16, t0 + .008);
    master.gain.setValueAtTime(.14, t0 + .09);
    master.gain.exponentialRampToValueAtTime(.0001, t0 + .46);
    [
      {type:'square',   from:330, to:185, det:-5},
      {type:'sawtooth', from:220, to:110, det: 5}
    ].forEach(v => {
      const o = c.createOscillator();
      o.type = v.type; o.detune.setValueAtTime(v.det, t0);
      o.frequency.setValueAtTime(v.from, t0);
      o.frequency.exponentialRampToValueAtTime(v.to, t0 + .4);
      o.connect(master); o.start(t0); o.stop(t0 + .48);
    });
    master.connect(lp); lp.connect(c.destination);
    swoosh(0, .18, 1500, 260, .11);
    voice(98, .17, .32, {type:'triangle', gain:.13, atk:.004, cut:760, h2:true});
  }
  const C3=130.81, C4=261.63, G4=392, C5=523.25, E5=659.25, G5=784,
        C6=1046.5, E6=1318.5, G6=1568, C7=2093, E7=2637, G7=3136,
        A4=440, B4=493.88, D5=587.33, F5=698.46, A5=880, B5=987.77, D6=1174.7,
        F3=174.61, G3=196;
  const marimba = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'triangle', gain:gain, atk:.004, cut:4200, h2:true});
  const bell = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', gain:gain, atk:.004, cut:8000, h2:true});
  const BEAT = .28;
  const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
               [G5,2,.5],[E5,2.5,.5],[F5,3,1],[E5,4,.5],[D5,4.5,.5],
               [C5,5,.5],[E5,5.5,.5],[G5,6,1],[C5,7,1]];
  const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
  function bgmTone(freq, at, dur, type, gain){
    const c = ac(); if(!c || !bgmBus) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);

    ctx(){ return C },
    unlock(){ ac() },
    tap(){ marimba(G5, 0, .14, .09) },
    step(i){ marimba([C5,D5,E5,G5,A5,C6][Math.min(i,5)], 0, .26, .11) },
    good(){ [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));

    bad(){ wrongHit() },
    clear(){ swoosh(0, .5, 700, 5200, .1);
             [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12)) },
    fanfare(){
      [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(m => marimba(m[0],m[1],m[2],.12));
      [[G5,.5,.14],[A5,.62,.14],[B5,.74,.14],[C6,.86,.3]]
        .forEach(m => marimba(m[0],m[1],m[2],.12));
      chord([C5,E5,G5,C6], 1.2, 1.1, {type:'triangle', gain:.07});
      [[E6,2.35,.4],[D6,2.6,.4],[C6,2.85,.55]]
        .forEach(m => bell(m[0],m[1],m[2],.10));
      chord([C5,E5,G5,C6], 3.5, 1.5, {type:'triangle', gain:.08});
      voice(C4, 3.5, 1.5, {type:'sine', gain:.07});
      [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(m => bell(m[0],m[1],m[2],.045));

      if(bgmOn) return;
      bgmOn = true;
      bgmBus = c.createGain(); bgmBus.gain.setValueAtTime(.9, c.currentTime);
      bgmBus.connect(c.destination);
      bgmAt = c.currentTime + (delay === undefined ? .35 : delay);
      bgmLoop();
    },
    bgmStop(){
      const c = ac(); bgmOn = false;
      if(bgmTm){ clearTimeout(bgmTm); bgmTm = null }
      if(bgmBus && c){
        const bus = bgmBus; bgmBus = null;
        try{
          const t0 = c.currentTime;
          bus.gain.setValueAtTime(bus.gain.value, t0);
          bus.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
        }catch(e){}
        setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
      }
    }
  };
})();

/* 열별 표시 순서 — 원본 워크시트 배치 그대로. 셔플하지 않는다 */
const COL_SIL = [1,2,3,4,5];
const COL_FLW = [4,3,1,2,5];
const COL_CLR = [1,4,5,3,2];

/* 좌표 — 아트보드 u. 크림 판(x 195~1755 · y 128~1095)의 가운데(975, 612)에 맞춘다.
   실루엣 열 왼쪽 끝(371u)이 좌하단 소년(~336u)과 겹치지 않는다 */
const ROW_Y = [268, 440, 612, 784, 956];
const X = { sil:455, p1:575, p2:855, flw:975, p3:1095, p4:1375, clr:1495 };   /* 좌·우 열을 원래보다 30u 씩 바깥으로 */

const I18N = {
  en:{ instr:'Look at the shadows! Match each shadow to its flower, then the flower to its color.',
       tag:'QUESTION', win:"You found every flower's color!", retry:'PLAY AGAIN', exit:'EXIT',
       shadow:'Shadow', flower:'Flower', color:'Color' },
  ko:{ instr:'그림자를 잘 봐! 그림자를 꽃에 잇고, 꽃을 알맞은 색에 이어 보자.',
       tag:'문제', win:'꽃의 색을 모두 찾았어!', retry:'다시하기', exit:'나가기',
       shadow:'그림자', flower:'꽃', color:'색' }
};

/* ============================================================
   3. 화면 만들기
   ============================================================ */
const stage  = document.getElementById('stage');
const board  = document.getElementById('board');
const links  = document.getElementById('links');
const starsEl= document.getElementById('stars');
const winEl  = document.getElementById('win');
const boyEl  = document.getElementById('boy');
const btnSay = document.getElementById('btnSay');
const SVGNS  = 'http://www.w3.org/2000/svg';
const HOME   = 'B-2_00.home.html#abstraction';

let lang = 'en', tiles = [], linkAB = {}, linkBC = {}, armed = null, drag = null,
    draftEl = null, done = 0, hintTimer = null, locked = false;

const SIL_URI = {};
Object.keys(SIL).forEach(k => {
  SIL_URI[k] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SIL[k]);
});

function el(tag, cls, parent){
  const n = document.createElement(tag); if(cls) n.className = cls;
  if(parent) parent.appendChild(n); return n;
}
/* 종이 오브젝트 = 원본 그림 + 같은 모양으로 오린 펠트 결 */
function paperObj(parent, cls, maskUri, inner){
  const o = el('span', 'obj ' + (cls || ''), parent);
  o.style.setProperty('--m', 'url("' + maskUri + '")');
  if(typeof inner === 'string') o.innerHTML = inner;
  else o.appendChild(inner);
  el('i', 'obj__tx', o);
  return o;
}
function flowerImg(id){
  const im = document.createElement('img'); im.alt = ''; im.src = FLOWER[id]; return im;
}
function port(x, y, key){
  const p = el('i', 'port', board);
  p.style.left = 'calc(' + x + ' * var(--u))';
  p.style.top  = 'calc(' + y + ' * var(--u))';
  p.dataset.key = key; return p;
}
function makeTile(kind, id, row){
  const b = el('button', 'tile tile--' + kind, board);
  b.style.left = 'calc(' + X[kind] + ' * var(--u))';
  b.style.top  = 'calc(' + ROW_Y[row] + ' * var(--u))';
  const art = el('div', 'tile__art', b);
  if(kind === 'sil'){
    paperObj(art, 'obj--sil', SIL_URI[id], SIL[id]);
    paperObj(art, 'obj--flw', FLOWER[id], flowerImg(id));
  }else if(kind === 'flw'){
    paperObj(art, '', FLOWER[id], flowerImg(id));
  }else{
    const c = el('i', 'chip', art);
    c.style.setProperty('--face', CHIP[id].face);
  }
  const rec = {el:b, kind, id, row};
  b.__rec = rec; tiles.push(rec); return rec;
}
function build(){
  tiles = [];
  [].slice.call(board.querySelectorAll('.tile,.port')).forEach(n => n.remove());
  links.innerHTML = '';
  for(let r = 0; r < 5; r++){
    makeTile('sil', COL_SIL[r], r);
    makeTile('flw', COL_FLW[r], r);
    makeTile('clr', COL_CLR[r], r);
    port(X.p1, ROW_Y[r], 's'  + COL_SIL[r]);
    port(X.p2, ROW_Y[r], 'fl' + COL_FLW[r]);
    port(X.p3, ROW_Y[r], 'fr' + COL_FLW[r]);
    port(X.p4, ROW_Y[r], 'c'  + COL_CLR[r]);
  }
  linkAB = {}; linkBC = {}; done = 0; armed = null;
  labelTiles(); paintStars();
}
function labelTiles(){
  const t = I18N[lang];
  tiles.forEach(r => r.el.setAttribute('aria-label',
    (r.kind === 'sil' ? t.shadow : r.kind === 'flw' ? t.flower : t.color) + ' ' + (r.row + 1)));
}
(function buildStars(){
  for(let i = 0; i < 5; i++) el('i', 'pp-star', starsEl);
})();
function paintStars(){
  [].forEach.call(starsEl.children, (s, k) => s.classList.toggle('on', k < done));
}
const rowOf = (kind, id) => (kind === 'sil' ? COL_SIL : kind === 'flw' ? COL_FLW : COL_CLR).indexOf(id);
function anchor(kind, id, side){
  const y = ROW_Y[rowOf(kind, id)];
  if(kind === 'sil') return [X.p1, y];
  if(kind === 'clr') return [X.p4, y];
  return [side === 'left' ? X.p2 : X.p3, y];
}
const tileOf = (kind, id) => tiles.find(t => t.kind === kind && t.id === id);

/* ============================================================
   4. 연결선
   ============================================================ */
function curve(a, b){
  const mx = (a[0] + b[0]) / 2;
  return 'M' + a[0] + ' ' + a[1] + ' C ' + mx + ' ' + a[1] + ', ' + mx + ' ' + b[1] + ', ' + b[0] + ' ' + b[1];
}
function addLink(type, id){
  const a = type === 'AB' ? anchor('sil', id) : anchor('flw', id, 'right');
  const b = type === 'AB' ? anchor('flw', id, 'left') : anchor('clr', id);
  const g = document.createElementNS(SVGNS, 'g');
  g.dataset.type = type; g.dataset.id = id;
  const d = curve(a, b);
  [['ln ln--core', null], ['hit', null]].forEach(([cls, tf]) => {
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', d); p.setAttribute('class', cls);
    if(tf) p.setAttribute('transform', tf);
    g.appendChild(p);
  });
  g.addEventListener('pointerdown', ev => { ev.stopPropagation(); if(locked) return; removeLink(type, id); SFX.tap(); });
  links.appendChild(g);
  setPort(type === 'AB' ? 's' + id : 'fr' + id, true);
  setPort(type === 'AB' ? 'fl' + id : 'c' + id, true);
}
function removeLink(type, id){
  const g = links.querySelector('g[data-type="' + type + '"][data-id="' + id + '"]');
  if(g){ g.classList.add('is-gone'); setTimeout(() => g.remove(), 300); }
  if(type === 'AB'){ delete linkAB[id]; setPort('s' + id, false); setPort('fl' + id, false); }
  else { delete linkBC[id]; setPort('fr' + id, false); setPort('c' + id, false); }
  refresh(); armHint();
}
function setPort(key, on){
  const p = board.querySelector('.port[data-key="' + key + '"]');
  if(p) p.classList.toggle('is-on', !!on);
}
function refresh(){
  for(let id = 1; id <= 5; id++){
    const s = tileOf('sil', id), ab = !!linkAB[id], bc = !!linkBC[id];
    s.el.classList.toggle('is-outlined', ab && !(ab && bc));
    s.el.classList.toggle('is-bloomed', ab && bc);
  }
}

/* ============================================================
   5. 입력 — 탭·탭과 드래그를 모드 전환 없이 함께 받는다 (원본 규칙 유지)
   ============================================================ */
function toLocal(ev){
  const r = stage.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * 1920, (ev.clientY - r.top) / r.height * 1200];
}
function startDraft(rec, pt){
  clearDraft();
  const side = rec.kind === 'flw' ? (pt[0] < X.flw ? 'left' : 'right') : null;
  const a = anchor(rec.kind, rec.id, side);
  draftEl = document.createElementNS(SVGNS, 'path');
  draftEl.setAttribute('class', 'ln ln--draft');
  draftEl.setAttribute('d', curve(a, pt));
  draftEl.__a = a; draftEl.__side = side;
  links.appendChild(draftEl);
}
function moveDraft(pt){
  if(!draftEl) return;
  if(drag && drag.kind === 'flw'){
    const side = pt[0] < X.flw ? 'left' : 'right';
    if(side !== draftEl.__side){ draftEl.__side = side; draftEl.__a = anchor('flw', drag.id, side); }
  }
  draftEl.setAttribute('d', curve(draftEl.__a, pt));
}
function clearDraft(){ if(draftEl){ draftEl.remove(); draftEl = null; } }
function disarm(){ if(armed){ armed.el.classList.remove('is-armed'); armed = null; } }
function shake(rec){
  rec.el.classList.remove('is-shake'); void rec.el.offsetWidth; rec.el.classList.add('is-shake');
  setTimeout(() => rec.el.classList.remove('is-shake'), 440);
}
function complete(a, b){
  clearDraft();
  if(!a || !b || a === b) return;
  const kinds = [a.kind, b.kind].sort().join('-');
  const type = kinds === 'flw-sil' ? 'AB' : kinds === 'clr-flw' ? 'BC' : null;
  if(!type) return;                                   /* 무효 — 소리·흔들림 없음 */
  if(a.id !== b.id){ shake(a); shake(b); SFX.bad(); react('huh'); return; }
  const id = a.id;
  if(type === 'AB'){ if(linkAB[id]) return; linkAB[id] = 1; }
  else { if(linkBC[id]) return; linkBC[id] = 1; }
  addLink(type, id);
  SFX.step(type === 'AB' ? 0 : 2);
  refresh();
  if(linkAB[id] && linkBC[id]) chainDone(id);
  armHint();
}
function chainDone(id){
  SFX.good();
  react('cheer');
  burstAt(tileOf('sil', id).el);
  done++; paintStars();
  if(done === 5){ locked = true; clearTimeout(hintTimer); setTimeout(finish, 900); }
}
function burstAt(host){
  const colors = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#F0BDD9','#BFE3D8'];
  const r = host.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height * .5;
  const u = U(), N = 16;
  for(let i = 0; i < N; i++){
    const e = el('i', 'spark-bit' + (i % 3 ? ' star' : ''), stage);
    const a = -Math.PI * (0.06 + 0.88 * (i / (N - 1)));
    const rad = (100 + (i % 4) * 30) * u;
    e.style.cssText = 'left:' + cx + 'px; top:' + cy + 'px;' +
      '--s:' + Math.round((9 + (i % 5) * 4) * u) + 'px; --c:' + colors[i % colors.length] + ';' +
      '--dx:' + (Math.cos(a) * rad).toFixed(1) + 'px; --dy:' + (Math.sin(a) * rad).toFixed(1) + 'px;' +
      '--rot:' + (i * 47 % 360) + 'deg; animation-delay:' + (i * 14) + 'ms';
    setTimeout(() => e.remove(), 900);
  }
}
const U = () => stage.getBoundingClientRect().width / 1920;

/* 힌트 — 8초 무입력이면 아직 안 이어진 카드 하나에 빛 */
function armHint(){
  clearTimeout(hintTimer);
  if(locked || briefing) return;
  hintTimer = setTimeout(() => {
    for(let id = 1; id <= 5; id++){
      const t = !linkAB[id] ? tileOf('sil', id) : !linkBC[id] ? tileOf('flw', id) : null;
      if(t){ t.el.classList.add('is-hint'); SFX.tap();
             setTimeout(() => t.el.classList.remove('is-hint'), 3700); break; }
    }
    armHint();
  }, 8000);
}

board.addEventListener('pointerdown', ev => {
  if(locked || briefing) return;
  const t = ev.target.closest ? ev.target.closest('.tile') : null;
  if(!t){ disarm(); clearDraft(); return; }
  ev.preventDefault(); SFX.unlock();
  const rec = t.__rec, pt = toLocal(ev);
  if(armed && armed !== rec){ const a = armed; disarm(); complete(a, rec); return; }
  if(armed === rec){ disarm(); clearDraft(); return; }
  SFX.tap();
  drag = rec; armed = rec; rec.el.classList.add('is-armed');
  startDraft(rec, pt);
  board.setPointerCapture && board.setPointerCapture(ev.pointerId);
});
board.addEventListener('pointermove', ev => { if(drag) moveDraft(toLocal(ev)); });
board.addEventListener('pointerup', ev => {
  if(!drag) return;
  const over = document.elementFromPoint(ev.clientX, ev.clientY);
  const t = over && over.closest ? over.closest('.tile') : null;
  if(t && t.__rec !== drag){ const a = drag; disarm(); complete(a, t.__rec); }
  else clearDraft();                                  /* 제자리에서 뗐다 = 탭. armed 유지 */
  drag = null;
});
board.addEventListener('pointercancel', () => { drag = null; clearDraft(); });

/* 소년 반응 */
let reactTm = null;
function react(kind){
  boyEl.classList.remove('is-cheer', 'is-huh'); void boyEl.offsetWidth;
  boyEl.classList.add(kind === 'cheer' ? 'is-cheer' : 'is-huh');
  clearTimeout(reactTm);
  reactTm = setTimeout(() => boyEl.classList.remove('is-cheer', 'is-huh'), 1900);
}

/* ============================================================
   6. 완료 화면 §8.3
   ============================================================ */
(function buildWinArt(){
  const art = document.getElementById('winArt');
  [1,2,3,4,5].forEach((id, i) => {
    const f = (i - 2) / 2;                                  /* -1 … 1 */
    const x = 520 + f * 396, y = 190 - (1 - f * f) * 100;   /* 아치 */
    const o = paperObj(art, '', FLOWER[id], flowerImg(id));
    o.style.left = 'calc(' + (x - 94) + ' * var(--u))';
    o.style.top  = 'calc(' + y + ' * var(--u))';
    o.style.animationDelay = (i * .11) + 's, ' + (.6 + i * .2) + 's';
  });
})();
(function buildSparks(){
  const box = document.getElementById('winSparks');
  const COLORS = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#F0BDD9','#F7C8A0'];
  let seed = 20260929;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const N = 18;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + rnd() * .18, rad = .40 + rnd() * .16;
    const e = el('i', 'spark', box);
    e.style.cssText = '--x:' + (50 + Math.cos(ang) * rad * 116) + '%; --y:' + (50 + Math.sin(ang) * rad * 136) + '%;' +
      '--s:calc(' + (14 + Math.round(rnd() * 22)) + '*var(--u)); --c:' + COLORS[i % COLORS.length] + ';' +
      '--d:' + (rnd() * 2.2).toFixed(2) + 's';
  }
})();
(function buildConfetti(){
  const box = document.getElementById('winConf');
  const C = ['#FDE751','#E86FA7','#7E9ED3','#E83F39','#F0BDD9','#76905F','#FFF6DF'];
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 250;
    const e = el('i', 'conf', box);
    e.style.cssText = '--w:calc(' + (12 + Math.round(rnd() * 12)) + '*var(--u)); --h:calc(' + (16 + Math.round(rnd() * 18)) + '*var(--u));' +
      '--c:' + C[i % C.length] + '; --r:' + (rnd() < .4 ? '50%' : 'calc(4*var(--u))') + ';' +
      '--dx:calc(' + (Math.cos(ang) * dist).toFixed(0) + '*var(--u)); --dy:calc(' + (Math.sin(ang) * dist - 60).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd() * 900 - 450) + 'deg; --d:' + (rnd() * .35).toFixed(2) + 's';
  }
})();
function finish(){
  /* 실루엣 열이 위에서부터 한 번씩 톡 — 원본 연출 유지 */
  let seq = 0;
  const iv = setInterval(() => {
    if(seq >= 5){
      clearInterval(iv);
      SFX.clear();
      winEl.classList.add('on');
      setTimeout(() => SFX.fanfare(), 120);
      setTimeout(() => SFX.bgmStart(0), 3400);
      return;
    }
    const t = tileOf('sil', COL_SIL[seq]).el;
    t.classList.remove('is-bloomed'); void t.offsetWidth; t.classList.add('is-bloomed');
    SFX.step(seq);
    seq++;
  }, 340);
}
function resetGame(){
  SFX.bgmStop();
  winEl.classList.remove('on');
  locked = false;
  build(); refresh(); armHint();
}

/* ============================================================
   7. 음성 — 문제 문장(instr)은 녹음본 mp3, 나머지 문장은 speechSynthesis
      문제음성: Higgsfield Seed Audio · Pixie (DESIGN.md '생성 보이스 레지스트리')
      파일: audio/voice-q/q_05_abs_{en,ko}.mp3 — 읽지 못하면 같은 문장을 TTS 로 읽는다
   ============================================================ */
let speakTm = null;
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
/* 문제음성 녹음본 — 상대 경로(HTML 과 같은 폴더 기준) */
const VOICE_Q = {
  en:'audio/voice-q/q_05_abs_en.mp3',
  ko:'audio/voice-q/q_05_abs_ko.mp3'
};
let qAudio = null;
function stopVoice(){
  if(qAudio){ qAudio.onended = qAudio.onerror = qAudio.onplaying = null; qAudio.pause(); qAudio = null }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function speakTTS(l, text, hooks){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (l === 'ko') ? 'ko-KR' : 'en-US';
    u.rate = (l === 'ko') ? 1 : .95;
    u.pitch = 1.15;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.indexOf(l) === 0);
    if(v) u.voice = v;
    sayFlag(true);
    clearTimeout(speakTm);
    u.onstart = () => { if(hooks.start) hooks.start() };
    u.onend = () => { sayFlag(false); if(hooks.end) hooks.end() };
    u.onerror = () => { sayFlag(false); if(hooks.end) hooks.end() };
    speakTm = setTimeout(() => sayFlag(false), 12000);
    speechSynthesis.speak(u);
  }catch(e){ sayFlag(false) }
}
/* 녹음본 재생. 파일을 못 읽으면 TTS 로 넘기고,
   자동재생 차단(NotAllowedError)이면 조용히 멈춘다 — 브리핑의 첫 탭 재시도가 다시 부른다 */
function playVoiceFile(src, l, text, hooks){
  const a = new Audio(src);
  qAudio = a;
  let fell = false;
  const fallback = () => {
    if(fell || qAudio !== a) return;
    fell = true; qAudio = null;
    speakTTS(l, text, hooks);
  };
  a.onplaying = () => {
    if(qAudio !== a) return;
    sayFlag(true);
    clearTimeout(speakTm);
    speakTm = setTimeout(() => sayFlag(false), 15000);
    if(hooks.start) hooks.start();
  };
  a.onended = () => {
    if(qAudio !== a) return;
    qAudio = null; sayFlag(false);
    if(hooks.end) hooks.end();
  };
  a.onerror = fallback;
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    if(err && err.name === 'NotAllowedError'){ if(qAudio === a) qAudio = null; sayFlag(false); return }
    fallback();
  });
}
function say(l, key, hooks){
  l = l || lang;
  const t = I18N[l];
  const text = I18N[l][key || 'instr'];
  if(!text || MUTE.on) return;
  hooks = hooks || {};
  stopVoice();
  if((key || 'instr') === 'instr' && VOICE_Q[l]){ playVoiceFile(VOICE_Q[l], l, text, hooks); return }
  speakTTS(l, text, hooks);
}
function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.getElementById('lgEn').className = ko ? 'off' : 'on';
  document.getElementById('lgKo').className = ko ? 'on'  : 'off';
  const bl = document.getElementById('btnLang');
  bl.dataset.next = ko ? 'en' : 'ko';
  bl.setAttribute('aria-label', ko ? 'English' : '한국어');
  paintMute();
  document.getElementById('winLine').textContent = t.win;
  document.getElementById('talkTag').textContent = t.tag;
  document.getElementById('talkLine').textContent = t.instr;
  document.querySelector('#retry span').textContent = t.retry;
  document.querySelector('#exit span').textContent  = t.exit;
  document.documentElement.lang = lang;
  labelTiles();
}

/* ============================================================
   8. 브리핑 · 상단 버튼 (v4 흐름)
   끝나는 조건: 음성이 끝남 / 음성이 시작되지 않으면 7s / 900ms 이후 아무 데나 탭.
   ============================================================ */
let briefing = true, briefTm = null, skipArmed = false, voiceOn = false, retried = false;
function briefSay(){
  voiceOn = false;
  say(lang, 'instr', {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false;
  clearTimeout(hintTimer); disarm(); clearDraft();
  document.body.classList.add('is-briefing');
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
  briefSay();
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm);
  document.body.classList.remove('is-briefing');
  armHint();
}
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.pp-ibtn, .boy, .win')) return;
  if(!voiceOn && !retried && !qAudio && !('speechSynthesis' in window && speechSynthesis.speaking)){
    retried = true;
    clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
    briefSay(); return;
  }
  if(skipArmed) endBriefing();
}, true);
/* 소년을 누르면 브리핑을 다시 — 가운데로 나와 문제를 다시 읽어 준다 */
boyEl.addEventListener('click', () => {
  SFX.tap();
  if(briefing){ briefSay(); return }
  if(!locked) startBriefing();
});
/* 사운드 버튼 = 음소거 토글 (§4.1 · §11.4) */
function paintMute(){
  const L = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', L[lang][MUTE.on ? 'on' : 'off']);
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){
    SFX.tap();
    MUTE.on = true;
    stopVoice();
    sayFlag(false);
    const c = SFX.ctx(); if(c && c.state === 'running') c.suspend();
  }else{
    MUTE.on = false;
    const c = SFX.ctx(); if(c && c.state === 'suspended') c.resume();
    if(winEl.classList.contains('on')){ SFX.bgmStop(); SFX.bgmStart(0) }
    SFX.tap();
  }
  paintMute();
});
document.getElementById('btnLang').addEventListener('click', e => {
  SFX.unlock(); SFX.tap();
  lang = e.currentTarget.dataset.next;
  applyLang();
  if(briefing) briefSay(); else say(lang, 'instr');
});
document.getElementById('btnBack').addEventListener('click', () => { SFX.tap(); location.href = HOME; });
document.getElementById('exit').addEventListener('click',   () => { SFX.tap(); location.href = HOME; });
document.getElementById('retry').addEventListener('click',  () => { SFX.tap(); resetGame(); });

if('speechSynthesis' in window) speechSynthesis.getVoices();
build(); refresh();
applyLang();
startBriefing();
})();
</script>
