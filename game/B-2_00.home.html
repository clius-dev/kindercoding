<script>
const STAGES=[
 {id:'algorithms',title:'ALGORITHMS',href:'B-2_01.algorithms_v2.html',color:'#756487'},
 {id:'sequencing',title:'SEQUENCING',href:'B-2_02.sequencing_v4.html',color:'#6e806a'},
 {id:'decomposition',title:'DECOMPOSITION',href:'B-2_03.decomposition_v2.html',color:'#9b7f5d'},
 {id:'branching',title:'BRANCHING',href:'B-2_04.branching_v2.html',color:'#65808b'},
 {id:'abstraction',title:'ABSTRACTION',href:'B-2_05.abstraction_v2.html',color:'#95727a'},
 {id:'pattern',title:'PATTERN',href:'B-2_06.pattern_v2.html',color:'#5f7f79'}
];
const KEY='coding-kindergarten-b2-progress',buttons=[...document.querySelectorAll('.stage')],progressStars=[...document.querySelectorAll('.progress-star')],toast=document.getElementById('toast'),curtain=document.getElementById('curtain');let toastTimer=0;
const savedProgress=()=>{try{return Number(localStorage.getItem(KEY))||0}catch{return 0}},saveProgress=value=>{try{localStorage.setItem(KEY,String(value))}catch{}};
let progress=Math.max(0,Math.min(6,savedProgress()));
const returned=STAGES.findIndex(s=>s.id===decodeURIComponent(location.hash.slice(1)));
if(returned>=0){progress=Math.max(progress,returned+1);saveProgress(progress)}
function render(){progressStars.forEach((star,i)=>star.classList.toggle('on',i<progress));buttons.forEach((b,i)=>{const done=i<progress,locked=i>progress,now=progress<6&&i===progress;b.classList.toggle('is-done',done);b.classList.toggle('is-locked',locked);b.classList.toggle('is-current',now);b.setAttribute('aria-disabled',locked);b.setAttribute('aria-label',`${i+1}단계 ${STAGES[i].title}, ${locked?'잠김':done?'완료, 다시 하기':'현재 스테이지'}`)});document.getElementById('doneRoute').style.strokeDasharray=`${Math.min(100,progress/5*100)} 100`}
function locked(i){const b=buttons[i];b.classList.remove('is-shaking');void b.offsetWidth;b.classList.add('is-shaking');toast.textContent=`${String(progress+1).padStart(2,'0')}번 스테이지를 먼저 완료해요!`;toast.classList.add('is-on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('is-on'),1800)}
function openStage(i,b){const s=STAGES[i],r=b.querySelector('.stage__disc').getBoundingClientRect();curtain.style.setProperty('--cx',`${r.left+r.width/2}px`);curtain.style.setProperty('--cy',`${r.top+r.height/2}px`);curtain.style.setProperty('--go',s.color);document.getElementById('curtainNum').textContent=String(i+1).padStart(2,'0');document.getElementById('curtainTitle').textContent=s.title;curtain.classList.add('is-on');setTimeout(()=>location.href=s.href,760)}
buttons.forEach((b,i)=>b.addEventListener('click',()=>i>progress?locked(i):openStage(i,b)));
document.getElementById('homeBtn').addEventListener('click',()=>location.href='A-0_00.main.html');addEventListener('pageshow',()=>curtain.classList.remove('is-on'));render();
</script>
