/* ============================================================
   B-1_03 DECOMPOSITION — 도형 찾기 (Textured Cut-Paper Storybook Theater)
   뼈대: B-1_02.sequencing (교실 칠판 와이드 마스터 · 상단 크롬 · 종이 소년 브리핑 · 완료 화면)
   배경: B-1_03-bg-library-v14-main-wood-soft (05와 동일 배경)
   플레이: B-2_03.decomposition_v2 (삼각형→동그라미→정사각형→직사각형 순서로 눌러 찾기 · 카운터 · 이름 팝업)
   그림: 첨부 워크시트(Step B-1) 도형 그대로 — 삼각형 19 · 동그라미 4 · 정사각형 7 · 직사각형 6
   DESIGN.md §11(종이 콜라주) · §8.3 완료 · §8.4 브리핑 · §9.1.4 반응형
   공통 토큰·버튼은 DESIGN.css(.theme-paper · .pp-*), 반응형은 RESPONSIVE.css
   ============================================================ */
:root{
  --b1-ink:#1F2937;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#E9C48E; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent}
body{display:grid; place-items:center; word-break:keep-all}
button{font:inherit; color:inherit}
img{user-select:none; -webkit-user-drag:none}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u)); isolation:isolate; touch-action:manipulation}
.stage__bg{position:absolute; left:0; top:0; width:calc(1920*var(--u)); height:calc(1200*var(--u));
  max-width:none; display:block; z-index:0;
  image-rendering:auto;
  filter:saturate(1.05)}
.stage__bg--foliage{pointer-events:none; filter:saturate(1.15);
  -webkit-mask-image:
    radial-gradient(ellipse 6% 11% at 18% 0%, #000 0 38%, transparent 85%),
    radial-gradient(ellipse 6% 11% at 82% 0%, #000 0 38%, transparent 85%);
  mask-image:
    radial-gradient(ellipse 6% 11% at 18% 0%, #000 0 38%, transparent 85%),
    radial-gradient(ellipse 6% 11% at 82% 0%, #000 0 38%, transparent 85%)}
.stage__bg--board{z-index:1; pointer-events:none; transform:scaleY(1.055); transform-origin:50% 50%;
  clip-path:inset(calc(158*var(--u)) calc(570*var(--u)) calc(148*var(--u)) calc(610*var(--u)) round calc(86*var(--u)))}
.stage__fill{position:fixed; inset:0; width:100%; height:100%; object-fit:fill; z-index:-1; pointer-events:none}

/* ---------- 상단 크롬 (§11.4 · RESPONSIVE .pp-edge-*) ---------- */
.pp-ibtn svg{fill:currentColor; stroke:none}
.pp-ibtn--sound .sound-wave{fill:none; stroke:currentColor; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round}
.pp-ibtn.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.pp-edge-tl>.pp-ibtn,.pp-edge-tr>.pp-ibtn{flex:none}

/* ---------- 도형 판 — 칠판 위에 붙인 워크시트 종이 ---------- */
.sheet{position:absolute; z-index:6; left:calc(359*var(--u)); top:calc(320*var(--u));
  width:calc(1220*var(--u)); height:calc(560*var(--u))}
.scene{position:absolute; left:50%; top:50%; width:calc(1220*var(--u)); aspect-ratio:1544/680;
  transform:translate(-50%,-50%); cursor:pointer; touch-action:manipulation}
.scene > svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; display:block}
.shape{transition:fill .34s ease, opacity .34s ease; transform-box:fill-box; transform-origin:center}
.fx{position:absolute; inset:0; z-index:20; pointer-events:none}
.fx .bit{position:absolute; border-radius:50%; animation:ph-spark .5s ease-out 1 both}
.fx .fly{position:absolute; opacity:1; transition:transform .44s cubic-bezier(.42,.02,.42,1), opacity .44s ease}
.fx .fly svg{display:block; width:100%; height:100%}

@keyframes ph-pop{0%{transform:scale(1)}28%{transform:scale(1.16) rotate(-2deg)}58%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes ph-wobble{0%,100%{transform:rotate(0) scale(1)}22%{transform:rotate(-4deg) scale(1.03)}55%{transform:rotate(4deg) scale(1.03)}80%{transform:rotate(-2deg) scale(1)}}
@keyframes ph-spark{0%{transform:translate(-50%,-50%) scale(.4); opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9); opacity:0}}
@keyframes ph-shape-appear{0%{opacity:0; transform:scale(.2)}62%{opacity:1; transform:scale(1.1)}100%{opacity:1; transform:scale(1)}}
@keyframes ph-hint-shake{0%,100%{transform:translate(0)}14%{transform:translate(-17%)}38%{transform:translate(15%)}62%{transform:translate(-12%)}84%{transform:translate(8%)}}
@keyframes ph-bubble-pop{0%{transform:translateX(-50%) scale(.82)}55%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(1)}}

/* ---------- 안내 쪽지 — "삼각형 19개를 찾아보자!" (B-2_03 notice) ---------- */
.notice{position:absolute; z-index:8; left:50%; top:calc(212*var(--u)); width:calc(620*var(--u)); height:calc(104*var(--u));
  transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:calc(22*var(--u));
  padding:0 calc(40*var(--u)); pointer-events:none; isolation:isolate;
  transition:opacity var(--t-base) var(--e-out), visibility var(--t-base)}
.notice.pop{animation:ph-bubble-pop var(--t-slow) var(--e-pop) both}
.notice__paper{position:absolute; inset:0; z-index:-1;
  -webkit-mask:var(--pp-mask-tag) center/100% 100% no-repeat; mask:var(--pp-mask-tag) center/100% 100% no-repeat;
  background-color:var(--pp-gold); background-image:url("../img_png/paper/tx-paper-grain.webp"); background-size:calc(460*var(--u)) calc(160*var(--u));
  background-position:center; background-blend-mode:overlay}
.notice__glyph{width:calc(64*var(--u)); height:calc(64*var(--u)); flex:none; overflow:visible}
.notice__text{color:var(--pp-ink); font-size:calc(40*var(--u)); font-weight:800; line-height:1; letter-spacing:-.02em; white-space:nowrap}
html[lang="ko"] .notice__text{letter-spacing:-.03em}

/* ---------- 카운터 — 나무 판자 (B-2_03 counter, 크림 판 아래 중앙) ---------- */
.counter{position:absolute; z-index:8; left:50%; top:calc(894*var(--u)); width:calc(420*var(--u)); transform:translateX(-50%);
  transition:opacity var(--t-base) var(--e-out), visibility var(--t-base)}
.counter__panel{position:relative; height:calc(104*var(--u)); display:flex; align-items:center; justify-content:center;
  padding:0 calc(48*var(--u)); transform-origin:bottom center}
.counter__chalk{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.counter__row{position:relative; z-index:1; display:flex; align-items:center; gap:calc(24*var(--u))}
.counter__badge{display:grid; place-items:center; width:calc(74*var(--u)); height:calc(74*var(--u)); border-radius:50%;
  border:calc(3.5*var(--u)) solid rgba(244,241,230,.9); box-sizing:border-box; filter:url(#chalk2)}
.counter__badge svg{width:calc(44*var(--u)); height:calc(44*var(--u))}
.counter__badge path{fill:#f2d04a}
.counter__num{min-width:calc(96*var(--u)); color:#f4f1e6; filter:url(#chalk2);
  font-size:calc(62*var(--u)); font-weight:800; line-height:1; text-align:center; font-variant-numeric:tabular-nums}
body.is-briefing .notice, body.is-briefing .counter, body.is-done .notice, body.is-done .counter{opacity:0; visibility:hidden}

/* ---------- 종이 소년 ----------
   .boy-slot 이 자리·브리핑 이동(transform)을, 안쪽 .boy 가 반응 모션(transform)을 맡는다 (§8.1.1) */
.boy-slot{position:absolute; z-index:14; left:calc(50.7*var(--u)); bottom:calc(20.5*var(--u));
  width:calc(284.8*var(--u)); height:calc(470.2*var(--u)); transform-origin:50% 100%;
  transition:transform .62s var(--e-out)}
.boy{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; filter:var(--pp-lift-m); animation:boyIdle 6s ease-in-out infinite}
.boy > img{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain; object-position:50% 100%; pointer-events:none}
.boy:focus-visible{outline:none}
@keyframes boyIdle{0%,50%,100%{transform:none}
  25%{transform:translateY(calc(-5*var(--u))) rotate(1deg)}
  75%{transform:translateY(calc(-5*var(--u))) rotate(-1deg)}}
.boy.is-cheer{animation:boyHop .9s var(--e-out) 2}
@keyframes boyHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-34*var(--u))) rotate(-4deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-16*var(--u))) rotate(3deg)}}
.boy.is-huh{animation:boyHuh .8s var(--e-out)}
@keyframes boyHuh{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}60%{transform:rotate(7deg)}85%{transform:rotate(-3deg)}}

/* ---------- 브리핑 (§8.4) ----------
   소년이 화면 가운데 아래로 나와 커지고(바닥 -18u), 93u 위에 종이 말풍선이 뜬다.
   B-1_02 와 같은 크기·위치: 박스 x 50.7 · 바닥 20.5 · 284.8×470.2u, 브리핑 translateX 767u · ×1.18 → 말풍선 top 296u */
.veil{position:absolute; inset:0; z-index:12; background:var(--pp-veil);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
body.is-briefing .boy-slot{z-index:16; transform:translateX(calc(767*var(--u))) scale(1.18)}
body.is-briefing .boy{animation:boyTalk 1.5s var(--e-out) .5s infinite}
@keyframes boyTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-8*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}
.talk{top:calc(296*var(--u)); z-index:17; opacity:0; visibility:hidden;
  transform:translateY(calc(14*var(--u)));
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow), transform var(--t-slow) var(--e-out)}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none; transition-delay:.28s}

/* ---------- 도형 이름 팝업 (B-2_03 ShapeNameReveal — 종이 시트 + 골드 칩) ---------- */
.reveal{position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:var(--pp-scrim);
  -webkit-backdrop-filter:blur(calc(4*var(--u))) saturate(.72); backdrop-filter:blur(calc(4*var(--u))) saturate(.72);
  opacity:0; visibility:hidden; pointer-events:none; transition:opacity var(--t-base) var(--e-out), visibility var(--t-base)}
.reveal.on{opacity:1; visibility:visible}
.reveal-sheet{width:calc(680*var(--u)); height:calc(600*var(--u)); padding:0 calc(56*var(--u)) calc(52*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:calc(34*var(--u)); text-align:center;
  transform:scale(.82); transition:transform var(--t-slow) var(--e-pop)}
.reveal.on .reveal-sheet{transform:none}
/* 골드 칩은 팝업 안쪽 맨 위 (B-2_03 헤더 바) */
.reveal-sheet > .pp-tag{position:relative; left:auto; top:auto; transform:none; flex:none; margin-top:calc(52*var(--u)); margin-bottom:calc(6*var(--u))}
.reveal__glyph{display:grid; place-items:center; width:calc(230*var(--u)); height:calc(230*var(--u)); border-radius:50%;
  background:#fff url("../img_png/paper/tx-felt.webp") center/cover; background-blend-mode:soft-light}
.reveal__glyph svg{width:54%; height:54%; overflow:visible}
.reveal__name{margin:0; color:var(--pp-ink); font-size:calc(76*var(--u)); font-weight:800; line-height:1; letter-spacing:-.045em; text-wrap:balance}
.reveal.on .reveal__glyph{animation:revealGlyphIn .52s var(--e-pop) .12s both}
.reveal.on .reveal__name{animation:revealNameIn .42s var(--e-pop) .26s both}
@keyframes revealGlyphIn{0%{opacity:0; transform:scale(.2) rotate(-12deg)}66%{opacity:1; transform:scale(1.12) rotate(3deg)}100%{opacity:1; transform:scale(1) rotate(0)}}
@keyframes revealNameIn{0%{opacity:0; transform:scale(.42) translateY(calc(14*var(--u)))}70%{opacity:1; transform:scale(1.08)}100%{opacity:1; transform:scale(1)}}

/* 종이 오브젝트 (B-2_05 v2 방식) — 그림 + 같은 모양으로 오린 펠트 결(overlay).
   결은 무채색이라 색은 원본 그대로. 들뜸 그림자는 mask 바깥 층(.obj)에 건다 (§11.3).
   인라인 <style> 이라 텍스처 경로는 문서 기준 상대경로 */
.obj{position:relative; display:block; isolation:isolate; filter:var(--pp-lift-s)}
.obj > img,.pp-card .obj > img{position:absolute; inset:0; width:100%; height:100%; max-width:none; max-height:none;
  display:block; object-fit:contain; pointer-events:none}
.obj__tx{position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.95;
  background:url("../img_png/paper/tx-felt.webp") 0 0/calc(96*var(--u)) repeat;
  -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat}


/* ---------- 완료 화면 (§8.3) ---------- */
.win{z-index:60; display:flex; align-items:center; justify-content:center; background:var(--pp-veil);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(900*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u))); transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(180*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg, rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%); mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle, rgba(255,232,148,.85) 0%, rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}
.win__art{position:relative; z-index:2; width:calc(360*var(--u)); height:calc(359*var(--u)); display:block;
  filter:drop-shadow(0 calc(12*var(--u)) calc(20*var(--u)) rgba(80,40,10,.28))}
.win__art .obj{width:100%; height:100%; filter:none}
.win.on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3.5%) rotate(-1.5deg)}60%{transform:translateY(-1.5%) rotate(1.5deg)}}
.win__stack .win__actions{position:relative; z-index:3}
.win__sparks{position:absolute; left:50%; top:calc(-76*var(--u)); transform:translateX(-50%);
  width:calc(600*var(--u)); height:calc(512*var(--u)); z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s);
  background:var(--c); opacity:0; animation:twinkle 2.4s var(--e-out) infinite; animation-delay:var(--d);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}35%{opacity:1; transform:scale(1) rotate(35deg)}70%{opacity:.35; transform:scale(.75) rotate(70deg)}}
.win__confetti{position:absolute; left:50%; top:calc(-100*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h); background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}12%{opacity:1}70%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}



/* 완료 화면 — B-2_03 과 동일: 소년+고양이 하이파이브 그림(600u), 광선·글로우 중심 268u, 반짝이 20u, 컨페티 150u */
.win__rays,.win__glow{top:calc(268*var(--u))}
.win__art{width:calc(600*var(--u)); height:auto}
.win__art img{display:block; width:100%; height:auto}
.win__sparks{top:calc(20*var(--u))}
.win__confetti{top:calc(150*var(--u))}
.spark.dot{clip-path:none; border-radius:50%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>

  <img class="stage__bg stage__bg--foliage" aria-hidden="true" alt="" src="assets/B-1_03-bg-library-v14-main-wood-soft.png" style="--bgw:2796;--bgh:1200;--bgx:-438;--bgy:0">

  <!-- 상단 크롬 — 뷰포트 가장자리 고정 (RESPONSIVE.css .pp-edge-*, 28u + safe-area) -->

  </div>


  <!-- 안내 쪽지 -->
  <div class="notice" id="notice" aria-live="polite">
    <span class="notice__paper" aria-hidden="true"></span>
    <svg class="notice__glyph" id="noticeGlyph" viewBox="0 0 24 24" aria-hidden="true"><path id="noticePath" d="" fill="#3f9a4e" stroke="#ffffff" stroke-width="4.4" stroke-linejoin="round" paint-order="stroke fill"/></svg>

  <!-- 도형 판 — 워크시트 종이 -->
  <section class="sheet" id="sheet" aria-label="Shape hunt">
    <div class="scene" id="scene">
      <svg id="art" viewBox="228 332 1544 680" role="img" aria-label="">

<script>
(() => {
'use strict';

const MUTE = {on:false};
const SFX = (() => {
  let C = null, bgmBus = null, bgmOn = false, bgmAt = 0, bgmTm = null, noiseBuf = null;
  const ac = () => {
    if(MUTE.on) return null;           /* 음소거 중에는 새 소리를 만들지 않는다 */
    if(!C){
      try{ const AC = window.AudioContext || window.webkitAudioContext; C = new AC() }catch(e){ return null }
    }
    if(C.state === 'suspended') C.resume();
    return C;
  };
  function voice(freq, at, dur, o){
    o = o || {}; const c = ac(); if(!c) return;
    const t0 = c.currentTime + at, bus = o.bus || c.destination;
    const g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(o.cut || 5200, t0);
    const peak = o.gain || .12, atk = o.atk || .006;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    const osc = (type, mul, det) => {
      const s = c.createOscillator();
      s.type = type; s.frequency.setValueAtTime(freq * mul, t0);
      if(det) s.detune.setValueAtTime(det, t0);
      s.connect(g); s.start(t0); s.stop(t0 + dur + .04);
    };
    osc(o.type || 'sine', 1, 0);
    if(o.h2) osc('sine', 2, 4);
    g.connect(f); f.connect(bus);
  }
  const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));
  function swoosh(at, dur, f0, f1, gain){
    const c = ac(); if(!c) return;
    if(!noiseBuf){
      const n = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  }
  /* 오답 — 짧은 타격 뒤 음정이 크게 내려가는 두꺼운 경고음 */
  function wrongHit(){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime;
    const master = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.setValueAtTime(1.25, t0);
    lp.frequency.setValueAtTime(1800, t0);
    lp.frequency.exponentialRampToValueAtTime(620, t0 + .44);
    master.gain.setValueAtTime(.0001, t0);
    master.gain.exponentialRampToValueAtTime(.16, t0 + .008);
    master.gain.setValueAtTime(.14, t0 + .09);
    master.gain.exponentialRampToValueAtTime(.0001, t0 + .46);
    [
      {type:'square',   from:330, to:185, det:-5},
      {type:'sawtooth', from:220, to:110, det: 5}
    ].forEach(v => {
      const o = c.createOscillator();
      o.type = v.type; o.detune.setValueAtTime(v.det, t0);
      o.frequency.setValueAtTime(v.from, t0);
      o.frequency.exponentialRampToValueAtTime(v.to, t0 + .4);
      o.connect(master); o.start(t0); o.stop(t0 + .48);
    });
    master.connect(lp); lp.connect(c.destination);
    swoosh(0, .18, 1500, 260, .11);
    voice(98, .17, .32, {type:'triangle', gain:.13, atk:.004, cut:760, h2:true});
  }
  const C3=130.81, C4=261.63, G4=392, C5=523.25, E5=659.25, G5=784,
        C6=1046.5, E6=1318.5, G6=1568, C7=2093, E7=2637, G7=3136,
        A4=440, B4=493.88, D5=587.33, F5=698.46, A5=880, B5=987.77, D6=1174.7,
        F3=174.61, G3=196;
  const marimba = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'triangle', gain:gain, atk:.004, cut:4200, h2:true});
  const bell = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', gain:gain, atk:.004, cut:8000, h2:true});
  const BEAT = .28;
  const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
               [G5,2,.5],[E5,2.5,.5],[F5,3,1],[E5,4,.5],[D5,4.5,.5],
               [C5,5,.5],[E5,5.5,.5],[G5,6,1],[C5,7,1]];
  const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
  function bgmTone(freq, at, dur, type, gain){
    const c = ac(); if(!c || !bgmBus) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(bgmBus); o.start(at); o.stop(at + dur + .05);
  }
  function bgmLoop(){
    const c = ac(); if(!c || !bgmOn) return;
    if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;
    MEL.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'triangle', .055));
    BASS.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'sine', .045));
    bgmAt += 8 * BEAT;
    bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);
  }
  return {
    ctx(){ return C },
    unlock(){ ac() },
    tap(){ marimba(G5, 0, .14, .09) },
    hint(){ bell(E6, 0, .3, .07); bell(G6, .11, .4, .06) },
    step(i){ marimba([C5,D5,E5,G5,A5,C6][Math.min(i,5)], 0, .26, .11) },
    good(){ [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
            chord([C5,G5], .02, .5, {type:'triangle', gain:.05}) },
    bad(){ wrongHit() },
    clear(){ swoosh(0, .5, 700, 5200, .1);
             [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12)) },
    fanfare(){
      [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(m => marimba(m[0],m[1],m[2],.12));
      [[G5,.5,.14],[A5,.62,.14],[B5,.74,.14],[C6,.86,.3]]
        .forEach(m => marimba(m[0],m[1],m[2],.12));
      chord([C5,E5,G5,C6], 1.2, 1.1, {type:'triangle', gain:.07});
      [[E6,2.35,.4],[D6,2.6,.4],[C6,2.85,.55]]
        .forEach(m => bell(m[0],m[1],m[2],.10));
      chord([C5,E5,G5,C6], 3.5, 1.5, {type:'triangle', gain:.08});
      voice(C4, 3.5, 1.5, {type:'sine', gain:.07});
      [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(m => bell(m[0],m[1],m[2],.045));
    },
    bgmStart(delay){
      const c = ac(); if(!c) return;
      if(bgmOn) return;
      bgmOn = true;
      bgmBus = c.createGain(); bgmBus.gain.setValueAtTime(.9, c.currentTime);
      bgmBus.connect(c.destination);
      bgmAt = c.currentTime + (delay === undefined ? .35 : delay);
      bgmLoop();
    },
    bgmStop(){
      const c = ac(); bgmOn = false;
      if(bgmTm){ clearTimeout(bgmTm); bgmTm = null }
      if(bgmBus && c){
        const bus = bgmBus; bgmBus = null;
        try{
          const t0 = c.currentTime;
          bus.gain.setValueAtTime(bus.gain.value, t0);
          bus.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
        }catch(e){}
        setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
      }
    }
  };
})();

const NODES = SHAPES.map((s, i) => {
  let d, poly = null, cx, cy, r = 0, minX, maxX, minY, maxY;
  if(s.circ){
    const [x, y, rr] = s.circ; r = rr; cx = x; cy = y;
    d = 'M' + (x - rr).toFixed(2) + ',' + y.toFixed(2) + 'a' + rr + ',' + rr + ' 0 1,0 ' + (rr * 2) + ',0a' + rr + ',' + rr + ' 0 1,0 ' + (-rr * 2) + ',0Z';
    minX = x - rr; maxX = x + rr; minY = y - rr; maxY = y + rr;
  }else{
    poly = s.rect ? [[s.rect[0], s.rect[1]], [s.rect[0] + s.rect[2], s.rect[1]], [s.rect[0] + s.rect[2], s.rect[1] + s.rect[3]], [s.rect[0], s.rect[1] + s.rect[3]]] : s.poly;
    d = 'M' + poly.map(p => p[0] + ',' + p[1]).join('L') + 'Z';
    cx = poly.reduce((a, p) => a + p[0], 0) / poly.length; cy = poly.reduce((a, p) => a + p[1], 0) / poly.length;
    minX = Math.min(...poly.map(p => p[0])); maxX = Math.max(...poly.map(p => p[0]));
    minY = Math.min(...poly.map(p => p[1])); maxY = Math.max(...poly.map(p => p[1]));
  }
  return {id:'s' + i, type:s.t, color:PAL[s.k], d, poly, cx, cy, r, minX, maxX, minY, maxY,
          hit:Math.max(34, Math.min(maxX - minX, maxY - minY) / 2)};
});
const BY_ID = {}; NODES.forEach(n => BY_ID[n.id] = n);
const COUNT = {}; TYPES.forEach(t => COUNT[t] = NODES.filter(n => n.type === t).length);

function inPoly(x, y, p){
  let c = false;
  for(let i = 0, j = p.length - 1; i < p.length; j = i++){
    const [xi, yi] = p[i], [xj, yj] = p[j];
    if((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function pick(x, y){
  let hit = null;
  NODES.forEach(n => { if(n.r ? Math.hypot(x - n.cx, y - n.cy) <= n.r : inPoly(x, y, n.poly)) hit = n });   /* 나중에 그린 게 위 */
  if(hit) return hit;
  let best = null, bd = 1e9;
  NODES.forEach(n => { const d = Math.hypot(x - n.cx, y - n.cy); if(d <= n.hit && d < bd){ best = n; bd = d } });
  return best;
}

const els = {};
function buildShapes(opening){
  shapesG.innerHTML = '';
  NODES.forEach((n, i) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', n.d); p.setAttribute('fill', n.color); p.setAttribute('data-id', n.id); p.setAttribute('class', 'shape');
    if(opening) p.style.animation = 'ph-shape-appear ' + (TIMING.appearDur / 1000) + 's cubic-bezier(.3,1.4,.5,1) ' + (i * TIMING.appearStep / 1000).toFixed(3) + 's both';
    shapesG.appendChild(p); els[n.id] = p;
  });
  if(opening) later(() => NODES.forEach(n => { if(els[n.id]) els[n.id].style.animation = '' }), NODES.length * TIMING.appearStep + TIMING.appearDur + 100);
}
/* 찾은 도형은 B-2_03 처럼 낮은 채도의 모래색으로 가라앉힌다 — 다만 창문·문·지붕 원처럼 겹친 도형이 서로 안 묻히게
   모래색(#C7AB82)에 제 색을 22%만 섞는다 */
const SAND = [199, 171, 130];
function mutedOf(hex){
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return '#' + c.map((v, i) => Math.round(SAND[i] * .78 + v * .22).toString(16).padStart(2, '0')).join('');
}
NODES.forEach(n => { n.muted = mutedOf(n.color) });
function paintShapes(){
  NODES.forEach(n => {
    const muted = found.includes(n.id) && !restored[n.id];
    els[n.id].setAttribute('fill', muted ? n.muted : n.color);
    els[n.id].setAttribute('opacity', muted ? .92 : 1);
  });
}
function anim(el, css, ms){
  if(!el) return;
  el.style.animation = 'none'; void el.getBoundingClientRect(); el.style.animation = css;
  later(() => { el.style.animation = '' }, ms || 520);
}

}
function burstAt(vx, vy, color){
  const sr = scene.getBoundingClientRect(), r = $('art').getBoundingClientRect();
  const px = r.left - sr.left + (vx - VB.x) / VB.w * r.width, py = r.top - sr.top + (vy - VB.y) / VB.h * r.height;
  const unit = r.width * .032;
  for(let i = 0; i < 6; i++){
    const a = (-90 + i * 60 + Math.random() * 22) * Math.PI / 180, m = unit * (1.5 + Math.random() * .7), s = Math.max(4, unit * .24);
    const b = document.createElement('i'); b.className = 'bit';
    b.style.cssText = 'left:' + px + 'px;top:' + py + 'px;width:' + s + 'px;height:' + s + 'px;background:' + color +
      ';--dx:' + (Math.cos(a) * m).toFixed(1) + 'px;--dy:' + (Math.sin(a) * m).toFixed(1) + 'px;animation-delay:' + (i * 18) + 'ms';
    fx.appendChild(b); later(() => b.remove(), 720);
  }
}
function flyToCounter(vx, vy, type){
  const sr = scene.getBoundingClientRect(), r = $('art').getBoundingClientRect(), cr = counterPanel.getBoundingClientRect();
  const size = Math.max(16, r.width * .036);
  const px = r.left - sr.left + (vx - VB.x) / VB.w * r.width, py = r.top - sr.top + (vy - VB.y) / VB.h * r.height;
  const f = document.createElement('div'); f.className = 'fly';
  f.style.cssText = 'left:' + px + 'px;top:' + py + 'px;width:' + size + 'px;height:' + size + 'px;margin:' + (-size / 2) + 'px 0 0 ' + (-size / 2) + 'px';
  f.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + GLYPH[type] + '" fill="#007782"></path></svg>';
  fx.appendChild(f);
  const dx = (cr.left + cr.width * .2) - (sr.left + px), dy = (cr.top + cr.height / 2) - (sr.top + py);
  requestAnimationFrame(() => { f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.62)'; f.style.opacity = '.2' });
  later(() => f.remove(), 560);
}
function bounceCounter(){
  if(counterPanel.animate) counterPanel.animate([{transform:'scale(1)'}, {transform:'scale(1.14)'}, {transform:'scale(1)'}], {duration:420, easing:'ease-out'});
}
function react(kind){
  boyEl.classList.remove('is-cheer', 'is-huh'); void boyEl.offsetWidth;
  boyEl.classList.add(kind === 'cheer' ? 'is-cheer' : 'is-huh');
  later(() => boyEl.classList.remove('is-cheer', 'is-huh'), 1900);
}

scene.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(phase !== 'play' || locked) return;
  armIdle();
  const [vx, vy] = toView(e);
  const t = e.target && e.target.closest ? e.target.closest('[data-id]') : null;
  const n = (t && BY_ID[t.getAttribute('data-id')]) || pick(vx, vy);
  if(!n) return;
  const want = TYPES[mission];
  if(found.includes(n.id)){ anim(els[n.id], 'ph-pop .42s cubic-bezier(.3,1.5,.4,1) 1'); return }
  if(n.type !== want){ SFX.bad(); anim(els[n.id], 'ph-wobble .36s ease-in-out 1'); react('huh'); return }
  anim(els[n.id], 'ph-pop .42s cubic-bezier(.3,1.5,.4,1) 1');
  burstAt(vx, vy, n.color); flyToCounter(vx, vy, want);
  found.push(n.id); paintShapes();
  const k = found.length;
  SFX.step(k - 1); countSay(k);
  $('counterNum').textContent = k;
  later(bounceCounter, 240);
  if(k >= COUNT[want]){ locked = true; clearIdle(); later(finishMission, TIMING.finishDelay) }
});

/* 한참 가만히 있으면 안 찾은 도형 하나가 흔들린다 */
let idleTm = null, lastHint = null;
function clearIdle(){ clearTimeout(idleTm); idleTm = null }
function armIdle(){
  clearIdle();
  idleTm = setTimeout(() => {
    if(phase !== 'play' || locked) return;
    const left = NODES.filter(n => n.type === TYPES[mission] && !found.includes(n.id));
    if(!left.length) return;
    const pool = left.filter(n => n.id !== lastHint), n = (pool.length ? pool : left)[Math.floor(Math.random() * (pool.length || left.length))];
    lastHint = n.id; SFX.hint(); anim(els[n.id], 'ph-hint-shake .62s ease-in-out 3', 1980);
    armIdle();
  }, TIMING.idleHint);
}

/* ---------- 한 종류를 다 찾았을 때 → 색 복원 → 이름 팝업 → 다음 ---------- */
let finishToken = null;
function finishMission(){
  bounceCounter(); SFX.clear();
  const ids = found.slice(), step = Math.max(34, Math.round(700 / Math.max(1, ids.length)));
  ids.forEach((id, i) => later(() => { restored[id] = true; paintShapes() }, TIMING.restoreStart + i * step));
  const at = TIMING.restoreStart + ids.length * step + TIMING.restoreTail;
  const tok = {}; finishToken = tok;
  const next = () => { if(finishToken === tok){ finishToken = null; nextMission() } };
  later(() => {
    ids.forEach((id, i) => { const el = els[id]; if(el && el.animate) el.animate([{transform:'scale(1)'}, {transform:'scale(1.34)'}, {transform:'scale(1.24)'}, {transform:'scale(1)'}], {duration:1080, delay:i * 45, easing:'cubic-bezier(.32,1.5,.4,1)'}) });
    phase = 'reveal'; paintStars(); showReveal();
    praiseSay(next);
  }, at);
  later(next, at + TIMING.finishSafety);
}
function showReveal(){
  const t = TYPES[mission], c = I18N[lang].shape[t];
  $('revealPath').setAttribute('d', GLYPH[t]); $('revealName').textContent = c.name; $('revealLead').textContent = I18N[lang].lead;
  revealEl.classList.add('on'); revealEl.setAttribute('aria-hidden', 'false');
}
function hideReveal(){ revealEl.classList.remove('on'); revealEl.setAttribute('aria-hidden', 'true') }
function nextMission(){
  hideReveal();
  if(mission + 1 >= TYPES.length){ phase = 'done'; finish(); return }
  startMission(mission + 1);
}

/* ---------- 완료 (§8.3) ---------- */
(function buildSparks(){
  const box = $('winSparks'), COLORS = ['#F9DF1F','#FEC925','#F38820','#F291B9','#94C13D','#9463D6','#FFFFFF'];
  let seed = 20261006;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const N = 18;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + rnd() * .18, rad = .40 + rnd() * .16, el = document.createElement('i');
    el.className = 'spark' + (rnd() < .35 ? ' dot' : '');
    el.style.cssText = '--x:' + (50 + Math.cos(ang) * rad * 116) + '%;--y:' + (50 + Math.sin(ang) * rad * 136) + '%;' +
      '--s:calc(' + (14 + Math.round(rnd() * 22)) + '*var(--u));--c:' + COLORS[i % COLORS.length] + ';--d:' + (rnd() * 2.2).toFixed(2) + 's';
    box.appendChild(el);
  }
})();
(function buildConfetti(){
  const box = $('winConf'), C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#EE3A44'];
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 250, el = document.createElement('i');
    el.className = 'conf';
    el.style.cssText = '--w:calc(' + (12 + Math.round(rnd() * 12)) + '*var(--u));--h:calc(' + (16 + Math.round(rnd() * 18)) + '*var(--u));' +
      '--c:' + C[i % C.length] + ';--r:' + (rnd() < .4 ? '50%' : 'calc(4*var(--u))') + ';' +
      '--dx:calc(' + (Math.cos(ang) * dist).toFixed(0) + '*var(--u));--dy:calc(' + (Math.sin(ang) * dist - 60).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd() * 900 - 450) + 'deg;--d:' + (rnd() * .35).toFixed(2) + 's';
    box.appendChild(el);
  }
})();

function finish(){
  document.body.classList.add('is-done'); paintStars();
  SFX.clear(); winEl.classList.add('on'); winEl.setAttribute('aria-hidden', 'false');
  setTimeout(() => SFX.fanfare(), 120);
  setTimeout(() => SFX.bgmStart(0), 3400);
  setTimeout(() => winSay(), 900);
}
function resetGame(){
  SFX.bgmStop(); stopVoice(); clearLater(); clearIdle(); finishToken = null;
  hideReveal(); winEl.classList.remove('on'); winEl.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('is-done');
  mission = 0; lastHint = null;
  buildShapes(true); startMission(0);
}

/* ---------- 음성 — Pixie mp3(../audio/voice-q/q_b1_03_*, 숫자 count_* 는 q_03_* 공용) 우선, 없으면 TTS ---------- */
let curAudio = null, voiceTok = 0;
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
function stopTts(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel() }catch(e){} }
function stopVoice(){
  voiceTok++;
  if(curAudio){ curAudio.onended = curAudio.onerror = null; try{ curAudio.pause() }catch(e){} curAudio = null }
  stopTts(); sayFlag(false);
}
function tts(text, hooks, tok){
  hooks = hooks || {};
  if(!text || !('speechSynthesis' in window)){ if(hooks.blocked) hooks.blocked(); return false }
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ko' ? 'ko-KR' : 'en-US'; u.rate = lang === 'ko' ? 1.02 : .94; u.pitch = 1.13;
    u.onstart = () => { if(tok === voiceTok){ sayFlag(true); if(hooks.start) hooks.start() } };
    u.onend = u.onerror = () => { if(tok === voiceTok){ sayFlag(false); if(hooks.end) hooks.end() } };
    speechSynthesis.speak(u); return true;
  }catch(e){ if(hooks.blocked) hooks.blocked(); return false }
}
function speak(key, text, hooks){
  hooks = hooks || {};
  stopVoice();
  if(MUTE.on){ if(hooks.end) setTimeout(hooks.end, 1200); return false }
  const tok = voiceTok, a = new Audio('../audio/voice-q/' + (key.indexOf('count_') === 0 ? 'q_03_' : 'q_b1_03_') + key + '_' + lang + '.mp3');
  curAudio = a; a.preload = 'auto';
  let done = false;
  const fin = () => { if(done || tok !== voiceTok) return; done = true; curAudio = null; sayFlag(false); if(hooks.end) hooks.end() };
  const fallback = () => { if(done || tok !== voiceTok) return; done = true; curAudio = null; tts(text, hooks, tok) };
  a.addEventListener('ended', fin);
  a.addEventListener('error', fallback);
  a.addEventListener('playing', () => { if(tok === voiceTok){ sayFlag(true); if(hooks.start) hooks.start() } });
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    if(tok !== voiceTok || done) return;
    if(err && err.name === 'NotAllowedError'){ done = true; curAudio = null; if(hooks.blocked) hooks.blocked() }
    else fallback();
  });
  return true;
}
const countSay = k => speak('count_' + String(k).padStart(2, '0'), I18N[lang].num[k] || String(k));
const praiseSay = end => { const t = TYPES[mission]; speak('praise_' + t, I18N[lang].shape[t].praise, {end}) };
const winSay = () => speak('win', I18N[lang].win);

/* ---------- 언어 ---------- */
function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.documentElement.lang = lang;
  $('lgEn').className = ko ? 'off' : 'on'; $('lgKo').className = ko ? 'on' : 'off';
  $('btnLang').dataset.next = ko ? 'en' : 'ko'; $('btnLang').setAttribute('aria-label', ko ? 'English' : '한국어');
  $('btnBack').setAttribute('aria-label', ko ? '뒤로 가기' : 'Back');
  boyEl.setAttribute('aria-label', ko ? '안내 다시 듣기' : 'Hear it again');
  $('art').setAttribute('aria-label', t.art);
  $('talkTag').textContent = t.tag; $('talkLine').textContent = t.shape[TYPES[mission]].brief;
  $('retryTx').textContent = t.retry; $('exitTx').textContent = t.exit;
  paintNotice();
  if(revealEl.classList.contains('on')) showReveal();
  paintMute();
}

/* ---------- 브리핑 (§8.2 · §8.4) ----------
   끝나는 조건: 음성 종료 / 음성이 시작되지 않으면 7s / 0.9s 가드 이후 아무 데나 탭 */
let briefing = true, briefTm = null, skipArmed = false, voiceOn = false, retried = false;
function briefSay(){
  voiceOn = false;
  speak(TYPES[mission], I18N[lang].shape[TYPES[mission]].brief, {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) },
    blocked(){ voiceOn = false }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false; retried = false; document.body.classList.add('is-briefing');
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, MUTE.on ? 3500 : 7000);
  setTimeout(briefSay, 350);
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm); stopVoice();
  document.body.classList.remove('is-briefing');
  phase = 'play'; popNotice(); armIdle();
}
function startMission(i){
  stopVoice(); clearIdle(); clearTimeout(briefTm);
  mission = i; found = []; restored = {}; locked = false; phase = 'brief'; finishToken = null;
  paintShapes(); paintStars(); paintNotice();
  $('talkLine').textContent = I18N[lang].shape[TYPES[i]].brief;
  startBriefing();
}
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.pp-ibtn, .boy, .win')) return;
  if(!voiceOn && !retried && !(curAudio || ('speechSynthesis' in window && speechSynthesis.speaking))){
    retried = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000); briefSay(); return;
  }
  if(skipArmed) endBriefing();
}, true);

/* ---------- 소년 — 누르면 지금 상황을 다시 말해 준다 ---------- */
boyEl.addEventListener('click', () => {
  SFX.tap();
  if(briefing){ briefSay(); return }
  if(phase === 'done'){ winSay(); return }
  if(phase === 'reveal'){ const t = TYPES[mission]; speak('praise_' + t, I18N[lang].shape[t].praise); return }
  speak(TYPES[mission], I18N[lang].shape[TYPES[mission]].brief);
});

/* ---------- 상단 버튼 ---------- */
function paintMute(){
  const L = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', L[lang][MUTE.on ? 'on' : 'off']);
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){
    SFX.tap(); MUTE.on = true; stopVoice();
    const c = SFX.ctx(); if(c && c.state === 'running') c.suspend();
  }else{
    MUTE.on = false;
    const c = SFX.ctx(); if(c && c.state === 'suspended') c.resume();
    if(winEl.classList.contains('on')){ SFX.bgmStop(); SFX.bgmStart(0) }
    SFX.tap();
  }
  paintMute();
});
$('btnLang').addEventListener('click', e => {
  SFX.unlock(); SFX.tap();
  lang = e.currentTarget.dataset.next; applyLang();
  if(briefing) briefSay();
  else if(phase === 'done') winSay();
  else if(phase === 'reveal'){ const t = TYPES[mission]; speak('praise_' + t, I18N[lang].shape[t].praise) }
  else speak(TYPES[mission], I18N[lang].shape[TYPES[mission]].brief);
});
const leave = () => { SFX.tap(); location.href = 'B-1_00.submain.html' };
$('btnBack').addEventListener('click', leave);
$('exit').addEventListener('click', leave);
$('retry').addEventListener('click', () => { SFX.tap(); resetGame() });

if('speechSynthesis' in window) speechSynthesis.getVoices();
{ const bi = new Image(); bi.alt = ''; bi.src = 'assets/B-1_03-boy-fine-paper.png'; bi.className = 'b1-boy__image'; bi.draggable = false; boyEl.appendChild(bi);
  const seams = new Image(); seams.alt = ''; seams.src = 'assets/B-1_03-boy-flat-seams-overlay.png'; seams.className = 'b1-boy__image b1-boy__seams'; seams.draggable = false; boyEl.appendChild(seams) }
{ const wi = new Image(); wi.alt = ''; wi.src = 'assets/B-1_03-complete-duo-fine-paper.png'; wi.draggable = false; $('winArt').appendChild(wi) }
buildShapes(true); buildStars(); applyLang(); startMission(0);
})();
</script>
<script>/* MAP-PROGRESS v1 — 완료 화면이 뜨면 맵(B-1_00.submain.html)에 완료 기록 */(function(){var ID='decomposition',K='ck.b1.sub.done';var done=false;function mark(){try{var a=JSON.parse(localStorage.getItem(K)||'[]');if(a.indexOf(ID)<0)a.push(ID);localStorage.setItem(K,JSON.stringify(a));localStorage.setItem('ck.b1.sub.just',ID)}catch(e){}}function chk(){if(done)return;if(document.querySelector('#win.on,#win.is-on,[class*="_exit_"]')){done=true;mark();mo.disconnect()}}var mo=new MutationObserver(chk);mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});})();</script>
<script src="../EXIT_CONFIRM.js"></script>
<script>
/* 문제풀이 BGM — 개념별 공용 곡(puzzle-decomposition-blocks-loop). 첫 입력부터 반복 재생(자동재생 정책), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
(() => {
  const a = new Audio('../audio/bgm/puzzle-decomposition-blocks-loop.mp3');
  a.loop = true; a.preload = 'auto'; a.volume = .22;
  const $ = id => document.getElementById(id);
  const muted = () => { const b = $('btnSay') || document.querySelector('button[class*="soundButton"]'); return !!b && b.getAttribute('aria-pressed') === 'true' };
  const done = () => document.body.classList.contains('is-done') || !!document.querySelector('#win.on, [class*="_win_"]');
  let armed = false;
  const sync = () => {
    if(!armed) return;
    if(muted() || done() || document.hidden) a.pause();
    else if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}) }
  };
  let raf = 0; const soon = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; sync() }) };
  ['pointerdown','keydown'].forEach(t => window.addEventListener(t, () => { armed = true; sync() }, {passive:true}));
  document.addEventListener('visibilitychange', sync);
  new MutationObserver(soon).observe(document.body, {attributes:true, attributeFilter:['class','aria-pressed'], childList:true, subtree:true});
})();
</script>
