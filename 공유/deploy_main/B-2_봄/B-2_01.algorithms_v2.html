/* ============================================================
   B-2 · ALGORITHMS — 딸기 길 찾기 · v2 (종이 콜라주)
   원본 B-2_01.algorithms.html 을 DESIGN.md §11 종이 콜라주 테마로 재구성.
   · 유지: 3 x 3 판 · 딸기 7개 · START/END · 명령 레일 8칸 · 방향 카드 4 · 바구니 · 축하 고양이 · 소리
   · 변경: 배경(이미지 1장 §11.12) · 칸(잔디 펠트 §11.7) · 상단 원판 버튼(§11.4)
           · 버튼은 CSS 두께 대신 펠트 결 + 들뜸 그림자(§11.3) · 딸기 숫자 삭제 [stated]
   · 규칙: 숫자가 없으므로 순서 없이 모두 담고 END 로 [stated]
   무대 1920 x 1200 · 1u = var(--u)
   ============================================================ */

:root{
  /* --u 는 DESIGN.css + RESPONSIVE.css(--u-min .15px · --u-max 1.25px)가 정한다 — 반응형 */
  --bz-ink:var(--pp-ink, #1F2937);

  /* 버튼 역할 색(보라·다홍·초록)은 DESIGN.css §11.14 .pp-rbtn 으로 옮김 */

  /* 판 치수 — 칸은 잔디 펠트 원본 비율(411 x 335)에 맞춘 가로형 */
  --cell-w:calc(210 * var(--u));
  --cell-h:calc(172 * var(--u));
  --cell-gap:calc(14 * var(--u));
}
/* DESIGN.css 의 --pp-edge 는 --sp-gutter(단위 없음) 때문에 무효값 — 길이로 다시 잡는다 (B-2_04 v2 · B-2_05 v2 와 같음) */
.bz-stage.theme-paper{--pp-edge:calc(28 * var(--u))}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:#0F2418}        /* RESPONSIVE.css 가 body 를 투명하게 하므로 먹색은 html 이 맡는다 */
body{
  margin:0;font-family:var(--ff);color:var(--bz-ink);line-height:1.6;
  background:#0F2418;             /* 무대 비율 바깥 여백 — 다른 종이 화면과 같은 먹색 */
  overflow:hidden;overscroll-behavior:none;word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}

/* ---- 무대 ---- */
.app{position:fixed;inset:0;display:grid;place-items:center;overflow:clip}
.bz-stage{
  position:relative;
  width:calc(1920 * var(--u));height:calc(1200 * var(--u));
  overflow:clip;isolation:isolate;
  background:#6F9A58;             /* 배경 이미지가 오기 전 한 프레임 */
}
.stage__bg{position:absolute;z-index:0;display:block;max-width:none;pointer-events:none;user-select:none}   /* 위치·크기는 RESPONSIVE.css 의 --bgw/--bgh/--bgx/--bgy */
.bz-inner{position:absolute;inset:0;z-index:1}

/* ---- 종이 결 층 — 무채색 결을 overlay 로 얹는다 (§11.3). 모양은 부모 또는 mask 가 정한다 ---- */
.pp-grain{
  position:absolute;inset:0;pointer-events:none;
  background:var(--pp-tx-grain) center/calc(460 * var(--u)) calc(160 * var(--u));
  mix-blend-mode:overlay;opacity:.9;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
}

/* ---- 상단 크롬 §11.2 · §11.4 ---- */
.pp-edge-tl,.pp-edge-tr{z-index:20}
.pp-ibtn svg{fill:currentColor}
.pp-ibtn--sound .sound-wave{fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- 알림 — B-2_03.decomposition_v2 의 노란 종이 알림(._notice)과 같은 모양 [stated] ----

.bz-bubble.is-on{opacity:1;transform:translate(-50%,0) scale(1)}
.bz-bubble-text{white-space:nowrap}

/* ---- 보드 — 판은 배경에 그려진 3 x 3 흙 고랑 자체다 [stated: 숲속 딸기밭이 곧 판]
   칸은 따로 면을 그리지 않고, 고랑 위치(무대 좌표, 배경에서 실측)에 투명한 자리만 잡는다.
   살짝 원근이 있어 줄마다 폭이 다르다 — 좌표는 스크립트의 BEDS 표. */
.bz-boardzone{position:absolute;inset:0;pointer-events:none}
.bz-board{position:absolute;inset:0}
.bz-cell{position:absolute}
/* 도착 — 고랑이 따뜻하게 빛난다 */
.bz-cell.is-lit::after{content:'';position:absolute;inset:calc(-6 * var(--u));z-index:1;
  border-radius:calc(22 * var(--u));pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, rgba(255,229,155,.55) 0%, rgba(255,214,102,.28) 55%, rgba(255,214,102,0) 80%);
  box-shadow:0 0 calc(40*var(--u)) calc(8*var(--u)) rgba(255,205,90,.5);
  animation:ppNext 1.7s ease-in-out infinite}
/* START · END — 기존 세로 위치를 유지하고 각 고랑의 가로 중앙에 맞춘다. */
.bz-tag{
  position:absolute;left:50%;top:calc(-12 * var(--u));transform:translateX(-50%);z-index:4;
  width:calc(124 * var(--u));height:calc(40 * var(--u));
  display:flex;align-items:center;justify-content:center;padding-top:calc(1 * var(--u));
  font-size:calc(24 * var(--u));font-weight:800;line-height:1;letter-spacing:.04em;
  color:var(--pp-gold-ink);isolation:isolate;filter:var(--pp-lift-s);
}
.bz-tag::before{content:'';position:absolute;inset:0;z-index:-1;
  -webkit-mask:var(--pp-mask-tag) center/100% 100% no-repeat;
          mask:var(--pp-mask-tag) center/100% 100% no-repeat;
  background:var(--pp-gold) var(--pp-tx-grain) center/calc(460*var(--u)) calc(160*var(--u));
  background-blend-mode:overlay}

/* ---- 딸기 — 숫자 없는 벡터 + 종이 결 [stated] ---- */
.bz-plant{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(104 * var(--u));height:calc(124 * var(--u));z-index:2;filter:var(--pp-lift-s)}
.bz-bloom{
  position:absolute;inset:0;transform-origin:50% 80%;
  animation:bzSway 4.4s ease-in-out infinite;
  transition:opacity .34s ease,transform .34s cubic-bezier(.34,.06,.28,1);
}
.bz-berry-svg{width:100%;height:100%;overflow:visible}
.bz-bloom.is-picked{opacity:0;transform:translateY(-40%) scale(.46)}
.bz-bloom.is-wobbling{animation:bzWobble .62s ease}
@keyframes bzSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes bzWobble{20%{transform:rotate(-9deg)}45%{transform:rotate(7deg)}72%{transform:rotate(-4deg)}}

/* ---- 고양이 — 바구니를 든 채 고랑 사이를 걷는다 (B-2_01.algorithms_3 의 .mz-cat 과 같은 그림·동작) [stated]
   발밑이 고랑 아래쪽에 오도록 bottom 기준(translate -100%). 담은 딸기는 바구니 안에 채워진다. */
.bz-cat{
  position:absolute;z-index:7;width:calc(168 * var(--u));
  transform:translate(-50%,-100%);
  --nx:0%;--ny:0%;
  transition:left var(--bz-step) cubic-bezier(.34,.06,.28,1),
             top var(--bz-step) cubic-bezier(.34,.06,.28,1);
  /* 어두운 흙 고랑 위에서 잘 안 보인다 [stated] — 브리핑 캐릭터(§8.4)처럼 흰 글로우로 배경에서 떼어 낸다.
     발밑 빛 자리는 그림자처럼 보여서 뺐다 [stated]. 흰 찢긴 테두리는 쓰지 않는다 */
  /* 처음 값(.95 + .55 두 겹)은 너무 강했다 [stated: 살짝만] — 한 겹 · 옅게 */
  filter:drop-shadow(0 0 calc(5 * var(--u)) rgba(255,246,225,.6))
         drop-shadow(0 calc(4 * var(--u)) calc(6 * var(--u)) rgba(30,14,4,.3));
}
.bz-cat svg{display:block;width:100%;height:auto;overflow:visible}
.bz-cat .mz-body{transform-box:fill-box;transform-origin:50% 100%}
.bz-cat.is-walk .mz-body{animation:mzHop var(--bz-step) ease-out}
.bz-cat.is-bumping{animation:mzBump .42s}
@keyframes mzHop{
  0%{transform:translateY(0) scale(1.04,.94)}
  45%{transform:translateY(-9%) scale(.97,1.04)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes mzBump{
  30%{transform:translate(calc(-50% + var(--nx)),calc(-100% + var(--ny))) rotate(-6deg)}
  60%{transform:translate(-50%,-100%) rotate(4deg)}
}
.bz-drop{transform-box:fill-box;transform-origin:50% 100%;animation:bzDrop .34s var(--e-pop)}
@keyframes bzDrop{
  0%{transform:translateY(-45%) scale(.35);opacity:0}
  60%{transform:translateY(0) scale(1.14);opacity:1}
  100%{transform:translateY(0) scale(1)}
}

/* ---- 축하 고양이 (보드 옆) — 완료 화면이 대신하므로 항상 꺼 둔다 ---- */
.bz-cheer{display:none}
.bz-hop{transform-box:fill-box;transform-origin:50% 100%;animation:bzHop .72s ease-in-out infinite}
.bz-catshadow{transform-box:fill-box;transform-origin:50% 50%;opacity:.16;animation:bzShadow .72s ease-in-out infinite}
.bz-twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:bzTwinkle 1.5s ease-in-out infinite}
@keyframes bzHop{
  0%,100%{transform:translateY(0) scale(1,.98)}
  20%{transform:translateY(0) scale(1.04,.93)}
  55%{transform:translateY(-8%) scale(.98,1.04)}
  82%{transform:translateY(0) scale(1.02,.96)}
}
@keyframes bzShadow{0%,100%{transform:scaleX(1);opacity:.16}55%{transform:scaleX(.78);opacity:.09}}
@keyframes bzTwinkle{0%,100%{opacity:.12;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(40deg)}}

/* ============================================================
   조작 — 판 아래 레일, 레일 아래 방향 카드 [stated]. 모두 크림 판 안
   ============================================================ */
.bz-controls{
  position:absolute;left:50%;top:calc(846 * var(--u));transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:calc(22 * var(--u));
  transition:transform var(--t-slow) var(--e-out),opacity var(--t-base) ease;
}
.bz-stage.is-done .bz-controls{transform:translate(-50%,40%);opacity:0;pointer-events:none}
.bz-trackrow{display:flex;align-items:center;gap:calc(18 * var(--u))}

/* 원형 버튼 — DESIGN.css §11.14 .pp-rbtn 공통 규칙을 쓴다 (두께 · 오린 윤곽 · 펠트 결 55%). 여기서는 아이콘만 정한다 */

/* 되감기 — 다홍 [stated] */
/* .pp-rbtn 은 padding 0 이라 % 크기가 커진다 — 확정 당시(기본 버튼 padding) 크기를 u 로 고정 */
.bz-round svg{width:calc(45.8 * var(--u));height:calc(51 * var(--u));overflow:visible}
/* 아이콘 굵기 2.6 → 3.4 (24 viewBox) [stated: 조금 더 굵게] */
.bz-round svg path{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
/* 다른 조작 버튼처럼 마우스를 올리면 윗면이 한 단계 어두워진다 */
#clear{--face-hover:#BF4C39}

/* 명령 레일 — 나무 판자 게시판 */
.bz-rail{
  position:relative;flex:none;
  padding:calc(20 * var(--u)) calc(66 * var(--u));
  filter:drop-shadow(0 calc(4 * var(--u)) calc(5 * var(--u)) rgba(46,28,10,.34));
}
.bz-wood{
  position:absolute;inset:0;pointer-events:none;
  border-style:solid;border-width:0 calc(58 * var(--u));
  border-image-source:url("../_img_png/paper/counter-plank-hf.webp");
  border-image-slice:0 150 fill;border-image-repeat:stretch;
}
.bz-track{
  position:relative;z-index:1;
  display:grid;grid-template-columns:repeat(8,calc(84 * var(--u)));gap:calc(14 * var(--u));
  margin:0;padding:0;list-style:none;
}
/* 빈 칸 = 판자에 파인 홈 */
.bz-slot{
  position:relative;aspect-ratio:1;border-radius:50%;
  background:#5C2A1B;
  box-shadow:inset 0 calc(6 * var(--u)) 0 rgba(22,6,2,.5);
  display:grid;place-items:center;
}
/* 다음에 놓을 칸 — 선이 아니라 번지는 빛 (§11.7 .is-next) */
.bz-slot.is-next::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,229,155,.62) 0%, rgba(255,214,102,.30) 52%, rgba(255,214,102,.04) 80%);
  box-shadow:0 0 calc(22*var(--u)) calc(4*var(--u)) rgba(255,205,90,.45);
  animation:ppNext 1.7s ease-in-out infinite}
@keyframes ppNext{0%,100%{opacity:.55}50%{opacity:1}}

/* 실행 — 초록 펠트 */
/* 재생 삼각형 가운데 맞춤 [stated: 원형 센터 확인]
   이동 없이 두면 삼각형 외곽 상자는 원 중심과 맞지만(-0.3u), 무게중심은 왼쪽으로 5.6u 쏠려 보인다.
   외곽 상자 중심과 무게중심의 가운데가 원 중심에 오도록 오른쪽으로 3u 옮긴다 → 상자 +2.7u · 무게중심 −2.7u */
.bz-play svg{width:calc(56 * var(--u));height:calc(61 * var(--u));transform:translateX(calc(3 * var(--u)))}
.bz-play svg path{fill:currentColor;stroke:currentColor;stroke-width:3.4;stroke-linejoin:round}
/* 탭 유도 — 퍼지는 링 (§4 .is-hint) */
.bz-play.is-ready::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 0 0 rgba(47,191,113,.5);
  animation:bzRing 1.6s var(--e-out) infinite;
}
@keyframes bzRing{to{box-shadow:0 0 0 calc(26 * var(--u)) rgba(47,191,113,0)}}

/* 방향 카드 — 보라 펠트 + 흰 화살표 [stated] */
.bz-palette{flex:none;display:flex;align-items:center;gap:calc(40 * var(--u))}
.bz-palette.is-dimmed{opacity:.3;filter:saturate(.3);transition:opacity .3s ease}
.bz-card{user-select:none}
.bz-palette .bz-card .bz-ar{width:calc(65 * var(--u));height:calc(70.8 * var(--u))}
.bz-palette .bz-card{
  animation:bzBob 3.2s ease-in-out infinite}
.bz-palette .bz-card:nth-child(2){animation-delay:.25s}
.bz-palette .bz-card:nth-child(3){animation-delay:.5s}
.bz-palette .bz-card:nth-child(4){animation-delay:.75s}
.bz-palette .bz-card:active{animation:none}
@keyframes bzBob{0%,100%{translate:0 0}50%{translate:0 calc(-4 * var(--u))}}
.bz-ar{
  width:58%;height:58%;fill:currentColor;display:block;
  transform-origin:50% 50%;
  transform:rotate(var(--ar-rot,0deg));
}
/* 레일에 놓인 카드 — 홈 안에 노란 화살표 (카운터의 홈 위 도형과 같은 노랑 #FFD23F) */
.bz-slot .bz-card{position:absolute;inset:0;border-radius:50%;
  display:grid;place-items:center;background:none;color:#FFD23F;
  transition:transform var(--t-fast) var(--e-out),color var(--t-fast),opacity var(--t-fast)}
.bz-slot .bz-card .bz-ar{width:64%;height:64%}
@media (hover:hover){.bz-slot .bz-card:hover:not(:disabled){transform:scale(1.06)}}
.bz-slot .bz-card:active:not(:disabled){transform:scale(.92)}
/* 실행 중 — 지금 칸은 홈이 밝게 빛나고 화살표가 커진다, 지나온 칸은 크림으로 한 단 죽인다 */
.bz-slot .bz-card.is-active{z-index:3;color:#FFE27A;transform:scale(1.14);
  box-shadow:0 0 calc(18*var(--u)) calc(4*var(--u)) rgba(255,210,63,.55)}
.bz-slot .bz-card.is-reached{color:#FFF3E0;opacity:.55}

/* ---- 결과 배너 — 가이드 팝업(§11.9 찢은 종이 시트)과 같은 종이 [stated] ----
   면 = 크림 --pp-cream + --pp-tx-sheet (마스크 --pp-mask-sheet), 흰 섬유 가장자리 = --pp-rim (마스크 --pp-mask-rim, 10u 크게).
   mask 는 filter 뒤에 적용되므로 들뜸 그림자 --pp-lift-l 은 바깥 .bz-banner__paper 에 건다 (B-2_04 v2 .guide__paper 와 같은 구조).
   크기는 그대로 [stated] — 최소 높이 150u · 패딩 동일, 숫자 칸은 이전 62u 숫자 폭(74.5u)을 최소 폭으로 잡아 배너 폭이 줄지 않게.
   글자는 팝업 본문과 같게 — 40u / 800 · --pp-ink #1F2937
   윤곽: 팝업용 --pp-mask-sheet(1020 x 630)를 가로로 긴 배너에 늘리면 좌우 끝이 잘린 것처럼 곧게 펴진다 [stated: 잘린 것 같아].
   그래서 배너 크기(1086 x 150) 그대로 마스크를 따로 만들었다 — --bz-mask-banner / --bz-mask-banner-rim.
   찢김 정도는 가이드 팝업만큼만 [stated] — 가장자리 흔들림 ±1~2u(긴 물결 위주, 뜯긴 자리 없음), 모서리 R24(R50은 너무 둥글었다 [stated]),
   흰 섬유는 면과 같은 굴곡에서 0.5~5.5u 드러남 */

/* ============================================================

   종이 소년(B-2_02-boy-v5.webp)이 가운데로 나와 게임 방법을 말한다 [stated].
   끝나면 좌하단으로 돌아가 서 있고, 누르면 브리핑을 다시 한다 — 자리·크기·이동값은 B-2_05 v2 와 같다.
   소년 중심 x 193u → 960u : translateX 767u / scale 1.18 → 머리 top ≈ 625u
   말풍선 박스 바닥 = 머리 top − 93u = 532u → 말풍선 top = 296u (B-2_05 v2 · v4 와 같은 값)
   ============================================================ */
.bz-veil{position:fixed;inset:0;z-index:16;background:var(--pp-veil, rgba(0,0,0,.42));
  opacity:0;visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out),visibility var(--t-slow)}

  left:calc(50.7 * var(--u));top:calc(709.3 * var(--u));

  transition:transform .62s var(--e-out)}

  transform-origin:50% 100%;transition:transform var(--t-fast) var(--e-out)}

   찢은 종이 시트 1200×700u — 마스크·면은 1020×630 원본을 100% 로 늘림(DESIGN.css --pp-mask-rim · --pp-mask-sheet · --pp-tx-sheet).
   mask 는 filter 뒤에 적용되므로 들뜸 그림자는 바깥 .guide__paper 에 건다(§11.13).

   내용은 무조건 가운데 [stated] — grid 는 넘치는 줄을 왼쪽 기준으로 밀어내므로 flex 열 + align-items:center */

  /* 브리핑 — 바구니 고양이가 게임 방법까지 말한다 [stated] */

            ko:'딸기를 모두 담고 도착점으로 갈 수 있게 화살표를 놓아 줘.'},
  tag:     {en:'QUESTION', ko:'문제'},
  needArrow:{en:'Put an arrow in first!', ko:'화살표를 먼저 놓아 줘!'},

                ko:'아직 담지 않은 딸기가 있어! 모두 찾아보자!'},
  /* 완료 화면 — DESIGN.md §8.3. 버튼 문구는 전 화면 공통 */
  winRetry:{en:'PLAY AGAIN', ko:'다시하기'},
  /* 가이드 팝업 §8.5 — 스텝 문장(▶ 는 초록 실행 아이콘으로 그린다) · 음성은 한 문장 [stated] */
  howto:   {en:'How to play', ko:'플레이 방법'},
  close:   {en:'Close',       ko:'닫기'},
  guideA:  {en:'Place the arrows in order', ko:'화살표를 차례로 놓아요'},
  guideB:  {en:'Press ▶ to pick them all, then go to END!', ko:'▶를 눌러 딸기를 모두 담고 END로!'},

            ko:'화살표를 차례로 놓고, 실행 버튼을 눌러 딸기를 모두 담고 도착점으로 가 보자!'},
  winExit: {en:'EXIT',       ko:'나가기'},
};
/** 남은 딸기 수 안내 — 숫자가 없으니 몇 개가 남았는지만 알려 준다.
   녹음본과 글자가 같아야 하므로 숫자 대신 말로 쓴다 (DESIGN.md 생성 보이스 레지스트리) */
const REMAIN_EN = ['One strawberry is still in the field.','Two strawberries are still in the field.','Three strawberries are still in the field.',
  'Four strawberries are still in the field.','Five strawberries are still in the field.','Six strawberries are still in the field.','Seven strawberries are still in the field.'];
const REMAIN_KO = ['딸기가 한 개 남았어!','딸기가 두 개 남았어!','딸기가 세 개 남았어!','딸기가 네 개 남았어!','딸기가 다섯 개 남았어!','딸기가 여섯 개 남았어!','딸기가 일곱 개 남았어!'];
const leftTipLine = n => (lang === 'en' ? REMAIN_EN : REMAIN_KO)[n - 1];

/* ============================================================
   음성 — 모든 문장을 Pixie 녹음본으로 (DESIGN.md 「생성 보이스 레지스트리」 · B-2_02 v4 · 03 v2 · 05 v2 와 같음) [stated]
   파일: audio/voice-q/q_01_{키}_{en|ko}.mp3 (HTML 기준 상대 경로). 파일을 못 읽으면 같은 문장을 기기 TTS 로.
   자동재생이 막히면(NotAllowedError) TTS 로 넘기지 않고 멈췄다가 첫 탭에서 녹음본을 다시 재생한다.
   ============================================================ */
const VOICE_KEY = {intro:'intro', up:'up', down:'down', left:'left', right:'right', removed:'removed',
  needArrow:'needarrow', startOver:'startover', fixOrder:'fixorder', full:'full',
  tipAllPicked:'tip_allpicked', tipTooEarly:'tip_tooearly',
  guide:'guide'};   /* q_01_guide_{en|ko}.mp3 — 아직 녹음 전. 파일이 없으면 기기 TTS 로 읽는다 [stated] */
/* 문장 → 파일 키 (언어별). 말풍선 문장과 녹음본이 한 글자도 다르면 안 되므로 문장으로 찾는다 */
const VOICE_BY_LINE = {en:{}, ko:{}};
Object.keys(VOICE_KEY).forEach(k => { VOICE_BY_LINE.en[L[k].en] = VOICE_KEY[k]; VOICE_BY_LINE.ko[L[k].ko] = VOICE_KEY[k]; });
REMAIN_EN.forEach((x, i) => { VOICE_BY_LINE.en[x] = 'remain_' + (i + 1); });
REMAIN_KO.forEach((x, i) => { VOICE_BY_LINE.ko[x] = 'remain_' + (i + 1); });
const voiceSrc = (l, line) => { const k = VOICE_BY_LINE[l][line]; return k ? '../audio/voice-q/q_01_' + k + '_' + l + '.mp3' : null; };

let lang = 'en';
let soundOn = true;
const t = key => L[key][lang];

/* ============================================================
   완료 팡파르 · 승리 BGM — B-2_06(패턴) 과 같은 소리를 그대로 가져왔다.
   다른 화면의 완료 화면과 소리가 같아야 한다 [stated]. 값·타이밍 모두 동일.
   ============================================================ */
const SFX = (() => {
    let ctx = null, noiseBuf = null;
    const ac = () => {
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    };

    /* ---------- 공용 보이스 ----------
       오실 2개(디튠 레이어) + 로우패스로 배음을 깎는다.
       단일 오실 삐 소리보다 마림바·글로켄에 가깝게 들린다 */
    function voice(freq, at, dur, o){
      const c = ac(); if(!c) return;
      o = o || {};
      const t0  = c.currentTime + at;
      const bus = o.bus || c.destination;
      const g = c.createGain(), f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.cut || Math.min(freq * 5 + 900, 11000), t0);
      f.Q.setValueAtTime(.7, t0);
      const peak = o.gain || .12, atk = o.atk || .006;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      f.connect(g); g.connect(bus);
      const osc = (type, mul, det) => {
        const s = c.createOscillator();
        s.type = type;
        s.frequency.setValueAtTime(freq * (mul || 1), t0);
        if(o.bend) s.frequency.exponentialRampToValueAtTime(freq * o.bend, t0 + dur * .8);
        s.detune.setValueAtTime(det || 0, t0);
        s.connect(f); s.start(t0); s.stop(t0 + dur + .05);
      };
      osc(o.type || 'sine', 1, 0);
      if(o.layer) osc(o.layer, o.mul || 2, o.detune || 6);
    }
    const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));

    /* 노이즈 스웹 — 화음 앞에 붙이면 '쨘' 하는 공기감이 생긴다 */
    function swoosh(at, dur, f0, f1, gain){
      const c = ac(); if(!c) return;
      if(!noiseBuf){
        const n = Math.floor(c.sampleRate * 1.2);
        noiseBuf = c.createBuffer(1, n, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        let s = 12345;
        for(let i = 0; i < n; i++){ s = (s*1103515245 + 12345) % 2147483648; d[i] = s/1073741824 - 1 }
      }
      const t0 = c.currentTime + at;
      const src = c.createBufferSource(); src.buffer = noiseBuf;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
      bp.frequency.setValueAtTime(f0, t0);
      bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .3);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      src.connect(bp); bp.connect(g); g.connect(c.destination);
      src.start(t0); src.stop(t0 + dur + .05);
    }

    const C3=130.81, C4=261.63, G4=392,
          C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99, A5=880, B5=987.77,
          C6=1046.5, D6=1174.7, E6=1318.5, F6=1396.9, G6=1568, A6=1760,
          C7=2093, E7=2637, G7=3136;
    const F3=174.61, G3=196;

    /* 마림바 — 짧은 어택, 배음 얇게 */
    const marimba = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'triangle', mul:2, detune:5,
                         gain:gain || .13, cut:f*4+700});
    /* 글로켄 — 밝고 길게 울린다 */
    const bell = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'sine', mul:3.01, detune:4,
                         gain:gain || .10, cut:f*7+2000});

    /* ---- BGM 스케줄러 ---- */
    let bgmOn = false, bgmTm = null, bgmBus = null, bgmAt = 0;
    const BEAT = .28;                       // 8박 = 2.24s 루프
    const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
                 [A5,2,.5],[G5,2.5,.5],[E5,3,.5],[G5,3.5,.5],
                 [F5,4,.5],[A5,4.5,.5],[C6,5,.5],[A5,5.5,.5],
                 [G5,6,.5],[E5,6.5,.5],[C5,7,1]];
    const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
    function bgmTone(freq, at, dur, type, gain){
      const c = ac(); if(!c || !bgmBus) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, at);
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(gain, at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, at + dur);
      o.connect(g); g.connect(bgmBus);
      o.start(at); o.stop(at + dur + .05);
    }
    function bgmLoop(){
      const c = ac(); if(!c || !bgmOn) return;
      if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;   // 밀렸으면 따라잡는다
      MEL.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'triangle', .055));
      BASS.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'sine', .045));
      bgmAt += 8*BEAT;
      bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);               // 다음 루프를 미리 예약
    }

    return {
      unlock(){ ac() },

      /* 칸을 짚을 때 — 규칙과 맞으면 마림바가 한 칸씩 올라가고,
         어긋나면 낮고 둔한 나무 소리(경고음 아님) */
      tick(step, ok){
        if(ok) marimba([C5,E5,A5,C6][step] || C5, 0, .30, .13);
        else   voice(165, 0, .12, {type:'sine', gain:.075, cut:420});
      },

      /* 정답 1개 완성 — 글로켄 3음 + 낮은 화음으로 받쳐 준다 */
      correct(){
        [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
        voice(C4, .02, .5, {type:'sine', gain:.05, cut:900});
      },

      /* 5개 클리어 — 스웹 + 상승 마림바. 팝업 팡파르로 이어진다 */
      clear(){
        swoosh(0, .38, 500, 4200, .055);
        [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12));
        bell(C6, .40, .8, .09);
      },

      tap(){ voice(620, 0, .09, {type:'sine', gain:.10, cut:2200, bend:.66}) },
      hint(){ bell(D6, 0, .30, .085); bell(A6, .13, .38, .07) },

      /* ---- 팝업 팡파르 — 약 4.8초로 길게 이어진다 ----
         ① 콜(3연음) ② 상승 런 ③ 지속 화음 ④ 해결 멜로디 ⑤ 종결 화음 + 반짝임 */
      fanfare(){
        swoosh(0, .5, 400, 5200, .06);
        // ① 콜
        [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ② 상승 런
        [[G5,.46,.12],[A5,.55,.12],[B5,.64,.12],[C6,.73,.34]]
          .forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ③ 지속 화음
        chord([C5,E5,G5,C6], 1.00, 1.25, {type:'triangle', layer:'sine', mul:2, gain:.055, cut:5200});
        voice(C3, 1.00, 1.4, {type:'sine', gain:.055, cut:600});
        // ④ 해결 멜로디
        [[E6,1.12,.24],[D6,1.36,.24],[C6,1.60,.38],[G5,1.98,.32],
         [A5,2.32,.26],[B5,2.58,.26],[C6,2.84,.80]]
          .forEach(([f,a,d]) => bell(f,a,d,.10));
        // ⑤ 종결 화음 + 베이스 + 반짝임
        swoosh(3.42, .45, 900, 6000, .045);
        chord([C6,E6,G6], 3.50, 1.7, {type:'sine', layer:'triangle', mul:2, gain:.06, cut:8000});
        voice(C4, 3.50, 1.8, {type:'sine', gain:.05, cut:900});
        voice(C3, 3.50, 2.0, {type:'sine', gain:.05, cut:520});
        [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(([f,a,d]) => bell(f,a,d,.045));
      },

      /* ---- 승리 BGM — 2.24s 루프 (C-F-G 진행) ----
         파일 없이 합성한다. 팝업이 열려 있는 동안만 돌고 다시하기에서 멈춘다.
         delay: 팡파르가 잦아든 뒤 들어오도록 시작을 늦춘다 */
      bgm(on, delay){
        const c = ac(); if(!c) return;
        if(on){
          if(bgmOn) return;
          bgmOn = true;
          const d = (delay === undefined) ? .35 : delay;
          bgmBus = c.createGain();
          bgmBus.gain.setValueAtTime(.0001, c.currentTime);
          bgmBus.gain.setValueAtTime(.0001, c.currentTime + d);
          bgmBus.gain.exponentialRampToValueAtTime(1, c.currentTime + d + 1.1);
          bgmBus.connect(c.destination);
          bgmAt = c.currentTime + d;
          bgmLoop();
        }else{
          if(!bgmOn) return;
          bgmOn = false;
          clearTimeout(bgmTm); bgmTm = null;
          const bus = bgmBus; bgmBus = null;
          if(bus){
            const t0 = c.currentTime;
            bus.gain.cancelScheduledValues(t0);
            bus.gain.setValueAtTime(Math.max(bus.gain.value, .0001), t0);
            bus.gain.exponentialRampToValueAtTime(.0001, t0 + .4);
            setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
          }
        }
      }
    };
  })();

/* ============================================================
   소리 — 효과음(WebAudio)과 음성(클립 + 합성)
   ============================================================ */
const CHIME_FREQUENCY = {up:720, down:470, left:540, right:620, pick:880, remove:340, play:680};
let audioCtx = null;

/* B-2 봄 배경음악 — 첫 사용자 입력부터 반복 재생한다(브라우저 자동재생 정책 대응). */
const stageBgm = new Audio('../audio/bgm/B-2-spring-strawberry-garden-loop.wav');
stageBgm.loop = true;
stageBgm.preload = 'auto';
stageBgm.volume = .22;
function startStageBgm(){
  if (!soundOn || (result && result.hasWon) || !stageBgm.paused) return;
  const p = stageBgm.play();
  if (p && p.catch) p.catch(() => {});
}
function pauseStageBgm(){ stageBgm.pause(); }

/** 짧은 사인파 효과음 — 오디오 파일 없이 조작 피드백만 담당한다. */
function chime(kind){
  if (!soundOn) return;
  if (!audioCtx){
    if (typeof AudioContext === 'undefined') return;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const f = CHIME_FREQUENCY[kind], osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  if (kind === 'pick') osc.frequency.exponentialRampToValueAtTime(f * 1.5, now + .16);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.linearRampToValueAtTime(.2, now + .012);
  gain.gain.exponentialRampToValueAtTime(.0001, now + .3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + .34);
}

let playingClip = null, pendingClip = null, pendingHooks = null;

function hush(){
  SFX.bgm(false);
  pendingClip = null; pendingHooks = null;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (!playingClip) return;
  const a = playingClip; playingClip = null;
  a.onplaying = a.onended = a.onerror = null;
  /* 말하는 중에 끊을 때 바로 pause 하면 파형이 뚝 끊겨 '틱' 소리가 난다 — 60ms 동안 줄인 뒤 멈춘다 */
  const v0 = a.volume, t0 = performance.now();
  (function fade(){
    const k = Math.min(1, (performance.now() - t0) / 60);
    a.volume = v0 * (1 - k);
    if (k < 1) requestAnimationFrame(fade); else a.pause();
  })();
}
function speakTTS(l, line, hooks){
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(line);
  u.lang = l === 'en' ? 'en-US' : 'ko-KR';
  u.rate = .92; u.pitch = 1.08;
  u.onstart = () => { if (hooks.start) hooks.start(); };
  u.onend = () => { if (hooks.end) hooks.end(); };
  window.speechSynthesis.speak(u);
}
/* 녹음본 재생 — 못 읽으면 TTS, 자동재생 차단이면 멈췄다가 첫 탭에서 같은 파일을 다시 */
function playVoiceFile(a, l, line, hooks){
  playingClip = a;
  let fell = false;
  const fallback = () => {
    if (fell || playingClip !== a) return;
    fell = true; playingClip = null;
    speakTTS(l, line, hooks);
  };
  a.onplaying = () => { if (playingClip === a && hooks.start) hooks.start(); };
  a.onended = () => { if (playingClip !== a) return; playingClip = null; if (hooks.end) hooks.end(); };
  a.onerror = fallback;
  const p = a.play();
  if (p && p.catch) p.catch(err => {
    if (err && err.name === 'NotAllowedError'){ if (playingClip === a){ pendingClip = a; pendingHooks = {l, line, hooks}; } return; }
    fallback();
  });
}
/* hooks.start / hooks.end — 브리핑 종료(음성 종료 갈래, §8.2)를 알려 주는 용도 */
function speak(line, hooks){
  if (!soundOn || !line) return;
  hooks = hooks || {};
  hush();
  const src = voiceSrc(lang, line);
  if (src){ playVoiceFile(new Audio(src), lang, line, hooks); return; }
  speakTTS(lang, line, hooks);
}
['pointerdown','keydown'].forEach(type => window.addEventListener(type, () => {
  startStageBgm();
  const a = pendingClip, h = pendingHooks; if (!a) return;
  pendingClip = null; pendingHooks = null;
  a.currentTime = 0; playVoiceFile(a, h.l, h.line, h.hooks);
}, {capture:true}));

/* ---- 말풍선 : 문장을 띄우고 정해진 시간이 지나면 스스로 사라진다 ------- */
const bubble = document.getElementById('bubble');
const bubbleText = document.getElementById('bubbleText');
let bubbleTimer = null;

function say(line, holdMs){
  if (bubbleTimer !== null) clearTimeout(bubbleTimer);
  bubbleText.textContent = line;
  bubble.classList.add('is-on');
  bubbleTimer = setTimeout(() => bubble.classList.remove('is-on'), holdMs || BUBBLE_HOLD_MS);
  speak(line);
}

/** 문제 안내는 소리로만 들려준다 — 말풍선을 띄우지 않는다 [stated].
    들어오자마자 화면 위를 긴 글이 덮으면 아이가 판부터 보지 못한다. */
function sayVoiceOnly(line){
  if (bubbleTimer !== null) clearTimeout(bubbleTimer);
  bubble.classList.remove('is-on');
  speak(line);
}

  const wob = (1.3 / uPerUnit).toFixed(3);
  return '<filter id="' + id + '" x="-6%" y="-6%" width="112%" height="112%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">'
    + '<feImage href="' + CAT_FELT_TX + '" x="0" y="0" width="' + tw + '" height="' + th + '" preserveAspectRatio="none" result="txOne"/>'
    + '<feTile in="txOne" result="feltColor"/>'
    + '<feColorMatrix in="feltColor" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 0 1" result="feltGray"/>'
    + '<feComponentTransfer in="feltGray" result="feltSoft"><feFuncR type="linear" slope=".68" intercept=".56"/><feFuncG type="linear" slope=".68" intercept=".56"/><feFuncB type="linear" slope=".68" intercept=".56"/></feComponentTransfer>'
    + '<feDisplacementMap in="SourceGraphic" in2="feltColor" scale="' + wob + '" xChannelSelector="R" yChannelSelector="B" result="cutPaper"/>'
    + '<feComposite in="feltSoft" in2="cutPaper" operator="in" result="feltPaper"/>'
    + '<feBlend in="cutPaper" in2="feltPaper" mode="multiply" result="textured"/>'
    + '<feComposite in="textured" in2="cutPaper" operator="in"/>'
    + '</filter>';
}
function buildPaperFilters(){
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '0'); svg.setAttribute('height', '0'); svg.setAttribute('aria-hidden', 'true');
  svg.style.position = 'absolute';
  /* card-felt-teal.webp의 섬유 결을 색상과 분리해 각 종이 조각 안에 부드럽게 곱한다. */
  svg.innerHTML = '<defs>'
    + paperFilter('ppPaperBerry')
    /* 판 위 고양이 168u / viewBox 126.83 · 좌하단 브리핑 고양이 244u / 126.83 · 완료 고양이 440u / 171.83 */
    + catPaperFilter('ppPaperCat', 168 / 126.83)
    + catPaperFilter('ppPaperWin', 440 / 171.83)
    + '</defs>';
  document.body.prepend(svg);
}

function buildCheerCat(){
  document.getElementById('cheer').innerHTML  = cheerCatSvg('b2-cheer-weave');
  document.getElementById('winArt').innerHTML = cheerCatSvg('b2-win-weave');
}

/* ============================================================
   게임 상태 (hooks/useFlowerHillGame.ts)
   빈 바구니가 딸기를 순서 없이 모두 담고 END 로 이동한다 (v2).
   ============================================================ */
const stage = document.getElementById('stage');
const boardEl = document.getElementById('board');
const trackEl = document.getElementById('track');
const paletteEl = document.getElementById('palette');
const playBtn = document.getElementById('play');
const bannerEl = document.getElementById('banner');
const cheerEl = document.getElementById('cheer');

let commands = [];
let position = START_POSITION;
let picked = [];
let activeIndex = -1;
let isRunning = false, isFinished = false, isBumping = false;
let result = null;
let stepSeconds = STEP_SECONDS;
let runToken = 0;
let timers = [];

const wait = ms => new Promise(r => setTimeout(r, ms));
const onBoard = p => p.column >= 0 && p.column < BOARD_COLUMNS && p.row >= 0 && p.row < BOARD_ROWS;
const samePos = (a, b) => a.column === b.column && a.row === b.row;
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

/** 흔들리는 딸기 — 같은 알을 다시 흔들 때도 처음부터 재생되도록 클래스를 떼었다 붙인다 */
function shakeFlower(n){
  const el = bloomByNumber.get(n);
  if (!el) return;
  el.classList.remove('is-wobbling');
  void el.offsetWidth;                       /* reflow 를 한 번 강제해 애니메이션을 되감는다 */
  el.classList.add('is-wobbling');
}

/** 카드는 그대로 두고 판만 처음으로 — 고쳐서 다시 돌려보게 한다. */
function rewind(){
  runToken += 1; clearTimers();
  isRunning = false; isFinished = false;
  picked = []; position = START_POSITION;
  activeIndex = -1; result = null;
  bloomByNumber.forEach(el => el.classList.remove('is-wobbling'));
  stepSeconds = TIMING.rewindStep / 1000;
  applyStep();
  later(() => { stepSeconds = STEP_SECONDS; applyStep(); }, 300);
  renderAll();
}

function addCommand(direction){
  if (isRunning || commands.length >= MAX_COMMANDS) return;
  if (isFinished) rewind();
  commands = commands.concat(direction);
  say(t(direction), 850);
  renderAll();
}

function removeCommandAt(index){
  if (isRunning) return;
  if (isFinished) rewind();
  commands = commands.filter((_, i) => i !== index);
  say(t('removed'), 1100);
  chime('remove');
  renderAll();
}

function clearCommands(){
  if (isRunning) return;
  commands = [];
  rewind();
  say(t('startOver'), 1600);
}

function finish(){
  isFinished = true;
  const pickedCount = picked.length;
  const isBasketAtEnd = samePos(position, END_POSITION);
  const hasWon = pickedCount === TOTAL_FLOWERS && isBasketAtEnd;
  result = {pickedCount, isBasketAtEnd, hasWon};
  renderAll();

  /* 남은 딸기들이 차례로 흔들려 "아직 여기 있어요"를 알린다 */
  FIELD_FLOWERS.filter(f => !picked.includes(f.number))
    .forEach((f, i) => later(() => shakeFlower(f.number), i * 130));

  /* 완료 화면에는 말풍선을 띄우지 않는다 — 소리로만 [stated]. 화면 위를 덮지 않게 */
  if (hasWon){ sayVoiceOnly(t('full')); return; }

  const tip = pickedCount === TOTAL_FLOWERS ? t('tipAllPicked')
            : isBasketAtEnd ? t('tipTooEarly')
            : leftTipLine(TOTAL_FLOWERS - pickedCount);
  later(() => say(tip, 3600), 420);
}

async function play(){
  if (isRunning) return;
  if (isFinished) rewind();
  if (commands.length === 0){ say(t('needArrow'), 1800); return; }

  chime('play');
  runToken += 1;
  const token = runToken;
  isRunning = true; result = null;
  renderAll();

  for (let index = 0; index < commands.length; index += 1){
    if (token !== runToken) return;
    activeIndex = index; renderTrack();

    const direction = commands[index], delta = DIRECTION_DELTA[direction];
    const next = {column:position.column + delta.column, row:position.row + delta.row};
    say(t(direction), stepSeconds * 1000);

    if (!onBoard(next)){
      /* 판 밖 — 고양이가 그쪽으로 기우뚱 튕기고, 시퀀스는 계속된다 */
      basketEl.style.setProperty('--nx', (delta.column * 22) + '%');
      basketEl.style.setProperty('--ny', (delta.row * 10) + '%');
      isBumping = true; renderBasket();
      await wait(TIMING.bump);
      isBumping = false; renderBasket();
    } else {
      position = next;
      basketEl.classList.remove('is-walk'); void basketEl.offsetWidth; basketEl.classList.add('is-walk');
      renderBasket();
      await wait(stepSeconds * 1000 + TIMING.stepPadding);
      if (token !== runToken) return;

      const here = FIELD_FLOWERS.find(f =>
        f.column === next.column && f.row === next.row && !picked.includes(f.number));

      if (here){
        /* v2 — 순서 없이 밟으면 바로 담긴다 */
        picked = picked.concat(here.number);
        renderBoard(); renderBasket();
        chime('pick');
        await wait(TIMING.pick);
      }

      /* END 도착 — 딸기를 다 못 담았으면 남은 명령이 있어도 여기서 멈추고 안내한다 [stated] */
      if (samePos(position, END_POSITION) && picked.length < TOTAL_FLOWERS) break;
    }
  }

  if (token !== runToken) return;
  isRunning = false; activeIndex = -1;
  finish();
}

/* ============================================================
   렌더 — DOM 은 한 번만 짓고 그 뒤로는 상태만 반영한다.
   매번 다시 그리면 딸기의 sway·바구니 transition 이 끊긴다.
   ============================================================ */
const applyStep = () => stage.style.setProperty('--bz-step', stepSeconds + 's');
const arrowImg = d => '<svg class="bz-ar" style="--ar-rot:' + ({right:0, down:90, left:180, up:270})[d] + 'deg" aria-hidden="true"><use href="#bz-arrow"/></svg>';
const dirLabel = d => ({up:'Up', down:'Down', left:'Left', right:'Right'})[d];
/* 흙 고랑 9칸의 무대 좌표 [x, y, w, h] — felt-bg v4에서도 같은 위치/크기로 잠근 값.
   와이드 배경의 표시 크기와 오프셋(--bgw/--bgh/--bgx/--bgy)을 반영했다. */
const BEDS = [
  [[400,222,358,179],[796,222,328,179],[1162,222,356,179]],
  [[389,422,366,184],[792,422,335,184],[1166,422,364,184]],
  [[376,625,377,195],[789,624,342,195],[1169,625,375,195]],
];
const STAGE_W = 1920, STAGE_H = 1200;
const bedAt = (c, r) => BEDS[r][c];
const cellCenter = (c, r) => { const [x, y, w, h] = bedAt(c, r); return {x:x + w / 2, y:y + h / 2}; };

let endCellEl = null, basketEl = null, basketBerriesEl = null;
const bloomByNumber = new Map();
const slotEls = [];

/* ---- 보드 : 3 x 3 칸 + 심긴 딸기 + 움직이는 바구니 -------------------- */
function buildBoard(){
  for (let i = 0; i < BOARD_COLUMNS * BOARD_ROWS; i += 1){
    const column = i % BOARD_COLUMNS, row = Math.floor(i / BOARD_COLUMNS);
    const isStart = column === START_POSITION.column && row === START_POSITION.row;
    const isEnd = column === END_POSITION.column && row === END_POSITION.row;
    const flower = FIELD_FLOWERS.find(f => f.column === column && f.row === row);

    const cell = document.createElement('div');
    cell.className = 'bz-cell' + (isEnd ? ' is-end' : '');
    const [bx, by, bw, bh] = bedAt(column, row);
    cell.style.cssText = 'left:' + (bx / STAGE_W * 100) + '%;top:' + (by / STAGE_H * 100) + '%;width:' + (bw / STAGE_W * 100) + '%;height:' + (bh / STAGE_H * 100) + '%';
    if (isStart) cell.innerHTML = '<span class="bz-tag">START</span>';
    if (isEnd){ cell.innerHTML = '<span class="bz-tag">END</span>'; endCellEl = cell; }
    if (flower){
      /* 숫자 없는 딸기 — algorithms_9와 같은 벡터 그림에 B-2_02-boy-v5.webp 기반 종이 결을 입힌다 */
      const plant = document.createElement('div');
      plant.className = 'bz-plant';
      plant.innerHTML = '<span class="bz-bloom" role="img" aria-label="Strawberry">'
        + '<svg class="bz-berry-svg" viewBox="0 0 ' + BERRY_W + ' ' + BERRY_H + '" aria-hidden="true">'
        + '<g filter="url(#ppPaperBerry)">' + berryArt() + '</g></svg></span>';
      cell.appendChild(plant);
      bloomByNumber.set(flower.number, plant.firstElementChild);
    }
    boardEl.appendChild(cell);
  }

  /* 바구니를 든 고양이 — 변수 이름(basketEl)은 그대로 두고 그림만 고양이로 바꾼다 */
  basketEl = document.createElement('div');
  basketEl.className = 'bz-cat';
  basketEl.setAttribute('role', 'img');
  basketEl.innerHTML = walkerCatSvg();
  boardEl.appendChild(basketEl);
  basketBerriesEl = basketEl.querySelector('.bz-berries');
}

function renderBoard(){
  endCellEl.classList.toggle('is-lit', result ? result.hasWon : false);
  bloomByNumber.forEach((el, number) => el.classList.toggle('is-picked', picked.includes(number)));
}

/** 담긴 알을 맞춘다.
    BERRY_SLOTS 는 "그리는 순서"(뒤 줄 먼저)라 담기는 순서(order)와 다르다.
    그래서 몇 개인지가 아니라 어떤 order 가 들어 있는지로 맞춰야 한다 —
    개수만 보고 뒤에 이어 붙이면 같은 알이 두 번 그려지고 바깥쪽 알이 빠진다.
    새로 담긴 알만 새로 만들어지므로 톡 떨어지는 동작이 한 번만 재생된다. */
/** 걷는 고양이 — B-2_01.algorithms_3 의 walkerCatSvg 그대로.
    몸·얼굴은 완료 화면 고양이와 같은 원본 CAT.svg, 바구니 안의 딸기만 줍는 대로 채워진다 */
function walkerCatSvg(w, filterId){
  w = w || 'b2-walk-weave';
  filterId = filterId || 'ppPaperCat';
  return '<svg viewBox="-8 -6 126.83 176" focusable="false" aria-hidden="true">'
    + '<defs>' + weaveDefs(w) + '</defs>'
    + '<g class="mz-body" filter="url(#' + filterId + ')">'
    + '<g fill="none" stroke="' + CAT_COLOR.fur + '" stroke-width="' + CAT_ARM_WIDTH + '" stroke-linecap="round">'
    + '<path d="' + ARM_LEFT + '"/><path d="' + ARM_RIGHT + '"/></g>'
    + '<path d="' + CAT_BODY_PATH + '" fill="' + CAT_COLOR.fur + '"/>'
    + '<ellipse cx="' + CAT_BELLY.cx + '" cy="' + CAT_BELLY.cy + '" rx="' + CAT_BELLY.rx + '" ry="' + CAT_BELLY.ry + '" fill="' + CAT_COLOR.belly + '"/>'
    + '<path d="' + CAT_HEAD_PATH + '" fill="' + CAT_COLOR.fur + '"/>'
    + '<circle cx="' + CAT_EYE_LEFT_WHITE.cx + '" cy="' + CAT_EYE_LEFT_WHITE.cy + '" r="' + CAT_EYE_LEFT_WHITE.r + '" transform="' + CAT_EYE_LEFT_WHITE.t + '" fill="' + CAT_COLOR.eyeWhite + '"/>'
    + '<circle cx="' + CAT_EYE_LEFT_DARK.cx + '" cy="' + CAT_EYE_LEFT_DARK.cy + '" r="' + CAT_EYE_LEFT_DARK.r + '" transform="' + CAT_EYE_LEFT_DARK.t + '" fill="' + CAT_COLOR.eyeDark + '"/>'
    + '<path d="' + CAT_EYE_RIGHT_WHITE_PATH + '" fill="' + CAT_COLOR.eyeWhite + '"/>'
    + '<circle cx="' + CAT_EYE_RIGHT_DARK.cx + '" cy="' + CAT_EYE_RIGHT_DARK.cy + '" r="' + CAT_EYE_RIGHT_DARK.r + '" transform="' + CAT_EYE_RIGHT_DARK.t + '" fill="' + CAT_COLOR.eyeDark + '"/>'
    + '<path d="' + CAT_NOSE_PATH + '" fill="' + CAT_COLOR.nose + '"/>'
    + '<path d="' + CAT_MOUTH_PATH + '" fill="' + CAT_COLOR.eyeDark + '"/>'
    + '<g transform="translate(' + CHEER_BASKET.x + ' ' + CHEER_BASKET.y + ') scale(' + CHEER_BASKET.scale + ')">'
    + '<path d="' + basketBody.d + '" fill="url(#' + w + ')"/>'
    + '<path d="' + basketHandle.d + '" fill="' + basketHandle.fill + '"/>'
    + '<g class="bz-berries"></g>'
    + '<path d="' + basketRim.d + '" fill="' + basketRim.fill + '"/>'
    + '</g>'
    + '<g fill="' + CAT_COLOR.fur + '"><circle cx="27" cy="118" r="' + PAW_R + '"/><circle cx="84" cy="118" r="' + PAW_R + '"/></g>'
    + '</g></svg>';
}

function syncBasketBerries(){
  const SVGNS = 'http://www.w3.org/2000/svg';
  const want = BERRY_SLOTS.filter(s => s.order <= picked.length);
  const have = new Map(Array.from(basketBerriesEl.children, el => [Number(el.dataset.order), el]));

  have.forEach((el, order) => {
    if (!want.some(s => s.order === order)){ el.remove(); have.delete(order); }
  });

  want.forEach((s, i) => {
    let el = have.get(s.order);
    if (!el){
      el = document.createElementNS(SVGNS, 'g');
      el.dataset.order = s.order;
      el.setAttribute('transform', berryPlace(s.x, s.base, s.scale, s.tilt));
      el.innerHTML = '<g class="bz-drop">' + berryArt() + '</g>';
    }
    if (basketBerriesEl.children[i] !== el){
      basketBerriesEl.insertBefore(el, basketBerriesEl.children[i] || null);
    }
  });
}

function renderBasket(){
  const cc = cellCenter(position.column, position.row);
  /* 발밑 = 고랑 세로 중심보다 아래 (고랑 높이의 38%) — 고양이가 고랑 안에 서 있게 */
  const [, , , bh] = bedAt(position.column, position.row);
  basketEl.style.left = (cc.x / STAGE_W) * 100 + '%';
  basketEl.style.top = ((cc.y + bh * .38) / STAGE_H) * 100 + '%';
  basketEl.classList.toggle('is-bumping', isBumping);
  basketEl.setAttribute('aria-label', 'Cat with a basket of ' + picked.length + ' of ' + TOTAL_FLOWERS + ' strawberries');
  syncBasketBerries();
}

/* ---- 명령 레일 -------------------------------------------------------- */
function buildTrack(){
  for (let i = 0; i < MAX_COMMANDS; i += 1){
    const li = document.createElement('li');
    li.className = 'bz-slot';
    trackEl.appendChild(li);
    slotEls.push(li);
  }
}

function renderTrack(){
  slotEls.forEach((li, i) => {
    const d = commands[i];
    li.classList.toggle('is-filled', Boolean(d));
    li.classList.toggle('is-next', i === commands.length && !isRunning);

    if (li.dataset.dir !== (d || '')){
      li.dataset.dir = d || '';
      li.innerHTML = d
        ? '<button class="bz-card" type="button" data-remove="' + i + '" aria-label="'
          + dirLabel(d) + ' — tap to remove">' + arrowImg(d) + '</button>'
        : '';
    }
    const card = li.firstElementChild;
    if (!card) return;
    card.classList.toggle('is-active', isRunning && i === activeIndex);
    card.classList.toggle('is-reached', i < activeIndex);
    card.disabled = isRunning;
  });
}

/* ---- 방향 카드 줄 ----------------------------------------------------- */
function buildPalette(){
  paletteEl.innerHTML = PALETTE_DIRECTIONS.map(d =>
    '<button class="pp-rbtn bz-card" type="button" data-pick="' + d + '" aria-label="'
    + dirLabel(d) + '"><i class="pp-rbtn__face" aria-hidden="true"></i>' + arrowImg(d) + '</button>').join('');
}

function renderPalette(){
  paletteEl.classList.toggle('is-dimmed', Boolean(result));
  paletteEl.querySelectorAll('button').forEach(b => { b.disabled = isRunning; });
}

function renderBanner(){
  const hasWon = result ? result.hasWon : false;
  const n = result ? result.pickedCount : 0;
  /* 다 담았을 때는 완료 화면(§8.3)이 대신하므로 배너를 띄우지 않는다 */
  const showBanner = Boolean(result) && !hasWon;
  bannerEl.className = 'bz-banner' + (showBanner ? ' is-on' : '');
  bannerEl.setAttribute('aria-hidden', showBanner ? 'false' : 'true');
  document.getElementById('bannerCount').innerHTML = n + '<i>/' + TOTAL_FLOWERS + '</i>';
  document.getElementById('bannerTitle').textContent = hasWon
    ? (lang === 'en' ? 'All seven strawberries!' : '딸기 일곱 개를 다 담았어!')
    : (lang === 'en' ? 'Picked ' + n + ' of ' + TOTAL_FLOWERS + ' strawberries.' : '딸기 ' + n + '/' + TOTAL_FLOWERS + '개를 담았어.');
  const btn = document.getElementById('bannerBtn');
  btn.textContent = hasWon
    ? (lang === 'en' ? 'Play again' : '다시 하기')
    : (lang === 'en' ? 'Try again' : '다시 해 보자');
  btn.dataset.act = hasWon ? 'again' : 'retry';
}

/* 컨페티 — 완료 화면이 열릴 때 한 번 터진다 (DESIGN.md §8.3) */
(function buildConfetti(){
  const box = document.getElementById('winConf');
  const C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#EE3A44'];
  let seed = 7;
  const rnd = () => (seed = (seed*1103515245 + 12345) % 2147483648) / 2147483648;
  for (let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2;
    const dist = 180 + rnd() * 250;
    const w = 12 + Math.round(rnd()*12), h = 16 + Math.round(rnd()*18);
    const el = document.createElement('i');
    el.className = 'conf';
    el.style.cssText =
      '--w:calc(' + w + '*var(--u)); --h:calc(' + h + '*var(--u));' +
      '--c:' + C[i % C.length] + '; --r:' + (rnd() < .3 ? '50%' : '2px') + ';' +
      '--dx:calc(' + (Math.cos(ang)*dist).toFixed(0) + '*var(--u));' +
      '--dy:calc(' + (Math.sin(ang)*dist*.9 + 120).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd()*900 - 450) + 'deg;' +
      '--d:' + (rnd()*.22).toFixed(2) + 's';
    box.appendChild(el);
  }
})();

const winEl = document.getElementById('win');

let winSoundPlayed = false;

function renderWin(){
  const hasWon = result ? result.hasWon : false;
  stage.classList.toggle('is-done', hasWon);
  winEl.classList.toggle('is-on', hasWon);

  /* 완료로 들어가는 순간 한 번만 — 팡파르 뒤 3.4s 에 BGM 이 합류한다 (B-2_06 과 동일) */
  if (hasWon && !winSoundPlayed){
    winSoundPlayed = true;
    pauseStageBgm();
    if (soundOn){ SFX.fanfare(); SFX.bgm(true, 3.4); }
  }
  if (!hasWon && winSoundPlayed){
    winSoundPlayed = false;
    SFX.bgm(false);
    startStageBgm();
  }
  winEl.setAttribute('aria-hidden', hasWon ? 'false' : 'true');

  document.getElementById('winRetry').querySelector('span').textContent = t('winRetry');
  document.getElementById('winExit').querySelector('span').textContent  = t('winExit');
}

document.getElementById('winRetry').addEventListener('click', () => { clearCommands(); });
document.getElementById('winExit').addEventListener('click', () => {
  SFX.bgm(false);
  location.href = 'B-2_00.submain.html';
});

function renderAll(){
  renderBoard(); renderBasket(); renderTrack(); renderPalette(); renderBanner(); renderWin();
  playBtn.disabled = isRunning;
  playBtn.classList.toggle('is-ready', !isRunning && commands.length > 0);
  /* 보드 옆 축하 고양이는 쓰지 않는다 — 완료 화면(§8.3)의 큰 고양이가 대신한다 */
  cheerEl.classList.remove('is-on');
}

/* ============================================================
   입력
   ============================================================ */
paletteEl.addEventListener('click', e => {
  const b = e.target.closest('[data-pick]');

});
trackEl.addEventListener('click', e => {
  const b = e.target.closest('[data-remove]');

playBtn.addEventListener('click', play);

/* 다시 해 보자 — 놓은 화살표까지 모두 비우고 처음부터 [stated] */
document.getElementById('bannerBtn').addEventListener('click', clearCommands);

/* 상단 크롬 */
document.getElementById('back').addEventListener('click', () => {
  location.href = 'B-2_00.submain.html';
});
const langBtn = document.getElementById('lang');
const lgEn = document.getElementById('lgEn'), lgKo = document.getElementById('lgKo');
function applyLang(){
  document.documentElement.lang = lang;
  lgEn.className = lang === 'en' ? 'on' : 'off';
  lgKo.className = lang === 'ko' ? 'on' : 'off';
  /* 화면의 글자는 '지금 상태', 스크린리더는 '누르면 될 상태' (DESIGN.md §4.2) */
  langBtn.setAttribute('aria-pressed', lang === 'ko' ? 'true' : 'false');
  langBtn.setAttribute('aria-label', lang === 'en' ? '한글' : 'English');
  document.getElementById('talkTag').textContent = t('tag');
  document.getElementById('talkLine').textContent = t('intro');
  boyEl.setAttribute('aria-label', t('howto'));
  guideEl.setAttribute('aria-label', t('howto'));
  document.getElementById('guideClose').setAttribute('aria-label', t('close'));
  document.getElementById('stepA').textContent = t('guideA');
  document.getElementById('stepB').innerHTML = t('guideB').replace('▶', GTRI);
  renderBanner();
  renderWin();
}
langBtn.addEventListener('click', () => {
  lang = lang === 'en' ? 'ko' : 'en';
  hush();
  applyLang();
  if (briefing) briefSay(); else if (guideOpen()) speak(t('guide')); else sayVoiceOnly(t('intro'));
});
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  if (!soundOn){ hush(); pauseStageBgm(); }
  else if (result && result.hasWon) SFX.bgm(true, 0);
  else startStageBgm();
  /* 음소거 표시 — 종이 테마는 곡선 대신 X (DESIGN.css .pp-ibtn--sound[aria-pressed]) */
  soundBtn.setAttribute('aria-pressed', String(!soundOn));
  soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseStageBgm();
  else startStageBgm();
});

/* ============================================================
   문제 브리핑 — DESIGN.md §8.4 (B-2_05 v2 흐름 · 종이 소년)
   끝나는 조건 3갈래: 음성 종료 / 음성이 시작되지 않으면 7s / 0.9s 이후 아무 데나 탭.
   브리핑 동안 딤이 판·조작부를 덮는다 (상단 버튼은 딤 위).
   ============================================================ */
const boyEl = document.getElementById('boy');
const guideEl = document.getElementById('guide');
function guideOpen(){ return guideEl.classList.contains('on'); }
/* 스텝 문장 속 ▶ — 실행 버튼과 같은 초록 원 + 흰 삼각형 */
const GTRI = '<span class="gtri" aria-hidden="true"><svg viewBox="8 5 16 18"><path d="M11.2 7.6 20.6 14 11.2 20.4z"/></svg></span>';
let briefing = false, briefTm = null, skipArmed = false, voiceOn = false, retried = false;

/* sayId — 다시 읽을 때 취소된 이전 발화의 onend 가 새 브리핑을 끝내지 않게 */
let sayId = 0;
function briefSay(){
  voiceOn = false;
  const id = ++sayId;
  speak(t('intro'), {
    start(){ if (id !== sayId) return; voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 16000); },
    end(){ if (id === sayId && briefing && voiceOn) setTimeout(() => { if (id === sayId) endBriefing(); }, 700); }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false; retried = false;
  if (bubbleTimer !== null) clearTimeout(bubbleTimer);
  bubble.classList.remove('is-on');
  document.body.classList.add('is-briefing');
  setTimeout(() => { skipArmed = true; }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
  briefSay();
}
function endBriefing(){
  if (!briefing) return;
  briefing = false; clearTimeout(briefTm);
  document.body.classList.remove('is-briefing');
}
/* 딤을 누르면 건너뛰기. 자동재생이 막혀 음성이 안 나왔으면 첫 탭은 다시 읽기에 쓴다 */
stage.addEventListener('pointerdown', e => {
  if (!briefing) return;
  if (e.target.closest('.pp-ibtn, .bz-boy, .win')) return;
  if (!voiceOn && !retried && soundOn){
    retried = true;
    clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
    briefSay(); return;
  }
  if (skipArmed) endBriefing();
}, true);
/* 소년을 누르면 플레이 방법(가이드 팝업 §8.1 · §8.5) — 브리핑 중에는 문제를 다시 읽어 준다 [stated].
   실행 중·완료 화면에서는 무시. 열려 있는 동안 팝업이 무대를 덮어 입력이 잠긴다. 닫기 = ✕ 또는 딤 탭 */
function openGuide(){
  if (guideOpen() || isRunning || (result && result.hasWon)) return;
  if (bubbleTimer !== null) clearTimeout(bubbleTimer);
  bubble.classList.remove('is-on');
  guideEl.classList.add('on');
  guideEl.setAttribute('aria-hidden', 'false');
  speak(t('guide'));
}
function closeGuide(){
  if (!guideOpen()) return;
  guideEl.classList.remove('on');
  guideEl.setAttribute('aria-hidden', 'true');
  hush();                                   /* §8.1 — 닫으면 읽던 음성도 끊는다 */
}
boyEl.addEventListener('click', () => {
  if (briefing){ briefSay(); return; }
  openGuide();
});
document.getElementById('guideClose').addEventListener('click', () => { chime('remove'); closeGuide(); });
guideEl.addEventListener('pointerdown', e => { if (e.target === guideEl) closeGuide(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGuide(); });

/* 가이드 데모 — ① 방향 카드(들썩) › 레일 3홈(첫 홈에 노란 화살표가 놓임) ② 실행 › 딸기 3알(차례로 톡) › END */

    + '<g filter="url(#ppPaperBerry)">' + berryArt() + '</g></svg>';

    +   '<svg viewBox="8 5 16 18"><path d="M11.2 7.6 20.6 14 11.2 20.4z"/></svg></span>'
