<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nori Factory · Parent zone</title>
<link rel="stylesheet" href="../fonts/Paperlogy.css">
<link rel="stylesheet" href="../DESIGN.css">
<link rel="stylesheet" href="A_account.css?v=1">
<link rel="stylesheet" href="../RESPONSIVE.css?v=3">
<style>
/* A-3 로컬 — 키패드 · 탭 · 패널 (공통은 A_account.css) */
.kp{width:calc(112 * var(--u)); height:calc(112 * var(--u)); border:0; border-radius:50%; color:#fff; font-size:calc(52 * var(--u)); font-weight:850;
  background:var(--c-primary) var(--pp-tx-felt) center/100% 100% no-repeat; background-blend-mode:overlay; filter:var(--pp-lift-s); transition:transform .12s, background-color .15s}
@media (hover:hover){.kp:hover{background-color:#57318A}}
.kp:active{transform:scale(.9); background-color:var(--c-primary-dark)}
.kp:focus-visible{outline:calc(4 * var(--u)) solid var(--pp-hl); outline-offset:calc(4 * var(--u))}
.kp--clear{background-color:var(--c-accent); display:grid; place-items:center; padding:0}
.kp--clear svg{display:block; width:44%; height:44%; fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round}
.slots{display:flex; gap:calc(22 * var(--u)); justify-content:center}
.slot{width:calc(124 * var(--u)); height:calc(124 * var(--u)); border-radius:calc(30 * var(--u)); background:var(--ac-field); border:calc(5 * var(--u)) solid var(--ac-line);
  display:grid; place-items:center; font-size:calc(72 * var(--u)); font-weight:850; color:var(--c-primary-ink)}
.slot.is-cur{border-color:var(--c-primary)}
.slots.is-bad{animation:acShake .3s}
.q{font-size:calc(84 * var(--u)); font-weight:850; letter-spacing:-.02em; color:var(--pp-ink)}
.q em{font-style:normal; color:var(--c-primary)}
.tabs{display:flex; gap:calc(8 * var(--u)); justify-content:center; width:100%; border-bottom:calc(4 * var(--u)) solid var(--ac-line)}
.tab{position:relative; height:calc(72 * var(--u)); margin-bottom:calc(-4 * var(--u)); padding:0 calc(40 * var(--u)); border:0; background:transparent; color:#7d745c; font-size:calc(32 * var(--u)); font-weight:600; transition:color .15s, transform .12s}
.tab::after{content:""; position:absolute; left:calc(24 * var(--u)); right:calc(24 * var(--u)); bottom:0; height:calc(8 * var(--u)); border-radius:calc(4 * var(--u)); background:var(--c-primary); transform:scaleX(0); transition:transform .18s}
@media (hover:hover){.tab:hover{color:var(--c-primary-ink)}}
.tab[aria-selected="true"]{color:var(--c-primary-ink)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tab:active{transform:scale(.96)}
.tab:focus-visible{outline:calc(4 * var(--u)) solid var(--pp-hl); outline-offset:calc(-4 * var(--u)); border-radius:calc(12 * var(--u))}
.body{flex:1; width:100%; min-height:0; display:flex; flex-direction:column; justify-content:center; text-align:left}
.row{display:flex; gap:calc(48 * var(--u)); align-items:center; width:100%}
.prog{display:flex; align-items:center; gap:calc(22 * var(--u)); font-size:calc(30 * var(--u)); font-weight:800}
.prog span:first-child{flex:0 0 calc(330 * var(--u))}
.bar{flex:1; height:calc(30 * var(--u)); border-radius:calc(15 * var(--u)); background:#E2D8BF; overflow:hidden}
.bar i{display:block; height:100%; border-radius:inherit; background:var(--c-success)}
.prog b{flex:0 0 calc(110 * var(--u)); text-align:right; color:var(--c-primary-ink)}
.ac-chips.sm .ac-chip{height:calc(72 * var(--u)); width:100%; font-size:calc(26 * var(--u)); padding:0 calc(14 * var(--u)); min-width:0; border-radius:calc(26 * var(--u)); white-space:nowrap}
.grid-age{display:grid!important; grid-template-columns:repeat(7,calc(120 * var(--u))); gap:calc(16 * var(--u)); justify-content:start!important}
.grid-theme{display:grid!important; grid-template-columns:repeat(4,1fr); gap:calc(16 * var(--u)); justify-content:stretch!important}
.ac-avs.sm .ac-avb{width:calc(136 * var(--u)); height:calc(136 * var(--u)); padding:0}
</style>
<link rel="stylesheet" href="../MOBILE.css?v=2"><script src="../MOBILE.js?v=2"></script>
</head>
<body class="pp-kit">
<!-- A-3 부모 관리 — 기획: 밀크T 부모님 확인(수식 + 숫자패드) → 엄마아빠방(탭), Lingokids 보호자 설정(나이 · 관심 분야).
     ① 부모 확인(매번 새 수식) → ② 부모 관리: 아이 정보 / 학습 리포트 / 학습 설정 / 환경 설정. 서버 없음: localStorage 목업. DESIGN.md §6 · §8 · §11 -->
<main class="stage theme-paper" id="app">
  <div class="pp-edge-tl"><button class="pp-ibtn pp-ibtn--back" id="back" type="button" data-al="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.1 2.9a2.4 2.4 0 0 0-3.4 0L4.6 11a1.4 1.4 0 0 0 0 2l8.1 8.1a2.4 2.4 0 1 0 3.4-3.4L10.1 12l6-6a2.4 2.4 0 0 0 0-3.1Z"/></svg></button></div>
  <div class="pp-edge-tr"><button class="pp-ibtn pp-ibtn--lang" id="lang" type="button" data-al="lang"><span class="lg"><b class="on">A</b><i class="off">한</i></span></button></div>

  <!-- ① 부모 확인 -->
  <section class="pp-sheet ac-sheet" id="gate" style="width:calc(1040 * var(--u)); height:calc(1000 * var(--u)); gap:calc(20 * var(--u)); justify-content:center">
    <button class="pp-round" id="gateX" type="button" data-al="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h1 class="ac-ttl" data-i="gateTtl"></h1>
    <p class="ac-sub" data-i="gateSub" style="margin:0"></p>
    <div class="q" id="q" aria-live="polite"></div>
    <div class="slots" id="slots"></div>
    <div style="display:flex; flex-wrap:wrap; justify-content:center; width:calc(820 * var(--u)); gap:calc(18 * var(--u)) calc(22 * var(--u)); margin-top:calc(8 * var(--u))" id="pad"></div>
  </section>

  <!-- ② 부모 관리 -->
  <section class="pp-sheet ac-sheet u-hide" id="panel" style="width:calc(1560 * var(--u)); height:calc(1040 * var(--u)); padding:calc(44 * var(--u)) calc(72 * var(--u)) calc(40 * var(--u)); gap:calc(28 * var(--u)); justify-content:flex-start">
    <h1 class="ac-ttl" style="font-size:calc(50 * var(--u))" data-i="zone"></h1>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-t="info" aria-selected="true"></button>
      <button class="tab" role="tab" data-t="report" aria-selected="false"></button>
      <button class="tab" role="tab" data-t="learn" aria-selected="false"></button>
      <button class="tab" role="tab" data-t="settings" aria-selected="false"></button>
    </div>

    <div class="body" id="tInfo" style="justify-content:flex-start; padding-top:calc(12 * var(--u))">
      <div class="row" style="align-items:flex-start; gap:calc(56 * var(--u))">
        <div style="flex:0 0 calc(292 * var(--u))"><span class="ac-lbl" data-i="avatar"></span><div class="ac-avs sm" id="avs" style="display:grid; grid-template-columns:repeat(2,calc(136 * var(--u))); gap:calc(20 * var(--u)); justify-content:start"></div></div>
        <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:calc(36 * var(--u))">
          <div><span class="ac-lbl" data-i="name"></span><input class="ac-field" id="name" type="text" maxlength="12" autocomplete="off" style="height:calc(80 * var(--u))" aria-label="Name"></div>
          <div><span class="ac-lbl" data-i="age"></span><div class="ac-chips sm grid-age" id="ages"></div></div>
          <div><span class="ac-lbl" data-i="interests"></span><div class="ac-chips sm grid-theme" id="themes"></div></div>
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; margin-top:auto; padding-top:calc(24 * var(--u))"><button class="btn-bar ac-cta ac-cta--s" id="save" type="button" style="--bb-w:255; --bb-h:84"><span data-i="save"></span></button></div>
    </div>

    <div class="body u-hide" id="tReport" style="gap:calc(24 * var(--u))">
      <div class="ac-stats">
        <div class="ac-stat"><b id="rDays">0</b><span data-i="days"></span></div>
        <div class="ac-stat"><b id="rStages">0</b><span data-i="stages"></span></div>
        <div class="ac-stat"><b id="rThemes">0</b><span data-i="themes"></span></div>
      </div>
      <div><span class="ac-lbl" data-i="week"></span><div class="ac-week" id="week" style="height:calc(190 * var(--u))"></div></div>
      <div style="display:flex; flex-direction:column; gap:calc(14 * var(--u))"><span class="ac-lbl" style="margin:0" data-i="progress"></span><div id="prog" style="display:flex; flex-direction:column; gap:calc(14 * var(--u))"></div></div>
    </div>

    <div class="body u-hide" id="tLearn" style="gap:calc(40 * var(--u)); justify-content:flex-start; padding-top:calc(30 * var(--u))">
      <div><span class="ac-lbl" data-i="limit"></span><div class="ac-chips" id="limits" style="justify-content:flex-start"></div></div>
      <label class="ac-switch"><input type="checkbox" id="brk"><i></i><span data-i="brk"></span></label>
      <p class="ac-note" data-i="learnNote"></p>
    </div>

    <div class="body u-hide" id="tSettings" style="gap:calc(40 * var(--u)); justify-content:flex-start; padding-top:calc(30 * var(--u))">
      <label class="ac-switch"><input type="checkbox" id="bgm"><i></i><span data-i="music"></span></label>
      <div><span class="ac-lbl" data-i="language"></span><div class="ac-chips" id="langs" style="justify-content:flex-start"><button class="ac-chip" data-v="en" aria-pressed="false">English</button><button class="ac-chip" data-v="ko" aria-pressed="false">한국어</button></div></div>
      <div style="display:flex; gap:calc(20 * var(--u)); flex-wrap:wrap">
        <button class="ac-btn2" id="pwBtn" type="button" data-i="pwChange"></button>
        <button class="ac-btn2" id="logout" type="button" data-i="logout"></button>
      </div>
    </div>
  </section>
</main>


<script src="A_account.js?v=1"></script>
<script>
(() => {
  const D = {
    en:{back:'Back', lang:'Change language', close:'Close', gateTtl:'Parent check', gateSub:'Enter the answer to continue.', correct:"That's correct!", ok:'OK', wrong:'Try again!',
        zone:'Parent zone', tInfo:'Child info', tReport:'Learning report', tLearn:'Learning settings', tSettings:'Settings',
        avatar:'Friend', name:'Name', age:'Age', interests:'Favorite themes', save:'Save', saved:'Saved!', errName:'Please enter a name.', yr:n => String(n),
        days:'Days played', stages:'Stages completed', themes:'Themes picked', week:'This week', progress:'Stage progress (done / 6)',
        limit:'Daily play time', off:'No limit', min:n => n + ' min', brk:'Remind to take a break', learnNote:'Saved on this device. Time limits and reminders are not enforced yet (prototype).',
        music:'Background music', language:'Language', pwChange:'Change password', soon:'Coming soon!', logout:'Log out', dow:['S','M','T','W','T','F','S']},
    ko:{back:'뒤로', lang:'언어 변경', close:'닫기', gateTtl:'부모님 확인', gateSub:'정답을 입력하면 들어갈 수 있어요.', correct:'정답이에요!', ok:'확인', wrong:'다시 해 봐요!',
        zone:'부모 관리', tInfo:'아이 정보', tReport:'학습 리포트', tLearn:'학습 설정', tSettings:'환경 설정',
        avatar:'친구', name:'이름', age:'나이', interests:'좋아하는 주제', save:'저장', saved:'저장했어요!', errName:'이름을 입력해 주세요.', yr:n => n + '살',
        days:'놀이한 날', stages:'완료 스테이지', themes:'고른 주제', week:'이번 주', progress:'스테이지 진행 (완료 / 6)',
        limit:'하루 사용 시간', off:'제한 없음', min:n => n + '분', brk:'쉬어가기 알림', learnNote:'이 기기에 저장돼요. 시간 제한과 알림은 아직 동작하지 않아요(프로토타입).',
        music:'배경음악', language:'언어', pwChange:'비밀번호 변경', soon:'준비 중이에요!', logout:'로그아웃', dow:['일','월','화','수','목','금','토']}
  };
  const $ = id => document.getElementById(id), S = AC.S;
  const u = AC.user();
  if(!u || !u.done){ AC.go('A-1_login.html?stay'); return }
  AC.touchAttend();
  const t = () => D[AC.lang];

  /* ---------- ① 부모 확인 ---------- */
  const rnd = n => Math.floor(Math.random() * n);
  let ans = '', typed = '', locked = false;
  function newQ(){ const x = 100 + 10 * rnd(60), a = 100 + 10 * rnd(Math.floor((990 - x - 100) / 10) + 1);
    ans = String(x); typed = ''; $('q').innerHTML = a + ' + <em>?</em> = ' + (a + x); paintSlots() }
  function paintSlots(){ $('slots').innerHTML = [0, 1, 2].map(i => '<div class="slot' + (i === typed.length ? ' is-cur' : '') + '">' + (typed[i] || '') + '</div>').join('') }
  const pad = $('pad');
  '1234567890'.split('').forEach(d => { const b = document.createElement('button'); b.type = 'button'; b.className = 'kp'; b.textContent = d; b.dataset.d = d; pad.appendChild(b) });
  const clr = document.createElement('button'); clr.type = 'button'; clr.className = 'kp kp--clear'; clr.setAttribute('aria-label', 'Clear');
  clr.innerHTML = '<svg viewBox="-.5 0 24 24" aria-hidden="true"><path d="M20 6H9l-6 6 6 6h11z"/><path d="M12 10l4 4M16 10l-4 4"/></svg>'; pad.appendChild(clr);
  pad.addEventListener('click', e => { const b = e.target.closest('.kp'); if(!b) return;
    if(locked) return;
    if(b === clr){ typed = typed.slice(0, -1); return paintSlots() }
    if(locked || typed.length >= 3) return; typed += b.dataset.d; paintSlots();
    if(typed.length === 3){
      if(typed === ans){ locked = true; AC.toast(t().correct); setTimeout(enter, 1000) }
      else { const s = $('slots'); s.classList.remove('is-bad'); void s.offsetWidth; s.classList.add('is-bad'); AC.toast(t().wrong); setTimeout(newQ, 450) } } });
  document.addEventListener('keydown', e => { if($('gate').classList.contains('u-hide')) return; if(/^[0-9]$/.test(e.key)){ const b = [...pad.children].find(x => x.dataset.d === e.key); b && b.click() } else if(e.key === 'Backspace') clr.click() });
  function enter(){ $('gate').classList.add('u-hide'); $('panel').classList.remove('u-hide'); openTab(initTab) }
  $('gateX').addEventListener('click', () => AC.go('main.html'));
  $('back').addEventListener('click', () => AC.go($('gate').classList.contains('u-hide') ? 'A-2_profile.html' : 'main.html'));

  /* ---------- ② 패널 ---------- */
  const tabs = $('tabs'), TABS = ['info', 'report', 'learn', 'settings'];
  const initTab = (location.search.match(/[?&]tab=(\w+)/) || [])[1] || 'info';
  function openTab(k){ if(TABS.indexOf(k) < 0) k = 'info';
    tabs.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === k ? 'true' : 'false'));
    ['Info', 'Report', 'Learn', 'Settings'].forEach(n => $('t' + n).classList.toggle('u-hide', n.toLowerCase() !== k));
    if(k === 'report') paintReport() }
  tabs.addEventListener('click', e => { const b = e.target.closest('.tab'); if(b) openTab(b.dataset.t) });

  /* 아이 정보 */
  const avs = $('avs'), ages = $('ages'), themes = $('themes'), limits = $('limits'), langs = $('langs');
  AC.AVATARS.forEach(a => { const b = document.createElement('button'); b.type = 'button'; b.className = 'ac-avb'; b.dataset.v = a.id; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', a.id); b.innerHTML = '<img src="' + a.src + '" alt="">'; avs.appendChild(b) });
  for(let n = 3; n <= 9; n++){ const b = document.createElement('button'); b.type = 'button'; b.className = 'ac-chip'; b.dataset.v = n; b.setAttribute('aria-pressed', 'false'); ages.appendChild(b) }
  for(let i = 0; i < 12; i++){ const b = document.createElement('button'); b.type = 'button'; b.className = 'ac-chip'; b.dataset.v = i; b.setAttribute('aria-pressed', 'false'); themes.appendChild(b) }
  [0, 30, 60, 90].forEach(m => { const b = document.createElement('button'); b.type = 'button'; b.className = 'ac-chip'; b.dataset.v = m; b.setAttribute('aria-pressed', 'false'); limits.appendChild(b) });
  AC.chipGroup(avs); AC.chipGroup(ages); AC.chipGroup(themes, {multi:true});
  AC.chipGroup(limits, {onChange:v => { S.set('noriLimit', +v[0] || 0); AC.toast(t().saved) }});
  AC.chipGroup(langs, {onChange:v => { if(v[0]){ AC.setLang(v[0]); paint() } }});
  $('save').addEventListener('click', () => {
    const nm = $('name').value.trim(); if(!nm){ AC.toast(t().errName); $('name').classList.add('is-bad'); return }
    const iv = AC.chipValues(themes).map(Number);
    Object.assign(u, {name:nm, avatar:AC.chipValues(avs)[0] || u.avatar, age:+AC.chipValues(ages)[0] || u.age, interests:iv}); AC.saveUser(u); AC.toast(t().saved); $('save').disabled = true; setTimeout(() => AC.go('A-2_profile.html'), 900) });
  $('name').addEventListener('input', () => $('name').classList.remove('is-bad'));

  /* 리포트 */
  function paintReport(){ const d = t(), st = AC.stages();
    $('rDays').textContent = AC.attendDays(); $('rStages').textContent = AC.stagesTotal(); $('rThemes').textContent = (u.interests || []).length;
    $('week').innerHTML = AC.week().map(w => '<div><i class="' + (w.on ? 'is-on' : '') + '"></i><span>' + d.dow[w.dow] + '</span></div>').join('');
    $('prog').innerHTML = [['b1', 0], ['b2', 1], ['b3', 2]].map(([k, i]) => { const n = Math.min(6, st[k]);
      return '<div class="prog"><span>' + AC.THEMES[AC.lang][i] + '</span><div class="bar"><i style="width:' + (n / 6 * 100) + '%"></i></div><b>' + n + ' / 6</b></div>' }).join('') }

  /* 학습 설정 · 환경 설정 */
  $('brk').addEventListener('change', e => { S.set('noriBreak', e.target.checked); AC.toast(t().saved) });
  $('bgm').addEventListener('change', e => { S.set('noriBgm', e.target.checked ? 'on' : 'off'); AC.toast(t().saved) });
  $('pwBtn').addEventListener('click', () => AC.toast(t().soon));
  $('logout').addEventListener('click', () => { u.remember = false; AC.saveUser(u); AC.signOut(); AC.go('A-1_login.html?stay') });

  function paint(){ const d = t(); AC.applyI18n(D);
    tabs.querySelectorAll('.tab').forEach(b => b.textContent = d[{info:'tInfo', report:'tReport', learn:'tLearn', settings:'tSettings'}[b.dataset.t]]);
    ages.querySelectorAll('.ac-chip').forEach(c => c.textContent = d.yr(c.dataset.v));
    themes.querySelectorAll('.ac-chip').forEach(c => c.textContent = AC.THEMES[AC.lang][+c.dataset.v]);
    limits.querySelectorAll('.ac-chip').forEach(c => c.textContent = +c.dataset.v ? d.min(c.dataset.v) : d.off);
    AC.setChips(langs, AC.lang); if(!$('tReport').classList.contains('u-hide')) paintReport();
    document.title = 'Nori Factory · ' + d.zone }
  AC.bindLang(paint);
  $('name').value = u.name || ''; AC.setChips(avs, u.avatar || 'boy'); AC.setChips(ages, u.age || ''); AC.setChips(themes, u.interests || []);
  AC.setChips(limits, S.get('noriLimit', 0)); $('brk').checked = !!S.get('noriBreak', false); $('bgm').checked = S.get('noriBgm', 'on') !== 'off';
  paint(); newQ();
})();
</script>
</body>
</html>
