<title>Step B-1 · 어린이집과 친구 서브메인</title>
<link rel="stylesheet" href="../fonts/Paperlogy.css" type="text/css">
<link rel="stylesheet" href="../DESIGN.css" type="text/css">
<link rel="preload" href="assets/B-1_00-submain-bg-forest-kindergarten-wide-v2.webp" as="image">
<style>
/* ============================================================
   B-1_00 SUBMAIN — 숲속 어린이집 가는 길 로드맵 (종이 콜라주 테마 DESIGN.md §11 · 시작 체크리스트 §12.2)
   · 한 화면에 스테이지 6개(B-1_01 ~ 06)가 지그재그 길 위에 선다. 페이지 넘김 없음.
   · 배경: assets/B-1_00-submain-bg-forest-kindergarten-wide-v2.webp (2796×1200 와이드 마스터 · Higgsfield 아침빛 시안 C, 어린이집은 좌상단 배경 요소일 뿐 길·빈터와 분리)
     아트보드(1920×1200u) 중앙에 정렬 → --bgw:2796 --bgh:1200 --bgx:-438 --bgy:0 (DESIGN.md §9.1.4)
     빈터 6개는 아트보드 안쪽에 모여 있어 16:10 에서도 잘리지 않는다.
   · 빈터 좌표(아트보드 u, 배경 실측): NODES
   · 진행: 스테이지 완료 화면이 뜨면 localStorage 'ck.b1.sub.done' 에 기록(각 스테이지 끝의 MAP-PROGRESS 스크립트).
     순차 해금 — 앞 스테이지를 끝내야 다음이 열린다. B-2 와 키를 분리했다.
   · 테스트: ?reset (진행 초기화) · ?all (모두 완료) · ?done=3 (앞 3개 완료)
   ============================================================ */
:root{
  --design-w:1920; --design-h:1200;
  --mp-rim:#1E9CC4;          /* 카드 테두리 — 문제판 칸과 같은 파랑 */
  --mp-card:#CFEFF8;         /* 카드 면 — 연한 하늘색 (길의 크림과 구분) */
  --mp-lock:#5D3B2F;         /* 자물쇠 배지 — 나무껍질 */
  /* 종이 결 경로 — url() 은 '쓰는 쪽' 스타일시트 기준으로 풀린다.
     DESIGN.css 규칙(원판 버튼 등)은 DESIGN.css 기본값(--pp-tx-*)을 그대로 쓰고,
     이 화면 <style> 안의 규칙은 B-1_어린이집과친구/ 기준 경로의 아래 로컬 토큰을 쓴다 */
  --sm-grain:url("../_img_png/paper/tx-paper-grain.webp");
  --sm-felt:url("../_img_png/paper/tx-felt.webp");
  --sm-star:url("../_img_png/paper/star-on-flat.svg");
}
.stage.theme-paper{--pp-edge:calc(28 * var(--u))}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#183f3b; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none}
body{display:grid; place-items:center}
img{user-select:none; -webkit-user-drag:none}
button{font:inherit; color:inherit}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u));
  overflow:hidden; isolation:isolate}
.stage__bg{position:absolute; left:0; top:0; width:100%; height:100%; display:block; z-index:0; filter:saturate(1.02)}

/* ---------- 상단 크롬 §11.2 · §11.4 ---------- */
.pp-edge-tl,.pp-edge-tr,.pp-edge-tc{z-index:30}
.pp-ibtn svg{fill:currentColor}
/* 홈 버튼 — 보라 원판(오린 종이 윤곽 --pp-mask-disc) + 크림 아이콘 (map_v2 와 같음) */
.pp-ibtn--home{background:none; color:#FAEFE0; isolation:isolate}
.pp-ibtn--home::before{content:''; position:absolute; inset:0; z-index:-1;
  -webkit-mask:var(--pp-mask-disc) center/100% 100% no-repeat; mask:var(--pp-mask-disc) center/100% 100% no-repeat;
  background:#6C4689}
.pp-ibtn--home::after{content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
  -webkit-mask:var(--pp-mask-disc) center/100% 100% no-repeat; mask:var(--pp-mask-disc) center/100% 100% no-repeat;
  background:var(--sm-grain) center/calc(460 * var(--u)) calc(160 * var(--u)); mix-blend-mode:overlay; opacity:.4}
.pp-ibtn--home svg{width:56%; height:56%}
.pp-ibtn--sound .sound-wave{fill:none; stroke:currentColor; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round}
#btnSay.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 스테이지 노드 ----------
   (--x,--y) = 배경 빈터 중심(아트보드 u). 카드는 빈터 한가운데에 앉고,
   이름표는 길과 겹치지 않도록 위로 솟은 빈터(.is-up)는 위, 아래로 내려앉은 빈터는 아래에 둔다 */
.node{position:absolute; left:calc(var(--x) * var(--u)); top:calc(var(--y) * var(--u));
  width:0; height:0; z-index:10; padding:0; border:0; background:none; cursor:pointer}
.node__glow{position:absolute; left:calc(-170 * var(--u)); top:calc(-170 * var(--u));
  width:calc(340 * var(--u)); height:calc(340 * var(--u)); border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(255,226,140,.85) 0%, rgba(255,214,102,.45) 45%, rgba(255,214,102,0) 72%);
  opacity:0; pointer-events:none}
.node.is-now .node__glow{opacity:1; animation:ppNext 1.7s ease-in-out infinite}
@keyframes ppNext{0%,100%{transform:scale(.94); opacity:.75}50%{transform:scale(1.06); opacity:1}}

/* 카드 — 크림 종이 + 파랑 테두리(문제판 칸과 같은 언어) */
.node__card{position:absolute; left:calc(-70 * var(--u)); top:calc(-70 * var(--u));
  width:calc(140 * var(--u)); height:calc(140 * var(--u));
  filter:var(--pp-lift-m); transition:transform .25s var(--e-out)}
.node__face{position:absolute; inset:0; border-radius:calc(30 * var(--u));
  border:calc(8 * var(--u)) solid var(--mp-rim);
  background-color:var(--mp-card); background-image:var(--sm-grain);
  background-size:calc(460 * var(--u)) calc(160 * var(--u)); background-blend-mode:overlay;
  display:grid; place-items:center; overflow:hidden}
.node__face img{width:84%; height:84%; object-fit:contain; display:block}
.node__face svg{width:82%; height:82%; display:block}
/* crop: 전신 SVG를 상체(위 78%)만 보이게 + 키움. 아래쪽은 살짝 페이드 */
.node__crop{position:absolute; inset:6% 0 5% 0; overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 90%,transparent); mask-image:linear-gradient(#000 82%,transparent)}
.node__face .node__crop img{position:absolute; left:50%; top:0; width:auto; height:132%; transform:translateX(-50%); object-fit:contain}
.node.is-now .node__card{animation:nodeBob 1.6s ease-in-out infinite}
@keyframes nodeBob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(-8 * var(--u)))}}
@media (hover:hover){.node:not(.is-locked):hover .node__card{transform:translateY(calc(-6 * var(--u))) scale(1.05)}}
.node:not(.is-locked):active .node__card{transform:scale(.95)}
.node:focus-visible{outline:none}

/* 번호 배지 §11.6 — 골드 종이 원판 */
.node__num{flex:none; width:calc(44 * var(--u)); height:calc(44 * var(--u)); border-radius:50%;
  display:grid; place-items:center; font-size:calc(26 * var(--u)); font-weight:800; line-height:1; padding-top:calc(2 * var(--u));
  color:var(--pp-gold-ink); background:var(--pp-gold) var(--sm-grain) center/calc(230 * var(--u)) calc(80 * var(--u));
  background-blend-mode:overlay; filter:var(--pp-lift-s)}
/* 완료 별 · 자물쇠 — 카드 모서리에 걸친다 */
.node__star{position:absolute; right:calc(-24 * var(--u)); top:calc(-24 * var(--u)); z-index:2;
  width:calc(62 * var(--u)); height:calc(62 * var(--u));
  background:var(--sm-star) center/100% 100% no-repeat; filter:var(--pp-lift-s);
  opacity:0; transform:scale(.3); transition:opacity .3s, transform .45s var(--e-pop)}
.node.is-done .node__star{opacity:1; transform:none}
.node__lock{position:absolute; right:calc(-18 * var(--u)); bottom:calc(-18 * var(--u)); z-index:2;
  width:calc(56 * var(--u)); height:calc(56 * var(--u)); border-radius:50%;
  display:none; place-items:center; color:#F2DEBB;
  background:var(--mp-lock) var(--sm-grain) center/calc(230 * var(--u)) calc(80 * var(--u)); background-blend-mode:overlay;
  filter:var(--pp-lift-s)}
.node__lock svg{width:50%; height:50%; fill:currentColor}
.node.is-locked .node__lock{display:grid}
.node.is-locked .node__face{filter:saturate(.25) brightness(.92)}
.node.is-locked .node__face img,.node.is-locked .node__face svg{opacity:.55}
.node.is-locked .node__num{filter:saturate(.3) var(--pp-lift-s)}

/* 이름표 */
.node__label{position:absolute; left:50%; top:calc(106 * var(--u)); transform:translateX(calc(-50% + var(--lx,0) * var(--u)));
  display:flex; align-items:center; gap:calc(10 * var(--u));
  padding:calc(6 * var(--u)) calc(20 * var(--u)) calc(6 * var(--u)) calc(6 * var(--u)); white-space:nowrap;
  border-radius:calc(999 * var(--u)); font-size:calc(28 * var(--u)); font-weight:800; line-height:1;
  letter-spacing:.02em; color:var(--pp-ink);
  background:rgba(250,244,230,.94) var(--sm-grain) center/calc(460 * var(--u)) calc(160 * var(--u));
  background-blend-mode:overlay; filter:var(--pp-lift-s)}
.node__name{white-space:pre; word-break:keep-all; line-height:1.1; text-align:left}
.node.is-up .node__label{top:auto; bottom:calc(106 * var(--u))}
.node.is-locked .node__label{opacity:.72}
.node.is-shake .node__card{animation:nodeShake .45s ease}
@keyframes nodeShake{0%,100%{transform:translateX(0)}20%{transform:translateX(calc(-10 * var(--u)))}40%{transform:translateX(calc(10 * var(--u)))}60%{transform:translateX(calc(-6 * var(--u)))}80%{transform:translateX(calc(6 * var(--u)))}}

/* START 말풍선 — 지금 열린 노드 위 */
.go{position:absolute; z-index:20; left:0; top:0; pointer-events:none;
  transform:translate(calc(var(--gx) * var(--u) - 50%), calc(var(--gy) * var(--u) - 100%));
  opacity:0; transition:opacity .25s}
.go.on{opacity:1}
.go__b{position:relative; display:block; padding:calc(14 * var(--u)) calc(32 * var(--u)) calc(12 * var(--u));
  border-radius:calc(30 * var(--u)); font-size:calc(34 * var(--u)); font-weight:800; line-height:1; color:#fff;
  background:#3DA468 var(--sm-felt) 0 0/calc(192 * var(--u)) repeat; background-blend-mode:overlay;
  filter:var(--pp-lift-m); animation:goBounce 1.6s ease-in-out infinite}
/* 꼬리 — 말풍선 본체와 같은 면(색+펠트결)을 쓰고 본체 안으로 3u 겹쳐서, 화면 배율이 소수일 때도 틈이 생기지 않게 한다 */
.go__b::after{content:''; position:absolute; left:50%; top:calc(100% - 3 * var(--u));
  width:calc(36 * var(--u)); height:calc(19 * var(--u)); margin-left:calc(-18 * var(--u));
  background:#3DA468 var(--sm-felt) 0 0/calc(192 * var(--u)) repeat; background-blend-mode:overlay;
  clip-path:polygon(0 0, 100% 0, 50% 100%)}
@keyframes goBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(-8 * var(--u)))}}

/* 종이 소년 — 지금 열린 노드 왼쪽 길 위에 선다 */
.boy{position:absolute; z-index:15; width:calc(120 * var(--u)); height:calc(198 * var(--u));
  left:calc(var(--bx) * var(--u)); top:calc(var(--by) * var(--u)); transform:translate(-50%,-100%);
  transition:left 1.1s var(--e-out), top 1.1s var(--e-out); pointer-events:none; filter:var(--pp-lift-m)}
.boy img{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain; object-position:50% 100%}
.boy.is-walk img{animation:boyWalk .32s ease-in-out infinite}
@keyframes boyWalk{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(calc(-10 * var(--u))) rotate(2deg)}}

.rotate-gate{display:none}
@media (orientation: portrait){
  .stage{display:none}
  .rotate-gate{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:22px; font-weight:800; text-align:center; padding:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>

<main class="stage theme-paper" id="stage">

  <!-- 상단 크롬 §11.2 · §11.4 -->
  <div class="pp-edge-tl">

<!-- TEMP-UNLOCK: 임시 전체 해금 버튼 — 추후 삭제 (이 블록과 'TEMP-UNLOCK' 표시가 붙은 줄을 지우면 원상복구) -->

<script>
/* ---- 스테이지 · 빈터 좌표 (아트보드 1920×1200u, 배경 실측) ---- */
const SHAPES = `<svg viewBox="1 2 100 100" aria-hidden="true">
  <circle cx="30" cy="34" r="20" fill="#E2543D"/>
  <path d="M70 12 92 52H48Z" fill="#E7B23C"/>
  <rect x="14" y="58" width="34" height="34" rx="4" fill="#1E9CC4"/>
  <path d="M72 58l6 12 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2Z" fill="#3DA468"/></svg>`;
/* up: 위로 솟은 빈터 — 이름표를 위에 둔다 (아래 길과 겹침 방지) */
const NODES = [
  {id:'algorithms',    x:188,  y:690, up:false, href:'B-1_01.algorithms.html',    icon:'../_img_svg/B_1/img_버스와아이들.svg', ko:'알고리즘', en:'ALGORITHMS'},
  {id:'sequencing',    x:497,  y:537, up:true,  gdx:175, crop:true, href:'B-1_02.sequencing.html',    icon:'../_img_svg/B_1/seq_3.svg',           ko:'순서',     en:'SEQUENCING'},
  {id:'decomposition', x:817,  y:707, up:false, href:'B-1_03.decomposition.html', svg:SHAPES,                                ko:'분해',     en:'DECOMPOSITION'},
  {id:'branching',     x:1130, y:549, up:true,  href:'B-1_04.branching.html',     icon:'../_img_svg/B_1/bran_1.svg',          ko:'분기',     en:'BRANCHING'},
  {id:'abstraction',   x:1443, y:728, up:false, href:'B-1_05.abstraction.html',   icon:'../_img_svg/B_1/abs_art_color.svg',         ko:'추상화',   en:'ABSTRACTION'},
  {id:'pattern',       x:1756, y:606, up:true,  href:'B-1_06.pattern.html',       icon:'../_img_svg/B_1/pat_puzzle.svg',         ko:'패턴 인식', en:'PATTERN\nRECOGNITION'}
];
const BOY_DX = -150, BOY_DY = 96, BOY_MIN_X = 62;   /* 노드 기준 소년 발 위치 (첫 노드는 화면 밖으로 안 나가게) */
const GO_DY_DOWN = -112, GO_DY_UP = -172;           /* START 말풍선 꼬리 끝 (이름표가 위에 있는 노드는 더 높게) */
const HOME = '../B_0_main/main.html';

const K_DONE = 'ck.b1.sub.done', K_JUST = 'ck.b1.sub.just', K_LANG = 'ck.lang';
const K_UNLOCK = 'ck.dev.unlockAll';            /* TEMP-UNLOCK */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};

let devUnlock = !!store.get(K_UNLOCK, false);   /* TEMP-UNLOCK */

/* 테스트 파라미터 */
const qs = new URLSearchParams(location.search);
if(qs.has('reset')) store.set(K_DONE, []);
if(qs.has('all'))   store.set(K_DONE, NODES.map(n => n.id));
if(qs.has('done'))  store.set(K_DONE, NODES.slice(0, +qs.get('done') || 0).map(n => n.id));

let lang = store.get(K_LANG, 'en') === 'ko' ? 'ko' : 'en';
let muted = false;
const L = {
  en:{intro:'Wow, let’s go to the forest kindergarten! Start with stage one!', next:n=>`Great job! Now let’s go to ${n}.`,
      locked:'Finish the stage before this one first!', win:'Woohoo! We made it to the kindergarten! You cleared every stage! Great job!', go:'START', on:'Sound on', off:'Sound off'},
  ko:{intro:'우와, 숲속 어린이집에 가 보자! 1번부터 시작해 줘!', next:n=>`잘했어! 이제 ${n}(으)로 가 보자.`,
      locked:'앞 스테이지를 먼저 해결해 보자!', win:'야호! 어린이집에 도착했어! 모든 스테이지를 해결했어, 정말 잘했다!', go:'시작!', on:'소리 켜기', off:'소리 끄기'}
};

/* ---- 진행 ---- */
function doneSet(){ return new Set(store.get(K_DONE, [])) }
function progress(){                     /* 앞에서부터 연속으로 완료한 개수 */
  const d = doneSet(); let i = 0;
  while(i < NODES.length && d.has(NODES[i].id)) i++;
  return i;
}

/* ---- 렌더 ---- */
const nodesEl = document.getElementById('nodes');
nodesEl.innerHTML = NODES.map((n, i) => `
  <button class="node${n.up ? ' is-up' : ''}" type="button" data-i="${i}" style="--x:${n.x};--y:${n.y};--lx:${n.lx||0}" aria-label="${i+1}. ${n.en.replace('\n',' ')}">
    <span class="node__glow"></span>
    <span class="node__card">
      <span class="node__face">${n.svg || (n.crop ? `<span class="node__crop"><img alt="" src="${n.icon}"></span>` : `<img alt="" src="${n.icon}">`)}</span>
      <span class="node__star"></span>
      <span class="node__lock"><svg viewBox="0 0 24 24"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h.5A2.5 2.5 0 0 1 20 12.5v7A2.5 2.5 0 0 1 17.5 22h-11A2.5 2.5 0 0 1 4 19.5v-7A2.5 2.5 0 0 1 6.5 10Zm2.6 0h4.8V7.5a2.4 2.4 0 0 0-4.8 0Z"/></svg></span>
    </span>
    <span class="node__label"><span class="node__num">${i+1}</span><span class="node__name"></span></span>
  </button>`).join('');
const nodeEls = [...nodesEl.querySelectorAll('.node')];

const boy = document.getElementById('boy'), go = document.getElementById('go'), goText = document.getElementById('goText');

function placeBoy(i){
  const n = NODES[Math.min(i, NODES.length - 1)];
  boy.style.setProperty('--bx', Math.max(BOY_MIN_X, n.x + BOY_DX));
  boy.style.setProperty('--by', n.y + BOY_DY);
}
function placeGo(i){
  if(i !== 0){ go.classList.remove('on'); return }                   /* START 말풍선은 1번 문제를 풀기 전(처음)에만 */
  go.style.setProperty('--gx', NODES[i].x + (NODES[i].gdx || 0));   /* gdx: 말풍선을 옆으로 비껴 배경의 어린이집을 가리지 않게 */
  go.style.setProperty('--gy', NODES[i].y + (NODES[i].up ? GO_DY_UP : GO_DY_DOWN));
  go.classList.add('on');
}
function render(p){
  const d = doneSet();
  nodeEls.forEach((el, i) => {
    el.classList.toggle('is-done', d.has(NODES[i].id) && i < p + 1);
    el.classList.toggle('is-now', i === p);
    el.classList.toggle('is-locked', i > p && !devUnlock);   /* TEMP-UNLOCK: 원래 i > p */
    el.querySelector('.node__name').textContent = NODES[i][lang];   /* 노드 타이틀은 선택한 언어를 따른다(ko=한글 · en=영어) */
  });
  goText.textContent = L[lang].go;
  placeGo(p);
}

/* ---- 음성 — DESIGN.md §1 「생성 보이스 레지스트리」·「한국어 음성」: Pixie 녹음본(ko=MiniMax, en=Seed Audio) → 못 읽으면 기기 TTS → 자동재생 차단이면 첫 탭에서 녹음본 재생 ---- */
const btnSay = document.getElementById('btnSay');
const VOICE_DIR = '../audio/voice-q/';
const voiceKey = text => ['intro', 'locked', 'win'].find(k => L[lang][k] === text);
let voiceEl = null, pendingTap = null;
function stopVoice(){
  pendingTap = null;
  if(voiceEl){ const v = voiceEl; voiceEl = null; const t0 = performance.now();      /* 60ms 페이드 후 정지(틱 방지) */
    const fade = () => { const k = 1 - (performance.now() - t0) / 60; if(k > 0){ v.volume = Math.max(0, k); requestAnimationFrame(fade) } else v.pause() };
    fade(); }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  btnSay.classList.remove('is-playing');
}
function speakTTS(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'ko' ? 'ko-KR' : 'en-US'; u.rate = .95; u.pitch = 1.15;
  u.onstart = () => btnSay.classList.add('is-playing');
  u.onend = u.onerror = () => btnSay.classList.remove('is-playing');
  speechSynthesis.speak(u);
}
function say(text){
  if(muted) return;
  stopVoice();
  const key = voiceKey(text);
  if(!key){ speakTTS(text); return }
  const v = new Audio(`${VOICE_DIR}q_b1_00_${key}_${lang}.mp3`);
  voiceEl = v;
  v.onplay = () => btnSay.classList.add('is-playing');
  v.onended = () => { btnSay.classList.remove('is-playing'); if(voiceEl === v) voiceEl = null };
  v.onerror = () => { if(voiceEl === v){ voiceEl = null; speakTTS(text) } };      /* 파일이 없으면 같은 문장을 TTS 로 */
  const pr = v.play();
  if(pr && pr.catch) pr.catch(err => {
    if(err && err.name === 'NotAllowedError' && voiceEl === v){                    /* 자동재생 차단 → 첫 탭에서 녹음본 다시 */
      pendingTap = () => { if(voiceEl === v && !muted) v.play().catch(() => {}) } }
  });
}
addEventListener('pointerdown', () => { const f = pendingTap; pendingTap = null; if(f) f() }, {passive:true, capture:true});

/* ---- 입력 ---- */
/* 공통 로딩 화면(../loading.html, LOADING.md) 호출 — main.html 과 같은 방식 */
function loadingUrl(href, title){
  const loader = new URL('../loading.html', location.href), target = new URL(href, location.href);
  loader.searchParams.set('to', target.href); loader.searchParams.set('title', title || ''); loader.searchParams.set('lang', lang);
  return loader.href;
}
let leaving = false;
nodeEls.forEach((el, i) => el.addEventListener('click', () => {
  if(leaving) return;
  const p = progress();
  if(i > p && !devUnlock){   /* TEMP-UNLOCK: 원래 i > p */
    el.classList.remove('is-shake'); void el.offsetWidth; el.classList.add('is-shake');
    say(L[lang].locked); return;
  }
  leaving = true; stopVoice();
  el.querySelector('.node__card').style.transform = `translateY(calc(-10 * var(--u))) scale(1.12)`;
  setTimeout(() => { location.href = loadingUrl(NODES[i].href, NODES[i].en.replace('\n', ' ')) }, 330);
}));
addEventListener('pageshow', () => {
  leaving = false;
  nodeEls.forEach(el => el.querySelector('.node__card').style.transform = '');
});

document.getElementById('btnBack').addEventListener('click', () => { location.href = HOME });
document.getElementById('btnLang').addEventListener('click', e => {
  lang = lang === 'en' ? 'ko' : 'en'; store.set(K_LANG, lang);
  document.getElementById('lgEn').className = lang === 'en' ? 'on' : 'off';
  document.getElementById('lgKo').className = lang === 'ko' ? 'on' : 'off';
  e.currentTarget.setAttribute('aria-label', lang === 'en' ? '한국어' : 'English');
  const p = progress(); render(p); say(p >= NODES.length ? L[lang].win : L[lang].intro);
});
btnSay.addEventListener('click', () => {
  muted = !muted;
  btnSay.setAttribute('aria-pressed', muted);
  btnSay.setAttribute('aria-label', L[lang][muted ? 'on' : 'off']);
  if(muted) stopVoice(); else say(L[lang].intro);
});

/* TEMP-UNLOCK — 왼쪽 아래 ALL 버튼: 잠금만 풀고 완료 기록(ck.b?.sub.done)은 건드리지 않는다. 세 테마 공용 키 */
(() => { const b = document.getElementById('tmpUnlock'); b.setAttribute('aria-pressed', devUnlock);
  b.addEventListener('click', () => { devUnlock = !devUnlock; store.set(K_UNLOCK, devUnlock); b.setAttribute('aria-pressed', devUnlock); render(progress()) }) })();

/* ---- 시작 ---- */
(function init(){
  document.getElementById('lgEn').className = lang === 'en' ? 'on' : 'off';
  document.getElementById('lgKo').className = lang === 'ko' ? 'on' : 'off';
  const p = progress();
  const just = store.get(K_JUST, null); store.del(K_JUST);
  const ji = NODES.findIndex(n => n.id === just);
  if(ji >= 0 && ji === p - 1){
    /* 방금 끝낸 스테이지에서 출발 → 다음 노드로 걸어간다 */
    boy.style.transition = 'none'; placeBoy(ji); render(p - 1);
    nodeEls[ji].classList.add('is-done'); go.classList.remove('on');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      boy.style.transition = '';
      setTimeout(() => {
        if(p >= NODES.length){ render(p); say(L[lang].win); return }
        boy.classList.add('is-walk'); placeBoy(p);
        setTimeout(() => { boy.classList.remove('is-walk'); render(p); say(L[lang].next(NODES[p][lang])) }, 1100);
      }, 450);
    }));
  }else{
    placeBoy(p); render(p);
    /* 다시 들어왔을 때는 환영 음성만 — 전부 끝낸 뒤에는 완료 음성 */
    setTimeout(() => say(p >= NODES.length ? L[lang].win : L[lang].intro), 600);
  }
})();
</script>
<script>
/* 서브메인 BGM — 숲속 어린이집 곡(submain-forest-kindergarten-loop). 진입 즉시 재생 시도(막히면 첫 입력부터), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
(() => {
  const a = new Audio('../audio/bgm/submain-forest-kindergarten-loop.mp3');
  a.loop = true; a.preload = 'auto'; a.volume = .22;
  const $ = id => document.getElementById(id);
  const muted = () => { const b = $('btnSay') || document.querySelector('button[class*="soundButton"]'); return !!b && b.getAttribute('aria-pressed') === 'true' };
  const done = () => document.body.classList.contains('is-done') || !!document.querySelector('#win.on, [class*="_win_"]');
  let armed = true; /* 메인→로딩→서브메인으로 넘어온 경우 같은 사이트 상호작용이 있어 바로 재생을 시도 — 브라우저가 막으면 첫 입력에서 재생 */
  const sync = () => {
    if(!armed) return;
    if(muted() || done() || document.hidden) a.pause();
    else if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}) }
  };
  let raf = 0; const soon = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; sync() }) };
  ['pointerdown','keydown'].forEach(t => window.addEventListener(t, () => { armed = true; sync() }, {passive:true}));
  document.addEventListener('visibilitychange', sync);
  addEventListener('pageshow', sync); sync();
  new MutationObserver(soon).observe(document.body, {attributes:true, attributeFilter:['class','aria-pressed'], childList:true, subtree:true});
})();
</script>
</body>
