<style>
/* ============================================================
   B-1_02 SEQUENCING — 아침 준비 순서 (Textured Cut-Paper Storybook Theater)
   DESIGN.md §11(종이 콜라주) · §8.3 완료 · §8.4 브리핑 · §8.5/11.9 가이드 · §9.1.4 반응형
   배경: B-2 봄 숲 배경과 한 세트로 보이는 고해상도 나무집 칠판(B-1_02-sequencing-bg-v20-lighter-wall, 2796×1200) — 소품 간소화 · 화분 제거 · 밝은 갈색 벽면
   카드 그림: img_svg/B_1/seq_1~8.svg 를 종이 오브젝트(펠트 결 overlay, B-2_05 v2 방식)로 사용
   캐릭터: 워크시트의 해
   공통 토큰·버튼은 DESIGN.css(.theme-paper · .pp-*), 반응형은 RESPONSIVE.css
   ============================================================ */
:root{
  --b1-ink:#1F2937;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#E9C48E; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent}
body{display:grid; place-items:center; word-break:keep-all}
button{font:inherit; color:inherit}
img{user-select:none; -webkit-user-drag:none}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u)); isolation:isolate}
.stage__bg{position:absolute; left:0; top:0; width:calc(1920*var(--u)); height:calc(1200*var(--u));
  max-width:none; display:block; z-index:0; image-rendering:auto;
  filter:saturate(1.05)}
.stage__bg--foliage{pointer-events:none; filter:saturate(1.15);
  -webkit-mask-image:
    radial-gradient(ellipse 6% 11% at 18% 0%, #000 0 38%, transparent 85%),
    radial-gradient(ellipse 6% 11% at 82% 0%, #000 0 38%, transparent 85%);
  mask-image:
    radial-gradient(ellipse 6% 11% at 18% 0%, #000 0 38%, transparent 85%),
    radial-gradient(ellipse 6% 11% at 82% 0%, #000 0 38%, transparent 85%)}
.stage__bg--board{z-index:1; pointer-events:none; transform:scaleY(1.055); transform-origin:50% 50%;
  clip-path:inset(calc(158*var(--u)) calc(570*var(--u)) calc(148*var(--u)) calc(610*var(--u)) round calc(86*var(--u)))}
.stage__fill{position:fixed; inset:0; width:100%; height:100%; object-fit:fill; z-index:-1; pointer-events:none}

/* ---------- 상단 크롬 (§11.4 · RESPONSIVE .pp-edge-*) ---------- */
.pp-ibtn svg{fill:currentColor; stroke:none}
.pp-ibtn--sound .sound-wave{fill:none; stroke:currentColor; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round}
.pp-ibtn.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.pp-edge-tl>.pp-ibtn,.pp-edge-tr>.pp-ibtn{flex:none}

/* ---------- 문제판 — 칠판 안쪽 4×2 + 트레이 (첨부 원본 시안 ×1.46(높이 1200u 맞춤, 가공 없음): 칠판 안쪽 x 197~1723 · y 182~1015u, 문제판+트레이 영역을 안쪽 중앙에) ---------- */
.board{position:absolute; z-index:6; left:calc(352*var(--u)); top:calc(232*var(--u));
  width:calc(1215*var(--u)); height:calc(587*var(--u));
  display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr);
  gap:calc(31*var(--u)) calc(41*var(--u))}
.slot__empty{position:absolute; inset:0; pointer-events:none;
  /* 분필 라인 — B-1_04 와 같은 방식: 손으로 그린 곡선 path + #chalkF 필터 (JS chalkPath) */
  transition:opacity .2s var(--e-out)}
.slot__empty svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.slot__empty .ch1{fill:none; stroke:#f6f3e8; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; opacity:.95; filter:url(#chalkF)}
.slot.is-filled .slot__empty{opacity:0}
.slot__cell{position:absolute; inset:0; opacity:0; transform:scale(.86); transform-origin:50% 60%;
  transition:opacity .22s var(--e-out), transform .34s var(--e-pop)}
.slot.is-filled .slot__cell{opacity:1; transform:none}
.slot.is-landing .slot__cell{animation:landSquash .42s var(--e-out)}
@keyframes landSquash{0%{transform:scale(.98,.86)}45%{transform:scale(.95,1)}100%{transform:none}}
.slot__cell.pp-cell{background:#ebdcc0 url("../img_png/paper/tx-felt.webp") 0 0/calc(96*var(--u)) repeat; background-blend-mode:soft-light}
.slot__cell .obj{position:absolute; left:50%; top:50%; width:76%; height:72%; transform:translate(-50%,-50%)}
/* 번호 배지 — 골드 종이 원판 + 들뜸 그림자(§11.6) */
.badge{position:absolute; z-index:8; left:calc(-16*var(--u)); top:calc(-16*var(--u));
  width:calc(58*var(--u)); height:calc(58*var(--u)); border-radius:50%; pointer-events:none;
  display:grid; place-items:center; font-size:calc(28*var(--u)); font-weight:900; line-height:1; color:var(--pp-gold-ink);
  background:var(--pp-gold) url("../img_png/paper/tx-paper-grain.webp") center/calc(460*var(--u)) calc(160*var(--u));   /* 인라인 <style> 안이라 문서 기준 상대경로 */
  background-blend-mode:overlay; padding-top:calc(2*var(--u))}

/* 종이 오브젝트 (B-2_05 v2 방식) — 그림 + 같은 모양으로 오린 펠트 결(overlay).
   결은 무채색이라 색은 원본 그대로. 들뜸 그림자는 mask 바깥 층(.obj)에 건다 (§11.3).
   인라인 <style> 이라 텍스처 경로는 문서 기준 상대경로 */
.obj{position:relative; display:block; isolation:isolate; filter:var(--pp-lift-s)}
.obj > img,.pp-card .obj > img{position:absolute; inset:0; width:100%; height:100%; max-width:none; max-height:none;
  display:block; object-fit:contain; pointer-events:none}
.obj__tx{position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.95;
  background:url("../img_png/paper/tx-felt.webp") 0 0/calc(96*var(--u)) repeat;
  -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat}
/* 놓인 카드를 누르면 뜨는 그림+문장 팝업 */
.slot.is-filled{cursor:pointer}
.peek-sheet{will-change:transform; width:calc(880*var(--u)); height:calc(760*var(--u)); padding:calc(50*var(--u)) calc(60*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(30*var(--u)); text-align:center;
  transform:scale(.88); transition:transform var(--t-slow) var(--e-pop)}
.guide.on .peek-sheet{transform:none}
.peek__art{display:block; position:relative; width:calc(430*var(--u)); height:calc(460*var(--u))}
.peek__art .obj{width:100%; height:100%}
.peek__line{margin:0; font-weight:800; line-height:1.25; color:var(--pp-ink); font-size:calc(58*var(--u)); word-break:keep-all}
html[lang="en"] .peek__line{font-size:calc(52*var(--u))}

/* ---------- 카드 트레이 — 칠판 아래 줄 ---------- */
.tray{position:absolute; z-index:10; top:calc(846*var(--u)); left:calc(352*var(--u)); width:calc(1215*var(--u));
  display:grid; grid-template-columns:repeat(7,1fr); gap:calc(12*var(--u))}
.tray-card{width:100%; height:calc(152*var(--u)); flex:none; filter:var(--pp-lift-m)}
.tray-card .obj{width:70%; height:76%}
.tray-card.is-wrong{animation:cardShake .42s var(--e-out)}
@keyframes cardShake{0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(calc(-16*var(--u))) rotate(-4deg)}
  45%{transform:translateX(calc(14*var(--u))) rotate(3.5deg)}
  70%{transform:translateX(calc(-8*var(--u))) rotate(-2deg)}}
.tray-card.is-done{visibility:hidden; pointer-events:none}
.fly{position:fixed; z-index:80; margin:0; pointer-events:none; filter:var(--pp-lift-m)}

/* ---------- 반짝이 튀기기 ---------- */
.spark-bit{position:absolute; z-index:28; width:var(--s); height:var(--s);
  background:var(--c); pointer-events:none; border-radius:50%;
  animation:bitFly .78s var(--e-out) forwards}
.spark-bit.star{border-radius:0;
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes bitFly{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
  15%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05) rotate(var(--rot))}}

/* ---------- 해 캐릭터 ----------
   .sun-slot 이 자리·브리핑 이동(transform)을, 안쪽 .sun 이 반응 모션(transform)을 맡는다 (§8.1.1) */
.sun-slot{position:absolute; z-index:14; left:calc(50.7*var(--u)); bottom:calc(20.5*var(--u));
  width:calc(284.8*var(--u)); height:calc(470.2*var(--u)); transform-origin:50% 100%;
  transition:transform .62s var(--e-out)}
.sun{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; filter:var(--pp-lift-m);
  animation:sunIdle 6s ease-in-out infinite}
.sun .obj{width:100%; height:100%; filter:none}
.sun > img{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain; object-position:50% 100%; pointer-events:none}
.sun:focus-visible{outline:none}
@keyframes sunIdle{0%,50%,100%{transform:none}
  25%{transform:translateY(calc(-5*var(--u))) rotate(1deg)}
  75%{transform:translateY(calc(-5*var(--u))) rotate(-1deg)}}
.sun.is-cheer{animation:sunHop .9s var(--e-out) 2}
@keyframes sunHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-34*var(--u))) rotate(-4deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-16*var(--u))) rotate(3deg)}}
.sun.is-huh{animation:sunHuh .8s var(--e-out)}
@keyframes sunHuh{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}60%{transform:rotate(7deg)}85%{transform:rotate(-3deg)}}

/* ---------- 브리핑 (§8.4) ----------
   설명 캐릭터가 화면 가운데 아래로 나와 커지고(바닥 -18u), 93u 위에 종이 말풍선이 뜬다.
   설명 캐릭터(img_schoolboy.svg) — B-2_02.sequencing_v4 와 같은 크기·위치: 박스 x 50.7 · 바닥 20.5 · 284.8×470.2u, 브리핑 translateX 767u · ×1.18 → 머리 top ≈ 625u → 말풍선 top = 625 − 329 = 296u */
.veil{position:absolute; inset:0; z-index:12; background:var(--pp-veil);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
body.is-briefing .sun-slot{z-index:16;
  transform:translateX(calc(767*var(--u))) scale(1.18)}
body.is-briefing .sun{animation:sunTalk 1.5s var(--e-out) .5s infinite}
@keyframes sunTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-8*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}
.talk{top:calc(296*var(--u)); z-index:17; opacity:0; visibility:hidden;
  transform:translateY(calc(14*var(--u)));
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow), transform var(--t-slow) var(--e-out)}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none; transition-delay:.28s}

/* ---------- 가이드 팝업 (§8.5 · §11.9) ---------- */
.guide{background:var(--pp-scrim)}
.guide-sheet{width:calc(1200*var(--u)); height:calc(700*var(--u)); padding:calc(54*var(--u)) calc(60*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(26*var(--u)); text-align:center;
  transform:scale(.88); transition:transform var(--t-slow) var(--e-pop)}
.guide.on .guide-sheet{transform:none}
.gstep{display:flex; align-items:center; justify-content:center; gap:calc(18*var(--u));
  font-size:calc(44*var(--u)); font-weight:800; color:var(--pp-ink)}
.gstep i{flex:none; display:grid; place-items:center; width:calc(64*var(--u)); height:calc(64*var(--u));
  border-radius:50%; background:var(--pp-gold); color:var(--pp-gold-ink); font-style:normal; font-size:calc(37*var(--u))}
.gstep b{white-space:nowrap}
.gdemo,.gtrack{display:flex; justify-content:center; align-items:center; gap:calc(16*var(--u))}
.gdemo .mini{width:calc(138*var(--u)); height:calc(129*var(--u)); flex:none; filter:var(--pp-lift-s)}
.gdemo .mini .obj{width:70%; height:76%; filter:none}
.gdemo .mini.pick{animation:gPick 2.4s var(--e-out) infinite}
@keyframes gPick{0%,60%,100%{transform:translateY(0)}20%,45%{transform:translateY(calc(-20*var(--u)))}}
.garrow{width:calc(44*var(--u)); fill:var(--pp-teal)}
.gtrack > span{position:relative; width:calc(170*var(--u)); height:calc(140*var(--u)); border-radius:calc(20*var(--u));
  background:rgba(31,41,55,.12); display:grid; place-items:center}
.gtrack > span.filled{background:#ebdcc0 url("../img_png/paper/tx-felt.webp") 0 0/calc(96*var(--u)) repeat; background-blend-mode:soft-light}
.gtrack > span.filled{box-shadow:inset 0 0 0 calc(3*var(--u)) #c4a674}
.gtrack > span.filled .obj{width:62%; height:82%}
.gtrack > span.lit{background:radial-gradient(ellipse at 50% 45%,#FFEBB0 0%,#FFD97A 100%);
  box-shadow:inset 0 0 0 calc(3*var(--u)) #EDB94A, 0 0 calc(10*var(--u)) calc(1*var(--u)) rgba(255,200,80,.30);
  animation:litPulse 1.7s ease-in-out infinite}
@keyframes litPulse{0%,100%{opacity:.7}50%{opacity:1}}

/* ---------- 완료 화면 (§8.3) ---------- */
.win{z-index:60; display:flex; align-items:center; justify-content:center; background:var(--pp-veil);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(900*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u))); transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(180*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg, rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%); mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle, rgba(255,232,148,.85) 0%, rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}
.win__art{position:relative; z-index:2; width:calc(330*var(--u)); height:calc(403*var(--u)); display:block;
  filter:drop-shadow(0 calc(12*var(--u)) calc(20*var(--u)) rgba(80,40,10,.28))}
.win__art .obj{width:100%; height:100%; filter:none}
.win.on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3.5%) rotate(-1.5deg)}60%{transform:translateY(-1.5%) rotate(1.5deg)}}
.win__stack .win__actions{position:relative; z-index:3}
.win__sparks{position:absolute; left:50%; top:calc(-76*var(--u)); transform:translateX(-50%);
  width:calc(600*var(--u)); height:calc(512*var(--u)); z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s);
  background:var(--c); opacity:0; animation:twinkle 2.4s var(--e-out) infinite; animation-delay:var(--d);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}35%{opacity:1; transform:scale(1) rotate(35deg)}70%{opacity:.35; transform:scale(.75) rotate(70deg)}}
.win__confetti{position:absolute; left:50%; top:calc(-100*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h); background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}12%{opacity:1}70%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="chalkF" x="-4%" y="-6%" width="108%" height="112%" color-interpolation-filters="sRGB">

<feDisplacementMap in="SourceGraphic" in2="w" scale="2.5" xChannelSelector="R" yChannelSelector="G" result="d"/>

<feComposite in="d" in2="ga" operator="in" result="e"/>
<feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="21" result="b"/>

</filter></defs></svg>

  <img class="stage__bg stage__bg--foliage" aria-hidden="true" alt="" src="assets/B-1_02-sequencing-bg-v29-clean-main-paper.png" style="--bgw:2796;--bgh:1200;--bgx:-438;--bgy:0">

<script>
(() => {
'use strict';

const MUTE = {on:false};
const SFX = (() => {
  let C = null, bgmBus = null, bgmOn = false, bgmAt = 0, bgmTm = null, noiseBuf = null;
  const ac = () => {
    if(MUTE.on) return null;           /* 음소거 중에는 새 소리를 만들지 않는다 */
    if(!C){
      try{ const AC = window.AudioContext || window.webkitAudioContext; C = new AC() }catch(e){ return null }
    }
    if(C.state === 'suspended') C.resume();
    return C;
  };
  function voice(freq, at, dur, o){
    o = o || {}; const c = ac(); if(!c) return;
    const t0 = c.currentTime + at, bus = o.bus || c.destination;
    const g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(o.cut || 5200, t0);
    const peak = o.gain || .12, atk = o.atk || .006;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    const osc = (type, mul, det) => {
      const s = c.createOscillator();
      s.type = type; s.frequency.setValueAtTime(freq * mul, t0);
      if(det) s.detune.setValueAtTime(det, t0);
      s.connect(g); s.start(t0); s.stop(t0 + dur + .04);
    };
    osc(o.type || 'sine', 1, 0);
    if(o.h2) osc('sine', 2, 4);
    g.connect(f); f.connect(bus);
  }
  const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));
  function swoosh(at, dur, f0, f1, gain){
    const c = ac(); if(!c) return;
    if(!noiseBuf){
      const n = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  }
  /* 오답 — 짧은 타격 뒤 음정이 크게 내려가는 두꺼운 경고음 */
  function wrongHit(){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime;
    const master = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.setValueAtTime(1.25, t0);
    lp.frequency.setValueAtTime(1800, t0);
    lp.frequency.exponentialRampToValueAtTime(620, t0 + .44);
    master.gain.setValueAtTime(.0001, t0);
    master.gain.exponentialRampToValueAtTime(.16, t0 + .008);
    master.gain.setValueAtTime(.14, t0 + .09);
    master.gain.exponentialRampToValueAtTime(.0001, t0 + .46);
    [
      {type:'square',   from:330, to:185, det:-5},
      {type:'sawtooth', from:220, to:110, det: 5}
    ].forEach(v => {
      const o = c.createOscillator();
      o.type = v.type; o.detune.setValueAtTime(v.det, t0);
      o.frequency.setValueAtTime(v.from, t0);
      o.frequency.exponentialRampToValueAtTime(v.to, t0 + .4);
      o.connect(master); o.start(t0); o.stop(t0 + .48);
    });
    master.connect(lp); lp.connect(c.destination);
    swoosh(0, .18, 1500, 260, .11);
    voice(98, .17, .32, {type:'triangle', gain:.13, atk:.004, cut:760, h2:true});
  }
  const C3=130.81, C4=261.63, G4=392, C5=523.25, E5=659.25, G5=784,
        C6=1046.5, E6=1318.5, G6=1568, C7=2093, E7=2637, G7=3136,
        A4=440, B4=493.88, D5=587.33, F5=698.46, A5=880, B5=987.77, D6=1174.7,
        F3=174.61, G3=196;
  const marimba = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'triangle', gain:gain, atk:.004, cut:4200, h2:true});
  const bell = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', gain:gain, atk:.004, cut:8000, h2:true});
  const BEAT = .28;
  const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
               [G5,2,.5],[E5,2.5,.5],[F5,3,1],[E5,4,.5],[D5,4.5,.5],
               [C5,5,.5],[E5,5.5,.5],[G5,6,1],[C5,7,1]];
  const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
  function bgmTone(freq, at, dur, type, gain){
    const c = ac(); if(!c || !bgmBus) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(bgmBus); o.start(at); o.stop(at + dur + .05);
  }
  function bgmLoop(){
    const c = ac(); if(!c || !bgmOn) return;
    if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;
    MEL.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'triangle', .055));
    BASS.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'sine', .045));
    bgmAt += 8 * BEAT;
    bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);
  }
  return {
    ctx(){ return C },
    unlock(){ ac() },
    tap(){ marimba(G5, 0, .14, .09) },
    step(i){ marimba([C5,D5,E5,G5,A5,C6][Math.min(i,5)], 0, .26, .11) },
    good(){ [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
            chord([C5,G5], .02, .5, {type:'triangle', gain:.05}) },
    bad(){ wrongHit() },
    clear(){ swoosh(0, .5, 700, 5200, .1);
             [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12)) },
    fanfare(){
      [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(m => marimba(m[0],m[1],m[2],.12));
      [[G5,.5,.14],[A5,.62,.14],[B5,.74,.14],[C6,.86,.3]]
        .forEach(m => marimba(m[0],m[1],m[2],.12));
      chord([C5,E5,G5,C6], 1.2, 1.1, {type:'triangle', gain:.07});
      [[E6,2.35,.4],[D6,2.6,.4],[C6,2.85,.55]]
        .forEach(m => bell(m[0],m[1],m[2],.10));
      chord([C5,E5,G5,C6], 3.5, 1.5, {type:'triangle', gain:.08});
      voice(C4, 3.5, 1.5, {type:'sine', gain:.07});
      [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(m => bell(m[0],m[1],m[2],.045));
    },
    bgmStart(delay){
      const c = ac(); if(!c) return;
      if(bgmOn) return;
      bgmOn = true;
      bgmBus = c.createGain(); bgmBus.gain.setValueAtTime(.9, c.currentTime);
      bgmBus.connect(c.destination);
      bgmAt = c.currentTime + (delay === undefined ? .35 : delay);
      bgmLoop();
    },
    bgmStop(){
      const c = ac(); bgmOn = false;
      if(bgmTm){ clearTimeout(bgmTm); bgmTm = null }
      if(bgmBus && c){
        const bus = bgmBus; bgmBus = null;
        try{
          const t0 = c.currentTime;
          bus.gain.setValueAtTime(bus.gain.value, t0);
          bus.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
        }catch(e){}
        setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
      }
    }
  };
})();

function paperObj(src, cls){

  o.style.setProperty('--m', 'url("' + src + '")');
  const im = new Image(); im.alt = ''; im.src = src; im.draggable = false; o.appendChild(im);

/* 분필로 손으로 그린 사각형 (B-1_04 chalkPath 와 동일 방식) — 점을 흔들어 곡선으로 잇고, 시작점을 지나쳐 겹치게 */
function chalkPath(w, h2, inset, jit, rad) {
  const r = rad - inset, rnd = () => (Math.random() * 2 - 1) * jit * 0.5;
  const x0 = inset, y0 = inset, x1 = w - inset, y1 = h2 - inset, pts = [];
  const line = (ax, ay, bx, by, n) => { for (let k = 0; k < n; k++) { const t = k / n; pts.push([ax + (bx - ax) * t, ay + (by - ay) * t]); } };
  const arc = (cx, cy, a0, n) => { for (let k = 0; k < n; k++) { const a = a0 + (Math.PI / 2) * k / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  const s = x0 + r + 20;
  line(s, y0, x1 - r, y0, 6); arc(x1 - r, y0 + r, -Math.PI / 2, 5);
  line(x1, y0 + r, x1, y1 - r, 5); arc(x1 - r, y1 - r, 0, 5);
  line(x1 - r, y1, x0 + r, y1, 6); arc(x0 + r, y1 - r, Math.PI / 2, 5);
  line(x0, y1 - r, x0, y0 + r, 5); arc(x0 + r, y0 + r, Math.PI, 5);
  line(x0 + r, y0, s, y0, 3);
  pts.push([s, y0]);
  const P = pts.map(p => [p[0] + rnd(), p[1] + rnd()]);
  let d = 'M' + P[0][0].toFixed(1) + ' ' + P[0][1].toFixed(1);
  for (let k = 1; k < P.length - 1; k++) d += ' Q' + P[k][0].toFixed(1) + ' ' + P[k][1].toFixed(1) + ' ' + ((P[k][0] + P[k + 1][0]) / 2).toFixed(1) + ' ' + ((P[k][1] + P[k + 1][1]) / 2).toFixed(1);
  return d;
}

/* ---------- 문제판 ---------- */
const slots = [];
function buildBoard(){
  board.innerHTML = ''; slots.length = 0;
  ORDER.forEach((code, i) => {
    const s = document.createElement('div');
    s.className = 'slot pp-slot'; s.dataset.index = i;
    s.innerHTML = '<div class="slot__empty"><svg viewBox="0 0 273 278" preserveAspectRatio="none"><path class="ch1" d="' + chalkPath(273, 278, 6, 3, 30) + '"/></svg></div><div class="slot__cell pp-cell"></div><span class="badge pp-badge">' + (i + 1) + '</span>';
    board.appendChild(s); slots.push(s);
    s.addEventListener('click', () => onSlotTap(s));
    if(i < FIXED){ fillSlot(s, code, false) }
  });
}
function fillSlot(s, code, animate){
  const cell = s.querySelector('.slot__cell');
  cell.innerHTML = ''; cell.appendChild(paperObj(ART[code]));
  s.dataset.code = code; s.classList.add('is-filled');
  if(animate){ s.classList.add('is-landing'); setTimeout(() => s.classList.remove('is-landing'), 460) }
}
function onSlotTap(s){
  if(!s.dataset.code || briefing || guideOpen || winEl.classList.contains('on')) return;
  SFX.unlock(); SFX.tap(); showPeek(s.dataset.code);
}
function paintNext(){
  slots.forEach((s, i) => s.classList.toggle('is-next', !briefing && i === placed && placed < ORDER.length));
}

/* ---------- 진행 별 ---------- */
function buildStars(){ /* 진행 별 제거됨 — PROGRESS_STARS.md 참고 */ }
function paintStars(){ /* 진행 별 제거됨 — PROGRESS_STARS.md 참고 */ }

/* ---------- 트레이 ---------- */
let cards = [];
function buildTray(){
  tray.innerHTML = '';
  cards = TRAY.map(code => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pp-card tray-card'; b.dataset.code = code;
    b.setAttribute('aria-label', I18N[lang].name[code]);
    b.appendChild(paperObj(ART[code]));
    b.addEventListener('click', () => attempt(b));
    tray.appendChild(b); return b;
  });
}

/* ---------- 판정 · 연출 ---------- */
function attempt(card){
  if(locked || briefing || guideOpen || placed >= ORDER.length) return;
  SFX.unlock();
  if(card.dataset.code === ORDER[placed]){
    locked = true; SFX.step(placed - FIXED); flyIn(card);
  }else{
    SFX.bad();
    card.classList.remove('is-wrong'); void card.offsetWidth; card.classList.add('is-wrong');
    react('huh');
    setTimeout(() => card.classList.remove('is-wrong'), 460);
  }
}
function flyIn(card){
  const idx = placed, code = card.dataset.code, slot = slots[idx];
  const a = card.getBoundingClientRect(), b = slot.getBoundingClientRect();
  const f = card.cloneNode(true);
  f.className = 'pp-card tray-card fly';
  f.style.cssText = 'left:' + a.left + 'px;top:' + a.top + 'px;width:' + a.width + 'px;height:' + a.height + 'px';
  document.body.appendChild(f);
  card.style.visibility = 'hidden';
  const dx = b.left - a.left + (b.width - a.width) / 2, dy = b.top - a.top + (b.height - a.height) / 2;
  const sc = Math.min(b.width / a.width, b.height / a.height) * .96;
  const to = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ')';
  const an = f.animate([
    {transform:'translate(0,0) scale(1)', opacity:1},
    {transform:to, opacity:1, offset:.82},
    {transform:to, opacity:0}
  ], {duration:520, easing:'cubic-bezier(.2,.9,.3,1.08)', fill:'forwards'});
  an.onfinish = () => {
    f.remove(); card.style.visibility = ''; card.classList.add('is-done');
    fillSlot(slot, code, true);
    burstAt(slot);
    placed++; paintNext(); paintStars(); SFX.good(); react('cheer');
    say(I18N[lang].line[code], null, 'line_' + code);
    locked = false;
    if(placed === ORDER.length) setTimeout(finish, 800);
  };
}
function burstAt(slot){
  const sr = stage.getBoundingClientRect(), r = slot.getBoundingClientRect();
  const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height / 2;
  const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 1;
  const COL = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#BFE3D8'];
  for(let i = 0; i < 12; i++){
    const el = document.createElement('i'), ang = Math.random() * Math.PI * 2, dist = (90 + Math.random() * 90) * u;
    el.className = 'spark-bit' + (i % 3 ? ' star' : '');
    el.style.cssText = 'left:' + cx + 'px;top:' + cy + 'px;--s:' + ((12 + Math.random() * 14) * u) + 'px;--c:' + COL[i % COL.length] +
      ';--dx:' + (Math.cos(ang) * dist) + 'px;--dy:' + (Math.sin(ang) * dist) + 'px;--rot:' + Math.round(Math.random() * 360 - 180) + 'deg';
    stage.appendChild(el); setTimeout(() => el.remove(), 820);
  }
}
function react(kind){
  sunEl.classList.remove('is-cheer','is-huh'); void sunEl.offsetWidth;
  sunEl.classList.add(kind === 'cheer' ? 'is-cheer' : 'is-huh');
  setTimeout(() => sunEl.classList.remove('is-cheer','is-huh'), 1900);
}

/* ---------- 완료 (§8.3) ---------- */
(function buildSparks(){
  const box = $('winSparks'), COLORS = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#BFE3D8','#F7C8A0'];
  let seed = 20261006;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const N = 18;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + rnd() * .18, rad = .40 + rnd() * .16, el = document.createElement('i');
    el.className = 'spark';
    el.style.cssText = '--x:' + (50 + Math.cos(ang) * rad * 116) + '%;--y:' + (50 + Math.sin(ang) * rad * 136) + '%;' +
      '--s:calc(' + (14 + Math.round(rnd() * 22)) + '*var(--u));--c:' + COLORS[i % COLORS.length] + ';--d:' + (rnd() * 2.2).toFixed(2) + 's';
    box.appendChild(el);
  }
})();
(function buildConfetti(){
  const box = $('winConf'), C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#FFF6DF'];
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 250, el = document.createElement('i');
    el.className = 'conf';
    el.style.cssText = '--w:calc(' + (12 + Math.round(rnd() * 12)) + '*var(--u));--h:calc(' + (16 + Math.round(rnd() * 18)) + '*var(--u));' +
      '--c:' + C[i % C.length] + ';--r:' + (rnd() < .4 ? '50%' : 'calc(4*var(--u))') + ';' +
      '--dx:calc(' + (Math.cos(ang) * dist).toFixed(0) + '*var(--u));--dy:calc(' + (Math.sin(ang) * dist - 60).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd() * 900 - 450) + 'deg;--d:' + (rnd() * .35).toFixed(2) + 's';
    box.appendChild(el);
  }
})();
function finish(){
  SFX.clear(); winEl.classList.add('on'); winEl.setAttribute('aria-hidden', 'false');
  setTimeout(() => SFX.fanfare(), 120);
  setTimeout(() => SFX.bgmStart(0), 3400);
  setTimeout(() => say(I18N[lang].win, null, 'win'), 700);
}
function resetGame(){
  if(peekCode) closePeek();
  SFX.bgmStop(); stopVoice();
  winEl.classList.remove('on'); winEl.setAttribute('aria-hidden', 'true');
  placed = FIXED; locked = false;
  buildBoard(); buildTray(); paintStars(); paintNext();
}

/* ---------- 음성 — Pixie mp3 (instr·guide·win), 카드 설명은 TTS ---------- */
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
let voiceAud = null;
function stopVoice(){
  try{ if(voiceAud){ voiceAud.onended = voiceAud.onerror = null; voiceAud.pause(); voiceAud = null } }catch(e){}
  try{ if('speechSynthesis' in window) speechSynthesis.cancel() }catch(e){}
  sayFlag(false);
}
/* 음성 mp3 는 미리 받아 두고 재사용 — 재생 때마다 새로 읽고 디코딩하면서 생기던 끊김 방지 */
const AUDC = {};
function getAud(key, l){
  const k = key + '_' + l;
  if(!AUDC[k]){ const a = new Audio('../audio/voice-q/q_b1_02_' + k + '.mp3'); a.preload = 'auto'; AUDC[k] = a }
  return AUDC[k];
}
function preloadVoices(l){
  ['instr','guide','win','line_wake','line_brush','line_comb','line_dress','line_eat','line_go','line_bus','line_arrive']
    .forEach(k => { try{ getAud(k, l).load() }catch(e){} });
}
preloadVoices(lang);
setTimeout(() => preloadVoices(lang === 'ko' ? 'en' : 'ko'), 2500);
function say(text, hooks, key){
  hooks = hooks || {};
  if(MUTE.on || !text) return false;
  stopVoice();
  const tts = () => {
    if(!('speechSynthesis' in window)) return false;
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'ko' ? 'ko-KR' : 'en-US'; u.rate = lang === 'ko' ? 1.02 : .94; u.pitch = 1.13;
      u.onstart = () => { sayFlag(true); if(hooks.start) hooks.start() };
      u.onend = u.onerror = () => { sayFlag(false); if(hooks.end) hooks.end() };
      speechSynthesis.speak(u); return true;
    }catch(e){ return false }
  };
  if(!key) return tts();
  /* Pixie mp3 — 파일이 없거나 재생이 막히면 TTS 로 대체 */
  try{
    const a = getAud(key, lang);
    try{ a.currentTime = 0 }catch(e){}
    voiceAud = a; let started = false;
    a.onplaying = () => { if(!started){ started = true; sayFlag(true); if(hooks.start) hooks.start() } };
    a.onended = () => { sayFlag(false); voiceAud = null; if(hooks.end) hooks.end() };
    a.onerror = () => { if(voiceAud === a){ voiceAud = null; tts() } };
    const p = a.play();
    if(p && p.catch) p.catch(() => { if(voiceAud === a && !started){ voiceAud = null; tts() } });
    return true;
  }catch(e){ return tts() }
}

/* ---------- 언어 ---------- */
function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.documentElement.lang = lang;
  $('lgEn').className = ko ? 'off' : 'on'; $('lgKo').className = ko ? 'on' : 'off';
  $('btnLang').dataset.next = ko ? 'en' : 'ko'; $('btnLang').setAttribute('aria-label', ko ? 'English' : '한국어');
  $('btnBack').setAttribute('aria-label', ko ? '뒤로 가기' : 'Back');
  $('guideClose').setAttribute('aria-label', ko ? '닫기' : 'Close');
  sunEl.setAttribute('aria-label', ko ? '문제 다시 듣기' : 'Hear the question again');
  $('talkTag').textContent = t.tag; $('talkLine').textContent = t.instr;
  $('stepA').textContent = t.stepA; $('stepB').textContent = t.stepB;
  $('retryTx').textContent = t.retry; $('exitTx').textContent = t.exit;
  slots.forEach(s => { if(s.dataset.code) s.setAttribute('aria-label', t.name[s.dataset.code]) });
  if(peekCode) showPeek(peekCode, true);
  cards.forEach(c => c.setAttribute('aria-label', t.name[c.dataset.code]));
  paintMute();
}

/* ---------- 브리핑 (§8.2 · §8.4) ----------
   끝나는 조건: 음성 종료 / 음성이 시작되지 않으면 7s / 0.9s 가드 이후 아무 데나 탭 */
let briefing = true, briefTm = null, skipArmed = false, voiceOn = false, retried = false;
function briefSay(){
  voiceOn = false;
  say(I18N[lang].instr, {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) }
  }, 'instr');
}
function startBriefing(){
  briefing = true; skipArmed = false; document.body.classList.add('is-briefing'); paintNext();
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
  setTimeout(briefSay, 350);
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm); document.body.classList.remove('is-briefing'); paintNext();
}
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.pp-ibtn, .sun, .guide, .win')) return;
  if(!voiceOn && !retried && !('speechSynthesis' in window && speechSynthesis.speaking)){
    retried = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000); briefSay(); return;
  }
  if(skipArmed) endBriefing();
}, true);

/* ---------- 가이드 (§8.5) — 해를 누르면 열린다 ---------- */
function openGuide(){ guideOpen = true; guideEl.classList.add('on'); say(I18N[lang].guide, null, 'guide') }
let peekCode = null;
function showPeek(code, quiet){
  peekCode = code;
  const pa = $('peekArt'); pa.innerHTML = ''; pa.appendChild(paperObj(ART[code]));
  $('peekLine').textContent = I18N[lang].line[code];
  $('peek').classList.add('on');
  if(!quiet) say(I18N[lang].line[code], null, 'line_' + code);
}
function closePeek(){ peekCode = null; $('peek').classList.remove('on'); stopVoice() }
$('peekClose').addEventListener('click', e => { e.stopPropagation(); SFX.tap(); closePeek() });
$('peek').addEventListener('click', e => { if(e.target === e.currentTarget || e.target.closest('.peek-sheet')){ SFX.tap(); closePeek() } });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && peekCode) closePeek() });
function closeGuide(){ guideOpen = false; guideEl.classList.remove('on'); stopVoice() }
sunEl.addEventListener('click', () => {
  SFX.tap();
  if(briefing){ briefSay(); return }
  openGuide();
});
$('guideClose').addEventListener('click', () => { SFX.tap(); closeGuide() });
guideEl.addEventListener('pointerdown', e => { if(e.target === guideEl) closeGuide() });
(function buildGuideDemo(){
  const d = $('gdemo'), tr = $('gtrack');
  ['dress','comb','bus'].forEach((code, i) => {
    const m = document.createElement('span'); m.className = 'pp-card mini' + (i === 0 ? ' pick' : '');
    m.appendChild(paperObj(ART[code])); d.appendChild(m);
  });
  ['wake','eat',null].forEach(code => {
    const sp = document.createElement('span');
    if(code){ sp.className = 'filled'; sp.appendChild(paperObj(ART[code])) } else sp.className = 'lit';
    tr.appendChild(sp);
  });
})();

/* ---------- 상단 버튼 ---------- */
function paintMute(){
  const L = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', L[lang][MUTE.on ? 'on' : 'off']);
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){
    SFX.tap(); MUTE.on = true; stopVoice();
    const c = SFX.ctx(); if(c && c.state === 'running') c.suspend();
  }else{
    MUTE.on = false;
    const c = SFX.ctx(); if(c && c.state === 'suspended') c.resume();
    if(winEl.classList.contains('on')){ SFX.bgmStop(); SFX.bgmStart(0) }
    SFX.tap();
  }
  paintMute();
});
$('btnLang').addEventListener('click', e => {
  SFX.unlock(); SFX.tap();
  lang = e.currentTarget.dataset.next; applyLang();
  if(briefing) briefSay(); else if(guideOpen) say(I18N[lang].guide, null, 'guide');
});
const leave = () => { SFX.tap(); location.href = 'B-1_00.submain.html' };
$('btnBack').addEventListener('click', leave);
$('exit').addEventListener('click', leave);
$('retry').addEventListener('click', () => { SFX.tap(); resetGame() });

if('speechSynthesis' in window) speechSynthesis.getVoices();
{ const bi = new Image(); bi.alt = ''; bi.src = 'assets/B-1_03-boy-fine-paper.png'; bi.className = 'b1-boy__image'; bi.draggable = false; sunEl.appendChild(bi);
  const seams = new Image(); seams.alt = ''; seams.src = 'assets/B-1_03-boy-flat-seams-overlay.png'; seams.className = 'b1-boy__image b1-boy__seams'; seams.draggable = false; sunEl.appendChild(seams) } $('winArt').appendChild(paperObj(ART.bus));
buildBoard(); buildTray(); buildStars(); applyLang(); startBriefing();
})();
</script>

<script>
/* 문제풀이 BGM — 개념별 공용 곡(puzzle-sequencing-stepping-loop). 첫 입력부터 반복 재생(자동재생 정책), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
(() => {
  const a = new Audio('../audio/bgm/puzzle-sequencing-stepping-loop.mp3');
  a.loop = true; a.preload = 'auto'; a.volume = .22;
  const $ = id => document.getElementById(id);
  const muted = () => { const b = $('btnSay') || document.querySelector('button[class*="soundButton"]'); return !!b && b.getAttribute('aria-pressed') === 'true' };
  const done = () => document.body.classList.contains('is-done') || !!document.querySelector('#win.on, [class*="_win_"]');
  let armed = false;
  const sync = () => {
    if(!armed) return;
    if(muted() || done() || document.hidden) a.pause();
    else if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}) }
  };
  let raf = 0; const soon = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; sync() }) };
  ['pointerdown','keydown'].forEach(t => window.addEventListener(t, () => { armed = true; sync() }, {passive:true}));
  document.addEventListener('visibilitychange', sync);
  new MutationObserver(soon).observe(document.body, {attributes:true, attributeFilter:['class','aria-pressed'], childList:true, subtree:true});
})();
</script>
