<style>
/* ============================================================
   B-2_06 PATTERN RECOGNITION v2 — 종이 콜라주 테마 (DESIGN.md §11)
   B-2_02 v4 · B-2_03 v2 · B-2_04 v2 · B-2_05 v2 와 같은 크롬 · 브리핑 · 가이드 · 완료 화면.
   문제 데이터(LAYOUT) · 판정 · 입력 규칙 · 효과음은 원본 B-2_06.pattern.html(DESIGN.md §9.7) 그대로.
   아이콘 8종(새 · 클로버 · 무당벌레 · 해바라기 · 새집 · 노란꽃 · 나비 · 튤립)은 원본 SVG 그대로,
   면에 --pp-tx-felt 결만 overlay 로 입힌다 (B-2_05 v2 꽃과 같은 질감).
   배경은 B-2_04 v2 의 빈 판 배경(../img_png/B-2_06-stage-bg-forest-v1.webp) 재사용.
   좌표는 전부 아트보드 1920×1200u.
   ============================================================ */
:root{
  --design-w:1920; --design-h:1200;
  /* 이 화면 — 그리드 · 동그라미 (종이 팔레트 안에서) */
  --pt-line:rgba(106,75,51,.38);   /* 칸 점선 — 나무 판(#6A4B33) 계열을 크림 위에 옅게 */
  --pt-hot:rgba(231,178,60,.30);   /* 진행 · 일치 — --pp-gold 틴트 */
  --pt-cold:rgba(74,49,34,.13);    /* 어긋남 — 갈색 회색 틴트 */
  --pt-done:rgba(118,144,95,.24);  /* 찾은 패턴 — --pp-green 틴트 */
  --pt-ink:#76905F;                /* 그리는 중(일치) — --pp-green */
  --pt-ink-done:#5D7A49;           /* 확정 동그라미 — 한 단 진하게 */
  --pt-ink-bad:#9A8670;            /* 어긋남 — 점선 */
  --cw:156; --ch:132;              /* 칸 156×132u — 좌하단 소년(오른쪽 끝 ≈332u)을 피해 8열 1248u 를 화면 중앙에 */
}
/* DESIGN.css 의 --pp-edge 는 --sp-gutter(단위 없음) 때문에 무효값 — 길이로 다시 잡는다 (B-2_05 v2 와 같음) */
.stage.theme-paper{--pp-edge:calc(28 * var(--u))}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#0F2418; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; touch-action:none}
body{display:grid; place-items:center}
img{user-select:none; -webkit-user-drag:none}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u));
  overflow:hidden; isolation:isolate}
.stage__bg{position:absolute; left:0; top:0; width:100%; height:100%; display:block; z-index:0}

/* ---------- 상단 크롬 §11.2 · §11.4 ---------- */
.pp-edge-tl,.pp-edge-tr,.pp-edge-tc{z-index:20}
.pp-ibtn svg{fill:currentColor}
.pp-ibtn--sound .sound-wave{fill:none; stroke:currentColor; stroke-width:2.8;
  stroke-linecap:round; stroke-linejoin:round}
#btnSay.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 종이 오브젝트 — 원본 SVG + 같은 모양으로 오린 펠트 결(overlay) ----------
   B-2_05 v2 의 .obj 와 같은 값. 결은 무채색이라 색은 원본 그대로. 들뜸 그림자는 mask 바깥 층(.obj)에 건다 (§11.3) */
.obj{position:relative; display:block; isolation:isolate; filter:var(--pp-lift-s)}
.obj > svg{position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible}
.obj__tx{position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.95;
  background:var(--pp-tx-felt) 0 0/calc(96 * var(--u)) repeat;
  -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat}

/* ---------- PATTERN 카드 — 틸 펠트 가로 카드 (B-2_04 v2 카드와 같은 재질) ----------
   card-felt-teal-wide-a.webp 1320×420 → 520×166u(≈2.5배). 아이콘 4개 100u, 간격 12u.
   원본의 흰 외곽선 필터는 초록 면 대비 때문이었다 — 틸 면에서는 클로버도 읽히므로 쓰지 않는다 */
.rule{position:absolute; z-index:6; left:50%; top:calc(166 * var(--u));
  width:calc(520 * var(--u)); height:calc(166 * var(--u)); margin-left:calc(-260 * var(--u));
  display:flex; align-items:center; justify-content:center; gap:calc(12 * var(--u)); isolation:isolate}
.rule::before{content:''; position:absolute; inset:0; z-index:-1; filter:var(--pp-lift-s);
  background:url("../img_png/paper/card-felt-teal-wide-a.webp") center/100% 100% no-repeat}
.rule .ic{width:calc(100 * var(--u)); height:calc(100 * var(--u))}

/* ---------- 문제판 — 배경의 크림 판 위에 8열 × 5행 ----------
   x 336~1584 (가로 중앙) · y 352~1012. 원본처럼 칸 사이 간격 0, 점선으로 나눈다 */
.board{position:absolute; z-index:5; left:calc(336 * var(--u)); top:calc(352 * var(--u));
  width:calc(var(--cw) * 8 * var(--u)); height:calc(var(--ch) * 5 * var(--u))}
.grid{position:absolute; inset:0; display:grid;
  grid-template-columns:repeat(8, calc(var(--cw) * var(--u)));
  grid-template-rows:repeat(5, calc(var(--ch) * var(--u)));
  border:calc(2.5 * var(--u)) dashed var(--pt-line); border-radius:calc(14 * var(--u))}
.cell{position:relative; display:grid; place-items:center; touch-action:none; cursor:pointer;
  border-right:calc(2.5 * var(--u)) dashed var(--pt-line);
  border-bottom:calc(2.5 * var(--u)) dashed var(--pt-line);
  transition:background var(--t-fast) linear}
.cell:nth-child(8n){border-right:0}
.cell:nth-child(n+33){border-bottom:0}
.cell .ic{width:calc(104 * var(--u)); height:calc(104 * var(--u)); pointer-events:none;
  transform-origin:50% 85%}
.cell.hot{background:var(--pt-hot)}
.cell.cold{background:var(--pt-cold)}
.cell.done{background:var(--pt-done)}
/* 힌트 — 선이 아니라 번지는 빛 (.pp-slot.is-next 와 같은 빛) */
.cell.hint::after{content:''; position:absolute; inset:calc(8 * var(--u)); border-radius:calc(22 * var(--u));
  pointer-events:none; box-shadow:0 0 calc(30 * var(--u)) calc(8 * var(--u)) rgba(255,205,90,.75);
  background:radial-gradient(ellipse at 50% 50%, rgba(255,229,155,.55) 0%, rgba(255,214,102,0) 75%);
  animation:ppNext .6s ease-in-out 3}

/* 동그라미 오버레이 */
.ink{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; overflow:visible}

/* 보상 — 아이콘이 살아난다 (원본 모션 그대로) */
.cell.alive[data-code="B"] .ic{animation:aliveBird 1.1s var(--e-out)}
.cell.alive[data-code="C"] .ic{animation:aliveSway .9s var(--e-out)}
.cell.alive[data-code="L"] .ic{animation:aliveCrawl 1.0s var(--e-out)}
.cell.alive[data-code="S"] .ic{animation:aliveTurn 1.0s var(--e-out)}
@keyframes aliveBird{0%{transform:translateY(0)}30%{transform:translateY(-22%) rotate(-8deg)}
  55%{transform:translateY(-30%) rotate(6deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes aliveSway{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}60%{transform:rotate(9deg)}}
@keyframes aliveCrawl{0%{transform:translateX(0)}35%{transform:translateX(-14%) rotate(-6deg)}
  70%{transform:translateX(12%) rotate(5deg)}100%{transform:translateX(0)}}
@keyframes aliveTurn{0%,100%{transform:rotate(0) scale(1)}40%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(8deg) scale(1.06)}}

/* 클리어 반짝 */
.board.clear::after{content:''; position:absolute; inset:calc(-20*var(--u)); z-index:4;
  border-radius:calc(24*var(--u)); background:var(--pp-star-on); mix-blend-mode:screen;
  animation:flash .7s var(--e-out) forwards; pointer-events:none}
@keyframes flash{0%{opacity:0}30%{opacity:.5}100%{opacity:0}}

/* 반짝이 — v4 와 같은 별가루 (정답 1개마다) */
.spark-bit{position:absolute; z-index:28; width:var(--s); height:var(--s);
  background:var(--c); pointer-events:none; border-radius:50%;
  animation:bitFly .78s var(--e-out) forwards}
.spark-bit.star{border-radius:0;
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes bitFly{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
  15%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05) rotate(var(--rot))}}

/* ---------- 소년 — v4 와 같은 자리 · 같은 브리핑 이동 ---------- */
.boy-slot{position:absolute; z-index:14; transform-origin:50% 100%;
  left:calc(50.7 * var(--u)); top:calc(709.3 * var(--u));
  width:calc(284.8 * var(--u)); height:calc(470.3 * var(--u));
  transition:transform .62s var(--e-out)}
.boy{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; transition:transform var(--t-fast) var(--e-out)}
.boy img{width:100%; height:100%; display:block}
.boy:active{transform:scale(.96)}
.boy:focus-visible{outline:none}
.boy.is-cheer{animation:boyHop .9s var(--e-out) 2}
@keyframes boyHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-42*var(--u))) rotate(-3deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-20*var(--u))) rotate(2deg)}}

/* ---------- 브리핑 §8.4 · §11.8 (v4 · B-2_04 v2 와 같은 값) ----------
   딤은 pointer-events:none — 건너뛰기 탭이 그대로 칸에 닿아 첫 스와이프가 답으로 이어진다 (원본 규칙) */
.veil{position:absolute; inset:0; z-index:12; background:var(--pp-veil); pointer-events:none;
  opacity:0; visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
body.is-briefing .boy-slot{z-index:16; transform:translateX(calc(767*var(--u))) scale(1.18)}
body.is-briefing .boy{animation:boyTalk 1.5s var(--e-out) .5s infinite}
@keyframes boyTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-12*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}
.talk{top:calc(296*var(--u)); z-index:17; opacity:0; visibility:hidden;
  transform:translateY(calc(26*var(--u))) rotate(-1.4deg) scale(.94); transform-origin:50% 100%;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow), transform .5s var(--e-pop)}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none; transition-delay:.28s}

/* ---------- 가이드 팝업 §8.5 · §11.9 — B-2_04 v2 와 같은 시트 · 닫기 · 스텝 ----------
   데모만 이 화면 것 — ① 규칙 카드 ② 6칸 줄에서 같은 순서를 동그라미 */
.guide{position:absolute; inset:0; z-index:35; display:grid; place-items:center;
  background:var(--pp-scrim); opacity:0; pointer-events:none;
  transition:opacity var(--t-base) var(--e-out)}
.guide.on{opacity:1; pointer-events:auto}
.guide__sheet{position:relative; width:calc(1200*var(--u)); height:calc(700*var(--u));
  padding:calc(54*var(--u)) calc(60*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(26*var(--u)); text-align:center;
  transform:scale(.88); transition:transform var(--t-slow) var(--e-pop)}
.guide.on .guide__sheet{transform:none}
.guide__sheet > :not(.guide__paper):not(.pp-round){position:relative; z-index:1}
.guide__paper{position:absolute; inset:0; z-index:0; pointer-events:none; filter:var(--pp-lift-l)}
.guide__rim,.guide__face{position:absolute}
.guide__rim{inset:calc(-10*var(--u)); background:var(--pp-rim);
  -webkit-mask:var(--pp-mask-rim) center/100% 100% no-repeat; mask:var(--pp-mask-rim) center/100% 100% no-repeat}
.guide__face{inset:0; background:var(--pp-cream) var(--pp-tx-sheet) center/100% 100% no-repeat;
  -webkit-mask:var(--pp-mask-sheet) center/100% 100% no-repeat; mask:var(--pp-mask-sheet) center/100% 100% no-repeat}
.gstep{display:flex; align-items:center; justify-content:center; gap:calc(18*var(--u));
  font-size:calc(44*var(--u)); font-weight:800; color:var(--pp-ink)}
.gstep i{flex:none; display:grid; place-items:center; width:calc(64*var(--u)); height:calc(64*var(--u));
  border-radius:50%; background:var(--pp-gold); color:var(--pp-gold-ink); font-style:normal;
  font-size:calc(37*var(--u))}
.gstep b{white-space:nowrap}
.garrow{width:calc(44*var(--u)); fill:var(--pp-teal)}
/* 가이드 안 규칙 카드 — 본판 카드를 0.84배로 (걸침 배치 없이 흐름 안에) */
.guide .rule{position:relative; left:auto; top:auto; margin:0; flex:none;
  width:calc(436*var(--u)); height:calc(139*var(--u)); gap:calc(10*var(--u))}
.guide .rule .ic{width:calc(84*var(--u)); height:calc(84*var(--u))}
.demo{position:relative; flex:none; width:calc(var(--cw) * 6 * var(--u)); height:calc(var(--ch) * var(--u))}
.demo .grid{grid-template-columns:repeat(6, calc(var(--cw) * var(--u))); grid-template-rows:calc(var(--ch) * var(--u))}
.demo .cell{cursor:default; border-bottom:0}
.demo .cell:nth-child(6n){border-right:0}
/* 자식 선택자 필수 — .demo svg 로 두면 칸 안 아이콘까지 절대배치된다 (§9.7) */
.demo > svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.demo rect{stroke:var(--pt-ink-done); fill:none; stroke-linecap:round;
  stroke-dasharray:2400; stroke-dashoffset:2400; animation:draw 3.2s var(--e-out) infinite}
@keyframes draw{0%{stroke-dashoffset:2400; opacity:1} 45%,82%{stroke-dashoffset:0; opacity:1}
  100%{stroke-dashoffset:0; opacity:0}}

/* ---------- 완료 화면 §8.3 (B-2_04 v2 와 같은 값 · 같은 일러스트) ---------- */
.win{position:absolute; inset:0; z-index:60; display:flex; align-items:center;
  justify-content:center; background:var(--pp-scrim);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(1040*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u)));
  transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(200*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg, rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
          mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle, rgba(255,232,148,.85) 0%, rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}
.win__art{position:relative; z-index:2; display:block; width:calc(600*var(--u)); height:auto;
  filter:drop-shadow(0 calc(12*var(--u)) calc(20*var(--u)) rgba(80,40,10,.28))}
.win.on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3.5%) rotate(-1.5deg)}60%{transform:translateY(-1.5%) rotate(1.5deg)}}
.win__stack .win__actions{position:relative; z-index:3}
.win__sparks{position:absolute; left:50%; top:calc(-40*var(--u)); transform:translateX(-50%);
  width:calc(760*var(--u)); height:calc(480*var(--u)); z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s);
  background:var(--c); opacity:0; animation:twinkle 2.4s var(--e-out) infinite;
  animation-delay:var(--d);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}
  35%{opacity:1; transform:scale(1) rotate(35deg)}
  70%{opacity:.35; transform:scale(.75) rotate(70deg)}}
.win__confetti{position:absolute; left:50%; top:calc(80*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h);
  background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}
  12%{opacity:1}70%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>

<main class="stage theme-paper" id="stage">

      if(o.bend) s.frequency.exponentialRampToValueAtTime(freq * o.bend, t0 + dur * .8);
      s.detune.setValueAtTime(det || 0, t0);
      s.connect(f); s.start(t0); s.stop(t0 + dur + .05);
    };
    osc(o.type || 'sine', 1, 0);
    if(o.layer) osc(o.layer, o.mul || 2, o.detune || 6);
  }
  const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));
  function swoosh(at, dur, f0, f1, gain){
    const c = ac(); if(!c) return;
    if(!noiseBuf){
      const n = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      let s = 12345;
      for(let i = 0; i < n; i++){ s = (s*1103515245 + 12345) % 2147483648; d[i] = s/1073741824 - 1 }
    }
    const t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .3);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  }
  const C3=130.81, C4=261.63, G4=392,
        C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99, A5=880, B5=987.77,
        C6=1046.5, D6=1174.7, E6=1318.5, G6=1568, A6=1760,
        C7=2093, E7=2637, G7=3136, F3=174.61, G3=196;
  const marimba = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', layer:'triangle', mul:2, detune:5, gain:gain || .13, cut:f*4+700});
  const bell = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', layer:'sine', mul:3.01, detune:4, gain:gain || .10, cut:f*7+2000});

  let bgmOn = false, bgmTm = null, bgmBus = null, bgmAt = 0;
  const BEAT = .28;
  const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
               [A5,2,.5],[G5,2.5,.5],[E5,3,.5],[G5,3.5,.5],
               [F5,4,.5],[A5,4.5,.5],[C6,5,.5],[A5,5.5,.5],
               [G5,6,.5],[E5,6.5,.5],[C5,7,1]];
  const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
  function bgmTone(freq, at, dur, type, gain){
    const c = ac(); if(!c || !bgmBus) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(bgmBus);
    o.start(at); o.stop(at + dur + .05);
  }
  function bgmLoop(){
    const c = ac(); if(!c || !bgmOn) return;
    if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;
    MEL.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'triangle', .055));
    BASS.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'sine', .045));
    bgmAt += 8*BEAT;
    bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);
  }
  return {
    ctx(){ return ctx },
    unlock(){ ac() },
    tick(step, ok){
      if(ok) marimba([C5,E5,A5,C6][step] || C5, 0, .30, .13);
      else   voice(165, 0, .12, {type:'sine', gain:.075, cut:420});
    },
    correct(){
      [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
      voice(C4, .02, .5, {type:'sine', gain:.05, cut:900});
    },
    clear(){
      swoosh(0, .38, 500, 4200, .055);
      [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12));
      bell(C6, .40, .8, .09);
    },
    tap(){ voice(620, 0, .09, {type:'sine', gain:.10, cut:2200, bend:.66}) },
    hint(){ bell(D6, 0, .30, .085); bell(A6, .13, .38, .07) },
    fanfare(){
      swoosh(0, .5, 400, 5200, .06);
      [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(([f,a,d]) => marimba(f,a,d,.12));
      [[G5,.46,.12],[A5,.55,.12],[B5,.64,.12],[C6,.73,.34]].forEach(([f,a,d]) => marimba(f,a,d,.12));
      chord([C5,E5,G5,C6], 1.00, 1.25, {type:'triangle', layer:'sine', mul:2, gain:.055, cut:5200});
      voice(C3, 1.00, 1.4, {type:'sine', gain:.055, cut:600});
      [[E6,1.12,.24],[D6,1.36,.24],[C6,1.60,.38],[G5,1.98,.32],
       [A5,2.32,.26],[B5,2.58,.26],[C6,2.84,.80]].forEach(([f,a,d]) => bell(f,a,d,.10));
      swoosh(3.42, .45, 900, 6000, .045);
      chord([C6,E6,G6], 3.50, 1.7, {type:'sine', layer:'triangle', mul:2, gain:.06, cut:8000});
      voice(C4, 3.50, 1.8, {type:'sine', gain:.05, cut:900});
      voice(C3, 3.50, 2.0, {type:'sine', gain:.05, cut:520});
      [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(([f,a,d]) => bell(f,a,d,.045));
    },
    bgm(on, delay){
      if(on){
        const c = ac(); if(!c || bgmOn) return;
        bgmOn = true;
        const d = (delay === undefined) ? .35 : delay;
        bgmBus = c.createGain();
        bgmBus.gain.setValueAtTime(.0001, c.currentTime);
        bgmBus.gain.setValueAtTime(.0001, c.currentTime + d);
        bgmBus.gain.exponentialRampToValueAtTime(1, c.currentTime + d + 1.1);
        bgmBus.connect(c.destination);
        bgmAt = c.currentTime + d;
        bgmLoop();
      }else{
        if(!bgmOn) return;
        bgmOn = false;
        clearTimeout(bgmTm); bgmTm = null;
        const bus = bgmBus; bgmBus = null;
        if(bus && ctx){
          const t0 = ctx.currentTime;
          try{
            bus.gain.cancelScheduledValues(t0);
            bus.gain.setValueAtTime(Math.max(bus.gain.value, .0001), t0);
            bus.gain.exponentialRampToValueAtTime(.0001, t0 + .4);
          }catch(e){}
          setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
        }
      }
    }
  };
})();

function el(tag, cls, parent){
  const n = document.createElement(tag); if(cls) n.className = cls;
  if(parent) parent.appendChild(n); return n;
}
/* 아이콘 실루엣 마스크 — 인라인 심볼을 단독 SVG 로 꺼내 data URI 로 (file:// 에서도 mask 가 막히지 않게 §11.3) */
const ICON_URI = {};
document.querySelectorAll('symbol[id^="ic-"]').forEach(s => {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" style="' + (s.getAttribute('style') || '') + '">'
            + s.innerHTML + '</svg>';
  ICON_URI[s.id.slice(3)] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
});
/* 종이 아이콘 = 원본 심볼 + 같은 모양으로 오린 펠트 결 */
function paperIcon(parent, code){
  const o = el('span', 'obj ic', parent);
  o.style.setProperty('--m', 'url("' + ICON_URI[code] + '")');
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('viewBox', '0 0 240 240'); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(SVGNS, 'use'); u.setAttribute('href', '#ic-' + code);
  s.appendChild(u); o.appendChild(s);
  el('i', 'obj__tx', o);
  return o;
}

/* ============================================================
   4. 판정 · 그리기 — 원본 규칙 그대로 (§9.7 「셀 상태 · 입력 판정」)
   ============================================================ */
const CW = 156, CH = 132;
const rc = i => [Math.floor(i/COLS), i%COLS];
let path = [], found = [], dragging = false, downIdx = -1, moved = false;
let idleTimer = null, locked = false;

function runs(idxs){
  const out = []; let cur = null;
  idxs.forEach(i => {
    const [r,c] = rc(i);
    if(cur && cur.r === r && c === cur.c2 + 1) cur.c2 = c;
    else { cur = {r, c1:c, c2:c}; out.push(cur) }
  });
  return out;
}
function shape(run, color, width, dashed){
  const x = run.c1 * CW + 6, y = run.r * CH + 7;
  const w = (run.c2 - run.c1) * CW + CW - 12, h = CH - 14;
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + h/2 + '" ry="' + h/2 + '"'
       + ' fill="none" stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round"'
       + (dashed ? ' stroke-dasharray="26 20"' : '') + '/>';
}
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const isPrefixOK = () => path.every((i, k) => LAYOUT[i] === PATTERN[k]);
function renderLive(){
  if(!path.length){ inkLive.innerHTML = ''; return }
  const good = isPrefixOK();
  inkLive.innerHTML = runs(path).map(r => shape(r, cssv(good ? '--pt-ink' : '--pt-ink-bad'), 7, !good)).join('');
}
function renderLocked(){
  inkLocked.innerHTML = found.map(start => {
    const idxs = []; for(let k = 0; k < PATTERN.length; k++) idxs.push(start + k);
    return runs(idxs).map(r => shape(r, cssv('--pt-ink-done'), 9, false)).join('');
  }).join('');
}
function paintCells(){
  cells.forEach(c => c.classList.remove('hot','cold'));
  let bad = false;
  path.forEach((i, k) => {
    if(LAYOUT[i] !== PATTERN[k]) bad = true;           /* 어긋난 지점부터는 전부 cold */
    cells[i].classList.add(bad ? 'cold' : 'hot');
  });
}
function push(i){
  if(locked) return;
  if(!path.length) path = [i];
  else if(i === path[path.length-1]) return;
  else if(i === path[path.length-1] + 1 && path.length < PATTERN.length) path.push(i);
  else if(path.length > 1 && i === path[path.length-2]) path.pop();
  else if(path.length >= PATTERN.length) return;
  else path = [i];                                      /* 이어지지 않으면 새로 시작 */
  paintCells(); renderLive(); resetIdle();
  SFX.tick(path.length - 1, isPrefixOK());
  if(path.length === PATTERN.length) setTimeout(judge, 160);
}
function judge(){
  const start = path[0];
  const ok = isPrefixOK() && ANSWERS.includes(start) && !found.includes(start);
  if(ok){
    found.push(start);
    SFX.correct(); react();
    const got = path.slice();
    got.forEach(i => { cells[i].classList.remove('hot'); cells[i].classList.add('done') });
    got.forEach((i, k) => setTimeout(() => {
      cells[i].classList.add('alive');
      setTimeout(() => cells[i].classList.remove('alive'), 1200);
    }, k * 130));
    burstAt(cells[got[1]], cells[got[2]]);
    renderLocked(); paintStars();
    path = []; renderLive();
    if(found.length === ANSWERS.length) clearAll();
  }else{
    /* 오답 — 감점 · X · 소리 없음. 동그라미가 흩어질 뿐 (원본 규칙) */
    inkLive.style.transition = 'opacity .3s'; inkLive.style.opacity = '0';
    setTimeout(() => {
      path = []; paintCells(); renderLive();
      inkLive.style.opacity = '1'; inkLive.style.transition = '';
    }, 300);
  }
}
function paintStars(){ /* 진행 별 제거됨 — PROGRESS_STARS.md 참고 */ }
const U = () => stage.getBoundingClientRect().width / 1920;
function burstAt(a, b){
  const colors = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#F291B9','#BFE3D8'];
  const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const cx = (ra.left + rb.right) / 2 - sr.left, cy = ra.top - sr.top + ra.height * .5;
  const u = U(), N = 16;
  for(let i = 0; i < N; i++){
    const e = el('i', 'spark-bit' + (i % 3 ? ' star' : ''), stage);
    const ang = -Math.PI * (0.06 + 0.88 * (i / (N - 1)));
    const rad = (110 + (i % 4) * 30) * u;
    e.style.cssText = 'left:' + cx + 'px; top:' + cy + 'px;' +
      '--s:' + Math.round((9 + (i % 5) * 4) * u) + 'px; --c:' + colors[i % colors.length] + ';' +
      '--dx:' + (Math.cos(ang) * rad).toFixed(1) + 'px; --dy:' + (Math.sin(ang) * rad).toFixed(1) + 'px;' +
      '--rot:' + (i * 47 % 360) + 'deg; animation-delay:' + (i * 14) + 'ms';
    setTimeout(() => e.remove(), 900);
  }
}
let reactTm = null;
function react(){
  boyEl.classList.remove('is-cheer'); void boyEl.offsetWidth;
  boyEl.classList.add('is-cheer');
  clearTimeout(reactTm); reactTm = setTimeout(() => boyEl.classList.remove('is-cheer'), 1900);
}

/* 힌트 — 8초 무입력이면 아직 못 찾은 정답의 첫 칸만 빛 (브리핑 · 가이드 중에는 멈춤) */
function resetIdle(){
  clearTimeout(idleTimer);
  if(locked || briefing || guideOpen()) return;
  idleTimer = setTimeout(hint, 8000);
}
function hint(){
  const left = ANSWERS.filter(a => !found.includes(a));
  if(!left.length) return;
  const c = cells[left[0]];
  SFX.hint();
  c.classList.add('hint');
  setTimeout(() => c.classList.remove('hint'), 1900);
  resetIdle();
}

/* 입력 — 스와이프와 탭 4번을 모드 전환 없이 함께 받는다 (원본 규칙) */
function idxFromPoint(x, y){
  const t = document.elementFromPoint(x, y);
  const c = t && t.closest ? t.closest('#grid .cell') : null;
  return c ? +c.dataset.i : -1;
}
const blocked = () => locked || briefing || guideOpen();
grid.addEventListener('pointerdown', e => {
  if(blocked()) return;
  const i = idxFromPoint(e.clientX, e.clientY);
  if(i < 0) return;
  SFX.unlock();
  grid.setPointerCapture && grid.setPointerCapture(e.pointerId);
  dragging = true; moved = false; downIdx = i;
  push(i);
  e.preventDefault();
});
grid.addEventListener('pointermove', e => {
  if(!dragging || blocked()) return;
  const i = idxFromPoint(e.clientX, e.clientY);
  if(i < 0 || (i === downIdx && !moved)) return;
  if(i !== path[path.length-1]){ moved = true; push(i) }
});
grid.addEventListener('pointerup', () => {
  dragging = false;
  /* 첫 칸을 벗어나지 않고 뗐다 = 탭 → path 유지 (탭 4번 모드). 스와이프가 4칸 전에 끝나면 지운다 */
  if(moved && path.length && path.length < PATTERN.length){ path = []; paintCells(); renderLive() }
});
grid.addEventListener('pointercancel', () => { dragging = false; path = []; paintCells(); renderLive() });

  }, 520);
}
function resetGame(){
  SFX.bgm(false); stopVoice(); sayFlag(false);
  winEl.classList.remove('on');
  found = []; path = []; locked = false;
  cells.forEach(c => c.classList.remove('hot','cold','done','alive','hint'));
  inkLocked.innerHTML = ''; inkLive.innerHTML = '';
  board.classList.remove('clear');
  paintStars(); resetIdle();
}

/* ============================================================
   6. 음성 — Higgsfield Seed Audio · Pixie (DESIGN.md 「생성 보이스 레지스트리」, 다른 종이 화면과 같은 목소리)
      preset 0178ef57-ada4-43d9-992b-8d9221045bb4 · mp3 · 24 kHz · rate/pitch/loudness 0 (2026-10-01)
      앞에서부터 시도: 1) audio/voice-q/q_06_{instr,guide,win}_{en,ko}.mp3  2) Higgsfield 생성 원본 URL(온라인)  3) speechSynthesis
   ============================================================ */
const VOICE_SRC = {
  instr:{
    en:['../audio/voice-q/q_06_instr_en.mp3', 'https://d8j0ntlcm91z4.cloudfront.net/user_3GI37EwhNPEfYZaScuOAJmWbs2t/hf_20261001_032744_636a16cb-f5f6-412a-beeb-57826cf79364.mp3'],
    ko:['../audio/voice-q/q_06_instr_ko.mp3', 'https://d8j0ntlcm91z4.cloudfront.net/user_3GI37EwhNPEfYZaScuOAJmWbs2t/hf_20261001_032744_83186225-a3f5-427b-9f6d-9966e5a5ba07.mp3']
  },
  guide:{
    en:['../audio/voice-q/q_06_guide_en.mp3', 'https://d8j0ntlcm91z4.cloudfront.net/user_3GI37EwhNPEfYZaScuOAJmWbs2t/hf_20261001_032744_fc76677f-adf7-46f0-9785-4931f8dac531.mp3'],
    ko:['../audio/voice-q/q_06_guide_ko.mp3', 'https://d8j0ntlcm91z4.cloudfront.net/user_3GI37EwhNPEfYZaScuOAJmWbs2t/hf_20261001_032744_7f335e8d-b1ff-4a06-8714-92f6e74fee9f.mp3']
  },
  win:{
    en:['../audio/voice-q/q_06_win_en.mp3', 'https://d8j0ntlcm91z4.cloudfront.net/user_3GI37EwhNPEfYZaScuOAJmWbs2t/hf_20261001_033117_05f7a7c4-2220-4221-8324-aa567bf3b222.mp3'],
    ko:['../audio/voice-q/q_06_win_ko.mp3', 'https://d8j0ntlcm91z4.cloudfront.net/user_3GI37EwhNPEfYZaScuOAJmWbs2t/hf_20261001_033117_ebbafb3d-ee5e-4d88-9006-45cee2801f4e.mp3']
  }
};
const BAD_SRC = {};            /* 한 번 실패한 소스는 다시 시도하지 않는다 */
let lang = 'en', curAudio = null, speakTm = null;
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
function stopVoice(){
  if(curAudio){ curAudio.onended = curAudio.onerror = curAudio.onplaying = null; curAudio.pause(); curAudio = null }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  clearTimeout(speakTm);
}
function speakTTS(l, text, hooks){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (l === 'ko') ? 'ko-KR' : 'en-US';
    u.rate = .92; u.pitch = 1.25;       /* 원본 폴백 값 */
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.indexOf(l) === 0);
    if(v) u.voice = v;
    sayFlag(true);
    clearTimeout(speakTm);
    u.onstart = () => { if(hooks.start) hooks.start() };
    u.onend = () => { sayFlag(false); if(hooks.end) hooks.end() };
    u.onerror = () => { sayFlag(false); if(hooks.end) hooks.end() };
    speakTm = setTimeout(() => sayFlag(false), 12000);
    speechSynthesis.speak(u);
  }catch(e){ sayFlag(false) }
}
function playChain(list, i, l, text, hooks){
  if(i >= list.length){ speakTTS(l, text, hooks); return }
  const src = list[i], a = new Audio(src);
  curAudio = a;
  let moved = false, tm = null;
  const next = () => {
    if(moved || curAudio !== a) return;
    moved = true; clearTimeout(tm); BAD_SRC[src] = 1; curAudio = null;
    a.onended = a.onerror = a.onplaying = null;
    playChain(list, i + 1, l, text, hooks);
  };
  tm = setTimeout(next, 3500);          /* 느린 네트워크 — 3.5s 안에 시작 못 하면 다음 소스 */
  a.onplaying = () => {
    if(curAudio !== a) return;
    clearTimeout(tm); moved = true;
    sayFlag(true); clearTimeout(speakTm);
    speakTm = setTimeout(() => sayFlag(false), 15000);
    if(hooks.start) hooks.start();
  };
  a.onended = () => {
    if(curAudio !== a) return;
    curAudio = null; sayFlag(false);
    if(hooks.end) hooks.end();
  };
  a.onerror = next;
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    if(err && err.name === 'NotAllowedError'){ clearTimeout(tm); if(curAudio === a) curAudio = null; sayFlag(false); return }
    next();
  });
}
function say(l, key, hooks){
  l = l || lang; key = key || 'instr'; hooks = hooks || {};
  if(MUTE.on) return;
  stopVoice();
  const list = ((VOICE_SRC[key] || {})[l] || []).filter(s => !BAD_SRC[s]);
  playChain(list, 0, l, I18N[l][key], hooks);
}
function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.getElementById('lgEn').className = ko ? 'off' : 'on';
  document.getElementById('lgKo').className = ko ? 'on'  : 'off';
  const bl = document.getElementById('btnLang');
  bl.dataset.next = ko ? 'en' : 'ko';
  bl.setAttribute('aria-label', ko ? 'English' : '한국어');
  paintMute();
  document.getElementById('talkTag').textContent  = t.tag;
  document.getElementById('talkLine').textContent = t.instr;
  document.getElementById('stepA').textContent = t.stepA;
  document.getElementById('stepB').textContent = t.stepB;

  document.querySelector('#retry span').textContent = t.retry;
  document.querySelector('#exit span').textContent  = t.exit;
  document.getElementById('rule').setAttribute('aria-label', t.pattern);
  boyEl.setAttribute('aria-label', t.howto);
  guideEl.setAttribute('aria-label', t.howto);
  document.getElementById('guideClose').setAttribute('aria-label', t.close);
  cells.forEach(c => c.setAttribute('aria-label', NAME[lang][c.dataset.code]));
  document.documentElement.lang = lang;
}

/* ============================================================
   7. 브리핑 · 가이드 · 상단 버튼 (B-2_04 v2 흐름)
   브리핑 끝: 음성 끝 +0.7s / 음성이 시작되지 않으면 7s / 900ms 이후 아무 데나 탭
   ============================================================ */
let briefing = true, briefTm = null, skipArmed = false, voiceOn = false, retried = false;
const guideOpen = () => guideEl.classList.contains('on');
function briefSay(){
  voiceOn = false;
  say(lang, 'instr', {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false;
  clearTimeout(idleTimer);
  path = []; paintCells(); renderLive();
  document.body.classList.add('is-briefing');
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
  briefSay();
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm);
  document.body.classList.remove('is-briefing');
  resetIdle();
}
/* 캡처 단계 — 같은 pointerdown 이 그리드(버블)에 닿기 전에 브리핑을 끝내야
   아이의 첫 스와이프가 '건너뛰기'로만 소모되지 않고 답으로도 들어간다 (원본 규칙) */
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.pp-ibtn, .boy, .guide, .win')) return;
  if(!voiceOn && !retried && !curAudio && !('speechSynthesis' in window && speechSynthesis.speaking)){
    retried = true;                     /* 자동재생이 막혀 무음이었다 — 첫 탭에서 한 번 다시 읽는다 */
    clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
    briefSay(); return;
  }
  if(skipArmed) endBriefing();
}, true);

function openGuide(){
  if(locked) return;
  clearTimeout(idleTimer);
  dragging = false; path = []; paintCells(); renderLive();
  guideEl.classList.add('on');
  say(lang, 'guide');
}
function closeGuide(){
  if(!guideOpen()) return;
  guideEl.classList.remove('on');
  stopVoice(); sayFlag(false);
  resetIdle();
}
/* 소년 — 브리핑 중이면 문제를 다시 읽고, 플레이 중이면 플레이 방법(가이드 팝업 §8.1 · §8.5) */
boyEl.addEventListener('click', () => {
  SFX.tap();
  if(briefing){ briefSay(); return }
  openGuide();
});
document.getElementById('guideClose').addEventListener('click', () => { SFX.tap(); closeGuide() });
guideEl.addEventListener('pointerdown', e => { if(e.target === guideEl){ SFX.tap(); closeGuide() } });

/* 사운드 버튼 = 음소거 토글 (§4.1 · §11.4) */
function paintMute(){
  const L = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', L[lang][MUTE.on ? 'on' : 'off']);
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){
    SFX.tap();
    MUTE.on = true;
    stopVoice(); sayFlag(false);
    const c = SFX.ctx(); if(c && c.state === 'running') c.suspend();
  }else{
    MUTE.on = false;
    const c = SFX.ctx(); if(c && c.state === 'suspended') c.resume();
    if(winEl.classList.contains('on')){ SFX.bgm(false); SFX.bgm(true, 0) }
    SFX.tap();
  }
  paintMute();
});
document.getElementById('btnLang').addEventListener('click', e => {
  SFX.unlock(); SFX.tap();
  lang = e.currentTarget.dataset.next;
  applyLang();
  if(briefing) briefSay(); else say(lang, winEl.classList.contains('on') ? 'win' : guideOpen() ? 'guide' : 'instr');
});
document.getElementById('btnBack').addEventListener('click', () => { SFX.tap(); location.href = HOME; });
document.getElementById('exit').addEventListener('click',   () => { SFX.tap(); location.href = HOME; });
document.getElementById('retry').addEventListener('click',  () => { SFX.tap(); resetGame(); });

if('speechSynthesis' in window) speechSynthesis.getVoices();
applyLang();
paintStars();
startBriefing();
})();
</script>

<script>
/* 문제풀이 BGM — 개념별 공용 곡(puzzle-pattern-groove-loop). 첫 입력부터 반복 재생(자동재생 정책), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
(() => {
  const a = new Audio('../audio/bgm/puzzle-pattern-groove-loop.mp3');
  a.loop = true; a.preload = 'auto'; a.volume = .22;
  const $ = id => document.getElementById(id);
  const muted = () => { const b = $('btnSay') || document.querySelector('button[class*="soundButton"]'); return !!b && b.getAttribute('aria-pressed') === 'true' };
  const done = () => document.body.classList.contains('is-done') || !!document.querySelector('#win.on, [class*="_win_"]');
  let armed = false;
  const sync = () => {
    if(!armed) return;
    if(muted() || done() || document.hidden) a.pause();
    else if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}) }
  };
  let raf = 0; const soon = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; sync() }) };
  ['pointerdown','keydown'].forEach(t => window.addEventListener(t, () => { armed = true; sync() }, {passive:true}));
  document.addEventListener('visibilitychange', sync);
  new MutationObserver(soon).observe(document.body, {attributes:true, attributeFilter:['class','aria-pressed'], childList:true, subtree:true});
})();
</script>
