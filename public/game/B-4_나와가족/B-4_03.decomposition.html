<style>
/* ============================================================
   B-4_03 DECOMPOSITION — 우리 가족 찾기 (나와 가족)
   배경: 파란 하늘 · 구름 · 잔디 (assets/B-4_03-bg-v13.webp, 2688×1200 와이드 마스터)
   배경: Higgsfield 하늘·잔디·길 (assets/B-4_03-bg-v13.webp, B-4_02 와 같은 펠트 질감, 덤불줄·집 없음). 집·사람 13명: img_svg/B-4 의 SVG 를 그대로 쓰고 종이 질감(tx-felt)을 CSS mask+overlay 로 얹음. 이름은 텍스트(Paperlogy)
   안내 캐릭터: 종이 소년(B-2_02-boy-v5) — 브리핑 후 왼쪽 아래로 이동, 누르면 플레이 방법(가이드)
   집 크기 = B-4_02·04·06 의 플레이 영역(크림 판 x 209~1704 · y 158~1043u)과 같은 1495×885u, 해상도 정중앙
   플레이: 질문이 하나씩 나오고(B-3_03 처럼) 해당 사람을 톡 누른다. 타이핑 없음. 5문제 순서 고정
   좌표는 전부 아트보드 1920×1200u
   ============================================================ */
:root{
  --design-w:1920; --design-h:1200;
  --br-line:#76905F;           /* = --pp-green. 연결된 점과 같은 색 */
  --br-port:#E7B23C;           /* = --pp-gold */
  --br-port-on:#76905F;
  --br-ring:#FFFFFF;
  }
/* DESIGN.css 의 --pp-edge 는 --sp-gutter(단위 없음) 때문에 무효값 — 길이로 다시 잡는다 (B-2_05 v2 와 같음) */
.stage.theme-paper{--pp-edge:calc(28 * var(--u))}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#0B1722; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; touch-action:none}
body{display:grid; place-items:center}
img{user-select:none; -webkit-user-drag:none}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u));
  overflow:hidden; isolation:isolate}
.stage__bg{position:absolute; left:0; top:0; width:100%; height:100%; display:block; z-index:0}

/* ---------- 상단 크롬 §11.2 · §11.4 ---------- */
.pp-edge-tl,.pp-edge-tr,.pp-edge-tc{z-index:20}
.pp-ibtn svg{fill:currentColor}
.pp-ibtn--sound .sound-wave{fill:none; stroke:currentColor; stroke-width:2.8;
  stroke-linecap:round; stroke-linejoin:round}
#btnSay.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 집 — 가로 1495u (플레이 영역 폭). 그림 2335×1382(창 줄은 원본 비율 그대로, 지붕·벽 면만 세로로 늘림) ---------- */
.house{position:absolute; z-index:5; left:calc(210 * var(--u)); top:calc(171 * var(--u));   /* 집 SVG 1500u 폭 · 지붕 윗단~바닥 판(보이는 집 몸체)이 y 269~931u → 해상도 정중앙(600u) */
  width:calc(1500 * var(--u)); height:calc(737.7 * var(--u))}
/* SVG 그림 + 종이 질감: 그림 모양(mask)에만 tx-felt 를 overlay 로 얹는다 */
.art{position:absolute; inset:0; display:block; pointer-events:none; isolation:isolate;
  background:var(--svg) var(--bp,0 0)/var(--bs,100% 100%) no-repeat}
.art::after{content:''; position:absolute; inset:0; background:url("../img_png/paper/tx-felt.webp") 0 0/calc(96 * var(--u)) auto;
  mix-blend-mode:overlay; opacity:.95;
  -webkit-mask:var(--svg) var(--bp,0 0)/var(--bs,100% 100%) no-repeat; mask:var(--svg) var(--bp,0 0)/var(--bs,100% 100%) no-repeat}
/* 집은 면이 넓어 타일 반복(점 무늬 줄)이 보인다 — 서로 안 맞는 크기 두 겹으로 반복을 깨고 세기는 낮춘다 */
.art--house::after{background-size:calc(151 * var(--u)) auto; opacity:.55}
.art--house::before{content:''; position:absolute; inset:0; z-index:1; background:url("../img_png/paper/tx-felt.webp") calc(41 * var(--u)) calc(67 * var(--u))/calc(109 * var(--u)) auto;
  mix-blend-mode:overlay; opacity:.5;
  -webkit-mask:var(--svg) var(--bp,0 0)/var(--bs,100% 100%) no-repeat; mask:var(--svg) var(--bp,0 0)/var(--bs,100% 100%) no-repeat}
/* 이름판 글자 — DESIGN.css 폰트(--ff, Paperlogy) */
.nm{position:absolute; left:0; right:0; top:87.1%; height:auto; transform:translateY(-50%); text-align:center; pointer-events:none;
  font-family:var(--ff); font-weight:800; font-size:calc(22 * var(--u)); letter-spacing:.01em; line-height:1; color:#FFF6E6}
/* 사람 터치 영역 — 창문 하나(아치 + 이름판). 그림 위에 얹은 투명 버튼 */
.who{position:absolute; padding:0; border:0; background:none; cursor:pointer; z-index:2; isolation:isolate;
  border-radius:calc(72 * var(--u)) calc(72 * var(--u)) calc(8 * var(--u)) calc(8 * var(--u));
  transition:transform .2s var(--e-out)}
.who::after{content:''; position:absolute; inset:calc(-6 * var(--u)); border-radius:inherit; pointer-events:none;
  border:calc(7 * var(--u)) solid #FFD23F; opacity:0;
  box-shadow:0 0 calc(34 * var(--u)) calc(8 * var(--u)) rgba(255,205,90,.65)}
@media (hover:hover){.who:not(.is-ok):hover{transform:translateY(calc(-5 * var(--u)))}}
.who:active{transform:scale(.97)}
.who:focus-visible{outline:none}
.who.is-ok::after{opacity:1}
.who.is-hint::after{animation:whoHint 1.1s ease-in-out 3}
@keyframes whoHint{0%,100%{opacity:0}50%{opacity:1}}
.who.is-no{animation:whoShake .42s var(--e-out)}
@keyframes whoShake{0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(calc(-14*var(--u))) rotate(-1.6deg)}
  45%{transform:translateX(calc(12*var(--u))) rotate(1.2deg)}
  70%{transform:translateX(calc(-7*var(--u))) rotate(-.8deg)}}
.who.is-pop{animation:whoPop .56s var(--e-pop)}
@keyframes whoPop{0%{transform:scale(1)}22%{transform:scale(.96)}55%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- 소년 — v4 와 같은 자리 · 같은 브리핑 이동 ---------- */
.boy-slot .boy{pointer-events:auto}
.boy-slot{position:absolute; z-index:14; transform-origin:50% 100%;
  left:calc(817.6 * var(--u)); top:calc(709.3 * var(--u)); pointer-events:none;
  width:calc(284.8 * var(--u)); height:calc(470.3 * var(--u));
  transition:transform .62s var(--e-out)}
.boy{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; transition:transform var(--t-fast) var(--e-out)}
.boy img{width:100%; height:100%; display:block}
.boy:active{transform:scale(.96)}
.boy:focus-visible{outline:none}
.boy.is-cheer{animation:boyHop .9s var(--e-out) 2}
@keyframes boyHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-42*var(--u))) rotate(-3deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-20*var(--u))) rotate(2deg)}}
.boy.is-huh{animation:boyHuh .8s var(--e-out)}
@keyframes boyHuh{0%,100%{transform:rotate(0)}
  25%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}

/* ---------- 브리핑 §8.4 · §11.8 ----------
   소년 중심 x 136u → 960u : translateX 823.6u / scale 1.18 → 머리 top ≈ 625u
   말풍선 박스 바닥 = 머리 top − 93u = 532u → 말풍선 top = 296u (v4 와 같은 값) */
.veil{position:absolute; inset:0; z-index:12; background:var(--pp-veil);
  opacity:0; visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
/* 플레이 중 대기 모션 — 좌우로 살랑살랑 움직여 '눌러 봐' 하고 부른다 */
body:not(.is-briefing) .boy:not(.is-cheer):not(.is-huh){animation:boyCall 3.8s ease-in-out 1s infinite}
@keyframes boyCall{
  0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(calc(22*var(--u)),calc(-5*var(--u))) rotate(2.2deg)}
  50%{transform:translate(0,0) rotate(0)}
  75%{transform:translate(calc(-22*var(--u)),calc(-5*var(--u))) rotate(-2.2deg)}}
@media (prefers-reduced-motion:reduce){body:not(.is-briefing) .boy:not(.is-cheer):not(.is-huh){animation:none}}
body.is-briefing .boy-slot{z-index:16; transform:scale(1.18)}
body.is-briefing .boy{animation:boyTalk 1.5s var(--e-out) .5s infinite}
@keyframes boyTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-12*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}
.talk{top:calc(296*var(--u)); z-index:17; opacity:0; visibility:hidden;
  transform:translateY(calc(26*var(--u))) rotate(-1.4deg) scale(.94); transform-origin:50% 100%;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow), transform .5s var(--e-pop)}
#talkLine{white-space:pre-line}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none; transition-delay:.28s}
.guide{position:absolute; inset:0; z-index:35; display:grid; place-items:center;
  background:var(--pp-scrim); opacity:0; pointer-events:none;
  transition:opacity var(--t-base) var(--e-out)}
.guide.on{opacity:1; pointer-events:auto}
/* 가이드 시트 공통 규격 1200×700u · 내용 무조건 가운데(flex 열) — DESIGN.md §8.5 · §11.9 [stated] */
.guide__sheet{position:relative; width:calc(1200*var(--u)); height:calc(700*var(--u));
  padding:calc(54*var(--u)) calc(60*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(26*var(--u)); text-align:center;
  transform:scale(.88); transition:transform var(--t-slow) var(--e-pop)}
.guide.on .guide__sheet{transform:none}
.guide__sheet > :not(.guide__paper):not(.pp-round){position:relative; z-index:1}
.guide__paper{position:absolute; inset:0; z-index:0; pointer-events:none; filter:var(--pp-lift-l)}
.guide__rim,.guide__face{position:absolute}
.guide__rim{inset:calc(-10*var(--u)); background:var(--pp-rim);
  -webkit-mask:var(--pp-mask-rim) center/100% 100% no-repeat; mask:var(--pp-mask-rim) center/100% 100% no-repeat}
.guide__face{inset:0; background:var(--pp-cream) url("../img_png/paper/tx-paper-sheet.webp") center/100% 100% no-repeat;
  -webkit-mask:var(--pp-mask-sheet) center/100% 100% no-repeat; mask:var(--pp-mask-sheet) center/100% 100% no-repeat}
.gstep{display:flex; align-items:center; justify-content:center; gap:calc(18*var(--u));
  font-size:calc(44*var(--u)); font-weight:800; color:var(--pp-ink)}
.gstep i{flex:none; display:grid; place-items:center; width:calc(64*var(--u)); height:calc(64*var(--u));
  border-radius:50%; background:var(--pp-gold); color:var(--pp-gold-ink); font-style:normal;
  font-size:calc(37*var(--u))}
.gstep b{white-space:nowrap}
.garrow{width:calc(44*var(--u)); fill:var(--pp-teal)}


.guide .pp-round{position:absolute}
/* 정답 팝업 */
.rv{display:flex; align-items:center; justify-content:center; gap:calc(60*var(--u))}
.rv__pic{flex:none; width:calc(250*var(--u)); height:calc(339*var(--u)); position:relative;
  border-radius:calc(125*var(--u)) calc(125*var(--u)) calc(10*var(--u)) calc(10*var(--u));
  animation:rvPic .6s var(--e-pop) .1s both}
.rv__pic::after{display:none}
@keyframes rvPic{0%{opacity:0; transform:scale(.6) rotate(-6deg)}100%{opacity:1; transform:none}}
.rv__txt{display:flex; flex-direction:column; align-items:flex-start; gap:calc(10*var(--u)); max-width:calc(770*var(--u)); text-align:left}
.rv__chip{position:relative; isolation:isolate; display:grid; place-items:center; min-width:calc(190*var(--u)); height:calc(64*var(--u)); padding:0 calc(34*var(--u));
  color:var(--pp-gold-ink); font-weight:800; font-size:calc(34*var(--u)); letter-spacing:.02em}
.rv__chip::before{content:''; position:absolute; inset:0; z-index:-1;
  background-color:var(--pp-gold); background-image:url("../img_png/paper/tx-paper-grain.webp");
  background-size:calc(460 * var(--u)) calc(160 * var(--u)); background-blend-mode:overlay;
  -webkit-mask:var(--pp-mask-tag) center/100% 100% no-repeat; mask:var(--pp-mask-tag) center/100% 100% no-repeat}
.rv__clue{margin:calc(4*var(--u)) 0 calc(20*var(--u)); font-size:calc(36*var(--u)); font-weight:700; line-height:1.3; white-space:nowrap; color:var(--pp-ink); letter-spacing:-.02em; word-break:keep-all; text-wrap:balance}
.rv__lead{margin:0 0 calc(-14*var(--u)); font-size:calc(34*var(--u)); font-weight:600; line-height:1.2; color:var(--pp-ink); opacity:.78}
.rv__name{margin:0; font-size:calc(96*var(--u)); font-weight:800; line-height:1.1; letter-spacing:-.03em; color:var(--pp-ink);
  animation:rvName .5s var(--e-pop) .3s both}
@keyframes rvName{0%{opacity:0; transform:scale(.5) translateY(calc(14*var(--u)))}70%{transform:scale(1.08)}100%{opacity:1; transform:none}}

.rv__pic .nm{font-size:calc(43*var(--u))}
/* 반짝이 — v4 와 같은 별가루 */
.spark-bit{position:absolute; z-index:28; width:var(--s); height:var(--s);
  background:var(--c); pointer-events:none; border-radius:50%;
  animation:bitFly .78s var(--e-out) forwards}
.spark-bit.star{border-radius:0;
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes bitFly{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
  15%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05) rotate(var(--rot))}}

/* ---------- 완료 화면 §8.3 (v4 와 같은 값 · 일러스트만 날씨·행동 그림) ---------- */
.win{position:absolute; inset:0; z-index:60; display:flex; align-items:center;
  justify-content:center; background:var(--pp-scrim);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(1040*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u)));
  transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(200*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg, rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
          mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle, rgba(255,232,148,.85) 0%, rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}
/* 그림 아치 — 가운데가 가장 높다. 박스가 내용을 감싸야 아래 gap 이 실제 간격이 된다 */
/* 완료 일러스트 — B-2_03 v2 와 같은 이미지 · 같은 값 (소년 + 고양이 하이파이브, 종이 콜라주판) */
.win__art{position:relative; z-index:2; display:block; width:calc(600*var(--u)); height:auto;
  filter:drop-shadow(0 calc(12*var(--u)) calc(20*var(--u)) rgba(80,40,10,.28))}
.win.on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3.5%) rotate(-1.5deg)}60%{transform:translateY(-1.5%) rotate(1.5deg)}}
.win__stack .win__actions{position:relative; z-index:3}
.win__sparks{position:absolute; left:50%; top:calc(-40*var(--u)); transform:translateX(-50%);
  width:calc(760*var(--u)); height:calc(480*var(--u)); z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s);
  background:var(--c); opacity:0; animation:twinkle 2.4s var(--e-out) infinite;
  animation-delay:var(--d);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}
  35%{opacity:1; transform:scale(1) rotate(35deg)}
  70%{opacity:.35; transform:scale(.75) rotate(70deg)}}
.win__confetti{position:absolute; left:50%; top:calc(80*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h);
  background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}
  12%{opacity:1}70%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}



@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>

<body class="is-briefing">
<div class="stage__fill" aria-hidden="true" style="position:fixed;inset:0;background:linear-gradient(#8FCBEA 0 58%,#5C9B42 58% 100%);z-index:-1;pointer-events:none"></div>

<main class="stage theme-paper" id="stage">
  <img class="stage__bg" id="bg" alt="" src="assets/B-4_03-bg-v13.webp" style="--bgw:2688;--bgh:1200;--bgx:-384;--bgy:0">

  <!-- 상단 크롬 §11.2 · §11.4 -->
  <div class="pp-edge-tl">
    <button class="pp-ibtn" id="btnBack" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.1 2.9a2.4 2.4 0 0 0-3.4 0L4.6 11a1.4 1.4 0 0 0 0 2l8.1 8.1a2.4 2.4 0 1 0 3.4-3.4L10.1 12l6-6a2.4 2.4 0 0 0 0-3.1Z"/></svg>
    </button>
  </div>
  <div class="pp-edge-tr">
    <button class="pp-ibtn pp-ibtn--lang" id="btnLang" data-next="ko" aria-label="한국어">

    </button>
    <button class="pp-ibtn pp-ibtn--sound" id="btnSay" aria-label="Sound off" aria-pressed="false">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <path d="M3.5 10.2h4.1l5.3-4.3c.9-.7 2.2-.1 2.2 1.1v14c0 1.2-1.3 1.8-2.2 1.1l-5.3-4.3H3.5c-.8 0-1.5-.7-1.5-1.5v-4.6c0-.8.7-1.5 1.5-1.5Z"/>
        <path class="sound-wave" d="M18.2 10.7a4.6 4.6 0 0 1 0 6.6"/>
        <path class="sound-wave" d="M21.7 7.5a8.8 8.8 0 0 1 0 13"/>
        <path class="sound-wave sound-x" d="M18.4 10.4l6 6.8M24.4 10.4l-6 6.8"/>

<script>
(() => {
'use strict';
/* ============================================================
   1. 효과음 — B-2_02.sequencing_v4 SFX 모듈 그대로 (다른 화면과 소리가 같아야 한다)
   ============================================================ */
const MUTE = {on:false};
const SFX = (() => {
  let C = null, bgmBus = null, bgmOn = false, bgmAt = 0, bgmTm = null, noiseBuf = null;
  const ac = () => {
    if(MUTE.on) return null;           /* 음소거 중에는 새 소리를 만들지 않는다 */
    if(!C){
      try{ const AC = window.AudioContext || window.webkitAudioContext; C = new AC() }catch(e){ return null }
    }
    if(C.state === 'suspended') C.resume();
    return C;
  };
  function voice(freq, at, dur, o){
    o = o || {}; const c = ac(); if(!c) return;
    const t0 = c.currentTime + at, bus = o.bus || c.destination;
    const g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(o.cut || 5200, t0);
    const peak = o.gain || .12, atk = o.atk || .006;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    const osc = (type, mul, det) => {
      const s = c.createOscillator();
      s.type = type; s.frequency.setValueAtTime(freq * mul, t0);
      if(det) s.detune.setValueAtTime(det, t0);
      s.connect(g); s.start(t0); s.stop(t0 + dur + .04);
    };
    osc(o.type || 'sine', 1, 0);
    if(o.h2) osc('sine', 2, 4);
    g.connect(f); f.connect(bus);
  }
  const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));
  function swoosh(at, dur, f0, f1, gain){
    const c = ac(); if(!c) return;
    if(!noiseBuf){
      const n = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  }
  /* 오답 — 짧은 타격 뒤 음정이 크게 내려가는 두꺼운 경고음 */
  function wrongHit(){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime;
    const master = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.setValueAtTime(1.25, t0);
    lp.frequency.setValueAtTime(1800, t0);
    lp.frequency.exponentialRampToValueAtTime(620, t0 + .44);
    master.gain.setValueAtTime(.0001, t0);
    master.gain.exponentialRampToValueAtTime(.16, t0 + .008);
    master.gain.setValueAtTime(.14, t0 + .09);
    master.gain.exponentialRampToValueAtTime(.0001, t0 + .46);
    [
      {type:'square',   from:330, to:185, det:-5},
      {type:'sawtooth', from:220, to:110, det: 5}
    ].forEach(v => {
      const o = c.createOscillator();
      o.type = v.type; o.detune.setValueAtTime(v.det, t0);
      o.frequency.setValueAtTime(v.from, t0);
      o.frequency.exponentialRampToValueAtTime(v.to, t0 + .4);
      o.connect(master); o.start(t0); o.stop(t0 + .48);
    });
    master.connect(lp); lp.connect(c.destination);
    swoosh(0, .18, 1500, 260, .11);
    voice(98, .17, .32, {type:'triangle', gain:.13, atk:.004, cut:760, h2:true});
  }
  const C3=130.81, C4=261.63, G4=392, C5=523.25, E5=659.25, G5=784,
        C6=1046.5, E6=1318.5, G6=1568, C7=2093, E7=2637, G7=3136,
        A4=440, B4=493.88, D5=587.33, F5=698.46, A5=880, B5=987.77, D6=1174.7,
        F3=174.61, G3=196;
  const marimba = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'triangle', gain:gain, atk:.004, cut:4200, h2:true});
  const bell = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', gain:gain, atk:.004, cut:8000, h2:true});
  const BEAT = .28;
  const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
               [G5,2,.5],[E5,2.5,.5],[F5,3,1],[E5,4,.5],[D5,4.5,.5],
               [C5,5,.5],[E5,5.5,.5],[G5,6,1],[C5,7,1]];
  const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
  function bgmTone(freq, at, dur, type, gain){
    const c = ac(); if(!c || !bgmBus) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(bgmBus); o.start(at); o.stop(at + dur + .05);
  }
  function bgmLoop(){
    const c = ac(); if(!c || !bgmOn) return;
    if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;
    MEL.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'triangle', .055));
    BASS.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'sine', .045));
    bgmAt += 8 * BEAT;
    bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);
  }
  return {
    ctx(){ return C },
    unlock(){ ac() },
    tap(){ marimba(G5, 0, .14, .09) },
    step(i){ marimba([C5,D5,E5,G5,A5,C6][Math.min(i,5)], 0, .26, .11) },
    good(){ [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
            chord([C5,G5], .02, .5, {type:'triangle', gain:.05}) },
    bad(){ wrongHit() },
    clear(){ swoosh(0, .5, 700, 5200, .1);
             [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12)) },
    fanfare(){
      [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(m => marimba(m[0],m[1],m[2],.12));
      [[G5,.5,.14],[A5,.62,.14],[B5,.74,.14],[C6,.86,.3]]
        .forEach(m => marimba(m[0],m[1],m[2],.12));
      chord([C5,E5,G5,C6], 1.2, 1.1, {type:'triangle', gain:.07});
      [[E6,2.35,.4],[D6,2.6,.4],[C6,2.85,.55]]
        .forEach(m => bell(m[0],m[1],m[2],.10));
      chord([C5,E5,G5,C6], 3.5, 1.5, {type:'triangle', gain:.08});
      voice(C4, 3.5, 1.5, {type:'sine', gain:.07});
      [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(m => bell(m[0],m[1],m[2],.045));
    },
    bgmStart(delay){
      const c = ac(); if(!c) return;
      if(bgmOn) return;
      bgmOn = true;
      bgmBus = c.createGain(); bgmBus.gain.setValueAtTime(.9, c.currentTime);
      bgmBus.connect(c.destination);
      bgmAt = c.currentTime + (delay === undefined ? .35 : delay);
      bgmLoop();
    },
    bgmStop(){
      const c = ac(); bgmOn = false;
      if(bgmTm){ clearTimeout(bgmTm); bgmTm = null }
      if(bgmBus && c){
        const bus = bgmBus; bgmBus = null;
        try{
          const t0 = c.currentTime;
          bus.gain.setValueAtTime(bus.gain.value, t0);
          bus.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
        }catch(e){}
        setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
      }
    }
  };
})();


/* ============================================================

/* 문제 하나 = 브리핑(소년이 가운데로 나와 같은 자리 말풍선으로 문제를 냄) → 소년이 돌아가고 사람을 톡 → 정답 팝업 */
function startQuestion(i){

  /* 한 줄 유지 — 칸을 넘으면 글자만 줄인다 */
  cl.style.fontSize = ''; const box = cl.parentElement, max = box.clientWidth || box.getBoundingClientRect().width;
  if(cl.scrollWidth > max + 1) cl.style.fontSize = (parseFloat(getComputedStyle(cl).fontSize) * max / cl.scrollWidth) + 'px';
  document.getElementById('rvLead').textContent = q.lead[lang];
  document.getElementById('rvName').textContent = q.name;
}
function openReveal(i){
  revealIdx = i;
  const b = whoOf(QS[i].who), pic = document.getElementById('rvPic');
  ['--svg','--bs','--bp'].forEach(v => { const val = b.style.getPropertyValue(v); if(val) pic.style.setProperty(v, val); else pic.style.removeProperty(v) });
  document.getElementById('rvNm').textContent = b.getAttribute('aria-label');
  paintReveal();
  revealEl.classList.add('on');
  clearTimeout(revealTm); revealTm = setTimeout(closeReveal, MUTE.on ? 5000 : 16000);
  say(lang, 'ok' + (i + 1), {end(){ clearTimeout(revealTm); revealTm = setTimeout(closeReveal, 1800) }});
}
function closeReveal(){
  if(revealIdx === null) return;
  clearTimeout(revealTm); revealIdx = null;
  revealEl.classList.remove('on');
  stopVoice(); sayFlag(false);
  if(idx + 1 >= QS.length) setTimeout(finish, 350); else startQuestion(idx + 1);
}
document.getElementById('rvClose').addEventListener('click', () => { SFX.tap(); closeReveal() });
revealEl.addEventListener('pointerdown', e => { if(e.target === revealEl) closeReveal() });

function hintNow(){
  const b = whoOf(QS[idx].who); if(!b || b.classList.contains('is-ok')) return;
  b.classList.remove('is-hint'); void b.offsetWidth; b.classList.add('is-hint'); SFX.tap();
  setTimeout(() => b.classList.remove('is-hint'), 3500);
}
function armHint(){
  clearTimeout(hintTimer);
  if(locked || won || briefing) return;
  hintTimer = setTimeout(() => { hintNow(); armHint() }, 9000);
}
whoEls.forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); pick(b) }));

/* 소년 반응 */
let reactTm = null;
function react(kind){
  boyEl.classList.remove('is-cheer', 'is-huh'); void boyEl.offsetWidth;
  boyEl.classList.add(kind === 'cheer' ? 'is-cheer' : 'is-huh');
  clearTimeout(reactTm);
  reactTm = setTimeout(() => boyEl.classList.remove('is-cheer', 'is-huh'), 1900);
}

function burstAt(host){
  const colors = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#8ECFCB','#F7C8A0'];
  const r = host.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height * .35;
  const u = U(), N = 18;
  for(let i = 0; i < N; i++){
    const e = el('i', 'spark-bit' + (i % 3 ? ' star' : ''), stage);
    const ang = -Math.PI * (0.06 + 0.88 * (i / (N - 1)));
    const rad = (100 + (i % 4) * 30) * u;
    e.style.cssText = 'left:' + cx + 'px; top:' + cy + 'px;' +
      '--s:' + Math.round((9 + (i % 5) * 4) * u) + 'px; --c:' + colors[i % colors.length] + ';' +
      '--dx:' + (Math.cos(ang) * rad).toFixed(1) + 'px; --dy:' + (Math.sin(ang) * rad).toFixed(1) + 'px;' +
      '--rot:' + (i * 47 % 360) + 'deg; animation-delay:' + (i * 14) + 'ms';
    setTimeout(() => e.remove(), 900);
  }
}

/* ============================================================
   4. 완료 화면 §8.3
   ============================================================ */
(function buildSparks(){
  const box = document.getElementById('winSparks');
  const COLORS = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#8ECFCB','#F7C8A0'];
  let seed = 20260929;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const N = 18;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + rnd() * .18, rad = .40 + rnd() * .16;
    const e = el('i', 'spark', box);
    e.style.cssText = '--x:' + (50 + Math.cos(ang) * rad * 116) + '%; --y:' + (50 + Math.sin(ang) * rad * 136) + '%;' +
      '--s:calc(' + (14 + Math.round(rnd() * 22)) + '*var(--u)); --c:' + COLORS[i % COLORS.length] + ';' +
      '--d:' + (rnd() * 2.2).toFixed(2) + 's';
  }
})();
(function buildConfetti(){
  const box = document.getElementById('winConf');
  const C = ['#FDE751','#7FC7E8','#F28C3A','#8ECFCB','#FFFFFF','#76905F','#FFF6DF'];
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 250;
    const e = el('i', 'conf', box);
    e.style.cssText = '--w:calc(' + (12 + Math.round(rnd() * 12)) + '*var(--u)); --h:calc(' + (16 + Math.round(rnd() * 18)) + '*var(--u));' +
      '--c:' + C[i % C.length] + '; --r:' + (rnd() < .4 ? '50%' : 'calc(4*var(--u))') + ';' +
      '--dx:calc(' + (Math.cos(ang) * dist).toFixed(0) + '*var(--u)); --dy:calc(' + (Math.sin(ang) * dist - 60).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd() * 900 - 450) + 'deg; --d:' + (rnd() * .35).toFixed(2) + 's';
  }
})();
function finish(){
  won = true; clearTimeout(hintTimer);
  SFX.clear();
  winEl.classList.add('on');
  setTimeout(() => SFX.fanfare(), 120);
  setTimeout(() => say(lang, 'win'), 900);
  setTimeout(() => SFX.bgmStart(0), 3400);
}
function resetGame(){
  SFX.bgmStop(); stopVoice(); clearTimeout(revealTm); revealIdx = null;
  revealEl.classList.remove('on');
  winEl.classList.remove('on');
  won = false;
  whoEls.forEach(b => b.classList.remove('is-ok', 'is-hint', 'is-no', 'is-pop'));
  startQuestion(0);
}

/* ============================================================
   5. 음성 — 화면에서 나오는 모든 문장을 Pixie 녹음본으로 (DESIGN.md '생성 보이스 레지스트리')
      파일: ../audio/voice-q/q_b4_03_{키}_{en|ko}.mp3 — 없거나 읽지 못하면 같은 문장을 TTS 로 읽는다
      키: q1~q5 (질문) · ok1~ok5 (정답) · wrong · win
   ============================================================ */
let speakTm = null;
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
/* 음성 파일 없으면 TTS 로 대체 */
const voiceSrc = (l, key) => '../audio/voice-q/q_b4_03_' + key + '_' + l + '.mp3';
function textOf(l, key){
  let m;
  if((m = /^q(\d)$/.exec(key)))  return QS[+m[1] - 1].q[l];
  if((m = /^ok(\d)$/.exec(key))) return QS[+m[1] - 1].ok[l];
  return I18N[l][key];
}
let qAudio = null;
function stopVoice(){
  if(qAudio){ qAudio.onended = qAudio.onerror = qAudio.onplaying = null; qAudio.pause(); qAudio = null }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function speakTTS(l, text, hooks){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (l === 'ko') ? 'ko-KR' : 'en-US';
    u.rate = (l === 'ko') ? 1 : .95;
    u.pitch = 1.15;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.indexOf(l) === 0);
    if(v) u.voice = v;
    sayFlag(true);
    clearTimeout(speakTm);
    u.onstart = () => { if(hooks.start) hooks.start() };
    u.onend = () => { sayFlag(false); if(hooks.end) hooks.end() };
    u.onerror = () => { sayFlag(false); if(hooks.end) hooks.end() };
    speakTm = setTimeout(() => sayFlag(false), 12000);
    speechSynthesis.speak(u);
  }catch(e){ sayFlag(false) }
}
/* 녹음본 재생. 파일을 못 읽으면 TTS 로 넘기고,
   자동재생 차단(NotAllowedError)이면 조용히 멈춘다 — 브리핑의 첫 탭 재시도가 다시 부른다 */
function playVoiceFile(src, l, text, hooks){
  const a = new Audio(src);
  qAudio = a;
  let fell = false;
  const fallback = () => {
    if(fell || qAudio !== a) return;
    fell = true; qAudio = null;
    speakTTS(l, text, hooks);
  };
  a.onplaying = () => {
    if(qAudio !== a) return;
    sayFlag(true);
    clearTimeout(speakTm);
    speakTm = setTimeout(() => sayFlag(false), 15000);
    if(hooks.start) hooks.start();
  };
  a.onended = () => {
    if(qAudio !== a) return;
    qAudio = null; sayFlag(false);
    if(hooks.end) hooks.end();
  };
  a.onerror = fallback;
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    if(err && err.name === 'NotAllowedError'){ if(qAudio === a) qAudio = null; sayFlag(false); return }
    fallback();
  });
}
function say(l, key, hooks){
  l = l || lang;
  const text = textOf(l, key);
  if(!text || MUTE.on){ if(hooks && hooks.end) setTimeout(hooks.end, 600); return }
  hooks = hooks || {};
  stopVoice();
  playVoiceFile(voiceSrc(l, key), l, text, hooks);
}

function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.getElementById('lgEn').className = ko ? 'off' : 'on';
  document.getElementById('lgKo').className = ko ? 'on'  : 'off';
  const bl = document.getElementById('btnLang');
  bl.dataset.next = ko ? 'en' : 'ko';
  bl.setAttribute('aria-label', ko ? 'English' : '한국어');
  paintMute();
  paintTalk(); paintReveal();
  boyEl.setAttribute('aria-label', t.again);
  document.getElementById('rvClose').setAttribute('aria-label', t.close);
  document.getElementById('btnBack').setAttribute('aria-label', t.back);
  document.querySelector('#retry span').textContent = t.retry;
  document.querySelector('#exit span').textContent  = t.exit;
  document.documentElement.lang = lang;
}
/* 사운드 버튼 = 음소거 토글 (§4.1 · §11.4) */
function paintMute(){
  const L = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', L[lang][MUTE.on ? 'on' : 'off']);
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){
    SFX.tap();
    MUTE.on = true;
    stopVoice();
    sayFlag(false);
    const c = SFX.ctx(); if(c && c.state === 'running') c.suspend();
  }else{
    MUTE.on = false;
    const c = SFX.ctx(); if(c && c.state === 'suspended') c.resume();
    if(winEl.classList.contains('on')){ SFX.bgmStop(); SFX.bgmStart(0) }
    SFX.tap();
  }
  paintMute();
});
document.getElementById('btnLang').addEventListener('click', e => {
  SFX.unlock(); SFX.tap();
  lang = e.currentTarget.dataset.next;
  applyLang();
  if(revealIdx !== null) say(lang, 'ok' + (revealIdx + 1)); else if(briefing) briefSay(); else if(won) say(lang, 'win'); else say(lang, 'q' + (idx + 1));
});
document.getElementById('btnBack').addEventListener('click', () => { SFX.tap(); location.href = HOME; });
document.getElementById('exit').addEventListener('click',   () => { SFX.tap(); location.href = HOME; });
document.getElementById('retry').addEventListener('click',  () => { SFX.tap(); resetGame(); });
/* ============================================================
   6. 브리핑 (B-1_03 과 같은 흐름) — 문제마다 소년이 가운데로 나와 같은 자리(말풍선 top 296u)에서 문제를 낸다
   끝나는 조건: 음성이 끝남 / 음성이 시작되지 않으면 7s / 900ms 이후 아무 데나 탭
   ============================================================ */
let briefTm = null, skipArmed = false, voiceOn = false, retried = false;
function briefSay(){
  voiceOn = false;
  say(lang, 'q' + (idx + 1), {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false; retried = false;
  document.body.classList.add('is-briefing');
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, MUTE.on ? 3500 : 7000);
  setTimeout(briefSay, 350);
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm); stopVoice(); sayFlag(false);
  document.body.classList.remove('is-briefing');
  locked = false; armHint();
}
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.pp-ibtn, .boy, .win')) return;
  if(!voiceOn && !retried && !qAudio && !('speechSynthesis' in window && speechSynthesis.speaking)){
    retried = true;
    clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
    briefSay(); return;
  }
  if(skipArmed) endBriefing();
}, true);
/* 소년 — 누르면 지금 문제를 다시 말해 준다 */
boyEl.addEventListener('click', () => {
  SFX.tap();
  if(briefing){ briefSay(); return }
  if(won){ say(lang, 'win'); return }
  if(revealIdx !== null){ say(lang, 'ok' + (revealIdx + 1)); return }
  say(lang, 'q' + (idx + 1));
});

if('speechSynthesis' in window) speechSynthesis.getVoices();
applyLang();
startQuestion(0);
})();
</script>
<script>/* MAP-PROGRESS v1 — 완료 화면이 뜨면 맵(B-4_00.submain.html)에 완료 기록 */(function(){var ID='decomposition',K='ck.b4.sub.done';var done=false;function mark(){try{var a=JSON.parse(localStorage.getItem(K)||'[]');if(a.indexOf(ID)<0)a.push(ID);localStorage.setItem(K,JSON.stringify(a));localStorage.setItem('ck.b4.sub.just',ID)}catch(e){}}function chk(){if(done)return;if(document.querySelector('#win.on,#win.is-on,[class*="_exit_"]')){done=true;mark();mo.disconnect()}}var mo=new MutationObserver(chk);mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});})();</script>
<script>/* REACT-BRIDGE v1 — injected by scripts/sync-game.mjs, do not hand-edit */
(function(){
  var ID='decomposition', THEME='B-4', K='ck.b4.sub.done';
  var done=false;
  function notify(){
    if(done) return;
    if(document.querySelector('#win.on,#win.is-on,[class*="_exit_"]')){
      done = true;
      try{
        window.parent.postMessage({
          source: 'kindercoding-game',
          type: 'stageComplete',
          theme: THEME,
          stage: ID,
          key: K,
          ts: Date.now()
        }, '*');
      }catch(e){}
      mo.disconnect();
    }
  }
  var mo = new MutationObserver(notify);
  mo.observe(document.documentElement, {subtree:true, childList:true, attributes:true, attributeFilter:['class']});
})();
</script>

<script>
/* 문제풀이 BGM — 개념별 공용 곡(puzzle-decomposition-blocks-loop). 첫 입력부터 반복 재생(자동재생 정책), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
/* 문제풀이 BGM — 개념별 공용 곡(puzzle-decomposition-blocks-loop). 첫 입력부터 반복 재생(자동재생 정책), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
(() => {
  const a = new Audio('../audio/bgm/puzzle-decomposition-blocks-loop.mp3');
  a.loop = true; a.preload = 'auto'; a.volume = .22;
  const $ = id => document.getElementById(id);
  const muted = () => { const b = $('btnSay') || document.querySelector('button[class*="soundButton"]'); return !!b && b.getAttribute('aria-pressed') === 'true' };
  const done = () => document.body.classList.contains('is-done') || !!document.querySelector('#win.on, [class*="_win_"]');
  let armed = false;
  const sync = () => {
    if(!armed) return;
    if(muted() || done() || document.hidden) a.pause();
    else if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}) }
  };
  let raf = 0; const soon = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; sync() }) };
  ['pointerdown','keydown'].forEach(t => window.addEventListener(t, () => { armed = true; sync() }, {passive:true}));
  document.addEventListener('visibilitychange', sync);
  new MutationObserver(soon).observe(document.body, {attributes:true, attributeFilter:['class','aria-pressed'], childList:true, subtree:true});
})();
</script>
