<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Step B-3 · ALGORITHMS — 구름 보드 버전</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css">
<link rel="stylesheet" href="../DESIGN.css" type="text/css">
<style>
:root{ --b1-ink:#1F2937; --nb-teal:#2FA2AE; --nb-hl:#F2B632 }
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent}
body{display:grid; place-items:center; word-break:keep-all}
button{font:inherit; color:inherit}
img{user-select:none; -webkit-user-drag:none}
.stage{position:relative; z-index:1; width:calc(1920 * var(--u)); height:calc(1200 * var(--u)); overflow:visible; isolation:isolate; touch-action:manipulation}
.stage__bg{position:absolute; left:0; top:0; width:calc(1920*var(--u)); height:calc(1200*var(--u)); max-width:none; display:block; z-index:0}
.stage__fill{position:fixed; inset:0; width:100%; height:100%; max-width:none; display:block;
  object-fit:cover; object-position:center; z-index:0; pointer-events:none}
.pp-ibtn svg{fill:currentColor; stroke:none}
.pp-ibtn--sound .sound-wave{fill:none; stroke:currentColor; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round}
.pp-ibtn.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.pp-edge-tl>.pp-ibtn,.pp-edge-tr>.pp-ibtn{flex:none}

.fx{position:fixed; inset:0; z-index:70; pointer-events:none}
.fx .bit{position:absolute; border-radius:50%; animation:ph-spark .5s ease-out 1 both}
@keyframes ph-spark{0%{transform:translate(-50%,-50%) scale(.4); opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9); opacity:0}}
@keyframes ph-hint-shake{0%,100%{transform:translate(0)}14%{transform:translate(-8%)}38%{transform:translate(7%)}62%{transform:translate(-6%)}84%{transform:translate(4%)}}
@keyframes ph-bubble-pop{0%{transform:translateX(-50%) scale(.82)}55%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(1)}}

/* ---------- 종이 소년 ----------
   .boy-slot 이 자리·브리핑 이동(transform)을, 안쪽 .boy 가 반응 모션(transform)을 맡는다 (§8.1.1) */
.boy-slot{position:absolute; z-index:14; left:calc(50.7*var(--u)); bottom:calc(20.5*var(--u));
  width:calc(284.8*var(--u)); height:calc(470.2*var(--u)); transform-origin:50% 100%;
  transition:transform .62s var(--e-out)}
.boy{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; filter:var(--pp-lift-m); animation:boyIdle 6s ease-in-out infinite}
.boy > img{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain; object-position:50% 100%; pointer-events:none; filter:url(#ph-paper) saturate(1.2) contrast(1.05) brightness(1.02)}
.boy-slot::before{content:""; position:absolute; left:6%; right:6%; bottom:calc(-6*var(--u)); height:calc(34*var(--u)); border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(52,26,8,.55) 0%, rgba(52,26,8,.32) 45%, rgba(52,26,8,0) 72%); filter:blur(calc(3*var(--u))); pointer-events:none}
.boy:focus-visible{outline:none}
@keyframes boyIdle{0%,50%,100%{transform:none}
  25%{transform:translateY(calc(-5*var(--u))) rotate(1deg)}
  75%{transform:translateY(calc(-5*var(--u))) rotate(-1deg)}}
.boy.is-cheer{animation:boyHop .9s var(--e-out) 2}
@keyframes boyHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-34*var(--u))) rotate(-4deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-16*var(--u))) rotate(3deg)}}
.boy.is-huh{animation:boyHuh .8s var(--e-out)}
@keyframes boyHuh{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}60%{transform:rotate(7deg)}85%{transform:rotate(-3deg)}}

/* ---------- 브리핑 (§8.4) ----------
   소년이 화면 가운데 아래로 나와 커지고(바닥 -18u), 93u 위에 종이 말풍선이 뜬다.
   B-1_02 와 같은 크기·위치: 박스 x 50.7 · 바닥 20.5 · 284.8×470.2u, 브리핑 translateX 767u · ×1.18 → 말풍선 top 296u */
.veil{position:absolute; inset:0; z-index:12; background:var(--pp-veil);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
body.is-briefing .boy-slot{z-index:16; transform:translateX(calc(767*var(--u))) scale(1.18)}
body.is-briefing .boy{animation:boyTalk 1.5s var(--e-out) .5s infinite}
@keyframes boyTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-8*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}
.talk{top:calc(296*var(--u)); z-index:17; opacity:0; visibility:hidden;
  transform:translateY(calc(14*var(--u)));
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow), transform var(--t-slow) var(--e-out)}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none; transition-delay:.28s}

/* ---------- 완료 화면 (§8.3) ---------- */
.win{z-index:60; display:flex; align-items:center; justify-content:center; background:var(--pp-veil);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(900*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u))); transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(180*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg, rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%); mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle, rgba(255,232,148,.85) 0%, rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}
.win__art{position:relative; z-index:2; width:calc(360*var(--u)); height:calc(359*var(--u)); display:block;
  filter:drop-shadow(0 calc(12*var(--u)) calc(20*var(--u)) rgba(80,40,10,.28))}
.win__art .obj{width:100%; height:100%; filter:none}
.win.on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3.5%) rotate(-1.5deg)}60%{transform:translateY(-1.5%) rotate(1.5deg)}}
.win__stack .win__actions{position:relative; z-index:3}
.win__sparks{position:absolute; left:50%; top:calc(-76*var(--u)); transform:translateX(-50%);
  width:calc(600*var(--u)); height:calc(512*var(--u)); z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s);
  background:var(--c); opacity:0; animation:twinkle 2.4s var(--e-out) infinite; animation-delay:var(--d);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}35%{opacity:1; transform:scale(1) rotate(35deg)}70%{opacity:.35; transform:scale(.75) rotate(70deg)}}
.win__confetti{position:absolute; left:50%; top:calc(-100*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h); background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}12%{opacity:1}70%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}



/* 완료 화면 — B-2_03 과 동일: 소년+고양이 하이파이브 그림(600u), 광선·글로우 중심 268u, 반짝이 20u, 컨페티 150u */
.win__rays,.win__glow{top:calc(268*var(--u))}
.win__art{width:calc(600*var(--u)); height:auto}
.win__art img{display:block; width:100%; height:auto}
.win__sparks{top:calc(20*var(--u))}
.win__confetti{top:calc(150*var(--u))}
.spark.dot{clip-path:none; border-radius:50%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}


html,body{background:#78c8f5}
/* ---------- 가이드 팝업 §8.1 · §8.5 · §11.9 — B-2_01 과 같은 찢은 종이 시트 · 닫기 · 스텝 ----------
   소년을 누르면 열린다. 화면 전체(와이드 배경 포함)를 딤으로 덮는다. 닫기 = ✕ · 딤 탭 · Esc */
.guide{position:fixed; inset:0; z-index:35; display:grid; place-items:center;
  background:var(--pp-scrim); opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.guide.on{opacity:1; pointer-events:auto}
.guide__sheet{position:relative; width:calc(1200*var(--u)); height:calc(700*var(--u));
  padding:calc(54*var(--u)) calc(60*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(26*var(--u)); text-align:center;
  transform:scale(.88); transition:transform var(--t-slow) var(--e-pop)}
.guide.on .guide__sheet{transform:none}
.guide__sheet > :not(.guide__paper):not(.pp-round){position:relative; z-index:1}
.guide__paper{position:absolute; inset:0; z-index:0; pointer-events:none; filter:var(--pp-lift-l)}
.guide__rim,.guide__face{position:absolute}
.guide__rim{inset:calc(-10*var(--u)); background:var(--pp-rim);
  -webkit-mask:var(--pp-mask-rim) center/100% 100% no-repeat; mask:var(--pp-mask-rim) center/100% 100% no-repeat}
.guide__face{inset:0; background:var(--pp-cream) url("../img_png/paper/tx-paper-sheet.webp") center/100% 100% no-repeat;
  -webkit-mask:var(--pp-mask-sheet) center/100% 100% no-repeat; mask:var(--pp-mask-sheet) center/100% 100% no-repeat}
.gstep{display:flex; align-items:center; justify-content:center; gap:calc(18*var(--u));
  font-size:calc(44*var(--u)); font-weight:800; color:var(--pp-ink)}
.gstep i{flex:none; display:grid; place-items:center; width:calc(64*var(--u)); height:calc(64*var(--u));
  border-radius:50%; background:var(--pp-gold); color:var(--pp-gold-ink); font-style:normal; font-size:calc(37*var(--u))}
.gstep b{display:inline-flex; align-items:center; gap:calc(8*var(--u)); white-space:nowrap}
.gtri{flex:none; display:inline-grid; place-items:center; width:calc(54*var(--u)); height:calc(54*var(--u));
  border-radius:50%; background:#3DA468; vertical-align:middle}
.gtri svg{width:calc(22*var(--u)); height:calc(24*var(--u)); transform:translateX(calc(1.5*var(--u))); fill:#fff}
.garrow{width:calc(44*var(--u)); fill:var(--pp-teal)}
.gdemo{display:flex; align-items:center; justify-content:center; gap:calc(22*var(--u)); pointer-events:none}
.gdemo .pp-rbtn{cursor:default}
.gnext{width:calc(26*var(--u)); height:calc(32*var(--u)); fill:var(--pp-teal); opacity:.7}
.gdemo .bz-card .bz-ar{width:calc(52*var(--u)); height:calc(57*var(--u))}
.gpick{animation:gPick 2.4s var(--e-out) infinite}
@keyframes gPick{0%,60%,100%{transform:translateY(0)}12%,30%{transform:translateY(calc(-14*var(--u)))}}
.grail{padding:calc(14*var(--u)) calc(52*var(--u))}
.grail .rail__wood{border-width:0 calc(46*var(--u))}
.grail .track{grid-template-columns:repeat(3,calc(72*var(--u))); gap:calc(12*var(--u))}
.gslot-ar{position:absolute; inset:0; display:grid; place-items:center; color:#FFD23F; animation:gDrop 2.4s var(--e-out) infinite}
.gslot-ar .bz-ar{width:64%; height:64%}
@keyframes gDrop{0%,30%{opacity:0; transform:scale(.4)}40%{opacity:1; transform:scale(1.12)}48%,88%{opacity:1; transform:scale(1)}100%{opacity:0; transform:scale(1)}}
/* ② ▶ → 화살표 길을 따라 → 유치원 */
.garr{width:calc(46*var(--u)); height:calc(50*var(--u)); display:grid; place-items:center; color:var(--pp-teal);
  animation:gHop 2.4s var(--e-out) infinite}
.garr:nth-of-type(2){animation-delay:.2s}
.garr:nth-of-type(3){animation-delay:.4s}
.garr .bz-ar{width:100%; height:100%}
@keyframes gHop{0%,20%,60%,100%{transform:translateY(0)}35%{transform:translateY(calc(-12*var(--u)))}}
.gdest{flex:none; width:calc(96*var(--u)); height:calc(96*var(--u)); border-radius:50%; overflow:hidden;
  border:calc(6*var(--u)) solid #F7EBD1; background:#CDEAF5; filter:var(--pp-lift-s)}
.gdest img{display:block; width:100%; height:100%; object-fit:cover}
@media (prefers-reduced-motion: reduce){.gpick,.gslot-ar,.garr{animation:none}}


/* ============================================================
   B-3_01 ALGORITHMS — 동물이 자기 먹이를 먹도록 화살표 잇기 (구름 보드 버전)
   뼈대: B-1_01.algorithms_game (숲 배경 · 상단 크롬 · 종이 소년 브리핑 · 완료 화면)
   그림: 첨부 워크시트(Step B-3 ALGORITHMS) 오브젝트 그대로 — 동물 4 · 먹이 4 · 화살표
   칸: 길 대신 구름 5×5 (배경은 추후 하늘로 교체 예정이라 판 배경 없이 구름만 띄움)
   정답 예: 고양이 ↑ → → → 생선(고정 예시) / 개 · 토끼 · 원숭이는 직접 이어 준다
   ============================================================ */

/* ---------- 구름 보드 ---------- */
/* 그림자 약화(2026-10-08) — 이 화면에서만 들뜸 그림자 토큰을 약 55% 로 */
:root,.stage.theme-paper{--pp-lift-s:drop-shadow(0 calc(1.5*var(--u)) calc(1.5*var(--u)) rgba(46,28,10,.2));
  --pp-lift-m:drop-shadow(0 calc(2.5*var(--u)) calc(2.5*var(--u)) rgba(46,28,10,.2));
  --pp-lift-l:drop-shadow(0 calc(5*var(--u)) calc(6*var(--u)) rgba(10,20,26,.28))}
/* 말풍선 면 질감 — 460×160 결을 2.35배 늘려 깨져 보이던 것을, 시트 결(1020×630)을 거의 원본 배율로 깔도록 교체 */
.board{position:absolute; z-index:5; left:calc(335*var(--u)); top:calc(140*var(--u));
  width:calc(1000*var(--u)); height:calc(940*var(--u));
  display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr); gap:calc(20*var(--u))}
.cell{position:relative; padding:0; border:0; background:none; cursor:pointer; color:inherit;
  animation:cloudFloat 6.4s ease-in-out infinite; animation-delay:calc(var(--i) * -.83s)}
@keyframes cloudFloat{0%,100%{translate:0 0}50%{translate:0 calc(-6*var(--u))}}
.cell__cloud{position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible;
  shape-rendering:geometricPrecision;
  filter:var(--pp-lift-m); transition:transform var(--t-fast) var(--e-out), filter var(--t-fast)}
.cell__obj{position:absolute; left:50%; top:49%; transform:translate(-50%,-50%) rotate(var(--rot,0deg)); display:block; max-width:none;
  pointer-events:none; user-select:none}
.cell__obj--animal{top:50%}
.cell:focus-visible{outline:none}
@media (hover:hover){.cell.is-pick:hover .cell__cloud{transform:scale(1.04)}}

/* 지금 고른 동물 · 다음 화살표가 놓일 끝 · 목표 먹이 */
.cell.is-sel .cell__cloud{transform:scale(1.07); filter:drop-shadow(0 0 calc(5*var(--u)) #FFE27A) drop-shadow(0 0 calc(15*var(--u)) rgba(255,214,102,.95)) var(--pp-lift-m)}
.cell.is-sel .cell__obj{animation:selBob 1.1s ease-in-out infinite}
@keyframes selBob{0%,100%{translate:0 0}50%{translate:0 calc(-7*var(--u))}}
.cell.is-head .cell__cloud{filter:drop-shadow(0 0 calc(5*var(--u)) #FFE27A) drop-shadow(0 0 calc(14*var(--u)) rgba(255,214,102,.9)) var(--pp-lift-m); animation:headGlow 1.5s ease-in-out infinite}
@keyframes headGlow{0%,100%{opacity:.8}50%{opacity:1}}
.cell.is-target .cell__cloud{transform:scale(1.05)}
.cell.is-target .cell__obj{animation:selBob 1.4s ease-in-out infinite}
.cell.is-target::after{content:''; position:absolute; left:50%; top:48%; width:76%; aspect-ratio:1; border-radius:50%; transform:translate(-50%,-50%);
  pointer-events:none; box-shadow:0 0 0 0 rgba(255,226,122,.7); animation:tgtRing 1.7s var(--e-out) infinite}
@keyframes tgtRing{0%{box-shadow:0 0 0 0 rgba(255,226,122,.75)}100%{box-shadow:0 0 0 calc(30*var(--u)) rgba(255,226,122,0)}}
.cell.is-new .cell__obj{animation:arrowPop .46s cubic-bezier(.3,1.5,.4,1) 1}
@keyframes arrowPop{0%{scale:1.7; opacity:0}60%{scale:.9; opacity:1}100%{scale:1}}
.cell.is-shake{animation:cellWobble .45s ease-in-out 2}
@keyframes cellWobble{0%,100%{translate:0 0}20%{translate:calc(-9*var(--u)) 0}45%{translate:calc(9*var(--u)) 0}70%{translate:calc(-5*var(--u)) 0}}
.cell.is-eat .cell__obj{animation:eatHop .8s var(--e-out) 2}
@keyframes eatHop{0%,100%{translate:0 0}35%{translate:0 calc(-22*var(--u))}65%{translate:0 0}80%{translate:0 calc(-9*var(--u))}}
.cell.is-given{cursor:default}

/* ---------- 오른쪽 조작 영역 ---------- */
.chips{position:absolute; z-index:6; left:calc(1360*var(--u)); top:calc(178*var(--u)); width:calc(510*var(--u));

.chip{--cs:calc(20.4*var(--u));
  position:relative; height:calc(122*var(--u)); border:0; padding:0 calc(12*var(--u)); background:none; isolation:isolate;
  display:grid; grid-template-columns:calc(92*var(--u)) calc(32*var(--u)) calc(92*var(--u)); justify-content:center; justify-items:center; align-items:center;  gap:calc(6*var(--u)); cursor:pointer;
  filter:var(--pp-lift-s)}
.chip::before,.chip::after{content:''; position:absolute; inset:0; pointer-events:none}
.chip::before{z-index:0; border-radius:calc(24*var(--u)); background:#FFFFFF url("../img_png/paper/tx-paper-sheet.webp") center/100% auto no-repeat; background-blend-mode:multiply;
  filter:grayscale(1) brightness(1.06);
  -webkit-mask-box-image:var(--card-tx) 40 fill / var(--cs) stretch; mask-border:var(--card-tx) 40 fill / var(--cs) stretch}
.chip::after{display:none; z-index:1; border:var(--cs) solid transparent; border-image:var(--card-tx) 40 fill / var(--cs) stretch; mix-blend-mode:multiply; opacity:.5}
/* 선택 · 완료 = 컬러 펠트 버튼 / 비활성 = 흰 종이(tx-paper-sheet) */
.chip.is-sel::before,.chip.is-done::before{background:var(--tc,var(--cc)); filter:none}

.chip.is-sel::before{box-shadow:inset 0 0 0 calc(6*var(--u)) #F5B63C}
.chip img{position:relative; z-index:2; display:block; flex:none}
.chip__ar{width:calc(32*var(--u)); height:auto; opacity:.95}
.chip.is-sel .chip__ar,.chip.is-done .chip__ar{filter:brightness(0) invert(1)}
.chip.is-done .chip__ar{opacity:.5}
/* 완료 배지 — DESIGN.md §11.6 번호 배지: 골드 종이 원판 + 들뜸 그림자(--pp-lift-s), 안은 갈색 별 */
.chip__ok{position:absolute; z-index:3; right:calc(-10*var(--u)); top:calc(-16*var(--u)); width:calc(54*var(--u)); height:calc(54*var(--u));
  display:none; place-items:center; filter:var(--pp-lift-s)}
.chip.is-done .chip__ok{display:grid; animation:okPop .46s cubic-bezier(.3,1.5,.4,1) 1}
@keyframes okPop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.chip__disc{position:absolute; inset:0; display:block; background:#F5B63C; isolation:isolate;
  -webkit-mask:var(--pp-mask-disc) center/100% 100% no-repeat; mask:var(--pp-mask-disc) center/100% 100% no-repeat}
.chip__disc::after{content:''; position:absolute; inset:0; background:url("../img_png/paper/tx-felt.webp") center/calc(192*var(--u)) calc(192*var(--u)); mix-blend-mode:overlay; opacity:.55}
.chip__ok svg{position:relative; width:64%; height:64%; fill:#4A2F1B; stroke:#4A2F1B; stroke-width:2.2; stroke-linejoin:round}
.chip.is-given{cursor:default}

.pad{position:absolute; z-index:6; left:calc(1431*var(--u)); top:calc(508*var(--u));
  display:grid; grid-template-columns:repeat(3,calc(112*var(--u))); grid-template-rows:repeat(3,calc(112*var(--u))); gap:calc(16*var(--u))}
.pad .pp-rbtn{--size:112; --lift:calc(10*var(--u))}
.pad .bz-ar{width:56%; height:56%}
.pad .d-up{grid-area:1/2}.pad .d-left{grid-area:2/1}.pad .d-right{grid-area:2/3}.pad .d-down{grid-area:3/2}
.pad__mid{grid-area:2/2; align-self:center; justify-self:center; width:calc(54*var(--u)); height:calc(54*var(--u)); border-radius:50%;
  background:rgba(255,255,255,.55); box-shadow:inset 0 calc(3*var(--u)) 0 rgba(20,60,50,.18)}
.tools{position:absolute; z-index:6; left:calc(1495*var(--u)); top:calc(922*var(--u)); display:flex; gap:calc(40*var(--u))}
.bz-ar{width:58%; height:58%; fill:currentColor; display:block; transform-origin:50% 50%; transform:rotate(var(--ar-rot,0deg))}
.tools svg{width:calc(46*var(--u)); height:calc(46*var(--u)); overflow:visible}
.tools svg path{fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round}
.pad.is-off,.tools.is-off{opacity:.45; pointer-events:none}

/* 소년 — 왼쪽 아래 (브리핑 때 가운데로) */
.boy-slot{left:calc(40*var(--u)); bottom:calc(20*var(--u)); width:calc(242*var(--u)); height:calc(399.6*var(--u))}
body.is-briefing .boy-slot{transform:translateX(calc(799*var(--u))) scale(1.39)}

/* 가이드 팝업 데모 */
.gc{position:relative; flex:none; width:calc(132*var(--u)); height:calc(102*var(--u))}
.gc svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 calc(4*var(--u)) calc(4*var(--u)) rgba(28,84,110,.25))}
.gc img{position:absolute; left:50%; top:49%; transform:translate(-50%,-50%) rotate(var(--rot,0deg)); display:block}
.gc.is-tap{animation:gPick 2.4s var(--e-out) infinite}
.gc.is-tap svg{filter:drop-shadow(0 0 calc(5*var(--u)) #FFE27A) drop-shadow(0 0 calc(12*var(--u)) rgba(255,214,102,.9))}
.gdemo .pp-rbtn{--size:92; --lift:calc(8*var(--u))}
.gdemo .bz-ar{width:56%; height:56%}
@media (prefers-reduced-motion:reduce){.cell,.gc.is-tap{animation:none}}

<script>
(() => {
'use strict';
const MUTE = {on:false};
/* 배경음악 — B-3_01 전용 곡(신나는 하늘·구름 루프). 첫 사용자 입력부터 반복 재생(자동재생 정책 대응) */
const stageBgm = new Audio('../audio/bgm/B-3_01-sky-cloud-loop.mp3');
stageBgm.loop = true; stageBgm.preload = 'auto'; stageBgm.volume = .22;
function startStageBgm(){
  if(MUTE.on || document.hidden || document.body.classList.contains('is-done') || !stageBgm.paused) return;
  const p = stageBgm.play(); if(p && p.catch) p.catch(() => {});
}
function pauseStageBgm(){ stageBgm.pause() }
['pointerdown','keydown'].forEach(t => window.addEventListener(t, startStageBgm));
document.addEventListener('visibilitychange', () => { if(document.hidden) pauseStageBgm(); else startStageBgm() });
const SFX = (() => {
    let ctx = null, noiseBuf = null;
    const ac = () => {
      if(MUTE.on) return null;           /* 음소거 중에는 새 소리를 만들지 않는다 */
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    };

    /* ---------- 공용 보이스 ----------
       오실 2개(디튠 레이어) + 로우패스로 배음을 깎는다.
       단일 오실 삐 소리보다 마림바·글로켄에 가깝게 들린다 */
    function voice(freq, at, dur, o){
      const c = ac(); if(!c) return;
      o = o || {};
      const t0  = c.currentTime + at;
      const bus = o.bus || c.destination;
      const g = c.createGain(), f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.cut || Math.min(freq * 5 + 900, 11000), t0);
      f.Q.setValueAtTime(.7, t0);
      const peak = o.gain || .12, atk = o.atk || .006;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      f.connect(g); g.connect(bus);
      const osc = (type, mul, det) => {
        const s = c.createOscillator();
        s.type = type;
        s.frequency.setValueAtTime(freq * (mul || 1), t0);
        if(o.bend) s.frequency.exponentialRampToValueAtTime(freq * o.bend, t0 + dur * .8);
        s.detune.setValueAtTime(det || 0, t0);
        s.connect(f); s.start(t0); s.stop(t0 + dur + .05);
      };
      osc(o.type || 'sine', 1, 0);
      if(o.layer) osc(o.layer, o.mul || 2, o.detune || 6);
    }
    const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));

    /* 노이즈 스웹 — 화음 앞에 붙이면 '쨘' 하는 공기감이 생긴다 */
    function swoosh(at, dur, f0, f1, gain){
      const c = ac(); if(!c) return;
      if(!noiseBuf){
        const n = Math.floor(c.sampleRate * 1.2);
        noiseBuf = c.createBuffer(1, n, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        let s = 12345;
        for(let i = 0; i < n; i++){ s = (s*1103515245 + 12345) % 2147483648; d[i] = s/1073741824 - 1 }
      }
      const t0 = c.currentTime + at;
      const src = c.createBufferSource(); src.buffer = noiseBuf;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
      bp.frequency.setValueAtTime(f0, t0);
      bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .3);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      src.connect(bp); bp.connect(g); g.connect(c.destination);
      src.start(t0); src.stop(t0 + dur + .05);
    }

    const C3=130.81, C4=261.63, G4=392,
          C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99, A5=880, B5=987.77,
          C6=1046.5, D6=1174.7, E6=1318.5, F6=1396.9, G6=1568, A6=1760,
          C7=2093, E7=2637, G7=3136;
    const F3=174.61, G3=196;

    /* 마림바 — 짧은 어택, 배음 얇게 */
    const marimba = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'triangle', mul:2, detune:5,
                         gain:gain || .13, cut:f*4+700});
    /* 글로켄 — 밝고 길게 울린다 */
    const bell = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'sine', mul:3.01, detune:4,
                         gain:gain || .10, cut:f*7+2000});

    /* ---- BGM 스케줄러 ---- */
    let bgmOn = false, bgmTm = null, bgmBus = null, bgmAt = 0;
    const BEAT = .28;                       // 8박 = 2.24s 루프
    const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
                 [A5,2,.5],[G5,2.5,.5],[E5,3,.5],[G5,3.5,.5],
                 [F5,4,.5],[A5,4.5,.5],[C6,5,.5],[A5,5.5,.5],
                 [G5,6,.5],[E5,6.5,.5],[C5,7,1]];
    const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
    function bgmTone(freq, at, dur, type, gain){
      const c = ac(); if(!c || !bgmBus) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, at);
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(gain, at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, at + dur);
      o.connect(g); g.connect(bgmBus);
      o.start(at); o.stop(at + dur + .05);
    }
    function bgmLoop(){
      const c = ac(); if(!c || !bgmOn) return;
      if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;   // 밀렸으면 따라잡는다
      MEL.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'triangle', .055));
      BASS.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'sine', .045));
      bgmAt += 8*BEAT;
      bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);               // 다음 루프를 미리 예약
    }

    return {
      unlock(){ ac() },
      ctx(){ return ctx },

      /* 칸을 짚을 때 — 규칙과 맞으면 마림바가 한 칸씩 올라가고,
         어긋나면 낮고 둔한 나무 소리(경고음 아님) */
      tick(step, ok){
        if(ok) marimba([C5,E5,A5,C6][step] || C5, 0, .30, .13);
        else   voice(165, 0, .12, {type:'sine', gain:.075, cut:420});
      },

      /* 정답 1개 완성 — 글로켄 3음 + 낮은 화음으로 받쳐 준다 */
      correct(){
        [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
        voice(C4, .02, .5, {type:'sine', gain:.05, cut:900});
      },

      /* 5개 클리어 — 스웹 + 상승 마림바. 팝업 팡파르로 이어진다 */
      clear(){
        swoosh(0, .38, 500, 4200, .055);
        [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12));
        bell(C6, .40, .8, .09);
      },

      tap(){ voice(620, 0, .09, {type:'sine', gain:.10, cut:2200, bend:.66}) },
      hint(){ bell(D6, 0, .30, .085); bell(A6, .13, .38, .07) },

      /* ---- 팝업 팡파르 — 약 4.8초로 길게 이어진다 ----
         ① 콜(3연음) ② 상승 런 ③ 지속 화음 ④ 해결 멜로디 ⑤ 종결 화음 + 반짝임 */
      fanfare(){
        swoosh(0, .5, 400, 5200, .06);
        // ① 콜
        [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ② 상승 런
        [[G5,.46,.12],[A5,.55,.12],[B5,.64,.12],[C6,.73,.34]]
          .forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ③ 지속 화음
        chord([C5,E5,G5,C6], 1.00, 1.25, {type:'triangle', layer:'sine', mul:2, gain:.055, cut:5200});
        voice(C3, 1.00, 1.4, {type:'sine', gain:.055, cut:600});
        // ④ 해결 멜로디
        [[E6,1.12,.24],[D6,1.36,.24],[C6,1.60,.38],[G5,1.98,.32],
         [A5,2.32,.26],[B5,2.58,.26],[C6,2.84,.80]]
          .forEach(([f,a,d]) => bell(f,a,d,.10));
        // ⑤ 종결 화음 + 베이스 + 반짝임
        swoosh(3.42, .45, 900, 6000, .045);
        chord([C6,E6,G6], 3.50, 1.7, {type:'sine', layer:'triangle', mul:2, gain:.06, cut:8000});
        voice(C4, 3.50, 1.8, {type:'sine', gain:.05, cut:900});
        voice(C3, 3.50, 2.0, {type:'sine', gain:.05, cut:520});
        [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(([f,a,d]) => bell(f,a,d,.045));
      },

      /* ---- 승리 BGM — 2.24s 루프 (C-F-G 진행) ----
         파일 없이 합성한다. 팝업이 열려 있는 동안만 돌고 다시하기에서 멈춘다.
         delay: 팡파르가 잦아든 뒤 들어오도록 시작을 늦춘다 */
      bgm(on, delay){
        const c = ac(); if(!c) return;
        if(on){
          if(bgmOn) return;
          bgmOn = true;
          const d = (delay === undefined) ? .35 : delay;
          bgmBus = c.createGain();
          bgmBus.gain.setValueAtTime(.0001, c.currentTime);
          bgmBus.gain.setValueAtTime(.0001, c.currentTime + d);
          bgmBus.gain.exponentialRampToValueAtTime(1, c.currentTime + d + 1.1);
          bgmBus.connect(c.destination);
          bgmAt = c.currentTime + d;
          bgmLoop();
        }else{
          if(!bgmOn) return;
          bgmOn = false;
          clearTimeout(bgmTm); bgmTm = null;
          const bus = bgmBus; bgmBus = null;
          if(bus){
            const t0 = c.currentTime;
            bus.gain.cancelScheduledValues(t0);
            bus.gain.setValueAtTime(Math.max(bus.gain.value, .0001), t0);
            bus.gain.exponentialRampToValueAtTime(.0001, t0 + .4);
            setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
          }
        }
      }
    };
  })();

/* B-2_01 과 같은 짧은 사인파 효과음 — 되감기·삭제·실행 */
const CHIME_FREQUENCY = {up:720, down:470, left:540, right:620, pick:880, remove:340, play:680};
let audioCtx = null;
function chime(kind){
  if(MUTE.on) return;
  if(!audioCtx){
    if(typeof AudioContext === 'undefined') return;
    audioCtx = new AudioContext();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const f = CHIME_FREQUENCY[kind], osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  if(kind === 'pick') osc.frequency.exponentialRampToValueAtTime(f * 1.5, now + .16);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.linearRampToValueAtTime(.2, now + .012);
  gain.gain.exponentialRampToValueAtTime(.0001, now + .3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + .34);
}

const NAT = {"carrot": [140, 215], "fish": [199, 105], "cat": [187, 179], "dog": [234, 152], "rabbit": [119, 212], "banana": [190, 171], "monkey": [234, 214], "bone": [226, 103], "arrow": [144, 115]};                       /* 스프라이트 원본 px (워크시트 타일 1칸 = 312×242) */

const VEC = {right:[1,0], down:[0,1], left:[-1,0], up:[0,-1]};
const R = 5, C = 5;
const POS = {carrot:[0,0], fish:[0,4], cat:[1,1], dog:[1,2], rabbit:[2,2], banana:[2,3], monkey:[4,0], bone:[4,2]};
const PAIRS = [
  {id:'cat',    food:'fish',   color:'#1CA1B3', given:['up','right','right','right']},

  {id:'rabbit', food:'carrot', color:'#6C6FB2'},
  {id:'monkey', food:'banana', color:'#4598CF'}
];
const PAIR = Object.fromEntries(PAIRS.map(p => [p.id, p]));
const OBJ_AT = {}; Object.entries(POS).forEach(([k, v]) => { OBJ_AT[v[0] + ',' + v[1]] = k });

  }
};

let lang = 'en', phase = 'brief';           /* brief · play · run · done */
let moves = {}, done = {}, sel = null;
const $ = id => document.getElementById(id);
const guideEl = $('guide');
const guideOpen = () => guideEl.classList.contains('on');
const stage = $('stage'), boyEl = $('boy'), winEl = $('win'), btnSay = $('btnSay'), fx = $('fx'),
      boardEl = $('board'), chipsEl = $('chips'), padEl = $('pad'), toolsEl = $('tools');
const timers = new Set();
const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn() }, ms); timers.add(t); return t };
const clearLater = () => { timers.forEach(clearTimeout); timers.clear() };

/* ---------- 색 ---------- */
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
const TONE_WHITE = {hi:'#FFFFFF', lo:'#F1F2EE', rim:'#D5DAD5'};
const toneOf = c => ({hi:mix(c, '#FFFDF5', .22), lo:mix(c, '#000000', .12), rim:mix(c, '#000000', .23)});
const tonePath = c => ({hi:'#FFFFFF', lo:mix(c, '#FFFFFF', .72), rim:mix(c, '#000000', .08)});
const toneStyle = t => '--hi:' + t.hi + ';--lo:' + t.lo + ';--rim:' + t.rim;
const CLOUD = '<use href="#cloud" width="312" height="242"/>';
const TILE = '<use href="#felt-tile" width="312" height="242"/>';
/* 동물 칸 — 컬러 펠트 종이 타일: 면은 동물 색, 테두리는 한 단 연한 반투명 */
/* 면 색 = 동물 색 그대로 보이게(결 multiply 평균 .86 보정) · 나머지 칸은 흰색 */
const boost = c => '#' + hex(c).map(v => Math.min(255, Math.round(v / .86)).toString(16).padStart(2, '0')).join('');
const tileHtml = c => '<span class="cell__cloud" aria-hidden="true"><i class="cell__tile" style="--tc:' + (c ? boost(c) : '#FFFFFF') + ';--tx:' + (c ? 1 : .32) + '"></i></span>';
const WHITE_STYLE = '--face:#FFFFFF;--rim:#E4EBEE';
const PAPER = '<use href="#paper-tile" width="312" height="242"/>';
const feltStyle = c => '--face:' + mix(c, '#000000', .10) + ';--rim:' + mix(c, '#FFFFFF', .22);
/* 동물은 컬러 종이 칸의 중심에 크게 보이도록 종류별 비율을 맞춘다. */
const ANIMAL_SCALE = {cat:.68, dog:.66, rabbit:.68, monkey:.67};
const spr = (key, rot) => {
  const n = NAT[key], scale = ANIMAL_SCALE[key] || K, animalClass = ANIMAL_SCALE[key] ? ' cell__obj--animal' : '';
  return '<img class="cell__obj' + animalClass + '" alt="" draggable="false" src="' + IMG[key] + '" style="width:calc(' + (n[0] * scale).toFixed(1) + '*var(--u));height:calc(' + (n[1] * scale).toFixed(1) + '*var(--u))' + (rot ? ';--rot:' + rot + 'deg' : '') + '">';
};

/* ---------- 상태 ---------- */
function walk(id){
  let cur = POS[id].slice(); const cells = [];
  (moves[id] || []).forEach(d => { cur = [cur[0] + VEC[d][1], cur[1] + VEC[d][0]]; cells.push(cur.slice()) });
  return {cells, head:cur};
}
function arrowMap(){                                  /* 'r,c' → {id, dir} — 먹이 칸에 닿는 마지막 화살표는 그리지 않는다 */
  const m = {};
  PAIRS.forEach(p => {
    const w = walk(p.id), food = POS[p.food];
    w.cells.forEach((c, i) => { if(c[0] === food[0] && c[1] === food[1]) return; m[c[0] + ',' + c[1]] = {id:p.id, dir:moves[p.id][i]} });
  });
  return m;
}
function initState(){
  moves = {}; done = {};
  PAIRS.forEach(p => { moves[p.id] = p.given ? p.given.slice() : []; done[p.id] = !!p.given });
  sel = nextTodo();
}
const nextTodo = () => { const p = PAIRS.find(q => !done[q.id]); return p ? p.id : null };

/* ---------- 그리기 ---------- */
function buildBoard(){
  boardEl.innerHTML = '';
  for(let r = 0; r < R; r++) for(let c = 0; c < C; c++){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cell'; b.dataset.r = r; b.dataset.c = c; b.style.setProperty('--i', r * C + c);
    boardEl.appendChild(b);
  }
}
function paintBoard(newKey){
  const am = arrowMap(), w = sel ? walk(sel) : null;
  const food = sel ? POS[PAIR[sel].food] : null;
  [...boardEl.children].forEach(el => {
    const r = +el.dataset.r, c = +el.dataset.c, key = r + ',' + c, o = OBJ_AT[key], a = am[key];
    let tone = TONE_WHITE, inner = '';
    const pair = o ? PAIRS.find(p => p.id === o) : null;
    /* 이동경로 · 먹이 · 빈 칸은 흰색, 동물 칸만 동물 색 */
    inner = tileHtml(pair ? pair.color : null)
          + (o ? spr(o) : a ? '<img class="cell__obj" alt="" draggable="false" src="' + IMG.arrow + '" style="width:calc(' + (NAT.arrow[0] * .52).toFixed(1) + '*var(--u));height:calc(' + (NAT.arrow[1] * .52).toFixed(1) + '*var(--u));--rot:' + ROT[a.dir] + 'deg">' : '');
    if(el.dataset.sig !== inner){ el.innerHTML = inner; el.dataset.sig = inner }
    const isHead = !!w && !done[sel] && w.head[0] === r && w.head[1] === c && !pair;
    el.classList.toggle('is-sel', !!pair && pair.id === sel);
    el.classList.toggle('is-head', isHead);
    el.classList.toggle('is-target', !!food && !done[sel] && food[0] === r && food[1] === c);
    el.classList.toggle('is-pick', !!pair && !pair.given);
    el.classList.toggle('is-given', !!pair && !!pair.given);
    el.classList.toggle('is-new', key === newKey);
    el.setAttribute('aria-label', o ? o : a ? 'arrow ' + a.dir : 'cloud');
  });
  if(newKey) later(() => { const e = cellEl(newKey); if(e) e.classList.remove('is-new') }, 600);
}
const cellEl = key => { const [r, c] = key.split(',').map(Number); return boardEl.children[r * C + c] };
function paintChips(){
  chipsEl.innerHTML = '';
  PAIRS.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (p.id === sel ? ' is-sel' : '') + (done[p.id] ? ' is-done' : '') + (p.given ? ' is-given' : '');
    b.dataset.a = p.id; b.style.setProperty('--cc', p.color); b.style.setProperty('--tc', '#' + hex(p.color).map(v => Math.min(255, Math.round(v / .985)).toString(16).padStart(2, '0')).join(''));
    const h = k => 'height:calc(' + Math.min(74, NAT[k][1] * .31).toFixed(0) + '*var(--u))';
    const wdt = k => { const hh = Math.min(74, NAT[k][1] * .31); return 'width:calc(' + (NAT[k][0] * hh / NAT[k][1]).toFixed(0) + '*var(--u))' };
    b.innerHTML = '<img alt="" draggable="false" src="' + IMG[p.id] + '" style="' + h(p.id) + ';' + wdt(p.id) + '">'
      + '<img class="chip__ar" alt="" draggable="false" src="' + IMG.arrow + '">'
      + '<img alt="" draggable="false" src="' + IMG[p.food] + '" style="' + h(p.food) + ';' + wdt(p.food) + '">'
      + '<span class="chip__ok"><i class="chip__disc"></i><svg viewBox="0 0 24 24"><path d="M12 3.4l2.5 5.4 5.9.7-4.4 4 1.2 5.8L12 16.4 6.8 19.3 8 13.5 3.6 9.5l5.9-.7z"/></svg></span>';
    b.setAttribute('aria-label', p.id + ' → ' + p.food);
    chipsEl.appendChild(b);
  });
}
const render = newKey => { paintBoard(newKey); paintChips() };

/* ---------- 효과 ---------- */
function burstAt(el, colors){
  const rc = el.getBoundingClientRect(), x = rc.left + rc.width / 2, y = rc.top + rc.height / 2;
  for(let i = 0; i < 12; i++){
    const b = document.createElement('i'); b.className = 'bit';
    const ang = i / 12 * Math.PI * 2, dist = 50 + Math.random() * 40, s = 10 + Math.random() * 10;
    b.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + s + 'px;height:' + s + 'px;background:' + colors[i % colors.length] +
      ';--dx:' + (Math.cos(ang) * dist).toFixed(0) + 'px;--dy:' + (Math.sin(ang) * dist).toFixed(0) + 'px';
    fx.appendChild(b); setTimeout(() => b.remove(), 650);
  }
}
function shake(el){ if(!el) return; el.classList.remove('is-shake'); void el.offsetWidth; el.classList.add('is-shake'); later(() => el.classList.remove('is-shake'), 1000) }
function react(kind){
  boyEl.classList.remove('is-cheer', 'is-huh'); void boyEl.offsetWidth;
  boyEl.classList.add(kind === 'cheer' ? 'is-cheer' : 'is-huh');
  later(() => boyEl.classList.remove('is-cheer', 'is-huh'), 1900);
}

/* ---------- 조작 ---------- */
function select(id){
  if(phase !== 'play' || !PAIR[id]) return;
  if(PAIR[id].given){ const e = cellEl(POS[id][0] + ',' + POS[id][1]); shake(e); chime('remove'); return }
  sel = id; chime('pick'); render();
}
function move(d){
  if(phase !== 'play' || !sel) return;
  const p = PAIR[sel], w = walk(sel);
  const nr = w.head[0] + VEC[d][1], nc = w.head[1] + VEC[d][0];
  const from = cellEl(w.head[0] + ',' + w.head[1]);
  if(done[sel]){ shake(from); chime('remove'); return }
  if(nr < 0 || nr >= R || nc < 0 || nc >= C){ shake(from); chime('remove'); react('huh'); return }
  const key = nr + ',' + nc, food = POS[p.food];
  if(nr === food[0] && nc === food[1]){
    moves[sel].push(d); done[sel] = true; chime('pick');
    const fe = cellEl(key), ae = cellEl(POS[sel][0] + ',' + POS[sel][1]);
    burstAt(fe, ['#FFD23F', '#FF9D02', '#F291B9', '#FFFFFF', p.color]);
    ae.classList.add('is-eat'); fe.classList.add('is-eat'); later(() => { ae.classList.remove('is-eat'); fe.classList.remove('is-eat') }, 1700);
    sel = nextTodo(); render(); react('cheer'); speak('found', I18N[lang].found);
    if(!sel){ phase = 'run'; later(allDone, 1500) }
    return;
  }
  if(OBJ_AT[key] || arrowMap()[key]){ shake(cellEl(key)); chime('remove'); react('huh'); return }
  moves[sel].push(d); chime(d); render(key);
}
function undo(){
  if(phase !== 'play') return;
  const id = (sel && !PAIR[sel].given) ? sel : null;
  if(!id || !moves[id].length){ chime('remove'); return }
  moves[id].pop(); done[id] = false; chime('remove'); render();
}
function resetBoard(){
  if(phase !== 'play') return;
  initState(); chime('remove'); render();
}
padEl.addEventListener('click', e => { const b = e.target.closest('[data-d]'); if(b){ SFX.unlock(); if(phase === 'play' && sel) speak(b.dataset.d, I18N[lang].dir[b.dataset.d], null, 'q_01_'); move(b.dataset.d) } });
$('undo').addEventListener('click', () => { SFX.unlock(); undo() });
$('reset').addEventListener('click', () => { SFX.unlock(); resetBoard() });
chipsEl.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(b){ SFX.unlock(); select(b.dataset.a) } });
boardEl.addEventListener('click', e => {
  const el = e.target.closest('.cell'); if(!el || phase !== 'play') return;
  SFX.unlock();
  const r = +el.dataset.r, c = +el.dataset.c, o = OBJ_AT[r + ',' + c];
  if(o && PAIR[o]){ select(o); return }              /* 동물을 누르면 고르기 */
  if(!sel) return;
  const h = walk(sel).head, dr = r - h[0], dc = c - h[1];   /* 끝 칸 옆을 누르면 그쪽으로 한 칸 */
  if(Math.abs(dr) + Math.abs(dc) === 1) move(dr === -1 ? 'up' : dr === 1 ? 'down' : dc === -1 ? 'left' : 'right');
});
document.addEventListener('keydown', e => {
  if(guideOpen() || phase !== 'play') return;
  const m = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'}[e.key];
  if(m){ e.preventDefault(); move(m) } else if(e.key === 'Backspace' || e.key === 'z'){ undo() }
});

/* ---------- 완료 (§8.3) ---------- */
(function buildSparks(){
  const box = $('winSparks'), COLORS = ['#F9DF1F','#FEC925','#F38820','#F291B9','#94C13D','#9463D6','#FFFFFF'];
  let seed = 20261006;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const N = 18;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + rnd() * .18, rad = .40 + rnd() * .16, el = document.createElement('i');
    el.className = 'spark' + (rnd() < .35 ? ' dot' : '');
    el.style.cssText = '--x:' + (50 + Math.cos(ang) * rad * 116) + '%;--y:' + (50 + Math.sin(ang) * rad * 136) + '%;' +
      '--s:calc(' + (14 + Math.round(rnd() * 22)) + '*var(--u));--c:' + COLORS[i % COLORS.length] + ';--d:' + (rnd() * 2.2).toFixed(2) + 's';
    box.appendChild(el);
  }
})();
(function buildConfetti(){
  const box = $('winConf'), C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#EE3A44'];
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 250, el = document.createElement('i');
    el.className = 'conf';
    el.style.cssText = '--w:calc(' + (12 + Math.round(rnd() * 12)) + '*var(--u));--h:calc(' + (16 + Math.round(rnd() * 18)) + '*var(--u));' +
      '--c:' + C[i % C.length] + ';--r:' + (rnd() < .4 ? '50%' : 'calc(4*var(--u))') + ';' +
      '--dx:calc(' + (Math.cos(ang) * dist).toFixed(0) + '*var(--u));--dy:calc(' + (Math.sin(ang) * dist - 60).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd() * 900 - 450) + 'deg;--d:' + (rnd() * .35).toFixed(2) + 's';
    box.appendChild(el);
  }
})();



function allDone(){ phase = 'done'; later(finish, 300) }
function finish(){
  document.body.classList.add('is-done'); pauseStageBgm();
  winEl.classList.add('on'); winEl.setAttribute('aria-hidden', 'false');
  if(!MUTE.on){ SFX.fanfare(); SFX.bgm(true, 3.4) }
  winSay();
}
function resetGame(){
  SFX.bgm(false); stopVoice(); clearLater();
  winEl.classList.remove('on'); winEl.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('is-done');
  startGame();
}

/* ---------- 음성 — Pixie mp3(../audio/voice-q/q_b3_01_*) 우선, 없으면 TTS ---------- */
let curAudio = null, voiceTok = 0;
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
function stopTts(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel() }catch(e){} }
function stopVoice(){
  voiceTok++;
  if(curAudio){ curAudio.onended = curAudio.onerror = null; try{ curAudio.pause() }catch(e){} curAudio = null }
  stopTts(); sayFlag(false);
}
function tts(text, hooks, tok){
  hooks = hooks || {};
  if(!text || !('speechSynthesis' in window)){ if(hooks.blocked) hooks.blocked(); return false }
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ko' ? 'ko-KR' : 'en-US'; u.rate = lang === 'ko' ? 1.02 : .94; u.pitch = 1.13;
    u.onstart = () => { if(tok === voiceTok){ sayFlag(true); if(hooks.start) hooks.start() } };
    u.onend = u.onerror = () => { if(tok === voiceTok){ sayFlag(false); if(hooks.end) hooks.end() } };
    speechSynthesis.speak(u); return true;
  }catch(e){ if(hooks.blocked) hooks.blocked(); return false }
}
function speak(key, text, hooks, base){
  hooks = hooks || {};
  stopVoice();
  if(MUTE.on){ if(hooks.end) setTimeout(hooks.end, 1200); return false }
  const tok = voiceTok, a = new Audio('../audio/voice-q/' + (base || 'q_b3_01_') + key + '_' + lang + '.mp3');
  curAudio = a; a.preload = 'auto';
  let done = false;
  const fin = () => { if(done || tok !== voiceTok) return; done = true; curAudio = null; sayFlag(false); if(hooks.end) hooks.end() };
  const fallback = () => { if(done || tok !== voiceTok) return; done = true; curAudio = null; tts(text, hooks, tok) };
  a.addEventListener('ended', fin);
  a.addEventListener('error', fallback);
  a.addEventListener('playing', () => { if(tok === voiceTok){ sayFlag(true); if(hooks.start) hooks.start() } });
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    if(tok !== voiceTok || done) return;
    if(err && err.name === 'NotAllowedError'){ done = true; curAudio = null; if(hooks.blocked) hooks.blocked() }
    else fallback();
  });
  return true;
}
const winSay = () => speak('win', I18N[lang].win);

/* ---------- 언어 ---------- */
function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.documentElement.lang = lang;
  $('lgEn').className = ko ? 'off' : 'on'; $('lgKo').className = ko ? 'on' : 'off';
  $('btnLang').dataset.next = ko ? 'en' : 'ko'; $('btnLang').setAttribute('aria-label', ko ? 'English' : '한국어');
  $('btnBack').setAttribute('aria-label', ko ? '뒤로 가기' : 'Back');
  boyEl.setAttribute('aria-label', t.howto); guideEl.setAttribute('aria-label', t.howto);
  $('guideClose').setAttribute('aria-label', t.close);
  $('stepA').textContent = t.guideA; $('stepB').textContent = t.guideB;
  [...padEl.querySelectorAll('[data-d]')].forEach(b => b.setAttribute('aria-label', t.dir[b.dataset.d]));
  $('undo').setAttribute('aria-label', t.undo); $('reset').setAttribute('aria-label', t.reset);
  $('talkTag').textContent = t.tag; $('talkLine').textContent = t.brief;
$('retryTx').textContent = t.retry; $('exitTx').textContent = t.exit;
  paintMute();
}

/* ---------- 브리핑 (§8.2 · §8.4) ---------- */
let briefing = true, briefTm = null, skipArmed = false, voiceOn = false, retried = false;
function briefSay(){
  voiceOn = false;
  speak('brief', I18N[lang].brief, {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) },
    blocked(){ voiceOn = false }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false; retried = false; document.body.classList.add('is-briefing');
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, MUTE.on ? 3500 : 7000);
  setTimeout(briefSay, 350);
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm); stopVoice();
  document.body.classList.remove('is-briefing');
  phase = 'play'; render();
}
function startGame(){
  stopVoice(); clearTimeout(briefTm);
  phase = 'brief'; initState(); render(); applyLang();
  startBriefing(); startStageBgm();
}
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.pp-ibtn, .boy, .win')) return;
  if(!voiceOn && !retried && !(curAudio || ('speechSynthesis' in window && speechSynthesis.speaking))){
    retried = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000); briefSay(); return;
  }
  if(skipArmed) endBriefing();
}, true);

/* ---------- 소년 — 누르면 다시 설명 / 플레이 방법 팝업 ---------- */
boyEl.addEventListener('click', () => {
  if(briefing){ briefSay(); return }
  openGuide();
});
function openGuide(){
  if(guideOpen() || phase === 'run' || phase === 'done') return;
  guideEl.classList.add('on'); guideEl.setAttribute('aria-hidden', 'false');
  speak('guide', I18N[lang].guide);
}
function closeGuide(){
  if(!guideOpen()) return;
  guideEl.classList.remove('on'); guideEl.setAttribute('aria-hidden', 'true');
  stopVoice();
}
$('guideClose').addEventListener('click', () => { chime('remove'); closeGuide() });
guideEl.addEventListener('pointerdown', e => { if(e.target === guideEl) closeGuide() });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeGuide() });
(function buildGuideDemo(){
  const next = '<svg class="gnext" viewBox="0 0 26 32" aria-hidden="true"><path d="M4 2.5 23 16 4 29.5z"/></svg>';
  const mini = (key, tone, cls, rot, w, felt) => '<span class="gc' + (cls ? ' ' + cls : '') + '">' + tileHtml(felt || null)
    + '<img alt="" src="' + IMG[key] + '" style="width:calc(' + w + '*var(--u))' + (rot ? ';--rot:' + rot + 'deg' : '') + '"></span>';
  $('gdemoA').innerHTML = mini('dog', null, 'is-tap', 0, 80, '#A25B9F');
  $('gdemoB').innerHTML = mini('dog', null, '', 0, 80, '#A25B9F')
    + '<span class="pp-rbtn"><i class="pp-rbtn__face"></i><svg class="bz-ar" style="--ar-rot:0deg"><use href="#bz-arrow"/></svg></span>' + next
    + mini('arrow', TONE_WHITE, '', 0, 52) + mini('arrow', TONE_WHITE, '', 90, 52) + next + mini('bone', TONE_WHITE, '', 0, 84);
})();

/* ---------- 상단 버튼 ---------- */
function paintMute(){
  const L = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', L[lang][MUTE.on ? 'on' : 'off']);
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){ SFX.bgm(false); MUTE.on = true; stopVoice() }
  else{ MUTE.on = false; if(document.body.classList.contains('is-done')) SFX.bgm(true, 0) }
  paintMute();
  if(MUTE.on) pauseStageBgm(); else startStageBgm();
});
$('btnLang').addEventListener('click', e => {
  SFX.unlock();
  lang = e.currentTarget.dataset.next; applyLang();
  if(briefing) briefSay();
  else if(guideOpen()) speak('guide', I18N[lang].guide);
  else if(phase === 'done') winSay();
  else speak('brief', I18N[lang].brief);
});
const leave = () => { SFX.bgm(false); location.href = 'B-3_00.submain.html' };
$('btnBack').addEventListener('click', leave);
$('exit').addEventListener('click', leave);
$('retry').addEventListener('click', () => { resetGame() });

if('speechSynthesis' in window) speechSynthesis.getVoices();
{ const bi = new Image(); bi.alt = ''; bi.src = BOY; bi.draggable = false; boyEl.appendChild(bi) }
{ const wi = new Image(); wi.alt = ''; wi.src = '../img_png/complete-duo-paper-v4.png'; wi.draggable = false; $('winArt').appendChild(wi) }
buildBoard();
startGame();
})();
