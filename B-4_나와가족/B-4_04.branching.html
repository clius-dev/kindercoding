<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Step B-4 · BRANCHING — Feelings (Me and My Family)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css">
<link rel="stylesheet" href="../DESIGN.css" type="text/css">
<link rel="preload" href="assets/B-4_02-bg-home.webp" as="image">
<style>
/* ============================================================
   B-4_04 BRANCHING — If / Then 이어 주기 (나와 가족 · 일어난 일 → 내 기분)
   뼈대: B-2_04.branching_v2 (틸 펠트 판 5줄 · IF/THEN 칩 · 종이 소년 브리핑 · 가이드 · 완료 화면)
   플레이: B-1_04.branching 과 같음 (카드를 톡 · 톡 / 드래그로 잇기, 오답 흔들림, 8초 힌트,
           이은 쌍은 두 그림 + 문장 팝업, 카드를 누르면 그 카드 글을 읽어 줌)
   배경: B-4_02.sequencing 의 집 배경(assets/B-4_02-bg-home.webp, 크림 판) 그대로
   그림: 첨부 워크시트(Step B-4) 그림 그대로 — 흰 바탕만 투명 처리 (펠트 결 overlay 만 입힘, 색 보정 없음)
   좌표는 전부 아트보드 1920×1200u. 크림 판 안쪽 ≈ x 209~1704 · y 158~1043u (가운데 957, 600)
   ============================================================ */
:root{
  --design-w:1920; --design-h:1200;
  --br-line:#76905F;           /* = --pp-green. 연결된 점과 같은 색 */
  --br-port:#E7B23C;           /* = --pp-gold */
  --br-port-on:#76905F;
  --br-ring:#FFFFFF;
  }
/* DESIGN.css 의 --pp-edge 는 --sp-gutter(단위 없음) 때문에 무효값 — 길이로 다시 잡는다 (B-2_05 v2 와 같음) */
.stage.theme-paper{--pp-edge:calc(28 * var(--u))}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:#0B1722; overflow:hidden;
  font-family:var(--ff); -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; touch-action:none}
body{display:grid; place-items:center}
img{user-select:none; -webkit-user-drag:none}

/* ---------- 무대 ---------- */
.stage{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u));
  overflow:hidden; isolation:isolate}
.stage__bg{position:absolute; left:0; top:0; width:100%; height:100%; display:block; z-index:0}

/* ---------- 상단 크롬 §11.2 · §11.4 ---------- */
.pp-edge-tl,.pp-edge-tr,.pp-edge-tc{z-index:20}
.pp-ibtn svg{fill:currentColor}
.pp-ibtn--sound .sound-wave{fill:none; stroke:currentColor; stroke-width:2.8;
  stroke-linecap:round; stroke-linejoin:round}
#btnSay.is-playing{animation:sayPulse .9s ease-in-out infinite}
@keyframes sayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 연결선 ---------- */
.links{position:absolute; inset:0; z-index:3; width:100%; height:100%; overflow:visible; pointer-events:none}
.links .ln{fill:none; stroke-linecap:round; pointer-events:none}
.links .ln--core{stroke:var(--abs-line); stroke-width:10}
.links .hit{stroke:transparent; stroke-width:44; fill:none; cursor:pointer; pointer-events:stroke}
.links .ln--draft{stroke:var(--abs-line); stroke-width:10; opacity:.85;
  stroke-dasharray:22 16; animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-38}}
.links g.is-gone{animation:lnGone .3s var(--e-out) forwards}
@keyframes lnGone{to{opacity:0}}


/* ---------- 포트 — 흰 종이 테두리 + 골드 종이 점 (B-2_05 v2 와 같은 값) ---------- */
.port{position:absolute; z-index:4; width:calc(36 * var(--u)); height:calc(36 * var(--u));
  margin:calc(-18 * var(--u)) 0 0 calc(-18 * var(--u)); border-radius:50%; pointer-events:none;
  background:var(--br-ring) url("../_img_png/paper/tx-felt.webp") center/calc(96 * var(--u)) repeat;
  background-blend-mode:hard-light;
  transition:transform var(--t-fast) var(--e-pop)}
.port::after{content:''; position:absolute; inset:calc(5 * var(--u)); border-radius:50%;
  background:var(--br-port) url("../_img_png/paper/tx-felt.webp") center/calc(96 * var(--u)) repeat;
  background-blend-mode:overlay;
  transition:background-color var(--t-fast)}
.port.is-on{transform:scale(1.12)}
.port.is-on::after{background-color:var(--br-port-on)}

/* 연결선 */
.links .ln--core{stroke:var(--br-line); stroke-width:10}
.links .ln--draft{stroke:var(--br-line); stroke-width:10; opacity:.85;
  stroke-dasharray:22 16; animation:dash .6s linear infinite}
.links .ln--draw{stroke-dasharray:var(--len); stroke-dashoffset:var(--len);
  animation:lnDraw .42s var(--e-out) forwards}
@keyframes lnDraw{to{stroke-dashoffset:0}}

/* ---------- 카드 — 틸 펠트 판 안에 아이콘 + 글자 라벨 ----------
   한 줄 = 틸 펠트 판 440×140u. 아이콘은 가운데(포트) 쪽, 라벨은 바깥쪽 — 왼쪽 열 [라벨 | 아이콘] ●, 오른쪽 열 ● [아이콘 | 라벨].
   판은 card-felt-teal 과 같은 재질의 가로형 카드 이미지(../_img_png/paper/card-felt-teal-wide-a/b.webp)를 그대로 쓴다. 판 전체가 터치 영역 */
.tile{position:absolute; z-index:6; padding:0 calc(26 * var(--u)); border:0; background:none; cursor:pointer;
  width:calc(480 * var(--u)); height:calc(140 * var(--u)); margin-top:calc(-70 * var(--u));
  display:flex; align-items:center; gap:calc(18 * var(--u)); font-family:var(--ff);
  isolation:isolate; transition:transform .2s var(--e-out)}
/* 종이 판 — 틸 펠트 카드(card-felt-teal)를 같은 재질로 가로로 긴 한 장으로 다시 만든 이미지 2종.
   1320×420(3배 해상도) = 440×140u 와 같은 비율이라 늘어나지 않는다. 가장자리 · 결 · 점 모두 이미지 그대로 */
.tile__paper{position:absolute; inset:0; z-index:-1; pointer-events:none; filter:var(--pp-lift-s);
  background:var(--card) center/100% 100% no-repeat}
.tile--l{flex-direction:row-reverse; text-align:right}
.tile--r{text-align:left}
.tile:focus-visible{outline:none}
@media (hover:hover){.tile:not(.is-done):hover{transform:translateY(calc(-6 * var(--u))) scale(1.02)}}
.tile:active{transform:scale(.98)}
.tile.is-armed{transform:translateY(calc(-8 * var(--u))) scale(1.03); z-index:7}
.tile.is-done{cursor:default}
/* 고른 카드 · 힌트 — 판 둘레로 번지는 빛 (.pp-slot.is-next 와 같은 빛) */
.tile::after{content:''; position:absolute; inset:calc(-4 * var(--u)); z-index:-2;
  border-radius:calc(30 * var(--u)); pointer-events:none; opacity:0;
  box-shadow:0 0 calc(40 * var(--u)) calc(10 * var(--u)) rgba(255,205,90,.62)}
.tile.is-armed::after{opacity:1}
.tile.is-hint::after{animation:ppNext 1.2s ease-in-out 3}
.tile.is-shake{animation:cardShake .42s var(--e-out)}
@keyframes cardShake{0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(calc(-16*var(--u))) rotate(-2deg)}
  45%{transform:translateX(calc(14*var(--u))) rotate(1.5deg)}
  70%{transform:translateX(calc(-8*var(--u))) rotate(-1deg)}}
/* 정답 — 판이 톡 튀어오름 (THEN 반응 모션) */
.tile.is-pop{animation:tilePop .56s var(--e-pop)}
@keyframes tilePop{0%{transform:scale(1)}22%{transform:scale(.95)}55%{transform:scale(1.05) rotate(-1deg)}100%{transform:scale(1)}}
/* 그림 칸 — 그림 비율대로 (가로 ≤150u · 세로 ≤112u). 크기는 makeTile 이 --aw/--ah 로 준다 */
.tile__art{position:relative; flex:0 0 auto; width:calc(var(--aw) * var(--u)); height:calc(var(--ah) * var(--u))}
.tile__label{flex:1 1 auto; color:var(--pp-cream); font-size:calc(29 * var(--u)); font-weight:700;
  line-height:1.2; letter-spacing:-.018em; word-break:keep-all; text-wrap:balance; pointer-events:none;
  text-shadow:0 calc(2 * var(--u)) calc(1 * var(--u)) rgba(23,58,69,.3)}

/* 열 제목 칩 IF / THEN — 골드 종이 조각 (.pp-tag 와 같은 마스크 · 결) */
.col-title{position:absolute; z-index:6; top:calc(181 * var(--u)); width:calc(190 * var(--u)); height:calc(64 * var(--u));
  margin-left:calc(-95 * var(--u)); display:grid; place-items:center; pointer-events:none;
  color:var(--pp-gold-ink); font-weight:800; font-size:calc(31 * var(--u)); letter-spacing:.02em; isolation:isolate}
.col-title::before{content:''; position:absolute; inset:0; z-index:-1;
  background-color:var(--pp-gold); background-image:url("../_img_png/paper/tx-paper-grain.webp");
  background-size:calc(460 * var(--u)) calc(160 * var(--u)); background-blend-mode:overlay;
  -webkit-mask:var(--pp-mask-tag) center/100% 100% no-repeat; mask:var(--pp-mask-tag) center/100% 100% no-repeat}

/* 종이 오브젝트 — 원본 그림 + 펠트 결(overlay)을 그림 모양으로 오려 얹는다 (§11.3) */
.obj{position:relative; display:block; width:100%; height:100%; isolation:isolate;
  filter:var(--pp-lift-s)}
.obj > img{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain}
.obj__tx{position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.95;
  background:url("../_img_png/paper/tx-felt.webp") 0 0/calc(96 * var(--u)) repeat;
  -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat}

/* 반짝이 — v4 와 같은 별가루 */
.spark-bit{position:absolute; z-index:28; width:var(--s); height:var(--s);
  background:var(--c); pointer-events:none; border-radius:50%;
  animation:bitFly .78s var(--e-out) forwards}
.spark-bit.star{border-radius:0;
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes bitFly{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
  15%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05) rotate(var(--rot))}}


/* ---------- 소년 — v4 와 같은 자리 · 같은 브리핑 이동 ---------- */
.boy-slot{position:absolute; z-index:14; transform-origin:50% 100%;
  left:calc(50.7 * var(--u)); top:calc(709.3 * var(--u));
  width:calc(284.8 * var(--u)); height:calc(470.3 * var(--u));
  transition:transform .62s var(--e-out)}
.boy{position:absolute; inset:0; padding:0; border:0; background:none; cursor:pointer;
  transform-origin:50% 100%; transition:transform var(--t-fast) var(--e-out)}
.boy img{width:100%; height:100%; display:block}
.boy:active{transform:scale(.96)}
.boy:focus-visible{outline:none}
.boy.is-cheer{animation:boyHop .9s var(--e-out) 2}
@keyframes boyHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-42*var(--u))) rotate(-3deg)}
  55%{transform:translateY(0) rotate(0)}
  75%{transform:translateY(calc(-20*var(--u))) rotate(2deg)}}
.boy.is-huh{animation:boyHuh .8s var(--e-out)}
@keyframes boyHuh{0%,100%{transform:rotate(0)}
  25%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}

/* ---------- 브리핑 §8.4 · §11.8 ----------
   소년 중심 x 193u → 960u : translateX 767u / scale 1.18 → 머리 top ≈ 625u
   말풍선 박스 바닥 = 머리 top − 93u = 532u → 말풍선 top = 296u (v4 와 같은 값) */
.veil{position:absolute; inset:0; z-index:12; background:var(--pp-veil);
  opacity:0; visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .veil{opacity:1; visibility:visible}
body.is-briefing .boy-slot{z-index:16; transform:translateX(calc(767*var(--u))) scale(1.18)}
body.is-briefing .boy{animation:boyTalk 1.5s var(--e-out) .5s infinite}
@keyframes boyTalk{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(calc(-12*var(--u))) rotate(-1.2deg)}
  60%{transform:translateY(0) rotate(.8deg)}}
.talk{top:calc(296*var(--u)); z-index:17; opacity:0; visibility:hidden;
  transform:translateY(calc(26*var(--u))) rotate(-1.4deg) scale(.94); transform-origin:50% 100%;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow), transform .5s var(--e-pop)}
body.is-briefing .talk{opacity:1; visibility:visible; transform:none; transition-delay:.28s}

/* ---------- 가이드 팝업 §8.1 · §8.5 · §11.9 — B-2_02 v4 와 같은 시트 · 닫기 · 스텝 ----------
   찢은 종이 시트 1200×700u — 마스크·면은 1020×630 원본을 100% 로 늘림(DESIGN.css --pp-mask-rim · --pp-mask-sheet · --pp-tx-sheet).
   mask 는 filter 뒤에 적용되므로 들뜸 그림자는 바깥 .guide__paper 에 건다(§11.13).
   닫기 = DESIGN.css .pp-round(§11.10). 데모만 이 화면 것 — ① 날씨 카드 고르기 ② 행동 카드에 잇기 */
.guide{position:absolute; inset:0; z-index:35; display:grid; place-items:center;
  background:var(--pp-scrim); opacity:0; pointer-events:none;
  transition:opacity var(--t-base) var(--e-out)}
.guide.on{opacity:1; pointer-events:auto}
/* 가이드 시트 공통 규격 1200×700u · 내용 무조건 가운데(flex 열) — DESIGN.md §8.5 · §11.9 [stated] */
.guide__sheet{position:relative; width:calc(1200*var(--u)); height:calc(700*var(--u));
  padding:calc(54*var(--u)) calc(60*var(--u));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(26*var(--u)); text-align:center;
  transform:scale(.88); transition:transform var(--t-slow) var(--e-pop)}
.guide.on .guide__sheet{transform:none}
.guide__sheet > :not(.guide__paper):not(.pp-round){position:relative; z-index:1}
.guide__paper{position:absolute; inset:0; z-index:0; pointer-events:none; filter:var(--pp-lift-l)}
.guide__rim,.guide__face{position:absolute}
.guide__rim{inset:calc(-10*var(--u)); background:var(--pp-rim);
  -webkit-mask:var(--pp-mask-rim) center/100% 100% no-repeat; mask:var(--pp-mask-rim) center/100% 100% no-repeat}
.guide__face{inset:0; background:var(--pp-cream) url("../_img_png/paper/tx-paper-sheet.webp") center/100% 100% no-repeat;
  -webkit-mask:var(--pp-mask-sheet) center/100% 100% no-repeat; mask:var(--pp-mask-sheet) center/100% 100% no-repeat}
.gstep{display:flex; align-items:center; justify-content:center; gap:calc(18*var(--u));
  font-size:calc(44*var(--u)); font-weight:800; color:var(--pp-ink)}
.gstep i{flex:none; display:grid; place-items:center; width:calc(64*var(--u)); height:calc(64*var(--u));
  border-radius:50%; background:var(--pp-gold); color:var(--pp-gold-ink); font-style:normal;
  font-size:calc(37*var(--u))}
.gstep b{white-space:nowrap}
.garrow{width:calc(44*var(--u)); fill:var(--pp-teal)}
/* 데모 카드 — 트레이 카드와 같은 빈 틸 펠트 판(--pp-tx-card) 위에 날씨 · 행동 그림 */
.gdemo{display:flex; align-items:center; justify-content:center; gap:calc(16*var(--u))}
.gcard{position:relative; display:grid; place-items:center;
  width:calc(126*var(--u)); height:calc(118*var(--u));
  background:url("../_img_png/paper/card-felt-teal.webp") center/100% 100% no-repeat; filter:var(--pp-lift-s)}
.gcard .obj{width:calc(100*var(--u)); height:calc(84*var(--u)); filter:none}
.gcard.pick{animation:gPick 2.4s var(--e-out) infinite}
@keyframes gPick{0%,60%,100%{transform:translateY(0)}20%,45%{transform:translateY(calc(-14*var(--u)))}}
/* ② 잇기 — 포트 두 개 사이로 선이 그려지고, 이어지면 포트가 초록 */
.glink{display:block; width:calc(210*var(--u)); height:calc(118*var(--u)); overflow:visible}
.glink path{fill:none; stroke:var(--br-line); stroke-width:10; stroke-linecap:round;
  stroke-dasharray:190; stroke-dashoffset:190; animation:gDraw 2.4s var(--e-out) infinite}
@keyframes gDraw{0%,12%{stroke-dashoffset:190; opacity:1}48%,88%{stroke-dashoffset:0; opacity:1}100%{stroke-dashoffset:0; opacity:0}}
.glink .ring{fill:var(--br-ring)}
.glink .dot{fill:var(--br-port); animation:gDot 2.4s var(--e-out) infinite}
.glink .dot--b{animation-name:gDotB}
@keyframes gDot{0%,12%{fill:var(--br-port)}14%,100%{fill:var(--br-port-on)}}
@keyframes gDotB{0%,46%{fill:var(--br-port)}48%,100%{fill:var(--br-port-on)}}

/* ---------- 짝 맞춤 팝업 — 선이 이어지면 두 그림 + IF / THEN 문장 (B-1_04 와 같은 값 · 가이드 시트 재사용) ---------- */
.pair{z-index:36}
.pair__pics{display:flex; align-items:center; justify-content:center; gap:calc(26*var(--u)); height:calc(200*var(--u))}
.ppic{position:relative; flex:none; height:calc(200*var(--u)); width:calc(200*var(--u)*var(--ar))}
.ppic .obj{filter:drop-shadow(0 calc(4*var(--u)) calc(4*var(--u)) rgba(60,40,10,.3))}
.plink{display:block; width:calc(190*var(--u)); height:calc(60*var(--u)); overflow:visible; flex:none}
.plink path{fill:none; stroke:var(--br-line); stroke-width:10; stroke-linecap:round; stroke-dasharray:170; stroke-dashoffset:170}
.guide.on .plink path{animation:lnDraw .5s var(--e-out) .25s forwards}
@keyframes lnDraw{to{stroke-dashoffset:0}}
.plink .ring{fill:var(--br-ring)} .plink .dot{fill:var(--br-port-on)}
.pair__rows{display:flex; flex-direction:column; align-items:flex-start; gap:calc(18*var(--u)); max-width:calc(1060*var(--u))}
.pair__row{display:flex; align-items:center; gap:calc(24*var(--u)); text-align:left}
.pchip{flex:none; display:grid; place-items:center; width:calc(124*var(--u)); height:calc(56*var(--u)); isolation:isolate;
  color:var(--pp-gold-ink); font-weight:800; font-size:calc(28*var(--u)); letter-spacing:.02em; position:relative}
.pchip::before{content:''; position:absolute; inset:0; z-index:-1;
  background-color:var(--pp-gold); background-image:url("../_img_png/paper/tx-paper-grain.webp");
  background-size:calc(460 * var(--u)) calc(160 * var(--u)); background-blend-mode:overlay;
  -webkit-mask:var(--pp-mask-tag) center/100% 100% no-repeat; mask:var(--pp-mask-tag) center/100% 100% no-repeat}
.pair__row b{font-size:calc(46*var(--u)); font-weight:800; color:var(--pp-ink); line-height:1.15; letter-spacing:-.025em}
#pairIf{color:#5d6a80}

/* ---------- 완료 화면 §8.3 (v4 와 같은 값 · 일러스트만 날씨·행동 그림) ---------- */
.win{position:absolute; inset:0; z-index:60; display:flex; align-items:center;
  justify-content:center; background:var(--pp-scrim);
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}
.win__stack{position:relative; width:calc(1040*var(--u)); display:flex; flex-direction:column;
  align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u)));
  transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute; left:50%; top:calc(200*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg, rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
          mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));

  70%{opacity:.35; transform:scale(.75) rotate(70deg)}}

<script>
(() => {
'use strict';
/* ============================================================
   1. 효과음 — B-2_02.sequencing_v4 SFX 모듈 그대로 (다른 화면과 소리가 같아야 한다)
   ============================================================ */
const MUTE = {on:false};
const SFX = (() => {
  let C = null, bgmBus = null, bgmOn = false, bgmAt = 0, bgmTm = null, noiseBuf = null;
  const ac = () => {
    if(MUTE.on) return null;           /* 음소거 중에는 새 소리를 만들지 않는다 */
    if(!C){
      try{ const AC = window.AudioContext || window.webkitAudioContext; C = new AC() }catch(e){ return null }
    }
    if(C.state === 'suspended') C.resume();
    return C;
  };
  function voice(freq, at, dur, o){
    o = o || {}; const c = ac(); if(!c) return;
    const t0 = c.currentTime + at, bus = o.bus || c.destination;
    const g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(o.cut || 5200, t0);
    const peak = o.gain || .12, atk = o.atk || .006;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    const osc = (type, mul, det) => {
      const s = c.createOscillator();
      s.type = type; s.frequency.setValueAtTime(freq * mul, t0);
      if(det) s.detune.setValueAtTime(det, t0);
      s.connect(g); s.start(t0); s.stop(t0 + dur + .04);
    };
    osc(o.type || 'sine', 1, 0);
    if(o.h2) osc('sine', 2, 4);
    g.connect(f); f.connect(bus);
  }
  const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));
  function swoosh(at, dur, f0, f1, gain){
    const c = ac(); if(!c) return;
    if(!noiseBuf){
      const n = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  }
  /* 오답 — 짧은 타격 뒤 음정이 크게 내려가는 두꺼운 경고음 */
  function wrongHit(){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime;
    const master = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.setValueAtTime(1.25, t0);
    lp.frequency.setValueAtTime(1800, t0);
    lp.frequency.exponentialRampToValueAtTime(620, t0 + .44);
    master.gain.setValueAtTime(.0001, t0);
    master.gain.exponentialRampToValueAtTime(.16, t0 + .008);
    master.gain.setValueAtTime(.14, t0 + .09);
    master.gain.exponentialRampToValueAtTime(.0001, t0 + .46);
    [
      {type:'square',   from:330, to:185, det:-5},
      {type:'sawtooth', from:220, to:110, det: 5}
    ].forEach(v => {
      const o = c.createOscillator();
      o.type = v.type; o.detune.setValueAtTime(v.det, t0);
      o.frequency.setValueAtTime(v.from, t0);
      o.frequency.exponentialRampToValueAtTime(v.to, t0 + .4);
      o.connect(master); o.start(t0); o.stop(t0 + .48);
    });
    master.connect(lp); lp.connect(c.destination);
    swoosh(0, .18, 1500, 260, .11);
    voice(98, .17, .32, {type:'triangle', gain:.13, atk:.004, cut:760, h2:true});
  }
  const C3=130.81, C4=261.63, G4=392, C5=523.25, E5=659.25, G5=784,
        C6=1046.5, E6=1318.5, G6=1568, C7=2093, E7=2637, G7=3136,
        A4=440, B4=493.88, D5=587.33, F5=698.46, A5=880, B5=987.77, D6=1174.7,
        F3=174.61, G3=196;
  const marimba = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'triangle', gain:gain, atk:.004, cut:4200, h2:true});
  const bell = (f, at, dur, gain) =>
    voice(f, at, dur, {type:'sine', gain:gain, atk:.004, cut:8000, h2:true});
  const BEAT = .28;
  const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
               [G5,2,.5],[E5,2.5,.5],[F5,3,1],[E5,4,.5],[D5,4.5,.5],
               [C5,5,.5],[E5,5.5,.5],[G5,6,1],[C5,7,1]];
  const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
  function bgmTone(freq, at, dur, type, gain){
    const c = ac(); if(!c || !bgmBus) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(bgmBus); o.start(at); o.stop(at + dur + .05);
  }
  function bgmLoop(){
    const c = ac(); if(!c || !bgmOn) return;
    if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;
    MEL.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'triangle', .055));
    BASS.forEach(m => bgmTone(m[0], bgmAt + m[1]*BEAT, m[2]*BEAT*.92, 'sine', .045));
    bgmAt += 8 * BEAT;
    bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);
  }
  return {
    ctx(){ return C },
    unlock(){ ac() },
    tap(){ marimba(G5, 0, .14, .09) },
    step(i){ marimba([C5,D5,E5,G5,A5,C6][Math.min(i,5)], 0, .26, .11) },
    good(){ [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
            chord([C5,G5], .02, .5, {type:'triangle', gain:.05}) },
    bad(){ wrongHit() },
    clear(){ swoosh(0, .5, 700, 5200, .1);
             [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12)) },
    fanfare(){
      [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(m => marimba(m[0],m[1],m[2],.12));
      [[G5,.5,.14],[A5,.62,.14],[B5,.74,.14],[C6,.86,.3]]
        .forEach(m => marimba(m[0],m[1],m[2],.12));
      chord([C5,E5,G5,C6], 1.2, 1.1, {type:'triangle', gain:.07});
      [[E6,2.35,.4],[D6,2.6,.4],[C6,2.85,.55]]
        .forEach(m => bell(m[0],m[1],m[2],.10));
      chord([C5,E5,G5,C6], 3.5, 1.5, {type:'triangle', gain:.08});
      voice(C4, 3.5, 1.5, {type:'sine', gain:.07});
      [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(m => bell(m[0],m[1],m[2],.045));
    },
    bgmStart(delay){
      const c = ac(); if(!c) return;
      if(bgmOn) return;
      bgmOn = true;
      bgmBus = c.createGain(); bgmBus.gain.setValueAtTime(.9, c.currentTime);
      bgmBus.connect(c.destination);
      bgmAt = c.currentTime + (delay === undefined ? .35 : delay);
      bgmLoop();
    },
    bgmStop(){
      const c = ac(); bgmOn = false;
      if(bgmTm){ clearTimeout(bgmTm); bgmTm = null }
      if(bgmBus && c){
        const bus = bgmBus; bgmBus = null;
        try{
          const t0 = c.currentTime;
          bus.gain.setValueAtTime(bus.gain.value, t0);
          bus.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
        }catch(e){}
        setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
      }
    }
  };
})();

   칩 top 181u · 줄 중심 333 ~ 949u. 두 열은 판 가운데 957u 기준 대칭(두 열 사이 480u) */
const ROW_Y = [333, 487, 641, 795, 949];
const X = { pl:777, pr:1137 };                          /* 포트 */
const ROW_LEFT = { l:267, r:1167 };                     /* 판(440u)의 왼쪽 끝 */

const I18N = {
  en:{ instr:"Let's connect what happens to how I feel!", tag:'QUESTION',
       wrong:"Oops, let's try again!", win:'Woohoo! You matched all five pairs! Great job!', retry:'PLAY AGAIN', exit:'EXIT',
       guide:'Tap a picture, then connect it to the feeling that goes with it!',
       stepA:'Tap a picture', stepB:'Connect it to the right feeling!', howto:'How to play', close:'Close', back:'Back'
      },
  ko:{ instr:'일어난 일이랑 알맞은 기분을 선으로 이어 보자!', tag:'문제',
       wrong:'앗, 다시 한번 해 보자!', win:'와, 짝을 다 찾았어! 정말 잘했다!', retry:'다시하기', exit:'나가기',
       guide:'그림을 톡 누르고, 어울리는 기분에 이어 줘!',
       stepA:'그림을 톡 눌러 봐', stepB:'알맞은 기분에 이어 줘!', howto:'플레이 방법', close:'닫기', back:'뒤로 가기'
      }
};

/* ============================================================
   3. 화면 만들기
   ============================================================ */
const stage  = document.getElementById('stage');
const board  = document.getElementById('board');
const links  = document.getElementById('links');
const starsEl= document.getElementById('stars');
const winEl  = document.getElementById('win');
const boyEl  = document.getElementById('boy');
const btnSay = document.getElementById('btnSay');
const guideEl= document.getElementById('guide');
const SVGNS  = 'http://www.w3.org/2000/svg';
const HOME   = 'B-4_00.submain.html';

let lang = 'en', tiles = [], matched = new Set(), armed = null, drag = null,
    draftEl = null, hintTimer = null, locked = false, lastKey = 'instr';

function el(tag, cls, parent){
  const n = document.createElement(tag); if(cls) n.className = cls;
  if(parent) parent.appendChild(n); return n;
}
function paperObj(parent, art){
  const o = el('span', 'obj', parent);
  o.style.setProperty('--m', 'url("' + ART[art] + '")');
  const im = el('img', '', o); im.alt = ''; im.src = ART[art]; im.draggable = false;
  el('i', 'obj__tx', o);
  return o;
}
function port(x, y, key){
  const p = el('i', 'port', board);
  p.style.left = 'calc(' + x + ' * var(--u))';
  p.style.top  = 'calc(' + y + ' * var(--u))';
  p.dataset.key = key; return p;
}
function makeTile(side, id, row){
  const it = ITEMS.find(x => x.id === id);
  const b = el('button', 'tile tile--' + side, board);
  b.style.left = 'calc(' + ROW_LEFT[side] + ' * var(--u))';
  b.style.top  = 'calc(' + ROW_Y[row] + ' * var(--u))';
  /* 카드 이미지 2종을 번갈아 — 점 무늬 자리가 서로 다르다 */
  b.style.setProperty('--card', 'url("../_img_png/paper/card-felt-teal-wide-' + ((row + (side === 'l' ? 0 : 1)) % 2 ? 'b' : 'a') + '.webp")');
  el('span', 'tile__paper', b);
  const key = side === 'l' ? it.art : it.act, ar = AR[key];
  let aw = 118 * ar, ah = 118; if(aw > 160){ aw = 160; ah = 160 / ar }
  const box = el('span', 'tile__art', b); box.style.setProperty('--aw', aw.toFixed(1)); box.style.setProperty('--ah', ah.toFixed(1));
  /* THEN 열 — 그림 자리를 105u 로 고정해 글자 시작선을 맞춘다(넓은 그림은 양옆으로 삐져나감) */
  /* IF 열은 그림 자리를 160u 로 고정 — 글자 끝선을 맞춘다 */
  { const slot = side === 'r' ? 105 : 160; if(side === 'l' && aw > slot){ ah *= slot / aw; aw = slot; box.style.setProperty('--aw', aw.toFixed(1)); box.style.setProperty('--ah', ah.toFixed(1)); } const m = ((slot - aw) / 2).toFixed(1) + ' * var(--u)'; box.style.marginLeft = 'calc(' + m + ')'; box.style.marginRight = 'calc(' + m + ')'; }
  paperObj(box, key);
  el('span', 'tile__label', b);
  const rec = {el:b, side, id, row};
  b.__rec = rec; tiles.push(rec); return rec;
}
function build(){
  tiles = [];
  [].slice.call(board.querySelectorAll('.tile,.port')).forEach(n => n.remove());
  links.innerHTML = '';
  for(let r = 0; r < 5; r++){
    makeTile('l', LEFT[r], r);
    makeTile('r', RIGHT[r], r);
    port(X.pl, ROW_Y[r], 'l' + LEFT[r]);
    port(X.pr, ROW_Y[r], 'r' + RIGHT[r]);
  }
  matched = new Set(); armed = null; lastKey = 'instr';
  labelTiles(); paintStars();
}
function labelTiles(){
  const t = I18N[lang];
  tiles.forEach(r => {
    const txt = ITEMS.find(x => x.id === r.id).lb[lang][r.side === 'l' ? 0 : 1];
    r.el.querySelector('.tile__label').textContent = txt;
    r.el.setAttribute('aria-label', txt + (matched.has(r.id) ? ' ✓' : ''));
  });
}
function paintStars(){ /* 진행 별 제거됨 — PROGRESS_STARS.md 참고 */ }
const tileOf = (side, id) => tiles.find(t => t.side === side && t.id === id);
function anchor(side, id){
  return side === 'l' ? [X.pl, ROW_Y[LEFT.indexOf(id)]] : [X.pr, ROW_Y[RIGHT.indexOf(id)]];
}

/* ============================================================
   4. 연결선
   ============================================================ */
function curve(a, b){
  const mx = (a[0] + b[0]) / 2;
  return 'M' + a[0] + ' ' + a[1] + ' C ' + mx + ' ' + a[1] + ', ' + mx + ' ' + b[1] + ', ' + b[0] + ' ' + b[1];
}
function addLink(id){
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('d', curve(anchor('l', id), anchor('r', id)));
  p.setAttribute('class', 'ln ln--core ln--draw');
  links.appendChild(p);
  const len = Math.ceil(p.getTotalLength());
  p.style.setProperty('--len', len);
  setPort('l' + id, true); setPort('r' + id, true);
}
function setPort(key, on){
  const p = board.querySelector('.port[data-key="' + key + '"]');
  if(p) p.classList.toggle('is-on', !!on);
}

/* ============================================================
   5. 입력 — 탭 · 탭 / 드래그 (B-2_05 v2 와 같은 규칙). 이은 쌍은 다시 풀지 않는다
   ============================================================ */
function toLocal(ev){
  const r = stage.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * 1920, (ev.clientY - r.top) / r.height * 1200];
}
function startDraft(rec, pt){
  clearDraft();
  const a = anchor(rec.side, rec.id);
  draftEl = document.createElementNS(SVGNS, 'path');
  draftEl.setAttribute('class', 'ln ln--draft');
  draftEl.setAttribute('d', curve(a, pt));
  draftEl.__a = a;
  links.appendChild(draftEl);
}
function moveDraft(pt){ if(draftEl) draftEl.setAttribute('d', curve(draftEl.__a, pt)); }
function clearDraft(){ if(draftEl){ draftEl.remove(); draftEl = null; } }
function disarm(){ if(armed){ armed.el.classList.remove('is-armed'); armed = null; } }
function shake(rec){
  rec.el.classList.remove('is-shake'); void rec.el.offsetWidth; rec.el.classList.add('is-shake');
  setTimeout(() => rec.el.classList.remove('is-shake'), 440);
}
function pop(rec, delay){
  setTimeout(() => {
    rec.el.classList.remove('is-pop'); void rec.el.offsetWidth; rec.el.classList.add('is-pop');
    setTimeout(() => rec.el.classList.remove('is-pop'), 600);
  }, delay || 0);
}
function complete(a, b){
  clearDraft();
  if(!a || !b || a === b || a.side === b.side) return;     /* 같은 열끼리는 무효 */
  if(a.id !== b.id){ shake(a); shake(b); SFX.bad(); react('huh'); lastKey = 'instr'; say(lang, 'wrong'); armHint(); return; }
  const id = a.id;
  if(matched.has(id)) return;
  matched.add(id);
  addLink(id);
  const L = tileOf('l', id), R = tileOf('r', id);
  L.el.classList.add('is-done'); R.el.classList.add('is-done');
  pop(L, 0); pop(R, 250);
  SFX.good(); react('cheer'); burstAt(R.el);
  paintStars(); labelTiles();
  lastKey = 'p_' + id;
  locked = true; clearTimeout(hintTimer);               /* 팝업이 닫힐 때까지 입력 잠금 */
  setTimeout(() => openPair(id), 800);                  /* 선이 그려진 뒤 팝업 */
}
/* 짝 맞춤 팝업 — 두 그림 + IF / THEN 문장. 문장 음성이 끝나면 잠시 뒤 닫히고, ✕ · 딤 탭으로도 닫는다.
   마지막 쌍이면 닫힌 뒤 완료 화면 */
const pairEl = document.getElementById('pair');
let pairId = null, pairTm = null;
function paintPair(){
  if(!pairId) return;
  const it = ITEMS.find(x => x.id === pairId);
  document.getElementById('pairIf').textContent = it.lb[lang][0];
  document.getElementById('pairThen').textContent = it.pt[lang];
}
function openPair(id){
  pairId = id;
  const box = document.getElementById('pairPics'); box.innerHTML = '';
  const it = ITEMS.find(x => x.id === id);
  const pic = key => { const g = el('span', 'ppic', box); g.style.setProperty('--ar', AR[key]); paperObj(g, key); return g };
  pic(it.art);
  box.insertAdjacentHTML('beforeend',
    '<svg class="plink" viewBox="0 0 190 60" aria-hidden="true"><path d="M18 30 H172"/>' +
    '<circle class="ring" cx="18" cy="30" r="18"/><circle class="dot" cx="18" cy="30" r="13"/>' +
    '<circle class="ring" cx="172" cy="30" r="18"/><circle class="dot" cx="172" cy="30" r="13"/></svg>');
  pic(it.act);
  paintPair();
  pairEl.classList.add('on');
  clearTimeout(pairTm); pairTm = setTimeout(closePair, MUTE.on ? 5000 : 14000);
  say(lang, 'p_' + id, { end(){ clearTimeout(pairTm); pairTm = setTimeout(closePair, 1800) } });
}
function closePair(){
  if(!pairId) return;
  clearTimeout(pairTm); pairId = null;
  pairEl.classList.remove('on');
  stopVoice(); sayFlag(false);
  if(matched.size === 5){ setTimeout(finish, 350) }
  else { locked = false; armHint() }
}
document.getElementById('pairClose').addEventListener('click', () => { SFX.tap(); closePair() });
pairEl.addEventListener('pointerdown', e => { if(e.target === pairEl) closePair() });
function burstAt(host){
  const colors = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#8ECFCB','#BFE3D8'];
  const r = host.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height * .5;
  const u = U(), N = 16;
  for(let i = 0; i < N; i++){
    const e = el('i', 'spark-bit' + (i % 3 ? ' star' : ''), stage);
    const ang = -Math.PI * (0.06 + 0.88 * (i / (N - 1)));
    const rad = (100 + (i % 4) * 30) * u;
    e.style.cssText = 'left:' + cx + 'px; top:' + cy + 'px;' +
      '--s:' + Math.round((9 + (i % 5) * 4) * u) + 'px; --c:' + colors[i % colors.length] + ';' +
      '--dx:' + (Math.cos(ang) * rad).toFixed(1) + 'px; --dy:' + (Math.sin(ang) * rad).toFixed(1) + 'px;' +
      '--rot:' + (i * 47 % 360) + 'deg; animation-delay:' + (i * 14) + 'ms';
    setTimeout(() => e.remove(), 900);
  }
}
const U = () => stage.getBoundingClientRect().width / 1920;

/* 힌트 — 8초 무입력이면 아직 안 이은 왼쪽 카드 하나에 빛 */
function armHint(){
  clearTimeout(hintTimer);
  if(locked || briefing) return;
  hintTimer = setTimeout(() => {
    const id = LEFT.find(x => !matched.has(x));
    if(id){ const t = tileOf('l', id); t.el.classList.add('is-hint'); SFX.tap();
            setTimeout(() => t.el.classList.remove('is-hint'), 3700); }
    armHint();
  }, 8000);
}

board.addEventListener('pointerdown', ev => {
  if(locked || briefing) return;
  const t = ev.target.closest ? ev.target.closest('.tile') : null;
  if(!t){ disarm(); clearDraft(); return; }
  ev.preventDefault(); SFX.unlock();
  const rec = t.__rec;
  if(matched.has(rec.id)){ SFX.tap(); lastKey = 'c_' + rec.side + '_' + rec.id; say(lang, lastKey); return }
  if(armed && armed !== rec){
    if(armed.side === rec.side){ disarm(); }            /* 같은 열 — 고른 카드를 바꾼다 */
    else { const a = armed; disarm(); complete(a, rec); return; }
  }
  else if(armed === rec){ disarm(); clearDraft(); return; }
  SFX.tap(); lastKey = 'c_' + rec.side + '_' + rec.id; say(lang, lastKey);
  drag = rec; armed = rec; rec.el.classList.add('is-armed');
  startDraft(rec, toLocal(ev));
  board.setPointerCapture && board.setPointerCapture(ev.pointerId);
});
board.addEventListener('pointermove', ev => { if(drag) moveDraft(toLocal(ev)); });
board.addEventListener('pointerup', ev => {
  if(!drag) return;
  const over = document.elementFromPoint(ev.clientX, ev.clientY);
  const t = over && over.closest ? over.closest('.tile') : null;
  if(t && t.__rec !== drag && t.__rec.side !== drag.side && !matched.has(t.__rec.id)){ const a = drag; disarm(); complete(a, t.__rec); }
  else clearDraft();                                  /* 제자리에서 뗐다 = 탭. armed 유지 */
  drag = null;
});
board.addEventListener('pointercancel', () => { drag = null; clearDraft(); });

/* 소년 반응 */
let reactTm = null;
function react(kind){
  boyEl.classList.remove('is-cheer', 'is-huh'); void boyEl.offsetWidth;
  boyEl.classList.add(kind === 'cheer' ? 'is-cheer' : 'is-huh');
  clearTimeout(reactTm);
  reactTm = setTimeout(() => boyEl.classList.remove('is-cheer', 'is-huh'), 1900);
}

/* ============================================================
   6. 완료 화면 §8.3 — 날씨 · 행동 그림 아치
   ============================================================ */
(function buildSparks(){
  const box = document.getElementById('winSparks');
  const COLORS = ['#FFD23F','#FFE894','#FFFFFF','#E7B23C','#8ECFCB','#F7C8A0'];
  let seed = 20260929;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const N = 18;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + rnd() * .18, rad = .40 + rnd() * .16;
    const e = el('i', 'spark', box);
    e.style.cssText = '--x:' + (50 + Math.cos(ang) * rad * 116) + '%; --y:' + (50 + Math.sin(ang) * rad * 136) + '%;' +
      '--s:calc(' + (14 + Math.round(rnd() * 22)) + '*var(--u)); --c:' + COLORS[i % COLORS.length] + ';' +
      '--d:' + (rnd() * 2.2).toFixed(2) + 's';
  }
})();
(function buildConfetti(){
  const box = document.getElementById('winConf');
  const C = ['#FDE751','#7FC7E8','#F28C3A','#8ECFCB','#FFFFFF','#76905F','#FFF6DF'];
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2, dist = 180 + rnd() * 250;
    const e = el('i', 'conf', box);
    e.style.cssText = '--w:calc(' + (12 + Math.round(rnd() * 12)) + '*var(--u)); --h:calc(' + (16 + Math.round(rnd() * 18)) + '*var(--u));' +
      '--c:' + C[i % C.length] + '; --r:' + (rnd() < .4 ? '50%' : 'calc(4*var(--u))') + ';' +
      '--dx:calc(' + (Math.cos(ang) * dist).toFixed(0) + '*var(--u)); --dy:calc(' + (Math.sin(ang) * dist - 60).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd() * 900 - 450) + 'deg; --d:' + (rnd() * .35).toFixed(2) + 's';
  }
})();
function finish(){
  disarm(); clearDraft();
  SFX.clear();
  winEl.classList.add('on');
  lastKey = 'win';
  setTimeout(() => SFX.fanfare(), 120);
  setTimeout(() => say(lang, 'win'), 900);
  setTimeout(() => SFX.bgmStart(0), 3400);
}
function shuffleRight(){
  const prev = RIGHT.join();
  do{
    RIGHT = LEFT.slice();
    for(let i = 4; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [RIGHT[i], RIGHT[j]] = [RIGHT[j], RIGHT[i]]; }
  }while(RIGHT.join() === prev || RIGHT.some((id, i) => id === LEFT[i]) && Math.random() < .7);
}
function resetGame(){
  SFX.bgmStop(); stopVoice();
  pairId = null; clearTimeout(pairTm); pairEl.classList.remove('on');
  winEl.classList.remove('on');
  locked = false;
  shuffleRight(); build(); armHint();
}

/* ============================================================
   7. 음성 — 화면에서 나오는 모든 문장을 Pixie 녹음본으로 (DESIGN.md '생성 보이스 레지스트리')
      파일: audio/voice-q/q_b4_04_{키}_{en|ko}.mp3 — 없거나 읽지 못하면 같은 문장을 TTS 로 읽는다
      키: instr · wrong · win · guide · picnic · praise · thunder · scold · toy (한 쌍 전체 문장)
      + if_{쌍} (왼쪽 카드 글) · then_{쌍} (오른쪽 카드 글)
   ============================================================ */
let speakTm = null;
function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }
const VOICE_KEY = { instr:'instr', wrong:'wrong', win:'win', guide:'guide' };
ITEMS.forEach(it => {
  VOICE_KEY['p_' + it.id] = it.id;
  VOICE_KEY['c_l_' + it.id] = 'if_' + it.id;
  VOICE_KEY['c_r_' + it.id] = 'then_' + it.id;
});
const voiceSrc = (l, key) => VOICE_KEY[key] ? 'audio/voice-q/q_b4_04_' + VOICE_KEY[key] + '_' + l + '.mp3' : null;
function textOf(l, key){
  if(key.indexOf('p_') === 0){ const it = ITEMS.find(x => x.id === key.slice(2)); return it ? it[l] : '' }
  if(key.indexOf('c_') === 0){ const p = key.split('_'), it = ITEMS.find(x => x.id === p[2]); return it ? it.lb[l][p[1] === 'l' ? 0 : 1] : '' }
  return I18N[l][key];
}
let qAudio = null;
function stopVoice(){
  if(qAudio){ qAudio.onended = qAudio.onerror = qAudio.onplaying = null; qAudio.pause(); qAudio = null }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function speakTTS(l, text, hooks){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (l === 'ko') ? 'ko-KR' : 'en-US';
    u.rate = (l === 'ko') ? 1 : .95;
    u.pitch = 1.15;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.indexOf(l) === 0);
    if(v) u.voice = v;
    sayFlag(true);
    clearTimeout(speakTm);
    u.onstart = () => { if(hooks.start) hooks.start() };
    u.onend = () => { sayFlag(false); if(hooks.end) hooks.end() };
    u.onerror = () => { sayFlag(false); if(hooks.end) hooks.end() };
    speakTm = setTimeout(() => sayFlag(false), 12000);
    speechSynthesis.speak(u);
  }catch(e){ sayFlag(false) }
}
/* 녹음본 재생. 파일을 못 읽으면 TTS 로 넘기고,
   자동재생 차단(NotAllowedError)이면 조용히 멈춘다 — 브리핑의 첫 탭 재시도가 다시 부른다 */
function playVoiceFile(src, l, text, hooks){
  const a = new Audio(src);
  qAudio = a;
  let fell = false;
  const fallback = () => {
    if(fell || qAudio !== a) return;
    fell = true; qAudio = null;
    speakTTS(l, text, hooks);
  };
  a.onplaying = () => {
    if(qAudio !== a) return;
    sayFlag(true);
    clearTimeout(speakTm);
    speakTm = setTimeout(() => sayFlag(false), 15000);
    if(hooks.start) hooks.start();
  };
  a.onended = () => {
    if(qAudio !== a) return;
    qAudio = null; sayFlag(false);
    if(hooks.end) hooks.end();
  };
  a.onerror = fallback;
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    if(err && err.name === 'NotAllowedError'){ if(qAudio === a) qAudio = null; sayFlag(false); return }
    fallback();
  });
}
function say(l, key, hooks){
  l = l || lang; key = key || 'instr';
  const text = textOf(l, key);
  if(!text || MUTE.on) return;
  hooks = hooks || {};
  stopVoice();
  const src = voiceSrc(l, key);
  if(src){ playVoiceFile(src, l, text, hooks); return }
  speakTTS(l, text, hooks);
}
function applyLang(){
  const t = I18N[lang], ko = lang === 'ko';
  document.getElementById('lgEn').className = ko ? 'off' : 'on';
  document.getElementById('lgKo').className = ko ? 'on'  : 'off';
  const bl = document.getElementById('btnLang');
  bl.dataset.next = ko ? 'en' : 'ko';
  bl.setAttribute('aria-label', ko ? 'English' : '한국어');
  paintMute();

  document.getElementById('talkTag').textContent = t.tag;
  document.getElementById('talkLine').textContent = t.instr;
  boyEl.setAttribute('aria-label', t.howto);
  guideEl.setAttribute('aria-label', t.howto);
  document.getElementById('guideClose').setAttribute('aria-label', t.close);
  document.getElementById('pairClose').setAttribute('aria-label', t.close);
  document.getElementById('btnBack').setAttribute('aria-label', t.back);
  document.getElementById('stepA').textContent = t.stepA;
  document.getElementById('stepB').textContent = t.stepB;
  document.querySelector('#retry span').textContent = t.retry;
  document.querySelector('#exit span').textContent  = t.exit;
  document.documentElement.lang = lang;
  labelTiles(); paintPair();
}

/* ============================================================
   8. 브리핑 · 상단 버튼 (B-2_05 v2 흐름)
   끝나는 조건: 음성이 끝남 / 음성이 시작되지 않으면 7s / 900ms 이후 아무 데나 탭.
   ============================================================ */
let briefing = true, briefTm = null, skipArmed = false, voiceOn = false, retried = false;
function briefSay(){
  voiceOn = false;
  say(lang, 'instr', {
    start(){ voiceOn = true; clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 14000) },
    end(){ if(briefing && voiceOn) setTimeout(endBriefing, 700) }
  });
}
function startBriefing(){
  briefing = true; skipArmed = false; lastKey = 'instr';
  clearTimeout(hintTimer); disarm(); clearDraft();
  document.body.classList.add('is-briefing');
  setTimeout(() => { skipArmed = true }, 900);
  clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
  briefSay();
}
function endBriefing(){
  if(!briefing) return;
  briefing = false; clearTimeout(briefTm);
  document.body.classList.remove('is-briefing');
  armHint();
}
stage.addEventListener('pointerdown', e => {
  SFX.unlock();
  if(!briefing) return;
  if(e.target.closest('.pp-ibtn, .boy, .guide, .win')) return;
  if(!voiceOn && !retried && !qAudio && !('speechSynthesis' in window && speechSynthesis.speaking)){
    retried = true;
    clearTimeout(briefTm); briefTm = setTimeout(endBriefing, 7000);
    briefSay(); return;
  }
  if(skipArmed) endBriefing();
}, true);
/* 소년을 누르면 플레이 방법(가이드 팝업 §8.1 · §8.5) — 브리핑 중에는 문제를 다시 읽어 준다.
   열려 있는 동안 입력 잠금(팝업이 무대를 덮는다) · 힌트 멈춤. 닫기 = ✕ 또는 딤 탭 */
const guideOpen = () => guideEl.classList.contains('on');
function openGuide(){
  if(locked) return;
  clearTimeout(hintTimer); disarm(); clearDraft();
  guideEl.classList.add('on');
  say(lang, 'guide');
}
function closeGuide(){
  if(!guideOpen()) return;
  guideEl.classList.remove('on');
  stopVoice(); sayFlag(false);
  armHint();
}
boyEl.addEventListener('click', () => {
  SFX.tap();
  if(briefing){ briefSay(); return }
  openGuide();
});
document.getElementById('guideClose').addEventListener('click', () => { SFX.tap(); closeGuide() });
guideEl.addEventListener('pointerdown', e => { if(e.target === guideEl) closeGuide() });

/* 가이드 데모 — ① 그림 카드 3장(첫 장이 들썩) ② 그림 ● ── ● 기분 */
(function buildGuideDemo(){
  const card = (parent, art, cls) => { const c = el('span', 'gcard' + (cls ? ' ' + cls : ''), parent); paperObj(c, art); return c; };
  const A = document.getElementById('gdemoA'), B = document.getElementById('gdemoB');
  card(A, 'if_thunder', 'pick'); card(A, 'if_picnic'); card(A, 'if_toy');
  card(B, 'if_thunder');
  B.insertAdjacentHTML('beforeend',
    '<svg class="glink" viewBox="0 0 210 118" aria-hidden="true">' +
      '<path d="M18 59 C 105 59, 105 59, 192 59"/>' +
      '<circle class="ring" cx="18" cy="59" r="18"/><circle class="dot" cx="18" cy="59" r="13"/>' +
      '<circle class="ring" cx="192" cy="59" r="18"/><circle class="dot dot--b" cx="192" cy="59" r="13"/>' +
    '</svg>');
  card(B, 'th_scared');
})();
/* 사운드 버튼 = 음소거 토글 (§4.1 · §11.4) */
function paintMute(){
  const L = {en:{off:'Sound off', on:'Sound on'}, ko:{off:'소리 끄기', on:'소리 켜기'}};
  btnSay.setAttribute('aria-pressed', MUTE.on);
  btnSay.setAttribute('aria-label', L[lang][MUTE.on ? 'on' : 'off']);
}
btnSay.addEventListener('click', () => {
  if(!MUTE.on){
    SFX.tap();
    MUTE.on = true;
    stopVoice();
    sayFlag(false);
    const c = SFX.ctx(); if(c && c.state === 'running') c.suspend();
  }else{
    MUTE.on = false;
    const c = SFX.ctx(); if(c && c.state === 'suspended') c.resume();
    if(winEl.classList.contains('on')){ SFX.bgmStop(); SFX.bgmStart(0) }
    SFX.tap();
  }
  paintMute();
});
document.getElementById('btnLang').addEventListener('click', e => {
  SFX.unlock(); SFX.tap();
  lang = e.currentTarget.dataset.next;
  applyLang();
  if(briefing) briefSay(); else if(guideOpen()) say(lang, 'guide'); else say(lang, lastKey);
});
document.getElementById('btnBack').addEventListener('click', () => { SFX.tap(); location.href = HOME; });
document.getElementById('exit').addEventListener('click',   () => { SFX.tap(); location.href = HOME; });
document.getElementById('retry').addEventListener('click',  () => { SFX.tap(); resetGame(); });

if('speechSynthesis' in window) speechSynthesis.getVoices();
build();
applyLang();
startBriefing();
})();
</script>
<script>/* MAP-PROGRESS v1 — 완료 화면이 뜨면 맵(B-4_00.submain.html)에 완료 기록 */(function(){var ID='branching',K='ck.b4.sub.done';var done=false;function mark(){try{var a=JSON.parse(localStorage.getItem(K)||'[]');if(a.indexOf(ID)<0)a.push(ID);localStorage.setItem(K,JSON.stringify(a));localStorage.setItem('ck.b4.sub.just',ID)}catch(e){}}function chk(){if(done)return;if(document.querySelector('#win.on,#win.is-on,[class*="_exit_"]')){done=true;mark();mo.disconnect()}}var mo=new MutationObserver(chk);mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});})();</script>
<script src="../EXIT_CONFIRM.js"></script>
<script>
/* 문제풀이 BGM — 개념별 공용 곡(puzzle-branching-crossroads-loop). 첫 입력부터 반복 재생(자동재생 정책), 소리 끄기·완료 화면·탭 숨김 시 일시정지. DESIGN.md §12.8 */
(() => {
  const a = new Audio('../audio/bgm/puzzle-branching-crossroads-loop.mp3');
  a.loop = true; a.preload = 'auto'; a.volume = .22;
  const $ = id => document.getElementById(id);
  const muted = () => { const b = $('btnSay') || document.querySelector('button[class*="soundButton"]'); return !!b && b.getAttribute('aria-pressed') === 'true' };
  const done = () => document.body.classList.contains('is-done') || !!document.querySelector('#win.on, [class*="_win_"]');
  let armed = false;
  const sync = () => {
    if(!armed) return;
    if(muted() || done() || document.hidden) a.pause();
    else if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}) }
  };
  let raf = 0; const soon = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; sync() }) };
  ['pointerdown','keydown'].forEach(t => window.addEventListener(t, () => { armed = true; sync() }, {passive:true}));
  document.addEventListener('visibilitychange', sync);
  new MutationObserver(soon).observe(document.body, {attributes:true, attributeFilter:['class','aria-pressed'], childList:true, subtree:true});
})();
</script>
