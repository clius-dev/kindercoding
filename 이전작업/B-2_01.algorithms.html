<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Step B-2 · ALGORITHMS — 딸기 길 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="DESIGN.css">
<style>
/* ============================================================
   B-2 · ALGORITHMS — 딸기 길 찾기
   berry-b2 (Vite + React) 를 다른 B-2 화면과 같은 단일 HTML 로 옮긴 것.
   토큰·상단 크롬은 DESIGN.css 를 따르고(§1 색 · §4 상단바),
   무대 안쪽은 원본 컴포넌트의 CSS 를 .bz- 접두사로 그대로 가져왔다.
   원본 배율 체계: 무대 1920 x 1200 · 1cqw = 무대 폭의 1%
   ============================================================ */

:root{
  /* 1디자인단위 — DESIGN.css 와 같은 값. 다른 B-2 화면처럼 여기에도 적어 두어
     DESIGN.css 가 늦게 오거나 빠져도 무대가 0으로 접히지 않게 한다. */
  --u:clamp(.5px, min(100dvw / 1920, 100dvh / 1200), 1.25px);

  /* 원본(variables.css)이 쓰던 이름을 DESIGN.css 토큰에 붙여 둔다 —
     포팅한 CSS 를 고치지 않고 그대로 쓰기 위해서다. */
  --bz-ink:var(--c-primary-ink);
  --bz-radius-card:calc(44 * var(--u));
  --bz-shadow-card:0 calc(6 * var(--u)) 0 rgba(0,0,0,.10);
  --bz-shadow-primary:0 calc(7 * var(--u)) 0 var(--c-primary-dark);

  /* 원본 활동지에서 가져온 색 */
  --bz-card-face:#F3E4D0;
  --bz-card-face-end:#F4F3D3;

  /* 다홍 — 되감기 전용 [stated]. DESIGN.css 에는 없는 색이라 여기서 정의한다
     (--c-danger #F08A8A 는 너무 옅고, --c-accent #FF9D02 는 주황이라 역할이 다르다) */
  --bz-vermilion:#E2543D;
  --bz-vermilion-hover:#EE6C55;
  --bz-vermilion-deep:#B23D2B;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--ff);color:var(--bz-ink);line-height:1.6;
  background:#DFE8D6;             /* 무대 비율 바깥에 남는 여백 */
  overflow:hidden;overscroll-behavior:none;word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}

/* ---- 무대 : 어떤 창에서도 태블릿 비율(1920 x 1200)을 그대로 유지한다 ---- */
.app{position:fixed;inset:0;display:grid;place-items:center;overflow:clip}
.bz-stage{
  position:relative;
  width:calc(1920 * var(--u));height:calc(1200 * var(--u));
  /* 화면 꽉 채우는 무대 — 다른 B-2 화면처럼 모서리 라운드와 띄우는 그림자를 두지 않는다 */
  overflow:clip;
  /* 배경 SVG 가 그려지기 전 한 프레임 동안 보이는 바탕색 */
  background:linear-gradient(to bottom,#BFE4EE 0%,#EAF5E4 58%,#5DAA5F 58%,#5DAA5F 100%);
}
.bz-backdrop{position:absolute;inset:0;z-index:0;width:100%;height:100%;max-width:none;pointer-events:none}
/* cqw 의 기준 컨테이너 — 1cqw = 무대 폭의 1% */
.bz-inner{position:absolute;inset:0;z-index:1;container-type:inline-size}
.bz-main{position:absolute;inset:0}

/* ---- 상단 크롬 : DESIGN.md §4 · DESIGN.css 의 .topbar .ibtn 세트 ---------
   면·색·blob 반경은 DESIGN.css 가 갖고 있고, 여기서는 배치와 음소거 표시만 더한다. */
.topbar{position:absolute;display:flex;align-items:center;justify-content:space-between;z-index:12}
.topbar .tools{display:flex;gap:calc(16 * var(--u))}
/* 음소거 — 사선 1개 오버레이 (DESIGN.md §4 .ibtn.is-off) */
.topbar .ibtn.is-off::after{
  content:'';position:absolute;left:16%;right:16%;top:47%;
  height:calc(5 * var(--u));border-radius:99px;background:#fff;transform:rotate(-40deg);
}

/* ---- 말풍선 (SpeechBubble) -------------------------------------------- */
.bz-bubble{
  position:absolute;top:8.4%;left:50%;
  transform:translate(-50%,-50%) scale(.96);
  z-index:9;display:flex;align-items:center;gap:calc(16 * var(--u));
  max-width:62cqw;min-height:calc(98 * var(--u));padding:0 calc(30 * var(--u));
  margin:0;background:#fff;border:calc(3 * var(--u)) solid var(--c-primary-200);
  border-radius:calc(49 * var(--u));box-shadow:0 calc(8 * var(--u)) 0 rgba(74,40,116,.14);
  font-size:calc(48 * var(--u));font-weight:700;color:var(--bz-ink);
  opacity:0;pointer-events:none;
  transition:opacity var(--t-fast),transform var(--t-fast) var(--e-pop);
}
.bz-bubble.is-on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bz-wave{display:flex;align-items:flex-end;gap:calc(5 * var(--u));height:calc(30 * var(--u));flex:none}
.bz-wave span{width:calc(6 * var(--u));background:var(--c-primary);border-radius:calc(3 * var(--u));animation:bzWave .7s ease-in-out infinite}
.bz-wave span:nth-child(2){animation-delay:.12s}
.bz-wave span:nth-child(3){animation-delay:.24s}
@keyframes bzWave{0%,100%{height:35%}50%{height:100%}}
.bz-bubble-text{white-space:nowrap}

/* ---- 보드 (FlowerBoard) — 원본 활동지의 3 x 3 칸 위에 정확히 겹친다 ---- */
.bz-boardzone{position:absolute;left:30.25%;top:6.7%;width:39.56%;height:55.3%}
.bz-board{
  position:relative;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:.86cqw;width:100%;height:100%;
}
.bz-cell{position:relative}
.bz-cell::before{content:'';position:absolute;inset:0;z-index:0;border-radius:.68cqw;background:var(--bz-card-face)}
.bz-cell.is-end::before{background:var(--bz-card-face-end)}
.bz-cell.is-lit::before{
  background:#FFF6BD;
  box-shadow:0 0 0 .26cqw #F2B85B inset, 0 0 1.5cqw rgba(255,213,80,.8);
}
.bz-tag{
  position:absolute;left:.7cqw;top:.5cqw;z-index:3;
  color:#282451;font-size:1.25cqw;font-weight:800;letter-spacing:.04em;
}

/* ---- 딸기 (FlowerPlant) ------------------------------------------------
   세로·가로를 모두 %로 못 박는다. 한쪽만 두고 aspect-ratio 로 맞추면
   안쪽 이미지의 height:100% 가 풀리지 않아 딸기가 칸 아래로 삐져나간다. */
.bz-plant{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;height:82%;z-index:2}
.bz-bloom{
  position:absolute;inset:0;transform-origin:50% 80%;
  animation:bzSway 4.4s ease-in-out infinite;
  transition:opacity .34s ease,transform .34s cubic-bezier(.34,.06,.28,1);
}
.bz-bloom.is-picked{opacity:0;transform:translateY(-30%) scale(.46)}
.bz-bloom.is-wobbling{animation:bzWobble .62s ease}
/* 원본 PNG 7장은 여백이 조금씩 달라 비율이 제각각이다 — contain 으로 맞춰 넣는다 */
.bz-berry-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 .2cqw 0 rgba(143,45,45,.12))}
@keyframes bzSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes bzWobble{20%{transform:rotate(-9deg)}45%{transform:rotate(7deg)}72%{transform:rotate(-4deg)}}

/* ---- 바구니 (FlowerBasket) -------------------------------------------- */
.bz-basket{
  position:absolute;width:22%;aspect-ratio:71.92 / 64.96;z-index:5;
  transform:translate(-50%,-48%);
  transition:left var(--bz-step) cubic-bezier(.34,.06,.28,1),
             top var(--bz-step) cubic-bezier(.34,.06,.28,1);
  filter:drop-shadow(0 .26cqw 0 rgba(103,69,32,.2));
}
.bz-basket.is-bumping{animation:bzBump .42s}
.bz-basket svg{width:100%;height:100%}
/* 새로 담긴 딸기 한 알이 톡 떨어지는 동작. 자기 밑변을 기준으로 커진다. */
.bz-drop{transform-box:fill-box;transform-origin:50% 100%;animation:bzDrop .34s var(--e-pop)}
@keyframes bzDrop{
  0%{transform:translateY(-45%) scale(.35);opacity:0}
  60%{transform:translateY(0) scale(1.14);opacity:1}
  100%{transform:translateY(0) scale(1)}
}
@keyframes bzBump{25%{transform:translate(-50%,-48%) rotate(-7deg)}55%{transform:translate(-50%,-48%) rotate(5deg)}}

/* ---- 축하 고양이 (CheerCat) -------------------------------------------
   3 x 3 카드(30.25% ~ 69.81%)와 하단 조작 바를 가리지 않는 자리다. */
.bz-cheer{
  position:absolute;right:1%;bottom:32%;z-index:6;width:26.5%;
  pointer-events:none;opacity:0;
  transform:translateY(16%) scale(.62);transform-origin:50% 100%;
  transition:opacity var(--t-base) ease,transform var(--t-slow) var(--e-pop);
}
.bz-cheer.is-on{opacity:1;transform:translateY(0) scale(1)}
.bz-cheer svg{width:100%;height:auto}
/* SVG 그룹에 CSS transform 을 걸 때는 transform-box 를 fill-box 로 둬야
   자기 도형을 기준으로 움직인다. 기본값(view-box)이면 무대 전체가 기준이 된다. */
.bz-hop{transform-box:fill-box;transform-origin:50% 100%;animation:bzHop .72s ease-in-out infinite}
.bz-catshadow{transform-box:fill-box;transform-origin:50% 50%;opacity:.16;animation:bzShadow .72s ease-in-out infinite}
.bz-twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:bzTwinkle 1.5s ease-in-out infinite}
@keyframes bzHop{
  0%,100%{transform:translateY(0) scale(1,.98)}
  20%{transform:translateY(0) scale(1.04,.93)}
  55%{transform:translateY(-8%) scale(.98,1.04)}
  82%{transform:translateY(0) scale(1.02,.96)}
}
@keyframes bzShadow{0%,100%{transform:scaleX(1);opacity:.16}55%{transform:scaleX(.78);opacity:.09}}
@keyframes bzTwinkle{0%,100%{opacity:.12;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(40deg)}}

/* ---- 조작 패널 (ControlPanel) — 화면 폭을 채우는 둥근 물결형 하단 박스 ---- */
.bz-panel{
  --bz-panel-face:#D4EDA4;
  position:absolute;left:0;right:0;bottom:0;
  width:100%;padding:1.35cqw 3.2cqw 1.75cqw;
  transform:none;
  border-radius:0;
  background:var(--bz-panel-face);
  box-shadow:0 calc(-5 * var(--u)) calc(12 * var(--u)) rgba(47,94,50,.12);
  display:flex;align-items:center;justify-content:center;
}
/* 하단 풀이 영역 — 화면보다 넓은 단일 타원으로 완만한 동산 능선을 만든다. */
.bz-panel::before{
  content:'';position:absolute;left:50%;top:-1.1cqw;
  width:140%;height:4cqw;transform:translateX(-50%);
  border-radius:50%;background:var(--bz-panel-face);
  pointer-events:none;
}
/* 명령 레일 행은 흰 패널의 흐름에서 빼 풀이 영역에 둔다.
   패널 너비에는 영향을 주지 않으면서 가운데 레일과 좌우 버튼은 한 덩어리로 정렬한다. */
.bz-trackrow{position:absolute;left:50%;bottom:calc(100% + 4cqw);
  width:max-content;transform:translateX(-50%);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.55cqw}

/* 카드 전부 비우기 — DESIGN.md §4 의 아이콘 버튼 기본형(.ibtn L): 보라 solid + 리프트.
   정원이 아니라 §3.7 의 blob 반경을 쓰고, 옆의 실행 버튼과 다른 조합을 고른다. */
.bz-round{
  --face:var(--bz-vermilion);--face-hover:var(--bz-vermilion-hover);--face-active:var(--bz-vermilion-deep);
  --lift:var(--btn-lift-control);
  position:relative;flex:none;justify-self:end;
  width:calc(104 * var(--u));aspect-ratio:1;
  border-radius:50%;                         /* 반듯한 원 [stated] */
  display:grid;place-items:center;color:#fff;
  background:var(--face);box-shadow:0 var(--lift) 0 var(--face-active);
  transition:background var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast);
}
.bz-round:active{
  transform:translateY(calc(var(--lift) * .66));
  box-shadow:0 calc(var(--lift) * .34) 0 var(--face-active);
}
/* 되감기 아이콘 — 끝이 둥근 선형. 사운드 버튼의 볼륨 곡선과 같은 결이다 [stated].
   굵기 2.6 / 24 viewBox = 10.8%, 사운드 곡선(2.8 / 28 = 10%)과 같은 무게.
   머리는 접선 셰브론이 아니라 코너형이다 — 셰브론은 원호 끝과 겹쳐 뭉갰다. */
.bz-round svg{width:52%;height:52%}
.bz-round svg path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* 명령 레일 (CommandTrack) */
.bz-track{
  flex:none;display:grid;grid-template-columns:repeat(8,5.4cqw);gap:.72cqw;
  padding:.7cqw .9cqw;margin:0;list-style:none;
  /* 바깥 잔디(#5DAA5F)보다 짙게 잡아 풀이 레일의 경계를 분명히 한다. */
  border-radius:calc(34 * var(--u));background:#397A43;
}
.bz-slot{
  position:relative;aspect-ratio:1;border-radius:50%;background:transparent;
  display:grid;place-items:center;
  box-shadow:0 0 0 calc(4 * var(--u)) #78B985 inset;
}
.bz-slot::before{content:'';width:18%;aspect-ratio:1;border-radius:50%;background:transparent}
.bz-slot.is-filled{background:#DCEAD5}
.bz-slot.is-filled::before{display:none}
.bz-slot.is-next{background:#DCEAD5;
  box-shadow:0 0 0 calc(5 * var(--u)) var(--c-success) inset}
.bz-slot.is-next::before{background:var(--c-success);animation:bzPulse 1.4s ease-in-out infinite}
@keyframes bzPulse{50%{transform:scale(1.12)}}

/* 실행 버튼 — DESIGN.md §4 .ibtn--success (초록 solid + 리프트, 섀도만 --c-success-deep) */
.bz-play{
  --face:var(--c-success);--face-hover:#4BD188;--face-active:var(--c-success-deep);
  --lift:var(--btn-lift-action);
  position:relative;flex:none;justify-self:start;
  width:max(7.2cqw,var(--touch-min));aspect-ratio:1;
  border-radius:50%;                         /* 반듯한 원 [stated] */
  border:calc(8 * var(--u)) solid #fff;
  display:grid;place-items:center;
  background:var(--face);box-shadow:0 var(--lift) 0 var(--face-active);
  transition:background var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast);
}
.bz-play:active{
  transform:translateY(calc(var(--lift) * .66));
  box-shadow:0 calc(var(--lift) * .34) 0 var(--face-active);
}
.bz-play:disabled{
  cursor:not-allowed;background:var(--c-disabled-bg);
  border-color:rgba(255,255,255,.72);
  box-shadow:none;transform:none;
}
.bz-play:disabled{color:var(--c-disabled-ink)}
/* 탭 유도 — §4 「.is-hint : 리프트를 유지한 채 링만 퍼진다」.
   scale 펄스를 쓰면 눌림 transform 과 한 요소에서 부딪힌다 (§1). */
.bz-play.is-ready::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 0 0 rgba(47,191,113,.45);
  animation:bzRing 1.6s var(--e-out) infinite;
}
@keyframes bzRing{to{box-shadow:0 0 0 calc(26 * var(--u)) rgba(47,191,113,0)}}
/* 실행 삼각형 — 뒤로 셰브론처럼 모서리를 둥글린 채움형 */
.bz-play{color:#fff}
.bz-play svg{width:52%;height:52%;margin-left:4%}
.bz-play svg path{fill:currentColor;stroke:currentColor;stroke-width:3.4;stroke-linejoin:round}

/* 방향 카드 줄 (ArrowPalette) */
.bz-paletterow{width:100%;flex:none;display:flex;align-items:center;justify-content:center}
.bz-palette{flex:none;display:flex;align-items:center;gap:2.2cqw}
.bz-palette.is-dimmed{opacity:.22;filter:saturate(.3);transition:opacity .3s ease}

/* 방향 카드 (ArrowCard) — 팔레트와 명령 레일이 함께 쓴다.
   보라 면 + 흰 화살표 [stated]. 되감기가 다홍이라 색이 겹치지 않는다. */
.bz-card{
  --face:var(--c-primary);--face-hover:var(--c-primary-light);--face-active:var(--c-primary-dark);
  --lift:var(--btn-lift-action);             /* DESIGN.css 공통 완화값 */
  position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  user-select:none;color:#fff;background:var(--face);
  border:0;box-shadow:0 var(--lift) 0 var(--face-active);
  transition:transform var(--t-fast),opacity var(--t-fast),background var(--t-fast),box-shadow var(--t-fast);
}
.bz-card:active{
  transform:translateY(calc(var(--lift) * .66));
  box-shadow:0 calc(var(--lift) * .34) 0 var(--face-active);
}
/* 화살표 — img_svg/B-2/direction-arrow.svg 를 심볼로 심어 쓴다 [stated].
   원본의 중첩 transform 을 하나로 합치고 viewBox 를 도형 bbox 에 맞춰
   (184.02 x 143.87) 어떤 칸에서도 정확히 가운데 온다. 색은 currentColor.
   회전 중심은 SVG 정중앙에 고정하고, 위치 보정과 회전은 한 transform 에 합친다. */
.bz-ar{
  width:62%;height:62%;fill:currentColor;display:block;
  transform-origin:50% 50%;
  transform:translateY(var(--ar-dy,0px)) rotate(var(--ar-rot,0deg));
}
/* 네 장 모두 반듯한 정원 [stated] — blob 반경·기울임·엇갈린 세로 위치를 걷어냈다.
   되감기·실행이 정원이라 이 넷만 일그러져 보였다. 떠 있는 움직임만 시차를 둔다. */
/* 네 방향 버튼은 돌출 두께를 줄이고, 화살표는 보라색 윗면의 정중앙에 고정한다. */
.bz-palette .bz-card{width:max(7.4cqw,var(--touch-min));
  --lift:var(--btn-lift-direction);--ar-dy:0px;
  animation:bzBob 3.2s ease-in-out infinite}
.bz-palette .bz-card:nth-child(2){animation-delay:.25s}
.bz-palette .bz-card:nth-child(3){animation-delay:.5s}
.bz-palette .bz-card:nth-child(4){animation-delay:.75s}
.bz-palette .bz-card:active{animation:none}
@keyframes bzBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
/* 레일에 놓인 카드 — 보라 면 없이 화살표만 [stated]. 색은 버튼의 보라 그대로.
   칸의 원형 라인과 같은 원에 채워 넣어 화살표가 라인의 정가운데에 온다.
   --lift 0 · --ar-dy 0 이라 공통 규칙(두께 · 눌림 이동 · 세로 보정)이 모두 꺼진다. */
.bz-slot .bz-card{--lift:0px;--ar-dy:0px;position:absolute;inset:0;
  background:none;color:var(--c-primary)}
.bz-slot .bz-card:hover{background:none}
/* 실행 중인 아웃라인은 슬롯 인라인과 같은 자리에 겹친다.
   확대하면 두 원이 어긋나므로 크기는 유지하고 굵기와 색으로만 구분한다. */
.bz-slot .bz-card.is-active{z-index:3;transform:none;color:var(--c-success-deep);
  box-shadow:inset 0 0 0 calc(5 * var(--u)) var(--c-success)}
.bz-slot .bz-card.is-reached{color:var(--c-success-deep);
  box-shadow:inset 0 0 0 calc(4 * var(--u)) var(--c-success)}

/* ---- 결과 배너 (ResultBanner) — 실패가 아니라 "모자란 결과"를 보여 준다 */
.bz-banner{
  position:absolute;left:50%;bottom:1.2cqw;z-index:12;
  display:flex;align-items:center;gap:1.6cqw;
  height:7.8cqw;min-height:var(--touch-min);max-width:80cqw;padding:0 1.4cqw 0 2.6cqw;
  border-radius:var(--bz-radius-card);background:#fff;box-shadow:var(--bz-shadow-card);
  white-space:nowrap;opacity:0;pointer-events:none;
  transform:translate(-50%,130%);
  transition:transform var(--t-slow) var(--e-pop),opacity var(--t-base) ease;
}
.bz-banner.is-on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.bz-count{flex:none;font-size:3.2cqw;font-weight:700;line-height:1;color:var(--c-primary)}
.bz-count i{font-style:normal;font-size:2.6cqw;color:var(--c-primary-500)}
.bz-banner.is-win .bz-count{color:var(--c-success-dark)}
.bz-banner-title{font-size:2.1cqw;font-weight:700;color:var(--bz-ink)}
.bz-banner.is-win .bz-banner-title{color:var(--c-success-dark)}
.bz-actions{display:flex;align-items:center;justify-content:center;gap:1cqw;margin-left:1.4cqw;flex:none}
/* 다시하기 — DESIGN.md §3.8 의 바 버튼. 주황(accent)은 인트로 시작하기 몫이라
   다시하기는 보라를 쓴다 (B-SEQ · B-2 패턴과 같은 --c-primary 계열). */
.bz-banner .btn-bar{
  --face:var(--c-primary);--face-hover:var(--c-primary-light);--face-active:var(--c-primary-dark);
  --bb-w:300;--bb-h:104;--lift:var(--btn-lift-bar-compact);
  font-size:calc(34 * var(--u));padding:calc(14 * var(--u)) calc(40 * var(--u));
}

/* ============================================================
   완료 화면 — DESIGN.md §8.3. 박스 없이 축하 고양이만.
   반짝이는 고양이 SVG 안에 이미 들어 있어 .win__sparks 는 쓰지 않는다.
   ============================================================ */
.win{
  position:absolute;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.42);
  opacity:0;pointer-events:none;transition:opacity var(--t-base) var(--e-out);
}
.win.is-on{opacity:1;pointer-events:auto}
.win__stack{
  position:relative;width:calc(900 * var(--u));
  display:flex;flex-direction:column;align-items:center;gap:calc(44 * var(--u));
  transform:scale(.82) translateY(calc(28 * var(--u)));
  transition:transform var(--t-slow) var(--e-pop);
}
.win.is-on .win__stack{transform:none}

.win__rays,.win__glow{
  position:absolute;left:50%;top:calc(256 * var(--u));z-index:0;
  border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
}
.win__rays{
  width:calc(1000 * var(--u));height:calc(1000 * var(--u));
  background:repeating-conic-gradient(from 0deg,
    rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
          mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:winRaySpin 26s linear infinite;
}
@keyframes winRaySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{
  width:calc(760 * var(--u));height:calc(760 * var(--u));
  background:radial-gradient(circle,
    rgba(255,232,148,.85) 0%, rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:winGlowBreathe 3.4s ease-in-out infinite;
}
@keyframes winGlowBreathe{
  0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}

.win__art{position:relative;z-index:2;
  /* 고양이 SVG 는 세로로 길어 폭을 600u 로 두면 높이가 699u 가 된다.
     §8.3 의 아트 박스 높이(512u)에 맞춰 폭을 440u 로 잡는다. */
  width:calc(440 * var(--u));
  filter:drop-shadow(0 calc(12 * var(--u)) calc(20 * var(--u)) rgba(80,40,10,.28))}
.win__art svg{display:block;width:100%;height:auto}
.win.is-on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{
  0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-3.5%) rotate(-1.5deg)}
  60%{transform:translateY(-1.5%) rotate(1.5deg)}}

.win__confetti{position:absolute;left:50%;top:calc(150 * var(--u));transform:translateX(-50%);
  width:calc(900 * var(--u));height:calc(700 * var(--u));z-index:5;pointer-events:none}
.conf{position:absolute;left:50%;top:40%;width:var(--w);height:var(--h);
  background:var(--c);border-radius:var(--r);opacity:0}
.win.is-on .conf{animation:winConfBurst 1.5s var(--e-out) forwards;animation-delay:var(--d)}
@keyframes winConfBurst{
  0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.3)}
  12%{opacity:1}
  70%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}

/* 완료 화면에서는 조작 트레이를 쓸 일이 없으므로 아래로 내려 감춘다.
   명령 레일은 패널의 자식이라 함께 이동한다. */
.bz-panel{transition:transform var(--t-slow) var(--e-out),opacity var(--t-base) ease}
.bz-stage.is-done .bz-panel{transform:translateY(120%);opacity:0;pointer-events:none}

.win__line{position:relative;z-index:3;margin:0;color:#fff;
  font-size:calc(54 * var(--u));font-weight:800;line-height:1.15;text-align:center;
  text-shadow:0 calc(5 * var(--u)) 0 rgba(0,0,0,.22);text-wrap:balance}

@media (hover:hover){
  .bz-card:hover{background:var(--face-hover)}
  .bz-round:hover{background:var(--face-hover)}
  .bz-play:hover:not(:disabled){background:var(--face-hover)}
}

:focus-visible{outline:calc(4 * var(--u)) solid var(--c-primary-light);outline-offset:calc(4 * var(--u))}

/* 세로 모드 안내 — 표시 규칙은 DESIGN.css 의 @media(orientation:portrait) */
.rotate-gate{display:none;gap:calc(24 * var(--u));text-align:center;color:var(--bz-ink);font-size:calc(42 * var(--u));background:rgba(244,241,250,.94)}
.rotate-gate span{
  display:grid;place-items:center;width:calc(104 * var(--u));aspect-ratio:1;border-radius:50%;
  color:#fff;background:var(--c-primary);box-shadow:var(--bz-shadow-primary);font-size:calc(64 * var(--u));
}
</style>
</head>
<body>
<!-- 방향 화살표 원본 (img_svg/B-2/direction-arrow.svg). 카드마다 <use> 로 불러 쓴다 -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="bz-arrow" viewBox="0 0 184.02 143.87">
    <path d="M 184.02,71.99 C 183.84,74.02 182.78,75.86 181.11,77.03 C 162.92,92.78 127.77,127.63 107.36,143.09 C 106.49,143.66 105.47,143.93 104.44,143.86 C 101.23,143.86 98.63,141.26 98.63,138.05 L 97,103.45 C 97,103.45 128,105.3 6.69,103.45 C 3.52,103.35 0.97,100.8 0.88,97.63 C -0.29,80.13 -0.29,62.56 0.88,45.05 C 0.97,41.88 3.52,39.33 6.69,39.24 C 125.44,37.38 97,39.24 97,39.24 L 98.63,5.9 C 98.63,3.82 99.74,1.9 101.54,0.86 C 103.31,-0.29 105.59,-0.29 107.36,0.86 C 127.19,16.01 163.23,50.86 181.11,66.93 C 182.77,68.11 183.84,69.95 184.02,71.99"/>
  </symbol>
</svg>

<main class="app" id="app">
  <section class="bz-stage" id="stage" style="--bz-step:.6s" aria-label="B-2 Strawberry Path stage">

    <div class="bz-inner">
      <p class="bz-bubble" id="bubble" role="status" aria-live="polite">
        <span class="bz-wave" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="bz-bubble-text" id="bubbleText"></span>
      </p>

      <!-- 상단 크롬 — DESIGN.md §4 (흰 면 + 보라 아이콘 / 사운드만 보라 면).
           뒤로 아이콘·스피커 아이콘 path 와 언어 토글 마크업은 §4 · §4.1 · §4.2 고정값 -->
      <div class="topbar">
        <button class="ibtn ibtn--lg" id="back" type="button" aria-label="뒤로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.1 2.9a2.4 2.4 0 0 0-3.4 0L4.6 11a1.4 1.4 0 0 0 0 2l8.1 8.1a2.4 2.4 0 1 0 3.4-3.4L10.1 12l6-6a2.4 2.4 0 0 0 0-3.1Z"/></svg>
        </button>
        <div class="tools">
          <button class="ibtn ibtn--lg ibtn--lang" id="lang" type="button" aria-pressed="false" aria-label="한글">
            <span class="lg"><i id="lgEn" class="on">A</i><b id="lgKo" class="off">한</b></span>
          </button>
          <button class="ibtn ibtn--lg ibtn--sound" id="sound" type="button" aria-label="소리 끄기">
            <svg viewBox="0 0 28 28" aria-hidden="true">
              <path d="M3.5 10.2h4.1l5.3-4.3c.9-.7 2.2-.1 2.2 1.1v14c0 1.2-1.3 1.8-2.2 1.1l-5.3-4.3H3.5c-.8 0-1.5-.7-1.5-1.5v-4.6c0-.8.7-1.5 1.5-1.5Z"/>
              <path class="sound-wave" d="M18.2 10.7a4.6 4.6 0 0 1 0 6.6"/>
              <path class="sound-wave" d="M21.7 7.5a8.8 8.8 0 0 1 0 13"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="bz-main">
        <!-- 보드 -->
        <div class="bz-boardzone">
          <div class="bz-board" id="board"></div>
        </div>

        <!-- 다 담았을 때 나오는 축하 고양이 -->
        <div class="bz-cheer" id="cheer" aria-hidden="true"></div>

        <!-- 하단 조작 트레이 -->
        <div class="bz-panel">
          <div class="bz-trackrow">
            <button class="bz-round" id="clear" type="button" aria-label="Clear all cards">
              <!-- 되감기 ↺ — 원호 + 왼쪽 위 코너 머리 -->
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
            </button>
            <ol class="bz-track" id="track" aria-label="Command track"></ol>
            <button class="bz-play" id="play" type="button" aria-label="Go">
              <svg viewBox="8 5 16 18" aria-hidden="true"><path d="M11.2 7.6 20.6 14 11.2 20.4z"/></svg>
            </button>
          </div>

          <div class="bz-paletterow">
            <div class="bz-palette" id="palette"></div>
          </div>

          <div class="bz-banner" id="banner" role="status" aria-live="polite" aria-hidden="true">
            <span class="bz-count" id="bannerCount"></span>
            <span class="bz-banner-title" id="bannerTitle"></span>
            <span class="bz-actions"><button class="btn-bar" id="bannerBtn" type="button"></button></span>
          </div>
        </div>
      </div>

      <!-- 완료 화면 — DESIGN.md §8.3 -->
      <div class="win" id="win" aria-hidden="true">
        <div class="win__stack" role="dialog" aria-label="Done">
          <div class="win__rays" aria-hidden="true"></div>
          <div class="win__glow" aria-hidden="true"></div>
          <div class="win__art" id="winArt" aria-hidden="true"></div>
          <div class="win__confetti" id="winConf" aria-hidden="true"></div>
          <p class="win__line" id="winLine"></p>
          <div class="win__actions">
            <button class="btn-bar btn--retry" id="winRetry" type="button"><span></span></button>
            <button class="btn-bar btn--exit" id="winExit" type="button"><span></span></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="rotate-gate" role="status">
    <span aria-hidden="true">↻</span>
    <strong>기기를 가로로 돌려 주세요</strong>
  </div>
</main>

/* ============================================================
   완료 팡파르 · 승리 BGM — B-2_06(패턴) 과 같은 소리를 그대로 가져왔다.
   다른 화면의 완료 화면과 소리가 같아야 한다 [stated]. 값·타이밍 모두 동일.
   ============================================================ */
const SFX = (() => {
    let ctx = null, noiseBuf = null;
    const ac = () => {
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    };

    /* ---------- 공용 보이스 ----------
       오실 2개(디튠 레이어) + 로우패스로 배음을 깎는다.
       단일 오실 삐 소리보다 마림바·글로켄에 가깝게 들린다 */
    function voice(freq, at, dur, o){
      const c = ac(); if(!c) return;
      o = o || {};
      const t0  = c.currentTime + at;
      const bus = o.bus || c.destination;
      const g = c.createGain(), f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.cut || Math.min(freq * 5 + 900, 11000), t0);
      f.Q.setValueAtTime(.7, t0);
      const peak = o.gain || .12, atk = o.atk || .006;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      f.connect(g); g.connect(bus);
      const osc = (type, mul, det) => {
        const s = c.createOscillator();
        s.type = type;
        s.frequency.setValueAtTime(freq * (mul || 1), t0);
        if(o.bend) s.frequency.exponentialRampToValueAtTime(freq * o.bend, t0 + dur * .8);
        s.detune.setValueAtTime(det || 0, t0);
        s.connect(f); s.start(t0); s.stop(t0 + dur + .05);
      };
      osc(o.type || 'sine', 1, 0);
      if(o.layer) osc(o.layer, o.mul || 2, o.detune || 6);
    }
    const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));

    /* 노이즈 스웹 — 화음 앞에 붙이면 '쨘' 하는 공기감이 생긴다 */
    function swoosh(at, dur, f0, f1, gain){
      const c = ac(); if(!c) return;
      if(!noiseBuf){
        const n = Math.floor(c.sampleRate * 1.2);
        noiseBuf = c.createBuffer(1, n, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        let s = 12345;
        for(let i = 0; i < n; i++){ s = (s*1103515245 + 12345) % 2147483648; d[i] = s/1073741824 - 1 }
      }
      const t0 = c.currentTime + at;
      const src = c.createBufferSource(); src.buffer = noiseBuf;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
      bp.frequency.setValueAtTime(f0, t0);
      bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .3);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      src.connect(bp); bp.connect(g); g.connect(c.destination);
      src.start(t0); src.stop(t0 + dur + .05);
    }

    const C3=130.81, C4=261.63, G4=392,
          C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99, A5=880, B5=987.77,
          C6=1046.5, D6=1174.7, E6=1318.5, F6=1396.9, G6=1568, A6=1760,
          C7=2093, E7=2637, G7=3136;
    const F3=174.61, G3=196;

    /* 마림바 — 짧은 어택, 배음 얇게 */
    const marimba = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'triangle', mul:2, detune:5,
                         gain:gain || .13, cut:f*4+700});
    /* 글로켄 — 밝고 길게 울린다 */
    const bell = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'sine', mul:3.01, detune:4,
                         gain:gain || .10, cut:f*7+2000});

    /* ---- BGM 스케줄러 ---- */
    let bgmOn = false, bgmTm = null, bgmBus = null, bgmAt = 0;
    const BEAT = .28;                       // 8박 = 2.24s 루프
    const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
                 [A5,2,.5],[G5,2.5,.5],[E5,3,.5],[G5,3.5,.5],
                 [F5,4,.5],[A5,4.5,.5],[C6,5,.5],[A5,5.5,.5],
                 [G5,6,.5],[E5,6.5,.5],[C5,7,1]];
    const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
    function bgmTone(freq, at, dur, type, gain){
      const c = ac(); if(!c || !bgmBus) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, at);
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(gain, at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, at + dur);
      o.connect(g); g.connect(bgmBus);
      o.start(at); o.stop(at + dur + .05);
    }
    function bgmLoop(){
      const c = ac(); if(!c || !bgmOn) return;
      if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;   // 밀렸으면 따라잡는다
      MEL.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'triangle', .055));
      BASS.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'sine', .045));
      bgmAt += 8*BEAT;
      bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);               // 다음 루프를 미리 예약
    }

    return {
      unlock(){ ac() },

      /* 칸을 짚을 때 — 규칙과 맞으면 마림바가 한 칸씩 올라가고,
         어긋나면 낮고 둔한 나무 소리(경고음 아님) */
      tick(step, ok){
        if(ok) marimba([C5,E5,A5,C6][step] || C5, 0, .30, .13);
        else   voice(165, 0, .12, {type:'sine', gain:.075, cut:420});
      },

      /* 정답 1개 완성 — 글로켄 3음 + 낮은 화음으로 받쳐 준다 */
      correct(){
        [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
        voice(C4, .02, .5, {type:'sine', gain:.05, cut:900});
      },

      /* 5개 클리어 — 스웹 + 상승 마림바. 팝업 팡파르로 이어진다 */
      clear(){
        swoosh(0, .38, 500, 4200, .055);
        [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12));
        bell(C6, .40, .8, .09);
      },

      tap(){ voice(620, 0, .09, {type:'sine', gain:.10, cut:2200, bend:.66}) },
      hint(){ bell(D6, 0, .30, .085); bell(A6, .13, .38, .07) },

      /* ---- 팝업 팡파르 — 약 4.8초로 길게 이어진다 ----
         ① 콜(3연음) ② 상승 런 ③ 지속 화음 ④ 해결 멜로디 ⑤ 종결 화음 + 반짝임 */
      fanfare(){
        swoosh(0, .5, 400, 5200, .06);
        // ① 콜
        [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ② 상승 런
        [[G5,.46,.12],[A5,.55,.12],[B5,.64,.12],[C6,.73,.34]]
          .forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ③ 지속 화음
        chord([C5,E5,G5,C6], 1.00, 1.25, {type:'triangle', layer:'sine', mul:2, gain:.055, cut:5200});
        voice(C3, 1.00, 1.4, {type:'sine', gain:.055, cut:600});
        // ④ 해결 멜로디
        [[E6,1.12,.24],[D6,1.36,.24],[C6,1.60,.38],[G5,1.98,.32],
         [A5,2.32,.26],[B5,2.58,.26],[C6,2.84,.80]]
          .forEach(([f,a,d]) => bell(f,a,d,.10));
        // ⑤ 종결 화음 + 베이스 + 반짝임
        swoosh(3.42, .45, 900, 6000, .045);
        chord([C6,E6,G6], 3.50, 1.7, {type:'sine', layer:'triangle', mul:2, gain:.06, cut:8000});
        voice(C4, 3.50, 1.8, {type:'sine', gain:.05, cut:900});
        voice(C3, 3.50, 2.0, {type:'sine', gain:.05, cut:520});
        [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(([f,a,d]) => bell(f,a,d,.045));
      },

      /* ---- 승리 BGM — 2.24s 루프 (C-F-G 진행) ----
         파일 없이 합성한다. 팝업이 열려 있는 동안만 돌고 다시하기에서 멈춘다.
         delay: 팡파르가 잦아든 뒤 들어오도록 시작을 늦춘다 */
      bgm(on, delay){
        const c = ac(); if(!c) return;
        if(on){
          if(bgmOn) return;
          bgmOn = true;
          const d = (delay === undefined) ? .35 : delay;
          bgmBus = c.createGain();
          bgmBus.gain.setValueAtTime(.0001, c.currentTime);
          bgmBus.gain.setValueAtTime(.0001, c.currentTime + d);
          bgmBus.gain.exponentialRampToValueAtTime(1, c.currentTime + d + 1.1);
          bgmBus.connect(c.destination);
          bgmAt = c.currentTime + d;
          bgmLoop();
        }else{
          if(!bgmOn) return;
          bgmOn = false;
          clearTimeout(bgmTm); bgmTm = null;
          const bus = bgmBus; bgmBus = null;
          if(bus){
            const t0 = c.currentTime;
            bus.gain.cancelScheduledValues(t0);
            bus.gain.setValueAtTime(Math.max(bus.gain.value, .0001), t0);
            bus.gain.exponentialRampToValueAtTime(.0001, t0 + .4);
            setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
          }
        }
      }
    };
  })();

/* ============================================================
   소리 — 효과음(WebAudio)과 음성(클립 + 합성)
   ============================================================ */
const CHIME_FREQUENCY = {up:720, down:470, left:540, right:620, pick:880, remove:340, play:680};
let audioCtx = null;

/** 짧은 사인파 효과음 — 오디오 파일 없이 조작 피드백만 담당한다. */
function chime(kind){
  if (!soundOn) return;
  if (!audioCtx){
    if (typeof AudioContext === 'undefined') return;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const f = CHIME_FREQUENCY[kind], osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  if (kind === 'pick') osc.frequency.exponentialRampToValueAtTime(f * 1.5, now + .16);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.linearRampToValueAtTime(.2, now + .012);
  gain.gain.exponentialRampToValueAtTime(.0001, now + .3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + .34);
}

const clipCache = new Map();
let playingClip = null, pendingClip = null;

function getClip(key){
  let a = clipCache.get(key);
  if (!a){ a = new Audio(VOICE_CLIP[key]); a.preload = 'auto'; clipCache.set(key, a); }
  return a;
}
function hush(){
  SFX.bgm(false);
  pendingClip = null;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (!playingClip) return;
  playingClip.pause(); playingClip.currentTime = 0; playingClip = null;
}
function playClip(a){
  a.currentTime = 0; playingClip = a;
  a.play().then(
    () => { if (pendingClip === a) pendingClip = null; },
    err => {
      /* 첫 탭 전에는 브라우저가 자동재생을 막는다 — 다음 입력에서 다시 시도한다 */
      if (err && err.name === 'NotAllowedError'){ pendingClip = a; return; }
      if (playingClip === a) playingClip = null;
    }
  );
}
function speak(line){
  if (!soundOn || !line) return;
  hush();
  const key = lang === 'en' ? CLIP_BY_LINE[line.trim()] : null;
  if (key){ playClip(getClip(key)); return; }
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(line);
  u.lang = lang === 'en' ? 'en-US' : 'ko-KR';
  u.rate = .92; u.pitch = 1.08;
  window.speechSynthesis.speak(u);
}
['pointerdown','keydown'].forEach(type => window.addEventListener(type, () => {
  const p = pendingClip; if (!p) return;
  pendingClip = null; playClip(p);
}, {capture:true}));

/* ---- 말풍선 : 문장을 띄우고 정해진 시간이 지나면 스스로 사라진다 ------- */
const bubble = document.getElementById('bubble');
const bubbleText = document.getElementById('bubbleText');
let bubbleTimer = null;

function say(line, holdMs){
  if (bubbleTimer !== null) clearTimeout(bubbleTimer);
  bubbleText.textContent = line;
  bubble.classList.add('is-on');
  bubbleTimer = setTimeout(() => bubble.classList.remove('is-on'), holdMs || BUBBLE_HOLD_MS);
  speak(line);
}

/** 문제 안내는 소리로만 들려준다 — 말풍선을 띄우지 않는다 [stated].
    들어오자마자 화면 위를 긴 글이 덮으면 아이가 판부터 보지 못한다. */
function sayVoiceOnly(line){
  if (bubbleTimer !== null) clearTimeout(bubbleTimer);
  bubble.classList.remove('is-on');
  speak(line);
}

/* ============================================================
   배경 장면 (StageBackdrop.tsx) — 스케치를 따른 딸기 풀숲
   난수를 쓰면 새로고침마다 장면이 달라지므로 고정된 수열을 쓴다.
   ============================================================ */
const W = 1920, H = 1200, HORIZON = 700, MASS_BOTTOM = 1040;
const WOBBLE = [.06,-.1,.03,-.05,.11,-.02,.07,-.09,.01,-.07,.09,-.04];

/** 가운데가 높고 좌우로 흘러내리는 덤불 한 줄. step 은 반드시 radius 보다 작게. */
function bushRow({startX, step, count, crestY, edgeY, radius}){
  const mid = (count - 1) / 2;
  return Array.from({length:count}, (_, i) => {
    const tt = Math.min(1, (1 - Math.abs(i - mid) / mid) * 1.4);
    const ease = tt * tt * (3 - 2 * tt);
    const w = WOBBLE[i % WOBBLE.length];
    const r = radius * (1 + w);
    const top = edgeY + (crestY - edgeY) * ease + w * radius * 2.4;
    return [startX + i * step, top + r, r];
  });
}
/* 앞쪽 초록 풀 한 겹만 남기고 위로 끌어올려 풀밭 영역을 넓힌다. */
const LAYER_FRONT = bushRow({startX:-110, step:96, count:22, crestY:400, edgeY:590, radius:100});

/** 한 겹의 윤곽 y — 그 겹 위에 무언가를 얹을 때 기준으로 쓴다. */
function topAt(bumps, x){
  let top = Infinity;
  for (const [cx, cy, r] of bumps){
    const dx = Math.abs(x - cx);
    if (dx >= r) continue;
    top = Math.min(top, cy - Math.sqrt(r * r - dx * dx));
  }
  return isFinite(top) ? top : HORIZON;
}
/** 겹치는 원들 + 그 중심을 잇는 다각형 = 이음매 없는 한 겹 */
function bushLayer(bumps, fill){
  const first = bumps[0], last = bumps[bumps.length - 1];
  const left = first[0] - first[2] * .9, right = last[0] + last[2] * .9;
  const skirt = ['M ' + left + ' ' + MASS_BOTTOM, 'L ' + left + ' ' + first[1]]
    .concat(bumps.map(b => 'L ' + b[0] + ' ' + b[1]))
    .concat(['L ' + right + ' ' + last[1], 'L ' + right + ' ' + MASS_BOTTOM, 'Z']).join(' ');
  return '<g fill="' + fill + '">'
    + bumps.map(b => '<circle cx="' + b[0] + '" cy="' + b[1] + '" r="' + b[2] + '"/>').join('')
    + '<path d="' + skirt + '"/></g>';
}

const berryArt = () =>
  '<path d="' + BERRY_BODY_PATH + '" fill="#e5383f"/>'
  + '<path d="' + BERRY_STEM_PATH + '" fill="#89c059"/>'
  + '<path d="' + BERRY_LEAF_PATH + '" fill="#89c059" fill-rule="evenodd"/>'
  + '<g fill="#010101" opacity="0.1">'
  + BERRY_SEEDS.map(s => '<ellipse cx="' + s.cx + '" cy="' + s.cy + '" rx="1.97" ry="1.1" transform="' + s.t + '"/>').join('')
  + '</g>';

const berryPlace = (x, base, scale, tilt) =>
  'translate(' + x + ' ' + base + ') rotate(' + tilt + ') scale(' + scale + ') translate(' + (-BERRY_W / 2) + ' ' + (-BERRY_H) + ')';

const daisyArt = () =>
  DAISY_PETAL_PATHS.map(d => '<path d="' + d + '" fill="#fff" fill-rule="evenodd"/>').join('')
  + '<path d="' + DAISY_CORE_PATH + '" fill="#fbc033" fill-rule="evenodd"/>';

/** 장식의 y 는 겹의 윤곽에서 계산한다 — 손으로 적으면 하늘에 뜨기 쉽다. */
const BACKDROP_BERRY_DROP = 110;
function scatter(bumps, berries, daisies, berryScale, daisyScale, sink){
  const tiltOf = x => ((x % 7) - 3) * 4;
  return berries.map(cx =>
      '<g transform="' + berryPlace(cx, topAt(bumps, cx) + sink + BACKDROP_BERRY_DROP, berryScale, tiltOf(cx)) + '">' + berryArt() + '</g>').join('')
    + daisies.map(cx => {
      const cy = topAt(bumps, cx) + sink * .7;
      return '<g transform="translate(' + cx + ' ' + cy + ') rotate(' + tiltOf(cx + 3) + ') scale(' + daisyScale + ') translate(' + (-DAISY_W / 2) + ' ' + (-DAISY_H / 2) + ')">' + daisyArt() + '</g>';
    }).join('');
}

function buildBackdrop(){
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'bz-backdrop');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  svg.innerHTML =
    '<defs>'
    + '<linearGradient id="b2-sky" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#bfe4ee"/><stop offset="0.6" stop-color="#d9eeea"/><stop offset="1" stop-color="#ebf5e3"/></linearGradient>'
    + '<linearGradient id="b2-ground" x1="0" y1="0" x2="0" y2="1">'
    /* 앞 풀숲(#5daa5f)과 같은 초록 — 연두 그라데이션은 쓰지 않는다 [stated] */
    + '<stop offset="0" stop-color="#5daa5f"/><stop offset="1" stop-color="#5daa5f"/></linearGradient>'
    + '</defs>'

    + '<rect x="0" y="0" width="' + W + '" height="' + (HORIZON + 4) + '" fill="url(#b2-sky)"/>'
    /* 구름 — 풀숲에 가리지 않는 좌우 어깨에만 둔다 */
    + '<g fill="#ffffff">'
    + '<g opacity="0.7" transform="translate(146 148) scale(0.92)"><ellipse cx="0" cy="24" rx="94" ry="32"/><circle cx="-26" cy="4" r="36"/><circle cx="32" cy="-2" r="44"/></g>'
    + '<g opacity="0.45" transform="translate(452 74) scale(0.56)"><ellipse cx="0" cy="20" rx="80" ry="26"/><circle cx="24" cy="-4" r="36"/></g>'
    + '<g opacity="0.8" transform="translate(1806 164) scale(1.06)"><ellipse cx="0" cy="26" rx="100" ry="34"/><circle cx="-32" cy="2" r="38"/><circle cx="28" cy="-6" r="48"/></g>'
    + '</g>'
    /* 잔디 — 풀숲 아래를 받쳐 하늘이 비치지 않게 한다 */
    + '<rect x="0" y="' + HORIZON + '" width="' + W + '" height="' + (H - HORIZON) + '" fill="url(#b2-ground)"/>'
    /* 연두 풀 겹은 제거하고 두 번째 진한 초록 풀 겹만 확장해 사용한다. */
    + bushLayer(LAYER_FRONT, '#5daa5f')
    + scatter(LAYER_FRONT, [304, 1470, 1800], [144, 620, 1050, 1380], 1.9, 3.6, 50);
  document.getElementById('stage').prepend(svg);
}

/* ============================================================
   게임 상태 (hooks/useFlowerHillGame.ts)
   빈 바구니가 딸기 1 → 7 을 순서대로 담고 END 로 이동한다.
   순서를 어기면 막히지 않고 해당 딸기가 밭에 남는다.
   ============================================================ */
const stage = document.getElementById('stage');
const boardEl = document.getElementById('board');
const trackEl = document.getElementById('track');
const paletteEl = document.getElementById('palette');
const playBtn = document.getElementById('play');
const bannerEl = document.getElementById('banner');
const cheerEl = document.getElementById('cheer');

let commands = [];
let position = START_POSITION;
let picked = [];
let activeIndex = -1;
let isRunning = false, isFinished = false, isBumping = false;
let result = null;
let stepSeconds = STEP_SECONDS;
let runToken = 0;
let timers = [];

const wait = ms => new Promise(r => setTimeout(r, ms));
const onBoard = p => p.column >= 0 && p.column < BOARD_COLUMNS && p.row >= 0 && p.row < BOARD_ROWS;
const samePos = (a, b) => a.column === b.column && a.row === b.row;
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

/** 흔들리는 딸기 — 같은 알을 다시 흔들 때도 처음부터 재생되도록 클래스를 떼었다 붙인다 */
function shakeFlower(n){
  const el = bloomByNumber.get(n);
  if (!el) return;
  el.classList.remove('is-wobbling');
  void el.offsetWidth;                       /* reflow 를 한 번 강제해 애니메이션을 되감는다 */
  el.classList.add('is-wobbling');
}

/** 카드는 그대로 두고 판만 처음으로 — 고쳐서 다시 돌려보게 한다. */
function rewind(){
  runToken += 1; clearTimers();
  isRunning = false; isFinished = false;
  picked = []; position = START_POSITION;
  activeIndex = -1; result = null;
  bloomByNumber.forEach(el => el.classList.remove('is-wobbling'));
  stepSeconds = TIMING.rewindStep / 1000;
  applyStep();
  later(() => { stepSeconds = STEP_SECONDS; applyStep(); }, 300);
  renderAll();
}

function addCommand(direction){
  if (isRunning || commands.length >= MAX_COMMANDS) return;
  if (isFinished) rewind();
  commands = commands.concat(direction);
  say(t(direction), 850);
  renderAll();
}

function removeCommandAt(index){
  if (isRunning) return;
  if (isFinished) rewind();
  commands = commands.filter((_, i) => i !== index);
  say(t('removed'), 1100);
  chime('remove');
  renderAll();
}

function clearCommands(){
  if (isRunning) return;
  commands = [];
  rewind();
  say(t('startOver'), 1600);
}

function finish(){
  isFinished = true;
  const pickedCount = picked.length;
  const isBasketAtEnd = samePos(position, END_POSITION);
  const hasWon = pickedCount === TOTAL_FLOWERS && isBasketAtEnd;
  result = {pickedCount, isBasketAtEnd, hasWon};
  renderAll();

  /* 남은 딸기들이 차례로 흔들려 "아직 여기 있어요"를 알린다 */
  FIELD_FLOWERS.filter(f => !picked.includes(f.number))
    .forEach((f, i) => later(() => shakeFlower(f.number), i * 130));

  /* 완료 화면에는 말풍선을 띄우지 않는다 — 소리로만 [stated]. 화면 위를 덮지 않게 */
  if (hasWon){ sayVoiceOnly(t('full')); return; }

  const tip = pickedCount === TOTAL_FLOWERS ? t('tipAllPicked')
            : isBasketAtEnd ? t('tipTooEarly')
            : nextTipLine(pickedCount + 1);
  later(() => say(tip, 3600), 420);
}

async function play(){
  if (isRunning) return;
  if (isFinished) rewind();
  if (commands.length === 0){ say(t('needArrow'), 1800); return; }

  chime('play');
  runToken += 1;
  const token = runToken;
  isRunning = true; result = null;
  renderAll();

  for (let index = 0; index < commands.length; index += 1){
    if (token !== runToken) return;
    activeIndex = index; renderTrack();

    const direction = commands[index], delta = DIRECTION_DELTA[direction];
    const next = {column:position.column + delta.column, row:position.row + delta.row};
    say(t(direction), stepSeconds * 1000);

    if (!onBoard(next)){
      /* 판 밖 — 튕기지만 시퀀스는 계속된다 */
      isBumping = true; renderBasket();
      await wait(TIMING.bump);
      isBumping = false; renderBasket();
    } else {
      position = next; renderBasket();
      await wait(stepSeconds * 1000 + TIMING.stepPadding);
      if (token !== runToken) return;

      const here = FIELD_FLOWERS.find(f =>
        f.column === next.column && f.row === next.row && !picked.includes(f.number));

      if (here){
        if (here.number === picked.length + 1){
          /* 순서가 맞을 때만 담긴다 */
          picked = picked.concat(here.number);
          renderBoard(); renderBasket();
          chime('pick');
          await wait(TIMING.pick);
        } else {
          /* 순서가 아니면 그냥 지나친다 — 막지 않는다 */
          shakeFlower(here.number);
          await wait(TIMING.wrongOrder);
        }
      }
    }
  }

  if (token !== runToken) return;
  isRunning = false; activeIndex = -1;
  finish();
}

/* ============================================================
   렌더 — DOM 은 한 번만 짓고 그 뒤로는 상태만 반영한다.
   매번 다시 그리면 딸기의 sway·바구니 transition 이 끊긴다.
   ============================================================ */
const applyStep = () => stage.style.setProperty('--bz-step', stepSeconds + 's');
const arrowImg = d => '<svg class="bz-ar" style="--ar-rot:' + ({right:0, down:90, left:180, up:270})[d] + 'deg" aria-hidden="true"><use href="#bz-arrow"/></svg>';
const dirLabel = d => ({up:'Up', down:'Down', left:'Left', right:'Right'})[d];
const pct = (index, total) => ((index + .5) / total) * 100 + '%';

let endCellEl = null, basketEl = null, basketBerriesEl = null;
const bloomByNumber = new Map();
const slotEls = [];

/* ---- 보드 : 3 x 3 칸 + 심긴 딸기 + 움직이는 바구니 -------------------- */
function buildBoard(){
  for (let i = 0; i < BOARD_COLUMNS * BOARD_ROWS; i += 1){
    const column = i % BOARD_COLUMNS, row = Math.floor(i / BOARD_COLUMNS);
    const isStart = column === START_POSITION.column && row === START_POSITION.row;
    const isEnd = column === END_POSITION.column && row === END_POSITION.row;
    const flower = FIELD_FLOWERS.find(f => f.column === column && f.row === row);

    const cell = document.createElement('div');
    cell.className = 'bz-cell' + (isEnd ? ' is-end' : '');
    if (isStart) cell.innerHTML = '<span class="bz-tag">START</span>';
    if (isEnd){ cell.innerHTML = '<span class="bz-tag">END</span>'; endCellEl = cell; }
    if (flower){
      const plant = document.createElement('div');
      plant.className = 'bz-plant';
      plant.innerHTML = '<span class="bz-bloom"><img class="bz-berry-img" src="'
        + STRAWBERRY[flower.number - 1] + '" alt="Strawberry ' + flower.number + '"></span>';
      cell.appendChild(plant);
      bloomByNumber.set(flower.number, plant.firstElementChild);
    }
    boardEl.appendChild(cell);
  }

  basketEl = document.createElement('div');
  basketEl.className = 'bz-basket';
  basketEl.setAttribute('role', 'img');
  basketEl.innerHTML = '<svg viewBox="0 0 ' + BASKET_VB_W + ' ' + BASKET_VB_H + '" focusable="false">'
    + '<defs>' + weaveDefs('b2-basket-weave') + '</defs>'
    + '<path d="' + basketBody.d + '" fill="url(#b2-basket-weave)"/>'
    /* 담긴 딸기 — 손잡이보다 뒤, 테두리보다 아래에 놓인다 */
    + '<g class="bz-berries"></g>'
    + '<path d="' + basketHandle.d + '" fill="' + basketHandle.fill + '"/>'
    + '<path d="' + basketRim.d + '" fill="' + basketRim.fill + '"/>'
    + '</svg>';
  boardEl.appendChild(basketEl);
  basketBerriesEl = basketEl.querySelector('.bz-berries');
}

function renderBoard(){
  endCellEl.classList.toggle('is-lit', result ? result.hasWon : false);
  bloomByNumber.forEach((el, number) => el.classList.toggle('is-picked', picked.includes(number)));
}

/** 담긴 알을 맞춘다.
    BERRY_SLOTS 는 "그리는 순서"(뒤 줄 먼저)라 담기는 순서(order)와 다르다.
    그래서 몇 개인지가 아니라 어떤 order 가 들어 있는지로 맞춰야 한다 —
    개수만 보고 뒤에 이어 붙이면 같은 알이 두 번 그려지고 바깥쪽 알이 빠진다.
    새로 담긴 알만 새로 만들어지므로 톡 떨어지는 동작이 한 번만 재생된다. */
function syncBasketBerries(){
  const SVGNS = 'http://www.w3.org/2000/svg';
  const want = BERRY_SLOTS.filter(s => s.order <= picked.length);
  const have = new Map(Array.from(basketBerriesEl.children, el => [Number(el.dataset.order), el]));

  have.forEach((el, order) => {
    if (!want.some(s => s.order === order)){ el.remove(); have.delete(order); }
  });

  want.forEach((s, i) => {
    let el = have.get(s.order);
    if (!el){
      el = document.createElementNS(SVGNS, 'g');
      el.dataset.order = s.order;
      el.setAttribute('transform', berryPlace(s.x, s.base, s.scale, s.tilt));
      el.innerHTML = '<g class="bz-drop">' + berryArt() + '</g>';
    }
    if (basketBerriesEl.children[i] !== el){
      basketBerriesEl.insertBefore(el, basketBerriesEl.children[i] || null);
    }
  });
}

function renderBasket(){
  basketEl.style.left = pct(position.column, BOARD_COLUMNS);
  basketEl.style.top = pct(position.row, BOARD_ROWS);
  basketEl.classList.toggle('is-bumping', isBumping);
  basketEl.setAttribute('aria-label', 'Basket with ' + picked.length + ' of ' + TOTAL_FLOWERS + ' strawberries');
  syncBasketBerries();
}

/* ---- 명령 레일 -------------------------------------------------------- */
function buildTrack(){
  for (let i = 0; i < MAX_COMMANDS; i += 1){
    const li = document.createElement('li');
    li.className = 'bz-slot';
    trackEl.appendChild(li);
    slotEls.push(li);
  }
}

function renderTrack(){
  slotEls.forEach((li, i) => {
    const d = commands[i];
    li.classList.toggle('is-filled', Boolean(d));
    li.classList.toggle('is-next', i === commands.length && !isRunning);

    if (li.dataset.dir !== (d || '')){
      li.dataset.dir = d || '';
      li.innerHTML = d
        ? '<button class="bz-card" type="button" data-remove="' + i + '" aria-label="'
          + dirLabel(d) + ' — tap to remove">' + arrowImg(d) + '</button>'
        : '';
    }
    const card = li.firstElementChild;
    if (!card) return;
    card.classList.toggle('is-active', isRunning && i === activeIndex);
    card.classList.toggle('is-reached', i < activeIndex);
    card.disabled = isRunning;
  });
}

/* ---- 방향 카드 줄 ----------------------------------------------------- */
function buildPalette(){
  paletteEl.innerHTML = PALETTE_DIRECTIONS.map(d =>
    '<button class="bz-card" type="button" data-pick="' + d + '" aria-label="'
    + dirLabel(d) + '">' + arrowImg(d) + '</button>').join('');
}

function renderPalette(){
  paletteEl.classList.toggle('is-dimmed', Boolean(result));
  paletteEl.querySelectorAll('button').forEach(b => { b.disabled = isRunning; });
}

function renderBanner(){
  const hasWon = result ? result.hasWon : false;
  const n = result ? result.pickedCount : 0;
  /* 다 담았을 때는 완료 화면(§8.3)이 대신하므로 배너를 띄우지 않는다 */
  const showBanner = Boolean(result) && !hasWon;
  bannerEl.className = 'bz-banner' + (showBanner ? ' is-on' : '');
  bannerEl.setAttribute('aria-hidden', showBanner ? 'false' : 'true');
  document.getElementById('bannerCount').innerHTML = n + '<i>/' + TOTAL_FLOWERS + '</i>';
  document.getElementById('bannerTitle').textContent = hasWon
    ? (lang === 'en' ? 'All seven strawberries, in order!' : '일곱 개를 순서대로 다 담았어요!')
    : (lang === 'en' ? 'Picked ' + n + ' of ' + TOTAL_FLOWERS + ' strawberries.' : '딸기 ' + n + '/' + TOTAL_FLOWERS + '개를 담았어요.');
  const btn = document.getElementById('bannerBtn');
  btn.textContent = hasWon
    ? (lang === 'en' ? 'Play again' : '다시 하기')
    : (lang === 'en' ? 'Try again' : '다시 해 볼까요');
  btn.dataset.act = hasWon ? 'again' : 'retry';
}

/* 컨페티 — 완료 화면이 열릴 때 한 번 터진다 (DESIGN.md §8.3) */
(function buildConfetti(){
  const box = document.getElementById('winConf');
  const C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#EE3A44'];
  let seed = 7;
  const rnd = () => (seed = (seed*1103515245 + 12345) % 2147483648) / 2147483648;
  for (let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2;
    const dist = 180 + rnd() * 250;
    const w = 12 + Math.round(rnd()*12), h = 16 + Math.round(rnd()*18);
    const el = document.createElement('i');
    el.className = 'conf';
    el.style.cssText =
      '--w:calc(' + w + '*var(--u)); --h:calc(' + h + '*var(--u));' +
      '--c:' + C[i % C.length] + '; --r:' + (rnd() < .3 ? '50%' : '2px') + ';' +
      '--dx:calc(' + (Math.cos(ang)*dist).toFixed(0) + '*var(--u));' +
      '--dy:calc(' + (Math.sin(ang)*dist*.9 + 120).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd()*900 - 450) + 'deg;' +
      '--d:' + (rnd()*.22).toFixed(2) + 's';
    box.appendChild(el);
  }
})();

const winEl = document.getElementById('win');

let winSoundPlayed = false;

function renderWin(){
  const hasWon = result ? result.hasWon : false;
  stage.classList.toggle('is-done', hasWon);
  winEl.classList.toggle('is-on', hasWon);

  /* 완료로 들어가는 순간 한 번만 — 팡파르 뒤 3.4s 에 BGM 이 합류한다 (B-2_06 과 동일) */
  if (hasWon && !winSoundPlayed){
    winSoundPlayed = true;
    if (soundOn){ SFX.fanfare(); SFX.bgm(true, 3.4); }
  }
  if (!hasWon && winSoundPlayed){
    winSoundPlayed = false;
    SFX.bgm(false);
  }
  winEl.setAttribute('aria-hidden', hasWon ? 'false' : 'true');
  document.getElementById('winLine').textContent = t('winLine');
  document.getElementById('winRetry').querySelector('span').textContent = t('winRetry');
  document.getElementById('winExit').querySelector('span').textContent  = t('winExit');
}

document.getElementById('winRetry').addEventListener('click', () => { clearCommands(); });
document.getElementById('winExit').addEventListener('click', () => {
  SFX.bgm(false);
  location.href = 'B-2_00.home.html#algorithms';
});

function renderAll(){
  renderBoard(); renderBasket(); renderTrack(); renderPalette(); renderBanner(); renderWin();
  playBtn.disabled = isRunning;
  playBtn.classList.toggle('is-ready', !isRunning && commands.length > 0);
  /* 보드 옆 축하 고양이는 쓰지 않는다 — 완료 화면(§8.3)의 큰 고양이가 대신한다 */
  cheerEl.classList.remove('is-on');
}

/* ============================================================
   입력
   ============================================================ */
paletteEl.addEventListener('click', e => {
  const b = e.target.closest('[data-pick]');
  if (b && !b.disabled) addCommand(b.dataset.pick);
});
trackEl.addEventListener('click', e => {
  const b = e.target.closest('[data-remove]');
  if (b && !b.disabled) removeCommandAt(Number(b.dataset.remove));
});
playBtn.addEventListener('click', play);
document.getElementById('clear').addEventListener('click', clearCommands);
document.getElementById('bannerBtn').addEventListener('click', e => {
  if (e.currentTarget.dataset.act === 'again'){ clearCommands(); }
  else { rewind(); say(t('fixOrder'), 1800); }
});

/* 상단 크롬 */
document.getElementById('back').addEventListener('click', () => {
  location.href = 'B-2_00.home.html#algorithms';
});
const langBtn = document.getElementById('lang');
const lgEn = document.getElementById('lgEn'), lgKo = document.getElementById('lgKo');
function applyLang(){
  document.documentElement.lang = lang;
  lgEn.className = lang === 'en' ? 'on' : 'off';
  lgKo.className = lang === 'ko' ? 'on' : 'off';
  /* 화면의 글자는 '지금 상태', 스크린리더는 '누르면 될 상태' (DESIGN.md §4.2) */
  langBtn.setAttribute('aria-pressed', lang === 'ko' ? 'true' : 'false');
  langBtn.setAttribute('aria-label', lang === 'en' ? '한글' : 'English');
  renderBanner();
  renderWin();
}
langBtn.addEventListener('click', () => {
  lang = lang === 'en' ? 'ko' : 'en';
  hush();
  applyLang();
  sayVoiceOnly(t('intro'));
});
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  if (!soundOn) hush();
  /* 음소거 표시는 사선 1개 (DESIGN.md §4 .ibtn.is-off) */
  soundBtn.classList.toggle('is-off', !soundOn);
  soundBtn.setAttribute('aria-pressed', String(!soundOn));
  soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
});

/* ============================================================
   시작
   ============================================================ */
buildBackdrop();
buildCheerCat();
buildBoard();
buildTrack();
buildPalette();
applyLang();
applyStep();
renderAll();
setTimeout(() => sayVoiceOnly(t('intro')), TIMING.introDelay);
</script>
