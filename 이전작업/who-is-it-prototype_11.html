<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Who Is It? — Prototype v0.2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css">
<style>
  /* ── 폰트: 전 구간 Paperlogy ───────────────────────────────── */
  :root{ --ff:'Paperlogy','Paperlogy-4Regular',-apple-system,"Noto Sans KR",sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:var(--ff)}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1b2a;touch-action:none;user-select:none}
  #fit{position:absolute;inset:0;overflow:hidden;overflow:clip}
  #stage{position:absolute;left:50%;top:50%;width:2000px;height:1500px;transform-origin:center center;
    overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.5);background:#2FB6E3}

  /* ── 레이어 ───────────────────────────────────────────────── */
  /* fill = #ground 의 background-size 와 픽셀 단위로 정확히 일치시키기 위함
     (2732:2048 = 1.33398 vs 2000:1500 = 1.33333 → 0.05% 차이는 육안 식별 불가) */
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1}

  /* ── 지면 레이어 (잔디 + 덤불) ─────────────────────────────
     배경 이미지의 '지면 부분만' 잘라낸 레이어. background-position 을 박스에
     고정해 두었으므로 top 을 올리면 잔디선과 덤불이 통째로 같이 올라감.
       기본 top:780  → 배경 원본과 픽셀 단위로 겹쳐 시각적 변화 0
       입력 top:665  → 지면 115px 상승 (잔디선 956→841, 덤불 796→681)
     780 은 덤불 상단(796)보다 위, 구름 하단(410)보다 아래인 '빈 하늘' 구간이라
     레이어 경계가 단색 하늘 위에 놓여 이음매가 보이지 않음 */
  #ground{position:absolute;left:0;right:0;top:780px;bottom:0;z-index:1;
    background-repeat:no-repeat;background-size:2001px 1500px;background-position:-0.5px -780px;
    transition:top .45s cubic-bezier(.2,.85,.3,1)}
  #ground.up{top:665px}

  /* 집: 입력 패널이 열리면 "집만" 축소 (배경은 고정) */
  #houseLayer{position:absolute;left:150px;top:245px;width:1700px;height:750px;z-index:2;
    transform-origin:50% 100%;transition:transform .45s cubic-bezier(.2,.85,.3,1)}
  /* 입력 상태: 집을 120px 올림 (지면 슬라이스가 115px 따라 올라옴 → 뜨지 않음).
     1층 이름표 하단 y≈797 → A-Z 자판(top 816) 위 19px 여백 */
  #houseLayer.zoom  {transform:translateY(-120px) scale(.82)}
  #houseImg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 창문 = SVG 캐릭터 1장(아치 프레임 + 유리 + 인물 + 이름표가 한 파일에 포함).
     house.png 위에 1:1 로 덮어써서 baked 캐릭터를 가림 */
  .win{position:absolute;cursor:pointer}
  .win .chbox{position:absolute;inset:0;transform-origin:50% 88%}
  .win .chbox img{position:absolute;display:block;max-width:none}
  .win .chbox > img.svgch{inset:0;width:100%;height:100%}
  .win .chbox.crop{overflow:hidden}          /* SVG 미제공(Woody) → house.png 크롭 폴백 */
  .win.hit .chbox{animation:popIn .8s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes popIn{0%{transform:scale(1)}35%{transform:scale(1.16) translateY(-3%)}
    60%{transform:scale(1.03)}80%{transform:scale(1.09)}100%{transform:scale(1)}}
  /* SVG 프레임 340x460 안에서 실제 그림은 x 3.7%~96.2% / y 3.6%~96.3% 에 위치 */
  .win .dim{position:absolute;inset:2.5% 3%;background:#1A0E2B;opacity:0;border-radius:20px;
    transition:opacity .35s;pointer-events:none}
  .win .ring{position:absolute;inset:1.2% 1.6%;border:12px solid #17B26A;border-radius:28px;
    opacity:0;pointer-events:none;box-shadow:0 0 0 6px rgba(255,255,255,.6),0 12px 34px rgba(0,0,0,.3);
    transition:opacity .2s}
  .win .pulse{position:absolute;inset:1.2% 1.6%;border:12px solid #17B26A;border-radius:28px;
    opacity:0;pointer-events:none}
  .win.hit .pulse{animation:pulseRing .7s ease-out 2}
  @keyframes pulseRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
  .win.reveal .ring,.win.reveal .pulse{border-color:#FF9F1C}

  #boy{position:absolute;left:428px;top:1085px;width:336px;z-index:4;
    opacity:0;transform:translateY(320px);
    transition:transform .5s cubic-bezier(.2,.9,.3,1.25),opacity .3s}
  #boy.in{opacity:1;transform:none}
  #boy.out{opacity:0;transform:translateY(340px);transition:transform .38s ease-in,opacity .3s}
  #boy.wave{animation:waveB 1.1s ease-in-out}
  @keyframes waveB{0%,100%{transform:none}25%{transform:rotate(-2.5deg)}
    55%{transform:rotate(2deg)}80%{transform:rotate(-1.5deg)}}

  #homeBtn{position:absolute;left:1786px;top:50px;width:142px;z-index:13;cursor:pointer}
  #homeBtn:active{transform:translateY(3px)}
  /* 한글 토글: 홈버튼과 동일한 폭 142px (종횡비 275:171 유지 → 142x88.3)
     face 중심 y = 79 + 0.4678*88.3 = 120.3 → 홈버튼 face 중심(120.3)과 일치
     face 우측(1627+131.2=1758.4) ↔ 홈 face 좌측(1798.4) = 눈에 보이는 간격 40px */
  #koBtn{position:absolute;left:1627px;top:79px;width:142px;z-index:13;cursor:pointer;
    transition:filter .18s}
  #koBtn:active{transform:translateY(3px)}
  #koBtn.on{filter:drop-shadow(0 0 4px rgba(255,255,255,.95)) drop-shadow(0 0 8px rgba(255,255,255,.7))}

  /* ── 상단 배너 ─────────────────────────────────────────────── */
  /* 세로 정렬 기준: 홈버튼 원형 face 중심 y = 50 + 0.4954*142 = 120.3px
     배너 중심 = top 71 + 98/2 = 120 → 홈버튼 / 한글버튼 / 배너 3개가 같은 축 */
  #banner{position:absolute;left:40px;top:71px;right:402px;height:98px;background:#fff;border-radius:49px;
    display:flex;align-items:center;gap:22px;padding:0 30px;box-shadow:0 6px 0 rgba(0,0,0,.10);
    opacity:0;transform:translateY(-24px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:12}
  #banner.on{opacity:1;transform:none;pointer-events:auto}
  #banner .spk{width:64px;height:64px;border-radius:56% 44% 52% 48% / 46% 54% 44% 56%;background:#2FBF71;color:#fff;border:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  #banner .spk svg{width:54%;height:54%;fill:currentColor;stroke:none}
  #banner .spk .sound-wave{fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  #banner .txt{font-size:36px;font-weight:400;color:#2b2b2b;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1 1 auto}
  #banner b{font-weight:800;color:#111}
  #banner b.pulse{animation:pulseW .7s ease 3}
  @keyframes pulseW{0%,100%{color:#111}50%{color:#E2007A}}
  #stars{display:flex;gap:7px;flex:0 0 auto}
  #stars .s{width:44px;height:44px}
  #stars .s svg{width:100%;height:100%;display:block}

  /* ── 말풍선 ────────────────────────────────────────────────── */
  #bubble{position:absolute;left:790px;top:1238px;width:900px;background:#fff;border-radius:44px;
    padding:36px 46px;font-size:54px;font-weight:400;line-height:1.24;color:#1a1a1a;z-index:14;
    word-break:keep-all;overflow-wrap:break-word;
    box-shadow:0 8px 0 rgba(0,0,0,.08);opacity:0;transform:scale(.72);transform-origin:0% 50%;
    transition:opacity .3s,transform .32s cubic-bezier(.2,.9,.3,1.25)}
  #bubble.on{opacity:1;transform:scale(1)}
  #bubble b{font-weight:800}

  /* ── 입력 패널 ─────────────────────────────────────────────── */
  #panel{position:absolute;left:0;right:0;bottom:0;height:470px;background:rgba(255,255,255,.97);
    border-radius:56px 56px 0 0;box-shadow:0 -12px 44px rgba(0,0,0,.18);z-index:16;
    transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.85,.3,1);
    display:flex;align-items:center;justify-content:center;gap:36px;padding:0 40px}
  #panel.on{transform:none}
  #cells{display:flex;gap:20px}
  .cellwrap{position:relative}
  .cellwrap .guess{position:absolute;top:-52px;left:0;right:0;text-align:center;font-size:38px;
    font-weight:800;color:#6B3FA0;height:44px;opacity:0;transition:opacity .2s}
  .cellwrap.has .guess{opacity:1}
  /* 정사각 180x180 — 캔버스 내부 해상도도 정사각이라 글자가 눌리지 않음 */
  .cell{width:180px;height:180px;border-radius:28px;background:#F4F1FA;border:6px solid #D8CDEA;
    position:relative;overflow:hidden;cursor:crosshair;transition:border-color .18s,background .18s}
  .cell.active{border-color:#6B3FA0;background:#fff}
  .cell.ok{border-color:#2FBF71;background:#EAFBF1}
  .cell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .cell .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:124px;font-weight:700;color:#E2DAEE;pointer-events:none}
  .cell .lines{position:absolute;inset:0;pointer-events:none}
  .cellwrap .x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;
    background:#C9BEE0;color:#fff;border:0;font-size:22px;line-height:1;cursor:pointer;display:none;z-index:3}
  .cellwrap.has .x{display:block}
  #cells.shake{animation:shk .32s}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}
    40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}

  .ctrls{display:flex;flex-direction:column;gap:16px}
  .btn{border:0;border-radius:26px;font-size:30px;font-weight:700;padding:18px 26px;cursor:pointer;
    color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.16);white-space:nowrap}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.16)}
  .btn.clear{background:#B9AECB}
  .btn.ok{background:#2FBF71;font-size:36px;padding:24px 40px}
  .btn.kb{background:#6B3FA0;font-size:26px;padding:14px 20px}
  #devbtn{position:absolute;right:26px;top:16px;background:none;border:0;color:#B0A6C2;font-size:20px;cursor:pointer}

  /* A-Z 보조 키보드: 흰 라운드 패널 '밖'(위)에 뜨는 플로팅 오버레이 */
  /* 카드 1030x194 (테두리 10px 포함) · 키 66px */
  #kb{position:absolute;left:50%;bottom:490px;z-index:17;
    display:none;grid-template-columns:repeat(13,66px);gap:10px;
    background:#fff;border:10px solid #6B3FA0;border-radius:34px;padding:16px;
    box-shadow:0 12px 40px rgba(30,16,60,.28);
    transform:translateX(-50%) translateY(24px);opacity:0;
    transition:transform .28s cubic-bezier(.2,.85,.3,1),opacity .22s}
  #kb.on{display:grid;transform:translateX(-50%);opacity:1}
  #kb button{width:66px;height:66px;border-radius:17px;border:0;background:#F0EBF8;color:#4A2E73;
    font-size:32px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #DED4EE;padding:0}
  #kb button:active{background:#6B3FA0;color:#fff;box-shadow:none;transform:translateY(3px)}

  #toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);z-index:30;
    background:rgba(24,16,40,.93);color:#fff;font-size:46px;font-weight:800;padding:24px 48px;border-radius:34px;
    opacity:0;transition:.28s;pointer-events:none;text-align:center;line-height:1.3}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

  #result{position:absolute;inset:0;background:rgba(20,12,36,.86);z-index:40;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:34px;color:#fff}
  #result.on{display:flex}
  #result h1{font-size:96px;margin:0;font-weight:800}
  #result .rs{display:flex;gap:20px}
  #result .rs svg{width:104px;height:104px}
  #famrow{display:flex;gap:22px;background:#fff;border-radius:34px;padding:26px 32px}
  #famrow .fc{text-align:center;color:#4A2E73;font-size:28px;font-weight:800;width:160px}
  #famrow .fc .ph{width:160px;height:217px;border-radius:18px;position:relative;margin-bottom:10px;
    overflow:hidden}
  #famrow .fc .ph .chbox{position:absolute;inset:0}
  #famrow .fc .ph img{position:absolute;inset:0;width:100%;height:100%;display:block}
  #famrow .fc .ph .chbox.crop{overflow:hidden}
  #famrow .fc .ph .chbox.crop img{width:auto;height:auto;inset:auto}
  #famrow .fc .rel{color:#9B8FB0;font-weight:500;font-size:24px}

  /* ── 시작 게이트 (브라우저 자동재생 정책상 음성은 첫 탭 이후에만 재생됨) ── */
  #startGate{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:30px;background:rgba(18,12,32,.55)}
  #startGate.off{display:none}
  #startGate h1{margin:0;font-size:130px;font-weight:800;color:#fff;
    text-shadow:0 8px 0 rgba(0,0,0,.18)}
  #startGate .sub{font-size:36px;color:#fff;opacity:.9}
  #startBtn{border:0;border-radius:70px;background:#2FBF71;color:#fff;font-size:64px;font-weight:800;
    padding:30px 90px;cursor:pointer;box-shadow:0 10px 0 rgba(0,0,0,.22)}
  #startBtn:active{transform:translateY(5px);box-shadow:0 5px 0 rgba(0,0,0,.22)}
</style>
</head>

/* ── 필기 인식기 ─────────────────────────────────────────────
   칸별 획 → bbox 크롭 → 종횡비 유지 32x32 → 3중 박스블러 → L2 정규화
   → 레퍼런스 글리프와 코사인 유사도 → 13개 이름 사전으로 워드 레벨 보정
   ※ 레퍼런스 폰트는 인식 안정성을 위해 시스템 산세리프 + Paperlogy 혼합 */
const GS=32;
function boxBlur(src,r){
  const t=new Float32Array(GS*GS),o=new Float32Array(GS*GS);
  for(let y=0;y<GS;y++)for(let x=0;x<GS;x++){let s=0,c=0;for(let k=-r;k<=r;k++){const xx=x+k;if(xx<0||xx>=GS)continue;s+=src[y*GS+xx];c++}t[y*GS+x]=s/c}
  for(let y=0;y<GS;y++)for(let x=0;x<GS;x++){let s=0,c=0;for(let k=-r;k<=r;k++){const yy=y+k;if(yy<0||yy>=GS)continue;s+=t[yy*GS+x];c++}o[y*GS+x]=s/c}
  return o;
}
function featurize(cv){
  const w=cv.width,h=cv.height,g=cv.getContext('2d'),d=g.getImageData(0,0,w,h).data;
  let minx=w,miny=h,maxx=-1,maxy=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>24){if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y}}
  if(maxx<0)return null;
  const bw=maxx-minx+1,bh=maxy-miny+1,sc=24/Math.max(bw,bh);
  const ox=(GS-bw*sc)/2,oy=(GS-bh*sc)/2;
  let a=new Float32Array(GS*GS);
  for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){
    const v=d[(y*w+x)*4+3]/255; if(v<=.09)continue;
    const nx=Math.round((x-minx)*sc+ox),ny=Math.round((y-miny)*sc+oy);
    if(nx>=0&&nx<GS&&ny>=0&&ny<GS)a[ny*GS+nx]=Math.max(a[ny*GS+nx],v);
  }
  for(let i=0;i<3;i++)a=boxBlur(a,2);
  let n=0;for(let i=0;i<a.length;i++)n+=a[i]*a[i];n=Math.sqrt(n)||1;
  for(let i=0;i<a.length;i++)a[i]/=n;
  return a;
}

                  '500 46px "Comic Sans MS",cursive'];
const TPL={};
function addTemplates(fonts){
  const cv=document.createElement('canvas');cv.width=cv.height=72;const g=cv.getContext('2d');
  for(let i=0;i<26;i++){
    const L=String.fromCharCode(65+i),l=String.fromCharCode(97+i);
    if(!TPL[l])TPL[l]=[];
    for(const f of fonts)for(const ch of [L,l]){

      g.textAlign='center';g.textBaseline='middle';g.fillText(ch,36,36);

}

function letterSims(ft){const o={};for(const l in TPL){let m=0;for(const t of TPL[l])m=Math.max(m,dot(ft,t));o[l]=m}return o}

function resolveWord(sims){
  const n=sims.length;
  if(sims.some(s=>!s))return{name:null,reason:'empty'};
  const cands=NAMES.filter(x=>x.length===n);
  let best=null,bs=-1;
  for(const c of cands){let s=0;for(let i=0;i<n;i++)s+=sims[i][c[i].toLowerCase()];s/=n;if(s>bs){bs=s;best=c}}

/* ── 효과음 ─────────────────────────────────────────────────
   Higgsfield 는 standalone SFX 를 제공하지 않아(음악/효과음 모델은
   game pipeline 전용) Web Audio API 로 절차적 생성.
   → 외부 파일 0개, 완전 오프라인, 지연 0ms — 아동 앱 요건에 오히려 적합
   ※ BGM 은 사용자 요청으로 제외. 효과음만 유지 */
let AC=null, gSfx=null;
function audioInit(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  gSfx=AC.createGain(); gSfx.gain.value=.9; gSfx.connect(AC.destination);
}
function tone(freq,at,dur,{type='triangle',gain=.12,to=null}={}){
  if(!AC)return; const t=AC.currentTime+at;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+Math.min(.02,dur*.25));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(gSfx); o.start(t); o.stop(t+dur+.02);
}
function noise(at,dur,{f0=400,f1=2600,gain=.09}={}){
  if(!AC)return; const t=AC.currentTime+at, n=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(); src.buffer=buf;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
  bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(gain,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(gSfx); src.start(t); src.stop(t+dur);
}

function makeCell(wrap,idx){
  const cell=wrap.querySelector('.cell'),cv=wrap.querySelector('canvas');

  const g=cv.getContext('2d');g.scale(DPR,DPR);
  g.lineWidth=12;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#3B2A55';
  const o={wrap,cell,cv,g,idx,ink:false,sims:null,timer:null};
  let drawing=false,last=null;
  const pt=e=>{const r=cell.getBoundingClientRect();
    return{x:(e.clientX-r.left)/r.width*CS,y:(e.clientY-r.top)/r.height*CS}};
  cv.addEventListener('pointerdown',e=>{if(busy)return;setActive(idx);drawing=true;last=pt(e);o.ink=true;
    wrap.classList.add('has');const gh=cell.querySelector('.ghost');if(gh)gh.style.display='none';
    g.beginPath();g.moveTo(last.x,last.y);g.lineTo(last.x+.01,last.y);g.stroke();
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    clearTimeout(o.timer);e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);
    g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();last=p;e.preventDefault()});
  const up=()=>{if(!drawing)return;drawing=false;clearTimeout(o.timer);o.timer=setTimeout(()=>recognize(o),700)};
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,up));

}

function recognize(o){
  const ft=featurize(o.cv); if(!ft){o.sims=null;return}
  o.sims=letterSims(ft);
  let bl=null,bv=-1;for(const l in o.sims)if(o.sims[l]>bv){bv=o.sims[l];bl=l}
  o.wrap.querySelector('.guess').textContent=o.idx===0?bl.toUpperCase():bl;
  o.cell.classList.toggle('ok',bv>=ACCEPT); SFX.tick();
  const nx=cells.findIndex((c,k)=>k>o.idx&&!c.ink); if(nx>-1)setActive(nx);
}

  banner.classList.add('on');
  houseLayer.classList.add('zoom');            /* 집 축소 + 위로 이동 */
  $('#ground').classList.add('up');            /* 잔디선도 같이 올려 지면 유지 */
  buildCells(q.ans);buildKb();
  setTimeout(()=>{panel.classList.add('on');SFX.panel()},160);
}
function submit(){
  const q=QUESTIONS[qi];
  if(cells.some(c=>!c.ink)){SFX.wrong();play('empty');toast('빈 칸이 있어요<br><span style="font-size:34px">Fill every box</span>');return}
  const res=resolveWord(cells.map(c=>c.sims));
  if(!res.name||res.reason==='lowconf'){
    SFX.wrong();play('retry');
    toast('다시 써볼까?<br><span style="font-size:34px">Let\'s write it again</span>');return; // 오답 카운트 X
  }
  res.name===q.ans?onCorrect():onWrong(res.name);
}
function onCorrect(){
  const q=QUESTIONS[qi];busy=true;celebrating=true;
  scores[qi]=wrong===0?2:1;renderStars();
  panel.classList.remove('on');kbEl.classList.remove('on');
  houseLayer.classList.remove('zoom');$('#ground').classList.remove('up');
  clearHints();
  const w=winOf(q.ans),ring=w.querySelector('.ring');
  setTimeout(()=>{popWindow(q.ans);ring.style.opacity=1;w.classList.add('hit')},300);
  play(q.voOk);
  toast('⭐ That\'s right!<br><span style="font-size:34px">'+q.ans+'</span>',1800);
  setTimeout(()=>{qi++;qi>=QUESTIONS.length?showResult():startQuestion()},2400);
}
function onWrong(got){
  const q=QUESTIONS[qi];wrong++;
  cellsEl.classList.add('shake');setTimeout(()=>cellsEl.classList.remove('shake'),340);SFX.wrong();
  if(wrong===1){
    play(q.voHint);
    toast('Look again!<br><span style="font-size:34px">'+q.key+'</span>');
    const b=bannerTxt.querySelector('b');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');
  }else if(wrong===2){
    play('hint3');
    toast('힌트! 세 명 중에 있어요<br><span style="font-size:34px">It\'s one of these three</span>');
    CHARS.forEach(c=>{if(!q.pool.includes(c.name))winOf(c.name).querySelector('.dim').style.opacity=.62});
  }else reveal();
}
function reveal(){
  const q=QUESTIONS[qi];busy=true;celebrating=true;scores[qi]=0;renderStars();clearHints();
  kbEl.classList.remove('on');
  const w=winOf(q.ans),ring=w.querySelector('.ring');
  w.classList.add('reveal');popWindow(q.ans);ring.style.opacity=1;SFX.reveal();
  toast('여기 있어요!<br><span style="font-size:34px">'+q.ans+'</span>',2600);
  play(q.voRev);
  cells.forEach((c,i)=>{clearCell(c);
    c.g.save();c.g.fillStyle='#E2DAEE';c.g.font='700 124px Paperlogy, sans-serif';
    c.g.textAlign='center';c.g.textBaseline='middle';c.g.fillText(q.ans[i],CS/2,CS*0.52);c.g.restore()});
  setTimeout(()=>{qi++;qi>=QUESTIONS.length?showResult():startQuestion()},3400);
}
function showResult(){
  celebrating=false;
  panel.classList.remove('on');banner.classList.remove('on');kbEl.classList.remove('on');
  houseLayer.classList.remove('zoom');$('#ground').classList.remove('up');clearHints();
  $('#rStars').innerHTML=scores.map(v=>starSVG(v)).join('');
  const perfect=scores.every(v=>v===2);
  $('#rTitle').textContent=perfect?'Perfect!':'Great job!';
  play(perfect?'perfect':'great'); SFX.correct(); SFX.star();
  // 가족사진 — 5문항 정답이 한 가족(mom/dad/uncle/sister/grandma)을 이룸
  $('#famrow').innerHTML=QUESTIONS.map(q=>{
    const ch=CHARS.find(c=>c.name===q.ans);
    return `<div class="fc"><div class="ph">${chboxHTML(ch)}</div>
      <div>${q.ans}</div><div class="rel">${q.rel}</div></div>`;
  }).join('');
  $('#result').classList.add('on');
}
function buildKb(){
  if(kbEl.dataset.built)return;kbEl.dataset.built='1';
  kbEl.innerHTML=Array.from({length:26},(_,i)=>{const L=String.fromCharCode(65+i);
    return `<button data-l="${L}">${L}</button>`}).join('');
  kbEl.onclick=e=>{const L=e.target.dataset&&e.target.dataset.l;if(!L)return;
    const c=cells[activeCell];if(!c)return;
    SFX.key(); setCellLetter(c,activeCell===0?L:L.toLowerCase())};  // 다음 칸 이동은 recognize()가 처리
}

$('#okBtn').onclick=submit;
$('#clearBtn').onclick=()=>cells.forEach(clearCell);
$('#kbBtn').onclick=()=>{ const on=!kbEl.classList.contains('on');
  kbEl.classList.toggle('on',on); if(on) buildKb(); };
$('#spk').onclick=()=>play(QUESTIONS[qi]&&QUESTIONS[qi].vo);
$('#koBtn').onclick=()=>{ lang = lang==='ko' ? 'en' : 'ko';
  $('#koBtn').classList.toggle('on', lang==='ko'); renderSentence(); };
const restart=()=>{qi=0;scores=[];$('#result').classList.remove('on');renderStars();
  play('again');setTimeout(startQuestion,1600)};
$('#againBtn').onclick=restart; $('#homeBtn').onclick=restart;
$('#devbtn').onclick=()=>{const w=QUESTIONS[qi].ans;
  cells.forEach((c,i)=>setCellLetter(c,i===0?w[0].toUpperCase():w[i].toLowerCase()))};
// 창문 탭 = 탐색용 (답 제출 아님)
/* 캐릭터 탭 = 이름 듣기 (탐색용, 정답 제출과 무관) */
houseLayer.addEventListener('click',e=>{
  const w=e.target.closest('.win'); if(!w||celebrating)return;
  popWindow(w.dataset.name); SFX.tap();
  play('n_'+w.dataset.name.toLowerCase());
});

// 지면 레이어에 배경 이미지 연결 (data URI 중복 방지 — <img> 의 src 를 재사용)
$('#ground').style.backgroundImage=`url("${$('#bg').src}")`;

renderStars();
$('#startBtn').onclick=()=>{ audioInit(); preloadVO();
  $('#startGate').classList.add('off'); startQuestion(); };
</script>
</body>
</html>
