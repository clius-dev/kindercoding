<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Step B-2 · ALGORITHMS — 고양이 딸기 길 만들기 v9 (종이)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css">
<link rel="stylesheet" href="DESIGN.css" type="text/css">
<link rel="preload" href="img_png/B-2_01-stage-bg-berry-v1.png" as="image">
<style>
/* ============================================================
   B-2_01 ALGORITHMS v9 — 종이 콜라주 테마 (DESIGN.md §11)
   B-2_01.algorithms_3.html(캠핑 v10) 기반.
   · 배경: 코드로 그린 캠핑 장면 → Higgsfield 종이 딸기밭(img_png/B-2_01-stage-bg-berry-v1.png)
     없으면 B-2_04 빈 판 배경으로 대체
   · 타일: 물결 SVG → 잔디 펠트(--pp-tx-grass) + 들뜸 그림자(--pp-lift-s)
   · 상단 크롬: 종이 원판 버튼(§11.4) / 완료 화면 바 버튼(§11.11)
   · 배치(2026-09-30): 판 가로 중앙 → 그 밑 명령 레일 → 그 밑 방향 버튼 한 줄
   · 입력: 방향키 즉시 이동 → 명령 레일(되감기 · 8칸 · 실행). 실행하면 순서대로 걷고 길이 그려진다
   · 규칙: 지나온 칸은 다시 못 간다 · 딸기 4개를 모두 담고 텐트에 도착해야 성공
   · 딸기 · 고양이 · 완료 고양이 · 효과음은 v10 그대로
   좌표는 전부 아트보드 1920×1200u.
   ============================================================ */
:root{
  /* 판 — 5 x 4 · 타일 130u · 간격 10u (피치 140u) · 가로 중앙 [stated]
     세로 : 판 186~736 → 레일 764~888 → 방향 버튼 916~1036 (크림 판 안쪽 124~1100) */
  --mz-t:calc(130 * var(--u));
  --mz-g:calc(10 * var(--u));
  --mz-left:615;                /* (1920 - 690) / 2 */
  --mz-top:186;

  --mz-path:#2B2A33;            /* 이동 경로 — 먹색 반투명 + 흰 점선 (v10 확정값) */
  --mz-path-alpha:.38;
  --mz-path-dot:#FFFFFF;

  /* 명령 레일 — 짙은 잔디 펠트 */
  --rl-face:#3F6B3C;
  --rl-ring:rgba(196,226,170,.62);
  --rl-cursor:#EFE6CF;          /* 다음 칸 — 첨부 레퍼런스의 밝은 원 */
  --rl-run:#FFD23F;

  /* 다홍 — 되감기 전용 (v10 에서 가져옴) */
  --bz-vermilion:#E2543D;
  --bz-vermilion-hover:#D2432C;
  --bz-vermilion-press:#B23D2B;
  --bz-ink:var(--c-primary-ink);
}
/* DESIGN.css 의 --pp-edge 는 --sp-gutter(단위 없음) 때문에 무효값 — 길이로 다시 잡는다 (B-2_04 v2 와 같음) */
.stage.theme-paper{--pp-edge:calc(28 * var(--u))}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0F2418;overflow:hidden;
  font-family:var(--ff);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{display:grid;place-items:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
img,svg{display:block}
[hidden]{display:none!important}

/* ---------- 무대 ---------- */
.stage{position:relative;width:calc(1920 * var(--u));height:calc(1200 * var(--u));
  overflow:hidden;isolation:isolate;background:#3C5A34}
.stage__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:0;pointer-events:none}

/* ---------- 상단 크롬 §11.2 · §11.4 ---------- */
.pp-edge-tl,.pp-edge-tr{z-index:20}
.pp-ibtn svg{fill:currentColor}
.pp-ibtn--sound .sound-wave{fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 말풍선 — 종이 칩 한 줄 (방향 · 안내) ---------- */
.bz-bubble{
  position:absolute;left:50%;top:calc(88 * var(--u));z-index:15;
  transform:translate(-50%,-50%) scale(.96);
  display:flex;align-items:center;gap:calc(16 * var(--u));
  min-height:calc(92 * var(--u));padding:0 calc(40 * var(--u));margin:0;
  background:var(--pp-cream) var(--pp-tx-grain) center/calc(460 * var(--u)) calc(160 * var(--u));
  background-blend-mode:overlay;
  border-radius:calc(46 * var(--u));filter:var(--pp-lift-m);
  font-size:calc(42 * var(--u));font-weight:700;color:var(--pp-ink);white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity var(--t-fast),transform var(--t-fast) var(--e-pop);
}
.bz-bubble.is-on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bz-wave{display:flex;align-items:flex-end;gap:calc(5 * var(--u));height:calc(28 * var(--u));flex:none}
.bz-wave span{width:calc(6 * var(--u));background:var(--c-primary);border-radius:calc(3 * var(--u));animation:bzWave .7s ease-in-out infinite}
.bz-wave span:nth-child(2){animation-delay:.12s}
.bz-wave span:nth-child(3){animation-delay:.24s}
@keyframes bzWave{0%,100%{height:35%}50%{height:100%}}

/* ============================================================
   판 — 5 x 4 잔디 펠트 타일
   ============================================================ */
.mz-board{
  position:absolute;left:calc(var(--mz-left) * var(--u));top:calc(var(--mz-top) * var(--u));z-index:2;
  display:grid;
  grid-template-columns:repeat(var(--mz-cols),var(--mz-t));
  grid-template-rows:repeat(var(--mz-rows),var(--mz-t));
  gap:var(--mz-g);
}
/* 칸 — 잔디 펠트 한 장. 체커는 밝기만 한 단 다르게 (결은 그대로) */
.mz-tile{position:relative;border-radius:calc(26 * var(--u));
  background:var(--pp-tx-grass) center/100% 100% no-repeat;filter:var(--pp-lift-s)}
.mz-tile.is-dark{filter:brightness(.86) saturate(.95) var(--pp-lift-s)}

.mz-abs{position:absolute;pointer-events:none}
.mz-path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mz-path path{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* 칸 위 물건 — 딸기 · 연못 · 덤불 · 텐트. 오린 종이처럼 결 + 들뜸 그림자 */
.mz-item{z-index:2}
.mz-item svg{width:100%;height:100%;overflow:visible}
.mz-item.is-berry{width:calc(var(--mz-t) * .56);height:calc(var(--mz-t) * .66)}
.mz-item.is-pond,.mz-item.is-bush{width:calc(var(--mz-t) * .86);height:calc(var(--mz-t) * .72);filter:var(--pp-lift-s)}
.mz-item.is-tent{width:calc(var(--mz-t) * .92);height:calc(var(--mz-t) * .8);filter:var(--pp-lift-s)}
.mz-item .pp-grain{filter:url(#ppGrain)}
.is-wobbling{animation:bzWobble .62s ease}

.bz-bloom{
  position:absolute;inset:0;transform-origin:50% 80%;
  animation:bzSway 4.4s ease-in-out infinite;
  transition:opacity .34s ease,transform .34s cubic-bezier(.34,.06,.28,1);
}
.bz-bloom.is-picked{opacity:0;transform:translateY(-40%) scale(.46)}
.bz-bloom.is-wobbling{animation:bzWobble .62s ease}
.bz-berry-img{width:100%;height:100%;overflow:visible;filter:var(--pp-lift-s)}
@keyframes bzSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes bzWobble{20%{transform:rotate(-9deg)}45%{transform:rotate(7deg)}72%{transform:rotate(-4deg)}}

/* 고양이 — v10 그대로. 그림자만 종이 들뜸으로 */
.mz-cat{
  z-index:5;width:calc(var(--mz-t) * .86);
  transform:translate(-50%,-100%);
  --nx:0%;--ny:0%;
  transition:left var(--bz-step) cubic-bezier(.34,.06,.28,1),
             top var(--bz-step) cubic-bezier(.34,.06,.28,1);
  filter:var(--pp-lift-s);
}
.mz-cat svg{display:block;width:100%;height:auto;overflow:visible}
.mz-cat .mz-body{transform-box:fill-box;transform-origin:50% 100%}
.mz-cat.is-walk .mz-body{animation:mzHop var(--bz-step) ease-out}
.mz-cat.is-bumping{animation:mzBump .42s}
@keyframes mzHop{
  0%{transform:translateY(0) scale(1.04,.94)}
  45%{transform:translateY(-9%) scale(.97,1.04)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes mzBump{
  30%{transform:translate(calc(-50% + var(--nx)),calc(-100% + var(--ny))) rotate(-6deg)}
  60%{transform:translate(-50%,-100%) rotate(4deg)}
}
.bz-drop{transform-box:fill-box;transform-origin:50% 100%;animation:bzDrop .34s var(--e-pop)}
@keyframes bzDrop{
  0%{transform:translateY(-45%) scale(.35);opacity:0}
  60%{transform:translateY(0) scale(1.14);opacity:1}
  100%{transform:translateY(0) scale(1)}
}
.bz-hop{transform-box:fill-box;transform-origin:50% 100%;animation:bzHop .72s ease-in-out infinite}
.bz-catshadow{transform-box:fill-box;transform-origin:50% 50%;opacity:.16;animation:bzShadow .72s ease-in-out infinite}
.bz-twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:bzTwinkle 1.5s ease-in-out infinite}
@keyframes bzHop{
  0%,100%{transform:translateY(0) scale(1,.98)}
  20%{transform:translateY(0) scale(1.04,.93)}
  55%{transform:translateY(-8%) scale(.98,1.04)}
  82%{transform:translateY(0) scale(1.02,.96)}
}
@keyframes bzShadow{0%,100%{transform:scaleX(1);opacity:.16}55%{transform:scaleX(.78);opacity:.09}}
@keyframes bzTwinkle{0%,100%{opacity:.12;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(40deg)}}

/* ============================================================
   종이 펠트 원형 버튼 — 방향 · 되감기 · 실행 공통.
   §11.10 원형 버튼 규칙: 면 색 + 펠트 결(overlay) + --pp-lift-s. CSS 두께(box-shadow) 없음 (§11.13)
   hover 한 단 · 누름 더 어둡게
   ============================================================ */
.fb{
  --face:var(--c-primary);--face-hover:#57318A;--face-press:var(--c-primary-dark);
  position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:var(--face) var(--pp-tx-felt) center/100% 100% no-repeat;
  background-blend-mode:overlay;filter:var(--pp-lift-s);
  transition:transform var(--t-fast) var(--e-out),background-color var(--t-fast),opacity var(--t-fast);
}
@media (hover:hover){.fb:not(:disabled):hover{background-color:var(--face-hover);transform:scale(1.05)}}
.fb:not(:disabled):active{background-color:var(--face-press);transform:scale(.92)}
.fb:disabled{cursor:default;opacity:.45}
.fb:focus-visible{outline:none}

/* 방향 화살표 — img_svg/B-2/direction-arrow.svg 심볼 */
.bz-ar{width:58%;height:58%;fill:currentColor;display:block;transform-origin:50% 50%;
  transform:rotate(var(--ar-rot,0deg))}

/* ---------- 방향 버튼 — 이동 경로(레일) 밑 한 줄, 가로 중앙 [stated] ---------- */
.dpad{position:absolute;z-index:6;left:50%;top:calc(916 * var(--u));transform:translateX(-50%);
  display:flex;align-items:center;gap:calc(32 * var(--u));
  transition:transform var(--t-slow) var(--e-out),opacity var(--t-base) ease}
.dpad .fb{width:calc(120 * var(--u));height:calc(120 * var(--u))}

/* ---------- 명령 레일 (첨부 레퍼런스: 되감기 · 8칸 · 실행) ---------- */
.rail-row{position:absolute;z-index:6;left:50%;top:calc(764 * var(--u));transform:translateX(-50%);
  display:flex;align-items:center;gap:calc(20 * var(--u));
  transition:transform var(--t-slow) var(--e-out),opacity var(--t-base) ease}
.stage.is-done .rail-row,.stage.is-done .dpad{transform:translate(-50%,calc(40 * var(--u)));opacity:0;pointer-events:none}

.rail-rewind{--face:var(--bz-vermilion);--face-hover:var(--bz-vermilion-hover);--face-press:var(--bz-vermilion-press);
  width:calc(110 * var(--u));height:calc(110 * var(--u))}
.rail-rewind svg{width:52%;height:52%}
.rail-rewind svg path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rail-rewind.is-spin svg{animation:mzSpin .45s var(--e-out)}
@keyframes mzSpin{from{transform:rotate(0)}to{transform:rotate(-360deg)}}

.rail-play{--face:var(--c-success);--face-hover:var(--c-success-dark);--face-press:var(--c-success-deep);
  width:calc(124 * var(--u));height:calc(124 * var(--u))}
.rail-play svg{width:46%;height:46%;margin-left:8%}
/* 실행 대기 — 퍼지는 링 (DESIGN.md §4 .is-hint) */
.rail-play::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 0 rgba(47,191,113,.55);opacity:0}
.rail-play.is-hint::after{animation:railHint 1.4s ease-out infinite}
@keyframes railHint{0%{opacity:1;box-shadow:0 0 0 0 rgba(47,191,113,.55)}100%{opacity:0;box-shadow:0 0 0 calc(26 * var(--u)) rgba(47,191,113,0)}}

.rail{position:relative;display:flex;align-items:center;gap:calc(12 * var(--u));
  height:calc(124 * var(--u));padding:0 calc(16 * var(--u));border-radius:calc(44 * var(--u));
  background:var(--rl-face) var(--pp-tx-felt) center/calc(192 * var(--u)) calc(192 * var(--u));
  background-blend-mode:overlay;filter:var(--pp-lift-s)}
.slot{position:relative;width:calc(92 * var(--u));height:calc(92 * var(--u));border-radius:50%;
  display:grid;place-items:center;color:#fff}
.slot::before{content:'';position:absolute;inset:0;border-radius:50%;
  border:calc(5 * var(--u)) solid var(--rl-ring);transition:opacity var(--t-fast)}
/* 다음에 놓일 칸 — 밝은 원 + 가운데 점 (레퍼런스) + 번지는 빛(§11.7) */
.slot.is-next{background:var(--rl-cursor)}
.slot.is-next::before{border-color:var(--c-success)}
.slot.is-next::after{content:'';width:calc(26 * var(--u));height:calc(26 * var(--u));border-radius:50%;
  background:var(--c-success);animation:slotPulse 1.7s ease-in-out infinite}
@keyframes slotPulse{0%,100%{transform:scale(.85);opacity:.75}50%{transform:scale(1.1);opacity:1}}
/* 채워진 칸 — 보라 펠트 카드 */
.slot.is-filled{background:var(--c-primary) var(--pp-tx-felt) center/100% 100% no-repeat;background-blend-mode:overlay;
  cursor:pointer;animation:slotIn .26s var(--e-pop)}
.slot.is-filled::before{opacity:0}
@keyframes slotIn{0%{transform:scale(.4)}100%{transform:scale(1)}}
.slot .bz-ar{width:56%;height:56%}
/* 실행 중인 칸 · 막힌 칸 */
.slot.is-run{box-shadow:0 0 0 calc(7 * var(--u)) var(--rl-run)}
.slot.is-done-step{opacity:.55}
.slot.is-bad{background-color:var(--bz-vermilion);box-shadow:0 0 0 calc(7 * var(--u)) #FFE0C7;animation:slotShake .42s}
@keyframes slotShake{20%{transform:translateX(-8%)}45%{transform:translateX(7%)}72%{transform:translateX(-4%)}}

/* ============================================================
   완료 화면 — DESIGN.md §8.3 (v10 그대로, 딤은 §11.12 검정 42%)
   ============================================================ */
.win{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:var(--pp-scrim);opacity:0;pointer-events:none;transition:opacity var(--t-base) var(--e-out)}
.win.is-on{opacity:1;pointer-events:auto}
.win__stack{position:relative;width:calc(900 * var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(44 * var(--u));
  transform:scale(.82) translateY(calc(28 * var(--u)));transition:transform var(--t-slow) var(--e-pop)}
.win.is-on .win__stack{transform:none}
.win__rays,.win__glow{position:absolute;left:50%;top:calc(256 * var(--u));z-index:0;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.win__rays{width:calc(1000 * var(--u));height:calc(1000 * var(--u));
  background:repeating-conic-gradient(from 0deg,rgba(255,201,37,.6) 0deg 6deg,rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,0) 60%);
  animation:winRaySpin 26s linear infinite}
@keyframes winRaySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760 * var(--u));height:calc(760 * var(--u));
  background:radial-gradient(circle,rgba(255,232,148,.85) 0%,rgba(255,232,148,.38) 40%,rgba(255,232,148,0) 68%);
  animation:winGlowBreathe 3.4s ease-in-out infinite}
@keyframes winGlowBreathe{0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.win__art{position:relative;z-index:2;width:calc(440 * var(--u));filter:drop-shadow(0 calc(12 * var(--u)) calc(20 * var(--u)) rgba(80,40,10,.28))}
.win__art svg{display:block;width:100%;height:auto}
.win.is-on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3.5%) rotate(-1.5deg)}60%{transform:translateY(-1.5%) rotate(1.5deg)}}
.win__confetti{position:absolute;left:50%;top:calc(150 * var(--u));transform:translateX(-50%);width:calc(900 * var(--u));height:calc(700 * var(--u));z-index:5;pointer-events:none}
.conf{position:absolute;left:50%;top:40%;width:var(--w);height:var(--h);background:var(--c);border-radius:var(--r);opacity:0}
.win.is-on .conf{animation:winConfBurst 1.5s var(--e-out) forwards;animation-delay:var(--d)}
@keyframes winConfBurst{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.3)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
.win__line{position:relative;z-index:3;margin:0;color:#fff;font-size:calc(54 * var(--u));font-weight:800;line-height:1.15;text-align:center;
  text-shadow:0 calc(5 * var(--u)) 0 rgba(0,0,0,.22);text-wrap:balance}

.rotate-gate{display:none}
</style>
</head>
<body>
<!-- 방향 화살표 원본 (img_svg/B-2/direction-arrow.svg) + 종이 결 필터 -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="bz-arrow" viewBox="0 0 184.02 143.87">
    <path d="M 184.02,71.99 C 183.84,74.02 182.78,75.86 181.11,77.03 C 162.92,92.78 127.77,127.63 107.36,143.09 C 106.49,143.66 105.47,143.93 104.44,143.86 C 101.23,143.86 98.63,141.26 98.63,138.05 L 97,103.45 C 97,103.45 128,105.3 6.69,103.45 C 3.52,103.35 0.97,100.8 0.88,97.63 C -0.29,80.13 -0.29,62.56 0.88,45.05 C 0.97,41.88 3.52,39.33 6.69,39.24 C 125.44,37.38 97,39.24 97,39.24 L 98.63,5.9 C 98.63,3.82 99.74,1.9 101.54,0.86 C 103.31,-0.29 105.59,-0.29 107.36,0.86 C 127.19,16.01 163.23,50.86 181.11,66.93 C 182.77,68.11 183.84,69.95 184.02,71.99"/>
  </symbol>
  <!-- 오린 종이 결 — 면 색은 그대로 두고 잔 섬유 명암만 얹는다 (연못 · 덤불 · 텐트) -->
  <filter id="ppGrain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in" result="gm"/>
    <feBlend in="SourceGraphic" in2="gm" mode="soft-light"/>
  </filter>
</svg>

/* ============================================================
   완료 팡파르 · 승리 BGM — B-2_06(패턴) 과 같은 소리를 그대로 가져왔다.
   다른 화면의 완료 화면과 소리가 같아야 한다 [stated]. 값·타이밍 모두 동일.
   ============================================================ */
const SFX = (() => {
    let ctx = null, noiseBuf = null;
    const ac = () => {
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    };

    /* ---------- 공용 보이스 ----------
       오실 2개(디튠 레이어) + 로우패스로 배음을 깎는다.
       단일 오실 삐 소리보다 마림바·글로켄에 가깝게 들린다 */
    function voice(freq, at, dur, o){
      const c = ac(); if(!c) return;
      o = o || {};
      const t0  = c.currentTime + at;
      const bus = o.bus || c.destination;
      const g = c.createGain(), f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.cut || Math.min(freq * 5 + 900, 11000), t0);
      f.Q.setValueAtTime(.7, t0);
      const peak = o.gain || .12, atk = o.atk || .006;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      f.connect(g); g.connect(bus);
      const osc = (type, mul, det) => {
        const s = c.createOscillator();
        s.type = type;
        s.frequency.setValueAtTime(freq * (mul || 1), t0);
        if(o.bend) s.frequency.exponentialRampToValueAtTime(freq * o.bend, t0 + dur * .8);
        s.detune.setValueAtTime(det || 0, t0);
        s.connect(f); s.start(t0); s.stop(t0 + dur + .05);
      };
      osc(o.type || 'sine', 1, 0);
      if(o.layer) osc(o.layer, o.mul || 2, o.detune || 6);
    }
    const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));

    /* 노이즈 스웹 — 화음 앞에 붙이면 '쨘' 하는 공기감이 생긴다 */
    function swoosh(at, dur, f0, f1, gain){
      const c = ac(); if(!c) return;
      if(!noiseBuf){
        const n = Math.floor(c.sampleRate * 1.2);
        noiseBuf = c.createBuffer(1, n, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        let s = 12345;
        for(let i = 0; i < n; i++){ s = (s*1103515245 + 12345) % 2147483648; d[i] = s/1073741824 - 1 }
      }
      const t0 = c.currentTime + at;
      const src = c.createBufferSource(); src.buffer = noiseBuf;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
      bp.frequency.setValueAtTime(f0, t0);
      bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .3);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      src.connect(bp); bp.connect(g); g.connect(c.destination);
      src.start(t0); src.stop(t0 + dur + .05);
    }

    const C3=130.81, C4=261.63, G4=392,
          C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99, A5=880, B5=987.77,
          C6=1046.5, D6=1174.7, E6=1318.5, F6=1396.9, G6=1568, A6=1760,
          C7=2093, E7=2637, G7=3136;
    const F3=174.61, G3=196;

    /* 마림바 — 짧은 어택, 배음 얇게 */
    const marimba = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'triangle', mul:2, detune:5,
                         gain:gain || .13, cut:f*4+700});
    /* 글로켄 — 밝고 길게 울린다 */
    const bell = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'sine', mul:3.01, detune:4,
                         gain:gain || .10, cut:f*7+2000});

    /* ---- BGM 스케줄러 ---- */
    let bgmOn = false, bgmTm = null, bgmBus = null, bgmAt = 0;
    const BEAT = .28;                       // 8박 = 2.24s 루프
    const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
                 [A5,2,.5],[G5,2.5,.5],[E5,3,.5],[G5,3.5,.5],
                 [F5,4,.5],[A5,4.5,.5],[C6,5,.5],[A5,5.5,.5],
                 [G5,6,.5],[E5,6.5,.5],[C5,7,1]];
    const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
    function bgmTone(freq, at, dur, type, gain){
      const c = ac(); if(!c || !bgmBus) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, at);
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(gain, at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, at + dur);
      o.connect(g); g.connect(bgmBus);
      o.start(at); o.stop(at + dur + .05);
    }
    function bgmLoop(){
      const c = ac(); if(!c || !bgmOn) return;
      if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;   // 밀렸으면 따라잡는다
      MEL.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'triangle', .055));
      BASS.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'sine', .045));
      bgmAt += 8*BEAT;
      bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);               // 다음 루프를 미리 예약
    }

    return {
      unlock(){ ac() },

      /* 칸을 짚을 때 — 규칙과 맞으면 마림바가 한 칸씩 올라가고,
         어긋나면 낮고 둔한 나무 소리(경고음 아님) */
      tick(step, ok){
        if(ok) marimba([C5,E5,A5,C6][step] || C5, 0, .30, .13);
        else   voice(165, 0, .12, {type:'sine', gain:.075, cut:420});
      },

      /* 정답 1개 완성 — 글로켄 3음 + 낮은 화음으로 받쳐 준다 */
      correct(){
        [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
        voice(C4, .02, .5, {type:'sine', gain:.05, cut:900});
      },

      /* 5개 클리어 — 스웹 + 상승 마림바. 팝업 팡파르로 이어진다 */
      clear(){
        swoosh(0, .38, 500, 4200, .055);
        [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12));
        bell(C6, .40, .8, .09);
      },

      tap(){ voice(620, 0, .09, {type:'sine', gain:.10, cut:2200, bend:.66}) },
      hint(){ bell(D6, 0, .30, .085); bell(A6, .13, .38, .07) },

      /* ---- 팝업 팡파르 — 약 4.8초로 길게 이어진다 ----
         ① 콜(3연음) ② 상승 런 ③ 지속 화음 ④ 해결 멜로디 ⑤ 종결 화음 + 반짝임 */
      fanfare(){
        swoosh(0, .5, 400, 5200, .06);
        // ① 콜
        [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ② 상승 런
        [[G5,.46,.12],[A5,.55,.12],[B5,.64,.12],[C6,.73,.34]]
          .forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ③ 지속 화음
        chord([C5,E5,G5,C6], 1.00, 1.25, {type:'triangle', layer:'sine', mul:2, gain:.055, cut:5200});
        voice(C3, 1.00, 1.4, {type:'sine', gain:.055, cut:600});
        // ④ 해결 멜로디
        [[E6,1.12,.24],[D6,1.36,.24],[C6,1.60,.38],[G5,1.98,.32],
         [A5,2.32,.26],[B5,2.58,.26],[C6,2.84,.80]]
          .forEach(([f,a,d]) => bell(f,a,d,.10));
        // ⑤ 종결 화음 + 베이스 + 반짝임
        swoosh(3.42, .45, 900, 6000, .045);
        chord([C6,E6,G6], 3.50, 1.7, {type:'sine', layer:'triangle', mul:2, gain:.06, cut:8000});
        voice(C4, 3.50, 1.8, {type:'sine', gain:.05, cut:900});
        voice(C3, 3.50, 2.0, {type:'sine', gain:.05, cut:520});
        [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(([f,a,d]) => bell(f,a,d,.045));
      },

      /* ---- 승리 BGM — 2.24s 루프 (C-F-G 진행) ----
         파일 없이 합성한다. 팝업이 열려 있는 동안만 돌고 다시하기에서 멈춘다.
         delay: 팡파르가 잦아든 뒤 들어오도록 시작을 늦춘다 */
      bgm(on, delay){
        const c = ac(); if(!c) return;
        if(on){
          if(bgmOn) return;
          bgmOn = true;
          const d = (delay === undefined) ? .35 : delay;
          bgmBus = c.createGain();
          bgmBus.gain.setValueAtTime(.0001, c.currentTime);
          bgmBus.gain.setValueAtTime(.0001, c.currentTime + d);
          bgmBus.gain.exponentialRampToValueAtTime(1, c.currentTime + d + 1.1);
          bgmBus.connect(c.destination);
          bgmAt = c.currentTime + d;
          bgmLoop();
        }else{
          if(!bgmOn) return;
          bgmOn = false;
          clearTimeout(bgmTm); bgmTm = null;
          const bus = bgmBus; bgmBus = null;
          if(bus){
            const t0 = c.currentTime;
            bus.gain.cancelScheduledValues(t0);
            bus.gain.setValueAtTime(Math.max(bus.gain.value, .0001), t0);
            bus.gain.exponentialRampToValueAtTime(.0001, t0 + .4);
            setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
          }
        }
      }
    };
  })();

/* ============================================================
   소리 — 효과음(WebAudio)과 음성(클립 + 합성)
   ============================================================ */
const CHIME_FREQUENCY = {up:720, down:470, left:540, right:620, pick:880, remove:340, play:680};
let audioCtx = null;

/** 짧은 사인파 효과음 — 오디오 파일 없이 조작 피드백만 담당한다. */
function chime(kind){
  if (!soundOn) return;
  if (!audioCtx){
    if (typeof AudioContext === 'undefined') return;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const f = CHIME_FREQUENCY[kind], osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, now);
  if (kind === 'pick') osc.frequency.exponentialRampToValueAtTime(f * 1.5, now + .16);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.linearRampToValueAtTime(.2, now + .012);
  gain.gain.exponentialRampToValueAtTime(.0001, now + .3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + .34);
}

const clipCache = new Map();
let playingClip = null, pendingClip = null;

function getClip(key){
  let a = clipCache.get(key);
  if (!a){ a = new Audio(VOICE_CLIP[key]); a.preload = 'auto'; clipCache.set(key, a); }
  return a;
}
function hush(){
  SFX.bgm(false);
  pendingClip = null;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (!playingClip) return;
  playingClip.pause(); playingClip.currentTime = 0; playingClip = null;
}
function playClip(a){
  a.currentTime = 0; playingClip = a;
  a.play().then(
    () => { if (pendingClip === a) pendingClip = null; },
    err => {
      /* 첫 탭 전에는 브라우저가 자동재생을 막는다 — 다음 입력에서 다시 시도한다 */
      if (err && err.name === 'NotAllowedError'){ pendingClip = a; return; }
      if (playingClip === a) playingClip = null;
    }
  );
}
function speak(line){
  if (!soundOn || !line) return;
  hush();
  const key = lang === 'en' ? CLIP_BY_LINE[line.trim()] : null;
  if (key){ playClip(getClip(key)); return; }
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(line);
  u.lang = lang === 'en' ? 'en-US' : 'ko-KR';
  u.rate = .92; u.pitch = 1.08;
  window.speechSynthesis.speak(u);
}
['pointerdown','keydown'].forEach(type => window.addEventListener(type, () => {
  const p = pendingClip; if (!p) return;
  pendingClip = null; playClip(p);
}, {capture:true}));

/* ============================================================

   · 판 밖 · 연못 · 덤불 → 튕기고 멈춤
   · 지나온 칸 → 튕기고 멈춤 (재방문 금지)
   · 텐트 도착 : 딸기를 다 담았으면 성공, 남았으면 남은 딸기를 흔들고 멈춤
   · 카드가 끝났는데 텐트가 아니면 "텐트까지 가야 해요"
   실패하면 고양이는 그 자리에 두고, 다음 실행 때 출발 칸으로 돌아가 처음부터 다시 걷는다.
   ============================================================ */
const stage = document.getElementById('stage');
const boardEl = document.getElementById('board');
const paletteEl = document.getElementById('palette');
const railEl = document.getElementById('rail');
const playBtn = document.getElementById('play');
const rewindBtn = document.getElementById('rewind');

let program = [];                            /* 레일에 놓인 방향 */
let position = START_POSITION;
let visited = new Set();
let picked = [];
let isRunning = false, isFinished = false, isBumping = false;
let runIndex = -1, badIndex = -1;
let result = null;
let stepSeconds = STEP_SECONDS;
let timers = [];
let runToken = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const onBoard = p => p.column >= 0 && p.column < BOARD_COLUMNS && p.row >= 0 && p.row < BOARD_ROWS;
const samePos = (a, b) => a.column === b.column && a.row === b.row;
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const cellKey = p => p.column + ',' + p.row;
const obstacleAt = p => OBSTACLES.find(o => o.column === p.column && o.row === p.row);

const X = (c, f) => 'calc(' + c + ' * (var(--mz-t) + var(--mz-g)) + var(--mz-t) * ' + f + ')';
const Y = X;
const T = f => 'calc(var(--mz-t) * ' + f + ')';

function wobble(el){
  if (!el) return;
  el.classList.remove('is-wobbling');
  void el.offsetWidth;
  el.classList.add('is-wobbling');
}
const shakeFlower = n => wobble(bloomByNumber.get(n));

/** 고양이·딸기·길만 출발 상태로 — 레일 카드는 그대로 둔다 */
function resetWalk(){
  runToken += 1;
  clearTimers();
  isRunning = false; isBumping = false;
  picked = []; position = START_POSITION; visited = new Set([cellKey(START_POSITION)]);
  runIndex = -1; badIndex = -1;
  bloomByNumber.forEach(el => el.classList.remove('is-wobbling'));
  stepSeconds = TIMING.rewindStep / 1000;
  applyStep();
  later(() => { stepSeconds = STEP_SECONDS; applyStep(); }, 300);
  addTrail(null, START_POSITION);
}

/** 판 전체를 처음으로 — 되감기 · 다시하기 */
function resetGame(){
  isFinished = false; result = null;
  program = [];
  resetWalk();
  renderAll();
}

/* ---- 레일 편집 ---- */
function addCard(direction){
  if (isRunning || isFinished) return;
  if (program.length >= RAIL_SLOTS){ say(t('railFull'), 1400); if (soundOn) SFX.tick(0, false); return; }
  if (badIndex >= 0 || runIndex >= 0 || picked.length || !samePos(position, START_POSITION)) resetWalk();
  program = program.concat(direction);
  say(t(direction), 850);
  chime(direction);
  renderRail(); renderPalette(); renderCat(); renderBoard();
}
function removeCard(i){
  if (isRunning || isFinished || i >= program.length) return;
  resetWalk();
  program = program.slice(0, i).concat(program.slice(i + 1));
  chime('remove');
  renderAll();
}

/* ---- 실행 ---- */
async function run(){
  if (isRunning || isFinished) return;
  if (!program.length){ say(t('empty'), 1600); pulsePalette(); return; }
  resetWalk();
  renderAll();
  isRunning = true; renderPalette(); renderRail();
  const token = runToken;
  chime('play');
  await wait(TIMING.beforeRun);
  if (token !== runToken) return;

  for (let i = 0; i < program.length; i += 1){
    runIndex = i; renderRail();
    const direction = program[i];
    const delta = DIRECTION_DELTA[direction];
    const next = {column:position.column + delta.column, row:position.row + delta.row};
    say(t(direction), 700);

    const obstacle = onBoard(next) ? obstacleAt(next) : null;
    const again = onBoard(next) && visited.has(cellKey(next));
    if (!onBoard(next) || obstacle || again){
      if (obstacle) wobble(obstacleEls.get(cellKey(next)));
      await bump(delta);
      if (token !== runToken) return;
      stopRun(i, again ? t('revisit') : t('blocked'));
      return;
    }

    const from = position;
    position = next;
    visited.add(cellKey(next));
    addTrail(from, next);
    catEl.classList.remove('is-walk'); void catEl.offsetWidth; catEl.classList.add('is-walk');
    renderCat();
    await wait(stepSeconds * 1000 + TIMING.stepPadding);
    if (token !== runToken) return;

    const here = FIELD_FLOWERS.find(f => f.column === next.column && f.row === next.row && !picked.includes(f.number));
    if (here){
      picked = picked.concat(here.number);
      renderBoard(); renderCat();
      chime('pick');
      await wait(TIMING.pick);
      if (token !== runToken) return;
    }

    if (samePos(position, END_POSITION)){
      const left = TOTAL_FLOWERS - picked.length;
      if (left === 0){ win(); return; }
      FIELD_FLOWERS.filter(f => !picked.includes(f.number))
        .forEach((f, k) => later(() => shakeFlower(f.number), k * 130));
      stopRun(i, leftTipLine(left));
      return;
    }
  }
  /* 카드를 다 썼는데 텐트가 아니다 */
  const left = TOTAL_FLOWERS - picked.length;
  FIELD_FLOWERS.filter(f => !picked.includes(f.number))
    .forEach((f, k) => later(() => shakeFlower(f.number), k * 130));
  stopRun(-1, left ? leftTipLine(left) : t('noTent'));
}

async function bump(delta){
  catEl.style.setProperty('--nx', (delta.column * 22) + '%');
  catEl.style.setProperty('--ny', (delta.row * 10) + '%');
  if (soundOn) SFX.tick(0, false);
  isBumping = true; renderCat();
  await wait(TIMING.bump);
  isBumping = false; renderCat();
}

function stopRun(bad, line){
  isRunning = false;
  runIndex = -1; badIndex = bad;
  renderRail(); renderPalette();
  later(() => say(line, 2600), 250);
}

function win(){
  isRunning = false; isFinished = true; runIndex = -1;
  result = {hasWon:true};
  renderAll();
  sayVoiceOnly(t('full'));
}

function pulsePalette(){
  paletteEl.querySelectorAll('.fb').forEach((b, i) => later(() => wobble(b), i * 90));
}

function walkerCatSvg(){
  const w = 'b2-walk-weave';
  return '<svg viewBox="-8 -6 126.83 176" focusable="false" aria-hidden="true">'
    + '<defs>' + weaveDefs(w) + '</defs>'
    + '<g class="mz-body">'
    + '<g fill="none" stroke="' + CAT_COLOR.fur + '" stroke-width="' + CAT_ARM_WIDTH + '" stroke-linecap="round">'
    + '<path d="' + ARM_LEFT + '"/><path d="' + ARM_RIGHT + '"/></g>'
    + '<path d="' + CAT_BODY_PATH + '" fill="' + CAT_COLOR.fur + '"/>'
    + '<ellipse cx="' + CAT_BELLY.cx + '" cy="' + CAT_BELLY.cy + '" rx="' + CAT_BELLY.rx + '" ry="' + CAT_BELLY.ry + '" fill="' + CAT_COLOR.belly + '"/>'
    + '<path d="' + CAT_HEAD_PATH + '" fill="' + CAT_COLOR.fur + '"/>'
    + '<circle cx="' + CAT_EYE_LEFT_WHITE.cx + '" cy="' + CAT_EYE_LEFT_WHITE.cy + '" r="' + CAT_EYE_LEFT_WHITE.r + '" transform="' + CAT_EYE_LEFT_WHITE.t + '" fill="' + CAT_COLOR.eyeWhite + '"/>'
    + '<circle cx="' + CAT_EYE_LEFT_DARK.cx + '" cy="' + CAT_EYE_LEFT_DARK.cy + '" r="' + CAT_EYE_LEFT_DARK.r + '" transform="' + CAT_EYE_LEFT_DARK.t + '" fill="' + CAT_COLOR.eyeDark + '"/>'
    + '<path d="' + CAT_EYE_RIGHT_WHITE_PATH + '" fill="' + CAT_COLOR.eyeWhite + '"/>'
    + '<circle cx="' + CAT_EYE_RIGHT_DARK.cx + '" cy="' + CAT_EYE_RIGHT_DARK.cy + '" r="' + CAT_EYE_RIGHT_DARK.r + '" transform="' + CAT_EYE_RIGHT_DARK.t + '" fill="' + CAT_COLOR.eyeDark + '"/>'
    + '<path d="' + CAT_NOSE_PATH + '" fill="' + CAT_COLOR.nose + '"/>'
    + '<path d="' + CAT_MOUTH_PATH + '" fill="' + CAT_COLOR.eyeDark + '"/>'
    + '<g transform="translate(' + CHEER_BASKET.x + ' ' + CHEER_BASKET.y + ') scale(' + CHEER_BASKET.scale + ')">'
    + '<path d="' + basketBody.d + '" fill="url(#' + w + ')"/>'
    + '<path d="' + basketHandle.d + '" fill="' + basketHandle.fill + '"/>'
    + '<g class="bz-berries"></g>'
    + '<path d="' + basketRim.d + '" fill="' + basketRim.fill + '"/>'
    + '</g>'
    + '<g fill="' + CAT_COLOR.fur + '"><circle cx="27" cy="118" r="' + PAW_R + '"/><circle cx="84" cy="118" r="' + PAW_R + '"/></g>'
    + '</g></svg>';
}

function place(el, c, r, fx, fy){
  el.style.left = X(c, fx);
  el.style.top = Y(r, fy);
}

function buildBoard(){
  boardEl.style.setProperty('--mz-cols', BOARD_COLUMNS);
  boardEl.style.setProperty('--mz-rows', BOARD_ROWS);
  for (let i = 0; i < BOARD_COLUMNS * BOARD_ROWS; i += 1){
    const column = i % BOARD_COLUMNS, row = Math.floor(i / BOARD_COLUMNS);
    const tile = document.createElement('div');
    tile.className = 'mz-tile' + ((column + row) % 2 ? ' is-dark' : '');
    boardEl.appendChild(tile);
  }

  trailEl = document.createElement('div');
  trailEl.className = 'mz-abs'; trailEl.style.inset = '0'; trailEl.style.zIndex = '1';
  boardEl.appendChild(trailEl);

  const addItem = (cls, html, c, r, fx, fy) => {
    const el = document.createElement('div');
    el.className = 'mz-abs mz-item ' + cls;
    el.style.transform = 'translate(-50%,-50%)';
    el.innerHTML = html;
    place(el, c, r, fx, fy);
    boardEl.appendChild(el);
    return el;
  };

  OBSTACLES.forEach(o => {
    const el = addItem('is-' + o.kind, o.kind === 'pond' ? pondSvg() : bushSvg(), o.column, o.row, .5, .5);
    obstacleEls.set(cellKey(o), el.firstElementChild);
    el.firstElementChild.style.transformOrigin = '50% 90%';
  });

  FIELD_FLOWERS.forEach(f => {
    const el = addItem('is-berry', '<span class="bz-bloom"><svg class="bz-berry-img" viewBox="0 0 '
      + BERRY_W + ' ' + BERRY_H + '" role="img" aria-label="Strawberry" focusable="false">'
      + berryArt() + '</svg></span>', f.column, f.row, .5, .5);
    bloomByNumber.set(f.number, el.firstElementChild);
  });

  addItem('is-tent', tentSvg(), END_POSITION.column, END_POSITION.row, .5, .46);

  catEl = document.createElement('div');
  catEl.className = 'mz-abs mz-cat';
  catEl.setAttribute('role', 'img');
  catEl.innerHTML = walkerCatSvg();
  boardEl.appendChild(catEl);
  basketBerriesEl = catEl.querySelector('.bz-berries');

  addTrail(null, START_POSITION);
}

/* ---- 이동 경로 (v10 확정 A안) — 칸 중심을 잇는 둥근 먹색 반투명 선 + 흰 점선 ---- */
const TILE_U = 130, GAP_U = 10, PITCH_U = TILE_U + GAP_U;
const BOARD_W_U = BOARD_COLUMNS * PITCH_U - GAP_U, BOARD_H_U = BOARD_ROWS * PITCH_U - GAP_U;
const centerU = n => n * PITCH_U + TILE_U / 2;
const PATH_LAYERS = [
  [43, 'var(--mz-path)', null, 'var(--mz-path-alpha)'],   /* 58u × 130/176 */
  [10, 'var(--mz-path-dot)', 31, '.95'],
];
let trailPts = [];
let trailAnim = 0;

function drawTrail(pts){
  let d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
  if (pts.length === 1) d += ' l0.01 0';
  trailEl.innerHTML = '<svg class="mz-path" viewBox="0 0 ' + BOARD_W_U + ' ' + BOARD_H_U + '" aria-hidden="true">'
    + PATH_LAYERS.map(([w, c, gap, o]) =>
        '<path d="' + d + '" style="stroke:' + c + ';opacity:' + o + '" stroke-width="' + w + '"'
        + (gap ? ' stroke-dasharray="0 ' + gap + '"' : '') + '/>').join('')
    + '</svg>';
}
function addTrail(from, to){
  cancelAnimationFrame(trailAnim);
  const b = [centerU(to.column), centerU(to.row)];
  if (!from){ trailPts = [b]; drawTrail(trailPts); return; }
  const base = trailPts.slice();
  const a = base[base.length - 1];
  trailPts = base.concat([b]);
  const dur = stepSeconds * 1000, t0 = performance.now();
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    drawTrail(base.concat([[a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e]]));
    if (k < 1) trailAnim = requestAnimationFrame(tick);
  };
  trailAnim = requestAnimationFrame(tick);
}

function renderBoard(){
  bloomByNumber.forEach((el, number) => el.classList.toggle('is-picked', picked.includes(number)));
}

/** 바구니 속 딸기 — 딸기 4개를 바구니 자리 7개에 비율로 채운다 */
function syncBasketBerries(){
  const SVGNS = 'http://www.w3.org/2000/svg';
  const shown = Math.round(picked.length * BERRY_SLOTS.length / TOTAL_FLOWERS);
  const want = BERRY_SLOTS.filter(s => s.order <= shown);
  const have = new Map(Array.from(basketBerriesEl.children, el => [Number(el.dataset.order), el]));
  have.forEach((el, order) => {
    if (!want.some(s => s.order === order)){ el.remove(); have.delete(order); }
  });
  want.forEach((s, i) => {
    let el = have.get(s.order);
    if (!el){
      el = document.createElementNS(SVGNS, 'g');
      el.dataset.order = s.order;
      el.setAttribute('transform', berryPlace(s.x, s.base, s.scale, s.tilt));
      el.innerHTML = '<g class="bz-drop">' + berryArt() + '</g>';
    }
    if (basketBerriesEl.children[i] !== el){
      basketBerriesEl.insertBefore(el, basketBerriesEl.children[i] || null);
    }
  });
}

function renderCat(){
  place(catEl, position.column, position.row, .5, .9);
  catEl.classList.toggle('is-bumping', isBumping);
  catEl.setAttribute('aria-label', 'Cat with ' + picked.length + ' of ' + TOTAL_FLOWERS + ' strawberries');
  syncBasketBerries();
}

/* ---- 방향 패드 · 레일 ---- */
function buildPalette(){
  paletteEl.innerHTML = PALETTE_DIRECTIONS.map(d =>
    '<button class="fb" type="button" data-pick="' + d + '" aria-label="' + dirLabel(d) + '">' + arrowImg(d) + '</button>').join('');
}
function buildRail(){
  railEl.innerHTML = Array.from({length:RAIL_SLOTS}, (_, i) =>
    '<button class="slot" type="button" data-slot="' + i + '" aria-label="Slot ' + (i + 1) + '"></button>').join('');
}
function renderPalette(){
  const lock = isFinished || isRunning;
  paletteEl.querySelectorAll('button').forEach(b => { b.disabled = lock || program.length >= RAIL_SLOTS; });
  rewindBtn.disabled = lock;
  playBtn.disabled = lock;
  /* 실행 대기 링 — 카드가 1장 이상 있고, 아직 이번 카드로 실행하지 않았을 때 */
  playBtn.classList.toggle('is-hint', !lock && program.length > 0 && badIndex < 0 && trailPts.length === 1);
}
function renderRail(){
  railEl.querySelectorAll('.slot').forEach((el, i) => {
    const d = program[i];
    const filled = d !== undefined;
    const was = el.dataset.dir || '';
    if (filled && was !== d){ el.innerHTML = arrowImg(d); el.dataset.dir = d; el.classList.remove('is-filled'); void el.offsetWidth; }
    if (!filled && was){ el.innerHTML = ''; el.dataset.dir = ''; }
    el.classList.toggle('is-filled', filled);
    el.classList.toggle('is-next', !filled && i === program.length && !isFinished);
    el.classList.toggle('is-run', i === runIndex);
    el.classList.toggle('is-done-step', runIndex >= 0 && i < runIndex);
    el.classList.toggle('is-bad', i === badIndex);
    el.setAttribute('aria-label', 'Slot ' + (i + 1) + (filled ? ': ' + dirLabel(d) : ''));
  });
}

/* 컨페티 — 완료 화면이 열릴 때 한 번 터진다 (DESIGN.md §8.3) */
(function buildConfetti(){
  const box = document.getElementById('winConf');
  const C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#EE3A44'];
  let seed = 7;
  const rnd = () => (seed = (seed*1103515245 + 12345) % 2147483648) / 2147483648;
  for (let i = 0; i < 34; i++){
    const ang = rnd() * Math.PI * 2;
    const dist = 180 + rnd() * 250;
    const w = 12 + Math.round(rnd()*12), h = 16 + Math.round(rnd()*18);
    const el = document.createElement('i');
    el.className = 'conf';
    el.style.cssText =
      '--w:calc(' + w + '*var(--u)); --h:calc(' + h + '*var(--u));' +
      '--c:' + C[i % C.length] + '; --r:' + (rnd() < .3 ? '50%' : '2px') + ';' +
      '--dx:calc(' + (Math.cos(ang)*dist).toFixed(0) + '*var(--u));' +
      '--dy:calc(' + (Math.sin(ang)*dist*.9 + 120).toFixed(0) + '*var(--u));' +
      '--rot:' + Math.round(rnd()*900 - 450) + 'deg;' +
      '--d:' + (rnd()*.22).toFixed(2) + 's';
    box.appendChild(el);
  }
})();

const winEl = document.getElementById('win');
let winSoundPlayed = false;
function renderWin(){
  const hasWon = result ? result.hasWon : false;
  stage.classList.toggle('is-done', hasWon);
  winEl.classList.toggle('is-on', hasWon);
  if (hasWon && !winSoundPlayed){
    winSoundPlayed = true;
    if (soundOn){ SFX.fanfare(); SFX.bgm(true, 3.4); }
  }
  if (!hasWon && winSoundPlayed){ winSoundPlayed = false; SFX.bgm(false); }
  winEl.setAttribute('aria-hidden', hasWon ? 'false' : 'true');
  document.getElementById('winLine').textContent = t('winLine');
  document.getElementById('winRetry').querySelector('span').textContent = t('winRetry');
  document.getElementById('winExit').querySelector('span').textContent  = t('winExit');
}

document.getElementById('winRetry').addEventListener('click', () => { resetGame(); });
function leaveGame(){
  SFX.bgm(false);
  /* 다른 B-2 화면과 같은 규칙 — 홈의 해당 섹션으로 */
  location.href = 'B-2_00.home.html#algorithms';
}
document.getElementById('winExit').addEventListener('click', leaveGame);

function renderAll(){
  renderBoard(); renderCat(); renderRail(); renderPalette(); renderWin();
}

/* ============================================================
   입력
   ============================================================ */
paletteEl.addEventListener('click', e => {
  const b = e.target.closest('[data-pick]');
  if (b && !b.disabled) addCard(b.dataset.pick);
});
railEl.addEventListener('click', e => {
  const s = e.target.closest('[data-slot]');
  if (s) removeCard(Number(s.dataset.slot));
});
playBtn.addEventListener('click', () => run());
rewindBtn.addEventListener('click', () => {
  if (isRunning || isFinished) return;
  rewindBtn.classList.remove('is-spin'); void rewindBtn.offsetWidth; rewindBtn.classList.add('is-spin');
  chime('remove');
  resetGame();
  say(t('cleared'), 1400);
});
document.getElementById('back').addEventListener('click', leaveGame);

const langBtn = document.getElementById('lang');
const lgEn = document.getElementById('lgEn'), lgKo = document.getElementById('lgKo');
function applyLang(){
  document.documentElement.lang = lang;
  lgEn.className = lang === 'en' ? 'on' : 'off';
  lgKo.className = lang === 'ko' ? 'on' : 'off';
  langBtn.setAttribute('aria-pressed', lang === 'ko' ? 'true' : 'false');
  langBtn.setAttribute('aria-label', lang === 'en' ? '한국어' : 'English');
  renderWin();
}
langBtn.addEventListener('click', () => {
  lang = lang === 'en' ? 'ko' : 'en';
  hush();
  applyLang();
  sayVoiceOnly(t('intro'));
});
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  if (!soundOn) hush();
  soundBtn.setAttribute('aria-pressed', String(!soundOn));
  soundBtn.setAttribute('aria-label', soundOn ? 'Sound off' : 'Sound on');
});

/* ============================================================
   시작
   ============================================================ */
buildCheerCat();
buildBoard();
buildPalette();
buildRail();
applyLang();
applyStep();
visited = new Set([cellKey(START_POSITION)]);
renderAll();
setTimeout(() => sayVoiceOnly(t('intro')), TIMING.introDelay);
</script>
