<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Step B-SEQ · SEQUENCING — 길 따라 놓기</title>
<!-- Paperlogy — who-is-it-prototype_11.html 과 동일한 CDN. 이 link 가 없어서 폰트가 적용되지 않았다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css">
<link rel="stylesheet" href="DESIGN.css" type="text/css">
<style>
/* ============================================================
   Kids Coding App — Step B-2 PATTERN RECOGNITION
   토큰은 DESIGN.md 를 따름. 신규: --c-mint
   ============================================================ */
:root{
  /* responsive scale */
  --design-w:1920; --design-h:1200;
  --u-min:.5px; --u-max:1.25px;
  --u:clamp(var(--u-min), min(100dvw / 1920, 100dvh / 1200), var(--u-max));

  /* brand */
  --c-primary:#6B3FA0; --c-primary-light:#9463D6; --c-primary-dark:#4A2874;
  --c-primary-ink:#4A2E73; --c-primary-50:#F4F1FA; --c-primary-100:#F0EBF8;
  --c-primary-200:#E2DAEE; --c-primary-300:#D8CDEA; --c-primary-400:#C9BEE0;

  /* semantic */
  --c-success:#2FBF71; --c-success-dark:#17B26A; --c-success-bg:#EAFBF1;
  --c-success-deep:#12905A;    /* 버튼 두께용 그늘. --c-success-dark 는 명도차가 없어 단이 안 보인다 */
  --c-accent:#FF9D02; --c-accent-3:#FF9F1C; --c-accent-dark:#C97A00;
  --c-star:#FFD23F; --c-info:#1478F0;
  --c-mint:#AEE9E4;            /* NEW — 원본 PATTERN 말풍선 하늘색 */
  --c-mint-ink:#1B4F5C;
  /* 화면 배경 — 컬러 없음(흰색). 색을 다시 넣을 땐 이 한 줄만 바꾸면 된다.
     (직전 베이지 안: #EBD7B0 = HSL(40,60%,81%) — 일러스트 팔레트 계열) */
  --c-sand:#FFFFFF;
  --c-paper:#FFFFFF;                 /* 워크시트 면 */

  /* neutral */
  --c-white:#fff; --c-ink:#111; --c-ink-2:#1A1A1A;
  --c-gray:#7A8B93; --c-gray-2:#9D93AC; --c-gray-3:#B0A6C2;
  --c-disabled-bg:#DCD7E4; --c-disabled-ink:#9D93AC;

  /* 말풍선 */
  --c-bubble:#FFFFFF;                     /* 말풍선 면 — 크림 #F6EEDA 에서 교체 [stated] */
  --c-tag:#F7941D;

  /* 배경 — 단색 + 톤온톤 패턴. 색 교체는 이 2줄 */
  --c-bg:hsl(var(--bg-h) 78% 76%);        /* 밝은 옐로우 바탕 #F2DA92 */
  --c-bg-mark:hsl(var(--bg-h) 66% 69%);   /* 패턴 마크 — 바탕과 명도차 7%p */

  /* 패널 테두리 — 컬러 프레임. 색을 바꾸려면 이 3줄만 고친다.
     --c-primary 계열보다 채도·명도를 낮춘 연보라. 테두리는 배경이지 액션이 아니다 */
  --c-frame:#A57BE0;        /* 인트로 단계 칩 번호 원 · 화살표 HSL 265 62% 68% */
  /* (폐기) 문제 패널 테두리 계열 — 흰 카드 한 장으로 가면서 안 쓴다 [stated]
     --c-frame-lip:#D5C2F0; --c-frame-deep:#8357C1; */
  /* 진행 표시 알약 — 배경보다 어두운 트랙 위에 별을 얹는다 [stated] */
  /* ==== 배경 계열 — 색상(hue) 하나로 전부 굴러간다 [stated] ====
     다른 색으로 바꾸려면 --bg-h 한 줄만 고치면 된다.
     S/L 비율은 대비를 맞춰 둔 값이므로 그대로 두는 게 좋다.
     (이전: 175 민트 / 지금: 205 하늘) */
  --bg-h:45;                              /* 골드 옐로우 계열 색상값 */
  --c-track:rgba(0,0,0,.50);              /* 진행 알약 트랙 — 검정 반투명 [stated] */
  --c-star-off:#FFFFFF;                    /* 아직 못 푼 별 — 흰색 */
  /* 문제 카드 — 흰색 [stated].
     셀 상태는 흰색을 쓰지 않고 배경과 같은 계열의 옅은 틴트로 알린다 */
  --c-card:var(--c-white);                /* 카드 면 · 배경 대비 1.51 */
  --c-card-on:hsl(var(--bg-h) 85% 84%);   /* 정답·진행 (흰 면 대비 1.25) */
  --c-card-off:hsl(var(--bg-h) 6% 88%);   /* 어긋남   (흰 면 대비 1.31) */
  /* (폐기) 나무 게시판 토큰 — 되돌릴 때를 위해 남겨둔다
     --c-board:#CE6F22; --c-board-deep:#A2500F; --c-board-lip:#E58C3E; */

  /* radius / spacing / shadow / motion */
  --r-lg:34px; --r-xl:44px; --r-pill:999px;
  /* 버튼 비대칭 반경 — DESIGN.md §3.7 */
  --r-blob-a:56% 44% 52% 48% / 46% 54% 44% 56%;
  --r-blob-b:44% 56% 47% 53% / 55% 45% 56% 44%;
  --r-blob-c:50% 50% 44% 56% / 44% 56% 50% 50%;
  --sp-3:16px; --sp-5:26px; --sp-7:40px; --sp-gutter:28;
  --sh-card:0 6px 0 rgba(0,0,0,.10);
  --e-out:cubic-bezier(.2,.85,.3,1); --e-pop:cubic-bezier(.2,.9,.3,1.25);
  --t-fast:.18s; --t-base:.3s; --t-slow:.45s;
  --touch-min:calc(88 * var(--u));

  --ff:'Paperlogy','Paperlogy-4Regular',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:var(--ff)}
html,body{margin:0; height:100%; overflow:hidden; font-family:var(--ff); background:var(--c-bg)}

.app{position:fixed; inset:0; overflow:hidden; display:grid; place-items:center;
  --inset-t:env(safe-area-inset-top,0px); --inset-b:env(safe-area-inset-bottom,0px);
  --inset-l:env(safe-area-inset-left,0px); --inset-r:env(safe-area-inset-right,0px);
  background:var(--c-bg);
}
/* 프레임·모서리 라운드·그림자 없음 — 화면 가장자리까지 하늘색 한 판 */
.safe{position:relative; width:calc(1920 * var(--u)); height:calc(1200 * var(--u));
  background:var(--c-bg); overflow:hidden}

/* ---------- 배경 — 단색 + 톤온톤 패턴 ---------- */
.scene{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:var(--c-bg)}
.scene__svg{position:absolute; inset:0; width:100%; height:100%; display:block}

/* ---------- 문제 패널 (컬러 테두리) ----------
   stage(1620x792) @ y281~1073
   frame 26u (바깥 선 3u + 본체 + 안쪽 밝은 링 7u) → panel → 하단 여백 20u
   PATTERN 카드는 패널 밖으로 나와 프레임 상단에 걸친다 (stage-local -76~64) */
/* 상하좌우 여백 80u 균등 — 1568 = 1408 + 80×2, 820 = 660 + 80×2 [stated] */
/* 문제 그리드 중심: 208(stage top) + 62(board top) + 330(half) = 600u */
.stage{position:absolute; left:50%; top:calc(208*var(--u)); transform:translateX(-50%);
  width:calc(1568*var(--u)); height:calc(820*var(--u)); z-index:5}

/* 플랫하게 — 광택(상단 하이라이트)과 내부 그림자를 빼고 단색 면으로 둔다.
   입체감은 아래 하드 섀도 하나로만 만든다 */
/* 그린 테두리 [stated] — PATTERN 카드(.rule__box)와 같은 --c-success 라인.
   두께(하드 섀도 옆면)는 주지 않는다. 선만 굵게.
   18u = 레퍼런스(첨부 팝업) 실측 비율 17.5px / 1498px = 1.17% 를 패널 폭 1568u 에 적용 [stated] */
.stage__panel{position:absolute; inset:0; z-index:2;
  background:var(--c-card); border-radius:calc(48*var(--u));
  border:calc(18*var(--u)) solid var(--c-success);
  box-shadow:0 calc(20*var(--u)) calc(30*var(--u)) rgba(120,78,6,.16)}

/* ---------- 상단바 — 뒤로 | 한글·사운드 ----------
   타이틀 삭제 [stated]. space-between 이라 좌우 버튼만으로 균형이 맞는다 */
.topbar{position:absolute;
  left:calc(var(--sp-gutter)*var(--u) + var(--inset-l));
  right:calc(var(--sp-gutter)*var(--u) + var(--inset-r));
  top:calc(var(--sp-gutter)*var(--u) + var(--inset-t));
  height:calc(104*var(--u)); z-index:30;
  display:flex; align-items:center; justify-content:space-between}
.topbar__right{display:flex; align-items:center; gap:calc(16*var(--u))}
/* 반경 순서만 화면 구조에 맞춰 지정하고 형태·색·크기는 DESIGN.css를 사용한다. */
#btnBack{border-radius:var(--r-blob-a)}
#btnLang{border-radius:var(--r-blob-b)}
#btnSay {border-radius:var(--r-blob-c)}
.ibtn.is-playing{animation:sayPulse .5s var(--e-out) infinite alternate}
@keyframes sayPulse{to{transform:scale(1.07)}}

/* 번역 토글 — A · 한 두 글자를 나란히. 순서는 A 가 앞 [stated].
   선택된 언어는 크기로 구분한다 — 밝기만으로는 어느 쪽이 켜졌는지 약하게 읽힌다 */
.ibtn--lang{font-family:inherit; font-weight:800; line-height:1; letter-spacing:0}
.ibtn--lang .lg{display:flex; align-items:baseline; gap:calc(5*var(--u)); color:inherit}
.ibtn--lang .lg b,
.ibtn--lang .lg i{font-style:normal; font-weight:800;
  transition:font-size var(--t-fast) var(--e-out), opacity var(--t-fast)}
.ibtn--lang .lg .on{font-size:calc(40*var(--u)); opacity:1}
.ibtn--lang .lg .off{font-size:calc(30*var(--u)); opacity:.5}

/* 진행 아이콘 5개 — 푼 만큼 동그라미가 별로 바뀐다 [stated]
   민트 배경 위에서 노란 별은 대비 1.04 라 그냥 두면 안 보인다 → 외곽선 필수 */
/* 진행 표시 — 어두운 알약 트랙 위 별 5개. 푼 만큼 금색이 된다 [stated] */
.dots{display:flex; align-items:center; gap:calc(11*var(--u));
  padding:calc(11*var(--u)) calc(18*var(--u));
  background:var(--c-track); border-radius:calc(999*var(--u))}
.dots i{display:block; width:calc(32*var(--u)); height:calc(32*var(--u))}
.dots svg{width:100%; height:100%; display:block; overflow:visible}
/* 통통한 별에 흰색 아웃라인을 고정한다. 활성 시에는 채움만 노란색으로 바뀐다. */
.dot__s{fill:var(--c-star-off); stroke:#fff; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; paint-order:stroke fill;
  transform-origin:50% 50%;
  transition:fill var(--t-base) var(--e-out)}
.dots i.on .dot__s{fill:var(--c-star); animation:starPop .5s var(--e-pop)}
@keyframes starPop{
  0%{transform:scale(.55) rotate(-30deg)}
  60%{transform:scale(1.24) rotate(8deg)}
  100%{transform:scale(1) rotate(0)}}

/* ---------- footer ---------- */
/* 진행 표시는 하단 센터 [stated] */
.edge-bottom{position:absolute; left:calc(96*var(--u)); right:calc(96*var(--u));
  bottom:calc(28*var(--u)); display:flex; align-items:center; justify-content:center;
  pointer-events:none}
.edge-bottom .btn{pointer-events:auto}
.foot-l{display:flex; align-items:center; gap:calc(30*var(--u))}
/* 알약도 같은 원리 — 어긋낸 반경 + box-shadow 두께 */
.btn{--lift:calc(11*var(--u)); --h:calc(104*var(--u));   /* 실제 렌더 높이 */
  position:relative; font-family:inherit; font-weight:800; border:0; cursor:pointer;
  color:#fff; background:var(--face);
  min-height:var(--touch-min); padding:calc(16*var(--u)) calc(44*var(--u));
  margin-bottom:var(--lift);            /* 두께가 차지하는 자리 */
  font-size:calc(34*var(--u));
  /* DESIGN.md §3.7 배율 — x .62 .44 .60 .46 / y .50 .42 .52 .44 (대각 균형) */
  border-radius:
    calc(var(--h)*.62) calc(var(--h)*.44) calc(var(--h)*.60) calc(var(--h)*.46) /
    calc(var(--h)*.50) calc(var(--h)*.42) calc(var(--h)*.52) calc(var(--h)*.44);
  box-shadow:0 var(--lift) 0 var(--face-active),
             0 calc(var(--lift) + 6*var(--u)) calc(12*var(--u)) rgba(60,30,10,.2);
  transition:background var(--t-fast), transform var(--t-fast) var(--e-out),
             box-shadow var(--t-fast) var(--e-out)}
.btn:active{transform:translateY(calc(var(--lift) * .7));
  box-shadow:0 calc(var(--lift) * .3) 0 var(--face-active),
             0 calc(var(--lift) * .3 + 3*var(--u)) calc(6*var(--u)) rgba(60,30,10,.2)}
.btn > span{position:relative; display:block}
/* 다시하기 — DESIGN.css .btn-bar (DESIGN.md §3.8). 이 화면은 섹션 색만 (보라) */
/* .btn--retry / .btn--exit 색은 DESIGN.css 가 정한다 — DESIGN.md §8.3 */
.btn--start{--face:var(--c-success); --face-active:var(--c-success-deep);
  font-size:calc(44*var(--u)); padding:calc(22*var(--u)) calc(76*var(--u))}

/* ---------- 완료 팝업 — 박스 없이 캐릭터만 ---------- */
.win{position:absolute; inset:0; z-index:40; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.42);   /* 검정, 너무 어둡지 않게 */
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--e-out)}
.win.on{opacity:1; pointer-events:auto}

.win__stack{position:relative; width:calc(900*var(--u));
  display:flex; flex-direction:column; align-items:center; gap:calc(44*var(--u));
  transform:scale(.82) translateY(calc(28*var(--u)));
  transition:transform var(--t-slow) var(--e-pop)}
.win.on .win__stack{transform:none}

/* 빛 — 캐릭터 중심(무대 높이 512u 의 절반)에 정렬 */
.win__rays, .win__glow{position:absolute; left:50%; top:calc(256*var(--u));
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0}
.win__rays{width:calc(1000*var(--u)); height:calc(1000*var(--u));
  background:repeating-conic-gradient(from 0deg,
    rgba(255,201,37,.6) 0deg 6deg, rgba(255,201,37,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(circle, #000 22%, rgba(0,0,0,0) 60%);
  mask-image:radial-gradient(circle, #000 22%, rgba(0,0,0,0) 60%);
  animation:raySpin 26s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.win__glow{width:calc(760*var(--u)); height:calc(760*var(--u));
  background:radial-gradient(circle,
    rgba(255,232,148,.85) 0%, rgba(255,232,148,.38) 40%, rgba(255,232,148,0) 68%);
  animation:glowBreathe 3.4s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}

.win__art{position:relative; z-index:2; width:calc(600*var(--u)); height:auto; display:block;
  filter:drop-shadow(0 calc(12*var(--u)) calc(20*var(--u)) rgba(80,40,10,.28))}
.win.on .win__art{animation:winHop 1.6s var(--e-out) .3s 2}
@keyframes winHop{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-3.5%) rotate(-1.5deg)}
  60%{transform:translateY(-1.5%) rotate(1.5deg)}}

.win__stack .win__actions{position:relative; z-index:3}

/* 반짝이 — 캐릭터 영역을 덮는 박스 안에서 원형 궤도로 배치 */
.win__sparks{position:absolute; left:50%; top:0; transform:translateX(-50%);
  width:calc(600*var(--u)); height:calc(512*var(--u));   /* 캐릭터 박스와 동일 */
  z-index:4; pointer-events:none}
.spark{position:absolute; left:var(--x); top:var(--y);
  width:var(--s); height:var(--s); background:var(--c);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%);
  opacity:0; animation:twinkle 2.4s var(--e-out) infinite; animation-delay:var(--d)}
.spark--dot{clip-path:none; border-radius:50%}
@keyframes twinkle{
  0%,100%{opacity:0; transform:scale(.4) rotate(0deg)}
  35%{opacity:1; transform:scale(1) rotate(35deg)}
  70%{opacity:.35; transform:scale(.75) rotate(70deg)}}

/* 컨페티 — 팝업 등장 순간 한 번 터진다 */
.win__confetti{position:absolute; left:50%; top:calc(150*var(--u)); transform:translateX(-50%);
  width:calc(900*var(--u)); height:calc(700*var(--u)); z-index:5; pointer-events:none}
.conf{position:absolute; left:50%; top:40%; width:var(--w); height:var(--h);
  background:var(--c); border-radius:var(--r); opacity:0}
.win.on .conf{animation:confBurst 1.5s var(--e-out) forwards; animation-delay:var(--d)}
@keyframes confBurst{
  0%  {opacity:0; transform:translate(0,0) rotate(0deg) scale(.3)}
  12% {opacity:1}
  70% {opacity:1}
  100%{opacity:0;
       transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}

/* ---------- 버디(고양이) + 말풍선 ----------
   브리핑 : 고양이·말풍선이 화면 센터. 규칙을 다 말하면
   플레이 : 말풍선은 접히고 고양이만 왼쪽 하단으로 미끄러진다 [stated].
   고양이는 그대로 남아 "누르면 다시 알려주는 버튼"이 된다 */
.buddy{position:absolute; inset:0; z-index:15; pointer-events:none}

/* 자리(slot)와 버튼(cat)을 분리한다 — 슬라이드는 slot 의 transform,
   눌림(scale)은 cat 의 transform. 한 요소에 겹치면 :active 가 슬라이드를
   통째로 덮어써서 누르는 순간 고양이가 제자리로 튄다 (시작하기 버튼과 같은 함정) */
/* 크기를 키웠다 [stated] — 220×258 → 244×286.
   플레이 상태 폭의 상한은 그리드 왼쪽 끝(256u)이 정한다 : left 8 + 244 = 252 < 256.
   화면 왼쪽에도 8u 는 남겨야 귀 끝이 뷰포트에 잘려 보이지 않는다 */
.buddy__slot{position:absolute;
  left:calc(var(--sp-gutter)*var(--u) + var(--inset-l));
  bottom:calc(-18*var(--u));
  width:calc(244*var(--u)); height:calc(286*var(--u));
  overflow:visible;
  transform-origin:50% 100%;            /* 바닥을 딛고 커지게 */
  transform:none;                       /* 플레이 위치 */
  transition:transform .62s var(--e-out)}
/* 브리핑 : 화면 센터 + 확대. 센터에는 그리드가 없으니 상한에 안 걸린다 [stated]
   x 이동 830u = (1920-244)/2 − 8, scale 1.18 → 화면상 288 × 337u */
body.is-briefing .buddy__slot{
  transform:translate(calc(700*var(--u)), calc(-304*var(--u))) scale(1.1)}

.buddy__cat{position:absolute; inset:0;
  padding:0; border:0; background:none; cursor:pointer; pointer-events:auto;
  overflow:visible; isolation:isolate;
  -webkit-tap-highlight-color:transparent;
  transition:transform var(--t-base) var(--e-pop)}
.buddy__cat > .buddy__pose{position:absolute; inset:0; display:block; width:100%; height:100%;
  overflow:visible; pointer-events:none; will-change:opacity; backface-visibility:hidden;
  filter:drop-shadow(0 0 calc(7*var(--u)) rgba(255,255,255,.72))
         drop-shadow(0 calc(8*var(--u)) calc(14*var(--u)) rgba(70,45,10,.20))}
/* 고양이와 같은 박스(244×286u)를 그대로 쓴다. 원본이 939×1676(세로로 긴 전신)이라
   cover + top 으로 잘라 상반신만 노출한다 — 하반신은 박스 밖으로 잘린다 [stated] */
/* 슬롯보다 20% 크게 그린다 — 접지선(슬롯 아래끝)은 고정, 위·오른쪽으로만 커진다 [stated] */
.buddy__farmer{inset:auto auto 0 0 !important;
  width:120% !important; height:120% !important;
  /* 원본 위쪽 4.9% 가 빈 여백이라 그만큼 끌어올려 고양이 머리 높이와 맞춘다 [stated] */
  object-fit:cover; object-position:center 14%}
.buddy__mc,.buddy__curious{display:none !important}
/* curious 원본(145×157)을 기존 캐릭터(110.83×130)와 같은 배율로 확대한다.
   하반신은 화면 아래쪽에서 자연스럽게 가리고, 외곽 글로우는 자르지 않는다. */
.buddy__curious{inset:0 auto auto 0 !important;
  width:130.83% !important; height:120.77% !important;
  object-fit:fill; object-position:left top; opacity:0}
.buddy__cat:active{transform:scale(.94)}
/* 브리핑이 끝나고 조용해지면 "눌러 보세요" 신호로 천천히 숨쉰다.
   물음표 배지는 뺐다 [stated] — 신호는 이 미세한 움직임 하나로 충분하다 */
/* 각 표정이 보이는 동안 한 번씩 가볍게 들썩인다.
   이미지가 교체되는 0·50·100%에서는 반드시 제자리라 전환이 튀지 않는다. */
body.is-idlecat .buddy__cat{animation:catIdleMotion 6s ease-in-out infinite}
body.is-idlecat .buddy__cat:active{animation:none; transform:scale(.94)}
@keyframes catIdleMotion{
  0%,50%,100%{transform:translateY(0) rotate(0)}
  24%{transform:translateY(calc(-5*var(--u))) rotate(-1deg)}
  74%{transform:translateY(calc(-5*var(--u))) rotate(1deg)}
}
/* 문제풀이 중에만 기본 표정과 curious 표정이 3초마다 즉시 바뀐다.
   크로스페이드·이동·확대 없이 같은 자리에서 확실하게 교체한다. */
body.is-idlecat .buddy__mc{animation:catPoseMain 6s steps(1,end) infinite}
body.is-idlecat .buddy__curious{animation:catPoseCurious 6s steps(1,end) infinite}
@keyframes catPoseMain{
  0%,49.99%,100%{opacity:1}
  50%,99.99%{opacity:0}
}
@keyframes catPoseCurious{
  0%,49.99%,100%{opacity:0}
  50%,99.99%{opacity:1}
}
/* ---------- 농부 소년 반응 [stated] ----------
   idle 애니메이션(0,2,1)보다 특이도가 높아야 이긴다 → body 조건을 함께 건다 */
.buddy__cat.is-cheer, body.is-idlecat .buddy__cat.is-cheer{animation:farmCheer .9s var(--e-pop)}
@keyframes farmCheer{
  0%{transform:translateY(0) rotate(0)}
  20%{transform:translateY(calc(-26*var(--u))) rotate(-5deg)}
  42%{transform:translateY(0) rotate(0)}
  62%{transform:translateY(calc(-16*var(--u))) rotate(4deg)}
  100%{transform:translateY(0) rotate(0)}}
.buddy__cat.is-huh, body.is-idlecat .buddy__cat.is-huh{animation:farmHuh .7s ease-in-out}
@keyframes farmHuh{
  0%,100%{transform:rotate(0)}
  28%{transform:rotate(-7deg)}
  64%{transform:rotate(5deg)}}

@media (prefers-reduced-motion:reduce){
  .buddy__cat.is-cheer, .buddy__cat.is-huh,
  body.is-idlecat .buddy__cat.is-cheer, body.is-idlecat .buddy__cat.is-huh{animation:none}
  body.is-idlecat .buddy__cat{animation:none}
  body.is-idlecat .buddy__mc{animation:none; opacity:1}
  body.is-idlecat .buddy__curious{animation:none; opacity:0}
}

/* 말풍선 제거됨 — 브리핑 설명은 음성으로만 [stated] */

.talk__tag{position:absolute; left:calc(122*var(--u)); top:calc(-34*var(--u));
  z-index:3; background:var(--c-tag); color:#fff; font-weight:800;
  font-size:calc(34*var(--u)); letter-spacing:.02em; line-height:1;
  padding:calc(17*var(--u)) calc(36*var(--u));
  border-radius:calc(38*var(--u)) calc(34*var(--u)) calc(40*var(--u)) calc(32*var(--u)) /
                calc(34*var(--u)) calc(40*var(--u)) calc(32*var(--u)) calc(38*var(--u));
  box-shadow:0 calc(4*var(--u)) 0 #C96F0B}

/* 브리핑 동안에는 진행 별을 감춘다 — 센터에 선 고양이가 알약을 덮고,
   시작도 안 한 진행도는 읽을 것도 없다. 왼쪽으로 비켜서면 다시 나온다 */
.edge-bottom{transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .edge-bottom{opacity:0; visibility:hidden}

/* 브리핑 동안 문제판을 덮는 딤 — "아직 네 차례가 아니다"를 눈으로 알린다.
   .rule(z4)보다 아래라 기억할 규칙 카드는 가려지지 않는다 (브리핑 중 유일하게 밝은 것).
   흰 베일(rgba(255,255,255,.72))에서 바꿨다 [stated] — 흰 패널 위에 흰 베일을 얹으면
   결과가 그냥 흰색이라, 크림색 말풍선(#F6EEDA) 대비가 1.16 에 묶여 형태가 그림자로만 읽혔다.
   불투명도를 올려도 면 색이 흰색이라 대비가 1픽셀도 안 움직인다 — 색을 바꿔야 풀린다.
   .30 딤이면 말풍선 대비 1.48. 가이드 팝업(.44)·완료 팝업(검정 .42)과 같은 '어둡게 덮기' 언어다 */
/* pointer-events:none 이 중요하다 — 베일이 클릭을 받으면 elementFromPoint 가 셀 대신
   베일을 돌려주고, 브리핑을 건너뛴 그 첫 스와이프가 답으로 이어지지 못한다.
   잠금은 CSS 가 아니라 locked 플래그가 맡는다 */
.stage__veil{position:absolute; inset:0; z-index:3; pointer-events:none;
  border-radius:calc(48*var(--u));
  background:rgba(90,60,15,.30); opacity:0; visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .stage__veil{opacity:1; visibility:visible}

/* ---------- 가이드 팝업 (고양이를 누르면) ---------- */
/* z35 — 상단바(z30)보다 확실히 위. 같은 30 이면 DOM 순서로만 이겨서 위태롭다 */
.guide{position:absolute; inset:0; z-index:35; display:grid; place-items:center;
  background:rgba(0,0,0,.46); opacity:0; visibility:hidden;   /* 갈색 딤 → 검정 반투명 [stated] */
  transition:opacity var(--t-base) var(--e-out), visibility var(--t-base)}
.guide.on{opacity:1; visibility:visible}
.guide__sheet{position:relative; display:flex; flex-direction:column; align-items:center;
  padding:calc(56*var(--u)) calc(72*var(--u)) calc(60*var(--u));
  background:var(--c-white); border-radius:calc(56*var(--u));
  box-shadow:0 calc(14*var(--u)) 0 rgba(120,78,6,.20),
             0 calc(30*var(--u)) calc(50*var(--u)) rgba(70,45,10,.28);
  transform:translateY(calc(24*var(--u))) scale(.96);
  transition:transform var(--t-base) var(--e-pop)}
.guide.on .guide__sheet{transform:none}
.guide .rule{position:static; transform:none; z-index:auto;
  margin-bottom:calc(24*var(--u))}
/* 닫기 — 뒤로 버튼과 같은 모양 [stated]. .ibtn 을 그대로 쓰고 위치만 준다
   (블롭 반경 · 두께 없음 · 눌림은 scale) */
.guide__close{position:absolute; right:calc(-26*var(--u)); top:calc(-30*var(--u))}

/* 단계 칩 — 번호 + 짧은 안내 */
/* 시트가 흰 면이라 흰 칩은 사라진다 → 번호 원과 같은 계열의 연보라 면 [stated].
   #EDE4F8 : 흰 시트 대비 1.23 · 글자 8.84 · 번호 원 2.62 */
.step{display:flex; align-items:center; gap:calc(16*var(--u));
  background:#EDE4F8; border-radius:calc(999*var(--u));
  padding:calc(10*var(--u)) calc(32*var(--u)) calc(10*var(--u)) calc(10*var(--u));
  box-shadow:none}
.step i{display:grid; place-items:center; width:calc(52*var(--u)); height:calc(52*var(--u));
  border-radius:50%; background:var(--c-frame); color:#fff;
  font-style:normal; font-weight:800; font-size:calc(32*var(--u))}
.step b{font-weight:800; font-size:calc(32*var(--u)); color:var(--c-primary-ink)}
.step--a{margin-bottom:calc(18*var(--u))}
.step--b{margin-bottom:calc(18*var(--u))}

/* (1) → (2) 화살표 */
.guide__arrow{width:calc(46*var(--u)); height:calc(60*var(--u));
  margin-bottom:calc(24*var(--u)); fill:var(--c-frame); opacity:.85}

/* ---------- rotate gate ---------- */
.rotate-gate{display:none}
@media (orientation:portrait){
  .app > :not(.rotate-gate){display:none}
  .rotate-gate{position:fixed; inset:0; z-index:99; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px; background:var(--c-bg);
    color:var(--c-primary-ink); font-size:24px; font-weight:800; text-align:center; padding:32px}
  .rotate-gate svg{width:96px; height:96px}
}

@media (prefers-reduced-motion:reduce){
  *,*::after,*::before{animation:none !important; transition-duration:.01ms !important}
}

/* ============================================================
   SEQUENCING · 길 따라 놓기 (v2)
   배경 = 농장 씬 이미지 / 문제판 = 나무 보드 / 트랙 = 굽은 길 위 발판 6개
   ============================================================ */
:root{
  --c-dash:#45D9B8;             /* 원본 워크시트 점선 [observed] */
  --c-wood:#D98B45;             /* 나무 보드 면 */
  --c-wood-dark:#B96A2C;        /* 판자 경계 · 테두리 */
  --c-wood-deep:#96521E;        /* 보드 두께(하드 섀도) */
}

/* ---------- 배경 — 톤온톤 패턴 대신 농장 씬 이미지 [stated] ---------- */
.scene{z-index:0}          /* 배경 이미지가 없을 때 보이는 SVG 폴백 씬 */
.app__bg{position:absolute; inset:0; z-index:1; width:100%; height:100%; object-fit:cover;
  /* 평면 잔디 패턴 — 어디를 잘라도 같으므로 중앙 기준 [stated] */
  object-position:center center;
  pointer-events:none; user-select:none}
.app__bg.is-missing{display:none}
.safe{background:transparent}
.app{background:#B1E2DD}          /* 이미지 로드 전·레터박스 여백 — 배경 하늘색과 동일 */

/* ============================================================
   인트로 — 농부가 트랙터를 타고 들어와 음성으로 설명한다 [stated]
   ============================================================ */
/* stage(5) 위, buddy(15) 아래 — 설명 중에는 밭을 덮고 농부만 그 위에 선다 */
.intro-scene{position:absolute; inset:0; z-index:6; overflow:hidden; pointer-events:none;
  opacity:0; visibility:hidden;
  transition:opacity var(--t-slow) var(--e-out), visibility var(--t-slow)}
body.is-briefing .intro-scene{opacity:1; visibility:visible}
.intro-scene__svg{position:absolute; inset:0; width:100%; height:100%; display:block}
/* 생성 배경이 있으면 SVG 씬을 덮고, 없으면 자기를 숨긴다 */
.intro-scene__img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  /* 원본 4:3 → 화면 16:10. 위(하늘)를 깎고 땅·길은 남긴다 [stated] */
  object-position:center bottom}
.intro-scene__img.is-missing{display:none}

/* ---------- 인트로 타이틀 — 하늘 한가운데 [stated] ----------
   형태(바 칩 + 스티커 타이틀)·비율은 DESIGN.css .intro-title (DESIGN.md §2.3, v1.6).
   이 화면은 섹션 색·글자 크기·세로 위치·간격만 덮어쓴다.
   칩 #1D76A5 는 기존 확정값(흰 글자 대비 5.02). 외곽선·두께·림은 v1.6 전환 때 초록 세트의
   명도 관계를 하늘 계열로 옮긴 추정값 [inferred] — 실물 확인 후 확정 (DESIGN.md §10).
   하늘이 끝나는 y(언덕선)는 배경마다 다르므로 --intro-title-top 으로 뺀다 */
.intro-title{--intro-title-top:120; --intro-title-gap:32; --tt-size:112;
  --tt-chip:#1A5C80; --tt-chip-ink:#FFFFFF; --tt-fill:#FFFDF2;
  --tt-stroke:#1D76A5; --tt-shadow:#174963; --tt-rim:#9ED8F8;
  --tt-color:#1A5C80;
  z-index:4}

/* 트랙터 — 농부 슬롯 안에 있어 슬롯 이동을 그대로 따라간다 */
/* 720u → 560u 축소. 트랙터+병아리 3개를 한 덩어리로 화면 가로 센터에 맞춘다 [stated] */
.tractor{position:absolute; left:calc(-191*var(--u)); bottom:calc(-175*var(--u));
  width:calc(560*var(--u)); z-index:2; pointer-events:none;
  opacity:0; transform:translateX(calc(-260*var(--u)));
  transition:opacity var(--t-slow) var(--e-out), transform var(--t-slow) var(--e-out)}
body.is-briefing .tractor{opacity:1; transform:none}
/* 생성 컷아웃이 로드되면 SVG 트랙터를 대신한다. 못 불러오면 SVG 가 그대로 남는다 [stated].
   컷아웃에는 소년이 이미 그려져 있으므로 별도 농부 캐릭터는 숨긴다 */
body.is-briefing.tractor-img .buddy__cat{opacity:0; visibility:hidden}
.tractor__img{width:100%; height:auto; display:none;
  filter:drop-shadow(0 calc(10*var(--u)) calc(9*var(--u)) rgba(60,45,20,.26))}
.tractor.use-img .tractor__img{display:block}
.tractor.use-img .tractor__svg{display:none}
.tractor__svg{width:100%; height:auto; display:block; overflow:visible;
  filter:drop-shadow(0 calc(10*var(--u)) calc(9*var(--u)) rgba(60,45,20,.26))}

/* ---------- 병아리 — 트랙터 뒤를 따라온다 [stated] ----------
   두 SVG 의 viewBox 가 서로 다르므로(34×44 / 279×267) 같은 정사각 박스 +
   object-fit:contain 으로 크기·비율을 통일한다 [stated] */
.chicks{position:absolute; left:calc(395*var(--u)); bottom:calc(-175*var(--u));
  display:flex; align-items:flex-end; gap:calc(30*var(--u));
  z-index:1; pointer-events:none;
  opacity:0; transform:translateX(calc(-260*var(--u)));
  transition:opacity var(--t-slow) var(--e-out), transform var(--t-slow) var(--e-out)}
body.is-briefing .chicks{opacity:1; transform:none}
.chick{width:calc(112*var(--u)); height:calc(112*var(--u));
  object-fit:contain; object-position:center bottom; display:block;
  filter:drop-shadow(0 calc(6*var(--u)) calc(6*var(--u)) rgba(60,45,20,.22))}
.chick.is-missing{display:none}
/* 정면 병아리(34×44)는 아트 아래에 여백 6.8u 가 있어 발이 떠 보인다.
   박스를 키워 몸통 높이를 seq_3 와 맞추고(94.7u → 107u), 여백만큼 아래로 민다 [stated] */
.chick--2{width:calc(98*var(--u)); height:calc(127*var(--u));
  margin-bottom:calc(-20*var(--u))}

/* 달려오는 동안만 종종걸음 */
body.is-arriving .chick{animation:chickHop .42s ease-in-out infinite}
body.is-arriving .chick--2{animation-delay:.21s}
@keyframes chickHop{0%,100%{translate:0 0}50%{translate:0 calc(-11*var(--u))}}
@media (prefers-reduced-motion:reduce){ .chick{animation:none !important} }

/* 바퀴는 달려오는 동안만 돈다 */
.tr-spin{animation:trSpin 1.05s linear infinite; animation-play-state:paused}
.tr-spin--fast{animation-duration:.72s}
body.is-arriving .tr-spin{animation-play-state:running}
@keyframes trSpin{to{transform:rotate(360deg)}}
.tr-puff{opacity:0}
body.is-arriving .tr-puff{animation:trPuff 1.15s ease-out infinite}
.tr-puff--2{animation-delay:.38s}
.tr-puff--3{animation-delay:.76s}
@keyframes trPuff{
  0%{opacity:.9; transform:translate(0,0) scale(.45)}
  100%{opacity:0; transform:translate(-52px,-78px) scale(1.6)}}
/* 노면에서 통통 튄다. transform 은 슬롯이 쓰므로 translate 프로퍼티로 따로 흔든다 */
body.is-arriving .tractor__svg{animation:trBump .33s ease-in-out infinite}
@keyframes trBump{0%,100%{translate:0 0}50%{translate:0 calc(-8*var(--u))}}

/* 오른쪽 화면 밖에서 들어와 선다 */
body.is-briefing.is-arriving .buddy__slot{
  animation:rideIn 1.7s cubic-bezier(.2,.66,.28,1) both}
@keyframes rideIn{
  from{transform:translate(calc(2300*var(--u)), calc(-304*var(--u))) scale(1.1)}
  to  {transform:translate(calc(700*var(--u)),  calc(-304*var(--u))) scale(1.1)}}

/* ---------- 진행 별을 상단 중앙으로 [stated] ---------- */
.edge-bottom{top:calc(28*var(--u)); bottom:auto; left:0; right:0;
  height:calc(104*var(--u)); z-index:31}

/* ---------- 열린 농장 문제 영역 ---------- */
.stage{left:50%; top:calc(130*var(--u)); transform:translateX(-50%);
  width:calc(1500*var(--u)); height:calc(790*var(--u)); z-index:5}
.stage__panel{position:absolute; inset:0; z-index:2; overflow:visible;
  background:transparent; border:0; border-radius:0; box-shadow:none}
.stage__panel::before,.stage__panel::after{display:none}

/* ---------- 길 + 발판 ---------- */
.board{position:absolute; left:50%; top:calc(70*var(--u)); transform:translateX(-50%);
  width:calc(1220*var(--u)); height:calc(710*var(--u)); z-index:3}

.step-slot{position:absolute; width:calc(380*var(--u)); height:calc(330*var(--u));
  display:grid; place-items:center;
  border-radius:calc(30*var(--u)) calc(24*var(--u)) calc(32*var(--u)) calc(25*var(--u)) /
                calc(24*var(--u)) calc(31*var(--u)) calc(23*var(--u)) calc(30*var(--u));
  background-color:#9B7041;
  background-image:

<defs>
  <!-- 아이콘 흰 외곽선. 좌표는 심볼 viewBox(240) 기준 — 96u 로 렌더되므로 1u ≈ 2.5.
       dilate 만 쓰면 모서리가 각지고 두꺼워 보인다. 부풀린 뒤 살짝 흐리고
       알파를 다시 세워(threshold) 실루엣을 둥글게 딴다. 최종 두께 ≈ 1.8u -->
  <filter id="icOutline" x="-25%" y="-25%" width="150%" height="150%"
          filterUnits="objectBoundingBox">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/>
    <feGaussianBlur in="d" stdDeviation="2.5" result="b"/>

    <feComposite in="white" in2="fat" operator="in" result="ring"/>

  <!-- 알·껍질 전용 외곽선. 원본 색(#F5F2F1)은 흰 면 대비 1.04 라 형태가 사라진다.
       흰색 대신 웜그레이로 실루엣만 깔아 원본 색은 건드리지 않는다 [stated] -->
  <filter id="paleOutline" x="-25%" y="-25%" width="150%" height="150%"

    <feComponentTransfer in="b" result="fat">
      <feFuncA type="linear" slope="14" intercept="-5"/>

    <feFlood flood-color="#E4DCCF" result="ring"/>
    <feComposite in="ring" in2="fat" operator="in" result="edge"/>

<script>
(function(){
  'use strict';

  /* ---------- 효과음 — WebAudio 합성. 외부 파일 0, 단일 HTML 유지 ---------- */
  const SFX = (() => {
    let ctx = null, noiseBuf = null;
    const ac = () => {
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    };

    /* ---------- 공용 보이스 ----------
       오실 2개(디튠 레이어) + 로우패스로 배음을 깎는다.
       단일 오실 삐 소리보다 마림바·글로켄에 가깝게 들린다 */
    function voice(freq, at, dur, o){
      const c = ac(); if(!c) return;
      o = o || {};
      const t0  = c.currentTime + at;
      const bus = o.bus || c.destination;
      const g = c.createGain(), f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.cut || Math.min(freq * 5 + 900, 11000), t0);
      f.Q.setValueAtTime(.7, t0);
      const peak = o.gain || .12, atk = o.atk || .006;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      f.connect(g); g.connect(bus);
      const osc = (type, mul, det) => {
        const s = c.createOscillator();
        s.type = type;
        s.frequency.setValueAtTime(freq * (mul || 1), t0);
        if(o.bend) s.frequency.exponentialRampToValueAtTime(freq * o.bend, t0 + dur * .8);
        s.detune.setValueAtTime(det || 0, t0);
        s.connect(f); s.start(t0); s.stop(t0 + dur + .05);
      };
      osc(o.type || 'sine', 1, 0);
      if(o.layer) osc(o.layer, o.mul || 2, o.detune || 6);
    }
    const chord = (fs, at, dur, o) => fs.forEach(f => voice(f, at, dur, o));

    /* 노이즈 스웹 — 화음 앞에 붙이면 '쨘' 하는 공기감이 생긴다 */
    function swoosh(at, dur, f0, f1, gain){
      const c = ac(); if(!c) return;
      if(!noiseBuf){
        const n = Math.floor(c.sampleRate * 1.2);
        noiseBuf = c.createBuffer(1, n, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        let s = 12345;
        for(let i = 0; i < n; i++){ s = (s*1103515245 + 12345) % 2147483648; d[i] = s/1073741824 - 1 }
      }
      const t0 = c.currentTime + at;
      const src = c.createBufferSource(); src.buffer = noiseBuf;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.setValueAtTime(1.4, t0);
      bp.frequency.setValueAtTime(f0, t0);
      bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + dur * .3);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      src.connect(bp); bp.connect(g); g.connect(c.destination);
      src.start(t0); src.stop(t0 + dur + .05);
    }

    const C3=130.81, C4=261.63, G4=392,
          C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99, A5=880, B5=987.77,
          C6=1046.5, D6=1174.7, E6=1318.5, F6=1396.9, G6=1568, A6=1760,
          C7=2093, E7=2637, G7=3136;
    const F3=174.61, G3=196;

    /* 마림바 — 짧은 어택, 배음 얇게 */
    const marimba = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'triangle', mul:2, detune:5,
                         gain:gain || .13, cut:f*4+700});
    /* 글로켄 — 밝고 길게 울린다 */
    const bell = (f, at, dur, gain) =>
      voice(f, at, dur, {type:'sine', layer:'sine', mul:3.01, detune:4,
                         gain:gain || .10, cut:f*7+2000});

    /* ---- BGM 스케줄러 ---- */
    let bgmOn = false, bgmTm = null, bgmBus = null, bgmAt = 0;
    const BEAT = .28;                       // 8박 = 2.24s 루프
    const MEL = [[C5,0,.5],[E5,.5,.5],[G5,1,.5],[C6,1.5,.5],
                 [A5,2,.5],[G5,2.5,.5],[E5,3,.5],[G5,3.5,.5],
                 [F5,4,.5],[A5,4.5,.5],[C6,5,.5],[A5,5.5,.5],
                 [G5,6,.5],[E5,6.5,.5],[C5,7,1]];
    const BASS = [[C3,0,1.4],[C3,2,1.4],[F3,4,1.4],[G3,6,1.4]];
    function bgmTone(freq, at, dur, type, gain){
      const c = ac(); if(!c || !bgmBus) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, at);
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(gain, at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, at + dur);
      o.connect(g); g.connect(bgmBus);
      o.start(at); o.stop(at + dur + .05);
    }
    function bgmLoop(){
      const c = ac(); if(!c || !bgmOn) return;
      if(bgmAt < c.currentTime + .05) bgmAt = c.currentTime + .1;   // 밀렸으면 따라잡는다
      MEL.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'triangle', .055));
      BASS.forEach(([f,b,d]) => bgmTone(f, bgmAt + b*BEAT, d*BEAT*.92, 'sine', .045));
      bgmAt += 8*BEAT;
      bgmTm = setTimeout(bgmLoop, 8*BEAT*1000 - 140);               // 다음 루프를 미리 예약
    }

    return {
      unlock(){ ac() },

      /* 칸을 짚을 때 — 규칙과 맞으면 마림바가 한 칸씩 올라가고,
         어긋나면 낮고 둔한 나무 소리(경고음 아님) */
      tick(step, ok){
        if(ok) marimba([C5,E5,A5,C6][step] || C5, 0, .30, .13);
        else   voice(165, 0, .12, {type:'sine', gain:.075, cut:420});
      },

      /* 정답 1개 완성 — 글로켄 3음 + 낮은 화음으로 받쳐 준다 */
      correct(){
        [C6,E6,G6].forEach((f,i) => bell(f, i*.055, .55, .085));
        voice(C4, .02, .5, {type:'sine', gain:.05, cut:900});
      },

      /* 5개 클리어 — 스웹 + 상승 마림바. 팝업 팡파르로 이어진다 */
      clear(){
        swoosh(0, .38, 500, 4200, .055);
        [C5,E5,G5,C6].forEach((f,i) => marimba(f, .06 + i*.075, .38, .12));
        bell(C6, .40, .8, .09);
      },

      tap(){ voice(620, 0, .09, {type:'sine', gain:.10, cut:2200, bend:.66}) },
      hint(){ bell(D6, 0, .30, .085); bell(A6, .13, .38, .07) },

      /* ---- 팝업 팡파르 — 약 4.8초로 길게 이어진다 ----
         ① 콜(3연음) ② 상승 런 ③ 지속 화음 ④ 해결 멜로디 ⑤ 종결 화음 + 반짝임 */
      fanfare(){
        swoosh(0, .5, 400, 5200, .06);
        // ① 콜
        [[G4,0,.16],[C5,.13,.16],[E5,.26,.24]].forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ② 상승 런
        [[G5,.46,.12],[A5,.55,.12],[B5,.64,.12],[C6,.73,.34]]
          .forEach(([f,a,d]) => marimba(f,a,d,.12));
        // ③ 지속 화음
        chord([C5,E5,G5,C6], 1.00, 1.25, {type:'triangle', layer:'sine', mul:2, gain:.055, cut:5200});
        voice(C3, 1.00, 1.4, {type:'sine', gain:.055, cut:600});
        // ④ 해결 멜로디
        [[E6,1.12,.24],[D6,1.36,.24],[C6,1.60,.38],[G5,1.98,.32],
         [A5,2.32,.26],[B5,2.58,.26],[C6,2.84,.80]]
          .forEach(([f,a,d]) => bell(f,a,d,.10));
        // ⑤ 종결 화음 + 베이스 + 반짝임
        swoosh(3.42, .45, 900, 6000, .045);
        chord([C6,E6,G6], 3.50, 1.7, {type:'sine', layer:'triangle', mul:2, gain:.06, cut:8000});
        voice(C4, 3.50, 1.8, {type:'sine', gain:.05, cut:900});
        voice(C3, 3.50, 2.0, {type:'sine', gain:.05, cut:520});
        [[E7,3.70,.55],[G7,3.92,.55],[C7,4.14,.75]].forEach(([f,a,d]) => bell(f,a,d,.045));
      },

      /* ---- 승리 BGM — 2.24s 루프 (C-F-G 진행) ----
         파일 없이 합성한다. 팝업이 열려 있는 동안만 돌고 다시하기에서 멈춘다.
         delay: 팡파르가 잦아든 뒤 들어오도록 시작을 늦춘다 */
      bgm(on, delay){
        const c = ac(); if(!c) return;
        if(on){
          if(bgmOn) return;
          bgmOn = true;
          const d = (delay === undefined) ? .35 : delay;
          bgmBus = c.createGain();
          bgmBus.gain.setValueAtTime(.0001, c.currentTime);
          bgmBus.gain.setValueAtTime(.0001, c.currentTime + d);
          bgmBus.gain.exponentialRampToValueAtTime(1, c.currentTime + d + 1.1);
          bgmBus.connect(c.destination);
          bgmAt = c.currentTime + d;
          bgmLoop();
        }else{
          if(!bgmOn) return;
          bgmOn = false;
          clearTimeout(bgmTm); bgmTm = null;
          const bus = bgmBus; bgmBus = null;
          if(bus){
            const t0 = c.currentTime;
            bus.gain.cancelScheduledValues(t0);
            bus.gain.setValueAtTime(Math.max(bus.gain.value, .0001), t0);
            bus.gain.exponentialRampToValueAtTime(.0001, t0 + .4);
            setTimeout(() => { try{ bus.disconnect() }catch(e){} }, 700);
          }
        }
      }
    };
  })();

  /* ---------- 데이터 — 닭 한살이 6장 (원본 벡터 img_seq_1~6.svg) ---------- */
  const CARDS = {
    crack: {img:'img_svg/B-2/img_seq_1.svg', ko:'금이 간 알',         en:'cracking egg',   pale:1},
    hatch: {img:'img_svg/B-2/img_seq_2.svg', ko:'껍질을 깨는 병아리', en:'hatching chick', pale:1},
    chick: {img:'img_svg/B-2/img_seq_3.svg', ko:'병아리',             en:'chick'},
    hen  : {img:'img_svg/B-2/img_seq_4.svg', ko:'닭',                 en:'hen'},
    sit  : {img:'img_svg/B-2/img_seq_5.svg', ko:'알을 품는 닭',       en:'hen sitting on the eggs'},
    nest : {img:'img_svg/B-2/img_seq_6.svg', ko:'둥지 속 알',         en:'eggs in the nest'}
  };
  /* 한살이는 순환이라 시작점이 없다 → 첫 발판을 고정해 시작점을 정한다 [stated] */
  const ORDER = ['nest','sit','crack','hatch','chick','hen'];
  const CARD_VOICE_KEY = {
    nest:'card1', sit:'card2', crack:'card3',
    hatch:'card4', chick:'card5', hen:'card6'
  };
  const FIXED = 1;
  const TRAY  = ['chick','crack','hen','hatch','sit'];   // 고정 배열(정답순 아님)

  /* 발판 좌표 — 위 3개, 아래 3개의 큰 3×2 배열. */
  const SW = 380, SH = 330;
  const CX = [190, 610, 1030, 190, 610, 1030];
  const CY = [165, 165, 165, 545, 545, 545];

  const board  = document.getElementById('board');
  const trayEl = document.getElementById('tray');
  const dotsEl = document.getElementById('dots');
  const winEl  = document.getElementById('win');

  (function buildSparks(){
    const stage = document.getElementById('winStage');
    const COLORS = ['#F9DF1F','#FEC925','#F38820','#F291B9','#94C13D','#9463D6','#FFFFFF'];
    const N = 18;
    let seed = 7;
    const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
    for(let i = 0; i < N; i++){
      const ang = (i / N) * Math.PI * 2 + rnd() * .18;
      const rad = .40 + rnd() * .16;                 // 중심에서 40~56%
      const x = 50 + Math.cos(ang) * rad * 116;      // 박스가 600×512 라
      const y = 50 + Math.sin(ang) * rad * 136;      // y 배율을 1.17배 키워야 원이 된다
      const s = 14 + Math.round(rnd() * 22);         // 아트보드 단위
      const el = document.createElement('i');
      el.className = 'spark' + (rnd() < .35 ? ' spark--dot' : '');
      el.style.cssText =
        `--x:${x.toFixed(1)}%; --y:${y.toFixed(1)}%;` +
        `--s:calc(${s}*var(--u)); --c:${COLORS[i % COLORS.length]};` +
        `--d:${(rnd()*2.2).toFixed(2)}s`;
      stage.appendChild(el);
    }
  })();

  /* 컨페티 — 팝업이 열릴 때 CSS 애니메이션으로 한 번 터진다 */
  (() => {
    const box = document.getElementById('winConf');
    if(!box) return;
    const C = ['#FFD23F','#FF9D02','#2FBF71','#A57BE0','#F291B9','#4FC3E8','#EE3A44'];
    let s = 7;
    const rnd = () => (s = (s*1103515245 + 12345) % 2147483648) / 2147483648;
    for(let i = 0; i < 34; i++){
      const ang = rnd() * Math.PI * 2;
      const dist = 180 + rnd() * 250;                    // 아트보드 단위
      const w = 12 + Math.round(rnd()*12), h = 16 + Math.round(rnd()*18);
      const el = document.createElement('i');
      el.className = 'conf';
      el.style.cssText =
        `--w:calc(${w}*var(--u)); --h:calc(${h}*var(--u));` +
        `--c:${C[i % C.length]}; --r:${rnd() < .3 ? '50%' : '2px'};` +
        `--dx:calc(${(Math.cos(ang)*dist).toFixed(0)}*var(--u));` +
        `--dy:calc(${(Math.sin(ang)*dist*.9 + 120).toFixed(0)}*var(--u));` +

  /* 흙이 튄다 — 위쪽 반원으로 날아올랐다 아래로 떨어진다 [stated] */
  function burstAt(slot){
    // 밝은 흙과 진한 흙을 섞는다 — 흙 타일 위에서도, 연두 잔디 위에서도 하나는 읽힌다
    const colors = ['#8A5A32','#D8A96A','#6E4526','#EFCB93','#A97343','#5A3A1E'];
    // 시작점은 타일 한가운데가 아니라 아래쪽 가장자리다 —
    // 가운데서 터지면 흙이 밭 그림을 덮는다 [stated]
    const cx = slot.offsetLeft + slot.offsetWidth / 2;
    const cy = slot.offsetTop + slot.offsetHeight * 0.86;
    const N = 13;
    for(let i = 0; i < N; i++){
      const p = document.createElement('i');
      // -170°~-10° : 위쪽으로만 튄다
      const a = -Math.PI * (0.06 + 0.88 * (i / (N - 1)));
      const r = 150 + (i % 4) * 30;      // 타일(380u) 밖 잔디까지 튀어야 눈에 띈다
      p.className = 'trail-pop';
      p.style.cssText =
        `--x:${cx}px;--y:${cy}px;--c:${colors[i % colors.length]};` +
        `--dx:${(Math.cos(a) * r).toFixed(0)}px;` +
        `--dy:${(Math.sin(a) * r * .8).toFixed(0)}px;` +
        `--fall:${(Math.abs(Math.sin(a)) * r * .42 + 40).toFixed(0)}px;` +
        `width:calc(${10 + (i % 3) * 5}*var(--u));height:calc(${10 + (i % 3) * 5}*var(--u))`;
      board.appendChild(p);
      setTimeout(() => p.remove(), 860);
    }
  }

  function paintNext(){

  /* ---------- 판정 — 즉시 판정 [stated] ---------- */
  function attempt(card){
    if(locked) return;
    if(card.dataset.code === ORDER[placed]) flyIn(card);
    else{
      SFX.tick(placed - FIXED, false);
      farmerReact('huh');
      card.style.transition = 'transform .28s var(--e-out)';
      card.style.transform = '';
      card.classList.remove('is-drag');
      card.classList.add('is-wrong');
      setTimeout(() => card.classList.remove('is-wrong'), 460);
      resetIdle();
    }
  }

  function flyIn(card){
    const slot = slots[placed];
    const home = card._home || card.getBoundingClientRect();
    const b = slot.getBoundingClientRect();
    const dx = (b.left + b.width/2)  - (home.left + home.width/2);
    const dy = (b.top  + b.height/2) - (home.top  + home.height/2);
    card.classList.remove('is-drag');
    card.style.transition = 'transform .40s var(--e-out), opacity .14s .32s';
    card.style.transform = `translate(${dx}px, ${dy}px) scale(${b.width / home.width})`;
    card.style.opacity = '0';
    locked = true;
    SFX.tick(placed - FIXED, true);
    setTimeout(() => {
      card.classList.add('is-gone');
      placed++;
      locked = false;
      paintNext(); updateDots();
      SFX.correct();
      burstAt(slot);
      slot.classList.add('is-planting');
      setTimeout(() => slot.classList.remove('is-planting'), 560);

      else resetIdle();

  }

  /* ---------- 입력 — 드래그와 탭을 모두 받는다 ---------- */
  function bindCard(card){
    let sx = 0, sy = 0, moved = false, active = false;
    card.addEventListener('pointerdown', e => {
      if(locked || card.classList.contains('is-gone')) return;
      say(lang, CARD_VOICE_KEY[card.dataset.code]);
      active = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      card._home = card.getBoundingClientRect();
      card.style.transition = 'none';
      card.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    card.addEventListener('pointermove', e => {
      if(!active) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if(!moved && Math.hypot(dx, dy) > 8){ moved = true; card.classList.add('is-drag') }
      if(moved) card.style.transform = `translate(${dx}px, ${dy}px) scale(1.12)`;
    });
    card.addEventListener('pointerup', () => {

      active = false;
      attempt(card);          // 탭이든 드래그든 '다음 발판'에 놓는 시도로 본다
    });
    card.addEventListener('pointercancel', () => {
      if(!active) return;
      active = false;
      card.style.transition = 'transform .28s var(--e-out)';
      card.style.transform = '';
      card.classList.remove('is-drag');

  /* 카드 상황 음성 — Higgsfield Seed Audio / Chloe 보이스.

     로컬 파일을 우선하고, 없으면 같은 문장을 기기 TTS 로 읽는다. */
  const VOICE_SRC = {
    instr:{ ko:['audio/seq_voice_ko.wav'], en:['audio/seq_voice_en.wav'] },
    guide:{ ko:['audio/seq_guide_ko.wav'], en:['audio/seq_guide_en.wav'] },

    card5:{ ko:['audio/seq_card_05_ko.mp3'], en:['audio/seq_card_05_en.mp3'] },
    card6:{ ko:['audio/seq_card_06_ko.mp3'], en:['audio/seq_card_06_en.mp3'] }
  };
  const TTS_LANG = { ko:'ko-KR', en:'en-US' };

  let lang = 'en';
  const audioCache = {};   // 'key:lang' -> HTMLAudioElement (성공한 소스)
  let activeAudio = null, voiceRequestId = 0;
  const btnSay      = document.getElementById('btnSay');
  const guideEl     = document.getElementById('guide');
  const btnBuddy    = document.getElementById('btnBuddy');
  const btnGuideX   = document.getElementById('guideClose');

  const btnBack = document.getElementById('btnBack');

  function tryAudio(src){
    return new Promise((res, rej) => {
      const a = new Audio();
      a.preload = 'auto';
      const ok = () => { cleanup(); res(a) };
      const no = () => { cleanup(); rej() };
      const cleanup = () => {
        a.removeEventListener('canplaythrough', ok);
        a.removeEventListener('error', no);
        clearTimeout(tm);
      };
      const tm = setTimeout(no, 3500);
      a.addEventListener('canplaythrough', ok, {once:true});
      a.addEventListener('error', no, {once:true});
      a.src = src;
      a.load();
    });
  }

  async function getAudio(l, key){
    const ck = key + ':' + l;
    if(audioCache[ck] !== undefined) return audioCache[ck];
    for(const src of (VOICE_SRC[key] || {})[l] || []){
      try { const a = await tryAudio(src); audioCache[ck] = a; return a } catch(e){}
    }
    audioCache[ck] = null;       // 파일 없음 → TTS 사용
    return null;
  }

  function sayFlag(on){ btnSay.classList.toggle('is-playing', on) }

  function stopActiveAudio(){
    if(!activeAudio) return;
    activeAudio.onended = null;
    activeAudio.pause();
    activeAudio.currentTime = 0;
    activeAudio = null;
  }

  function speakFallback(l, text){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text || I18N[l].instr);
    u.lang = TTS_LANG[l];
    u.rate = .92; u.pitch = 1.25;   // 기기 TTS 폴백도 생성 음성 톤에 맞춰 밝게
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith(l));
    if(v) u.voice = v;
    u.onstart = () => sayFlag(true);
    u.onend   = () => { sayFlag(false); fireVoiceDone() };
    speechSynthesis.speak(u);
  }

  let voiceDone = null;
  function fireVoiceDone(){ const f = voiceDone; voiceDone = null; if(f) f() }

  /* key: 'instr'(문제 · 녹음본 있음) | 'guide'(가이드 · 녹음본 있음)
     녹음본을 못 받으면 같은 문장을 기기 TTS 로 읽는다 */
  async function say(l = lang, key = 'instr'){
    const requestId = ++voiceRequestId;
    if('speechSynthesis' in window) speechSynthesis.cancel();
    stopActiveAudio();
    const a = await getAudio(l, key);
    if(requestId !== voiceRequestId) return;
    if(a){

        a.currentTime = 0;
        activeAudio = a;
        sayFlag(true);
        a.onended = () => {
          if(activeAudio === a) activeAudio = null;
          sayFlag(false); fireVoiceDone();
        };
        await a.play();
        return;
      }catch(e){ if(activeAudio === a) activeAudio = null; sayFlag(false) }
    }
    speakFallback(l, I18N[l][key]);
  }

     탭 건너뛰기를 둔 이유 : 7세가 5초를 기다리게만 두면 안 된다 [stated] */
  let briefTm = null, skipArmed = false;

  const ARRIVE_MS = 1700;          // 트랙터가 화면 밖에서 들어와 멈추기까지

  function startBriefing(){
    clearTimeout(briefTm); clearTimeout(arriveTm); clearTimeout(silentTm);

    document.body.classList.remove('is-idlecat', 'is-silent');

    // 도착 연출이 끝나기 전에는 건너뛰지 않는다 (오디오 해제용 첫 탭도 여기서 걸러진다)

      say(lang, 'instr');
      // 자동재생이 막혀 소리가 안 나오면 말풍선으로 대신 알린다 [stated]
      silentTm = setTimeout(() => {
        if(!btnSay.classList.contains('is-playing')) document.body.classList.add('is-silent');
      }, 900);
      briefTm = setTimeout(endBriefing, 5200);         // 음성이 안 나와도 진행된다
    }, ARRIVE_MS);
  }

  function endBriefing(){
    if(!document.body.classList.contains('is-briefing')) return;
    clearTimeout(briefTm); clearTimeout(arriveTm); clearTimeout(silentTm);
    voiceDone = null;
    document.body.classList.remove('is-briefing', 'is-arriving', 'is-silent');
    document.body.classList.add('is-idlecat');   // 고양이가 "눌러 보세요" 신호를 낸다
    locked = false;
    resetIdle();
  }

  /* 브리핑 중 아무 데나 탭 = 건너뛰기 (상단바 · 고양이 · 팝업은 제외).
     capture 단계에 둔다 — 같은 pointerdown 이 그리드 리스너(버블)에 닿기 전에
     잠금을 풀어야, 아이의 첫 스와이프가 '건너뛰기'로만 소모되지 않고 답으로도 들어간다 */
  document.addEventListener('pointerdown', e => {
    if(!skipArmed || !document.body.classList.contains('is-briefing')) return;
    if(e.target.closest('.topbar') || e.target.closest('.buddy__cat')) return;
    if(e.target.closest('.guide')) return;
    endBriefing();
  }, true);

  /* ---------- 가이드 팝업 ---------- */
  function openGuide(){
    endBriefing();                     // 브리핑 중이었다면 먼저 끝낸다
    clearTimeout(idleTimer);
    locked = true;
    guideEl.classList.add('on');
    document.body.classList.remove('is-idlecat');
    say(lang, 'guide');
  }
  function closeGuide(){
    guideEl.classList.remove('on');
    voiceRequestId += 1;
    stopActiveAudio();
    if('speechSynthesis' in window) speechSynthesis.cancel();
    sayFlag(false);
    voiceDone = null;
    locked = false;
    document.body.classList.add('is-idlecat');
    resetIdle();
  }
  btnBuddy.addEventListener('click', () => { SFX.tap(); openGuide() });
  btnGuideX.addEventListener('click', () => { SFX.tap(); closeGuide() });
  /* 배경(딤)을 눌러도 닫힌다 — 시트 안쪽은 통과시키지 않는다 */
  guideEl.addEventListener('pointerdown', e => {
    if(e.target.closest('.guide__sheet')) return;
    SFX.tap(); closeGuide();
  });

  btnLang.addEventListener('click', () => {
    SFX.tap();
    lang = (lang === 'ko') ? 'en' : 'ko';
    applyLang();
    // 바뀐 언어로 바로 읽어준다 — 가이드가 열려 있으면 가이드 문장으로
    say(lang, guideEl.classList.contains('on') ? 'guide' : 'instr');
  });
  // 뒤로 : 홈의 SEQUENCING 섹션으로 돌아간다.
  btnBack.addEventListener('click', () => { SFX.tap(); location.href = 'B-2_00.home.html#sequencing'; });
  document.getElementById('exit').addEventListener('click', () => { SFX.tap(); location.href = 'B-2_00.home.html#sequencing'; });

  // 자동재생 정책 때문에 첫 사용자 제스처에서 한 번 읽어준다
  let greeted = false;
  function greet(){
    SFX.unlock();               // 오디오는 첫 제스처에서만 열 수 있다
    if(greeted) return; greeted = true;
    // 자동재생이 막혀 무음이었을 때만 다시 읽는다.
    // 이미 소리가 나는 중이면 다시 부르지 않는다 — 두 번 겹쳐 읽는다
    // 도착 연출 중에는 부르지 않는다 — 트랙터가 선 뒤에 startBriefing 이 알아서 읽는다
    if(document.body.classList.contains('is-briefing') &&
       !document.body.classList.contains('is-arriving') &&
       !btnSay.classList.contains('is-playing')) say(lang, 'instr');
  }
  document.addEventListener('pointerdown', greet, {once:true});

  applyLang();
  /* 첫 카드 탭에서도 사용자 제스처 안에서 바로 재생되도록 12개 로컬 음원을 미리 캐시한다. */
  ['en','ko'].forEach(l => Object.values(CARD_VOICE_KEY).forEach(key => { getAudio(l, key); }));
  startBriefing();             // 자동재생이 허용되면 바로, 막히면 위 제스처에서

  // 폰트 로드 확인 — 콘솔에서 바로 알 수 있게
  if(document.fonts && document.fonts.load){
    // fonts.check() 는 없는 패밀리에도 true 를 반환해서 못 쓴다. load() 가 매칭된 face 를 돌려준다.
    document.fonts.load('800 40px Paperlogy').then(list => {
      console.log(list.length
        ? `[B-SEQ v2] Paperlogy 적용됨 (face ${list.length}개)`
        : '[B-SEQ v2] Paperlogy 미적용 — 시스템 폰트로 폴백 중. CDN 차단 여부를 확인하세요');
    });
  }
})();
</script>
</body>
</html>
