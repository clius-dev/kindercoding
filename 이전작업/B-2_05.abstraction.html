<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ABSTRACTION — Shadows &amp; Colors</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="DESIGN.css">
<style>
/* ============================================================
   B-ABS · ABSTRACTION — 그림자 · 꽃 · 색 잇기
   Artboard 1920 × 1200 · tokens from DESIGN.css
   ============================================================ */
:root{
  --design-w:1920; --design-h:1200;
  --u-min:.5px; --u-max:1.25px;
  --u:clamp(var(--u-min), min(100dvw / 1920, 100dvh / 1200), var(--u-max));

  --c-primary:#6B3FA0; --c-primary-light:#9463D6; --c-primary-dark:#4A2874;
  --c-primary-ink:#4A2E73; --c-primary-300:#D8CDEA;
  --c-success:#2FBF71; --c-success-deep:#12905A;
  --c-accent:#FF9D02; --c-accent-3:#FF9F1C;
  --c-star:#FFD23F; --c-star-off:#FFFFFF;
  --c-track:rgba(0,0,0,.50);
  --c-white:#fff; --c-ink-3:#2B2B2B;

  /* 이 화면 — 연결선 · 포트 (원본 워크시트 점 색) */
  --c-link:#45D9B8;
  --c-link-deep:#17A98A;

  /* 실루엣 3단 상태 */
  /* 제공된 에셋 원본 색. 흰 카드 대비 1.45 — 비텍스트 최소 기준 3.0 미달이다.
     대비를 올리려면 이 한 값만 #7E9793(3.12) 또는 #A6BBB7(2.02) 로 바꾼다 */
  --sil-idle:#CDCCCC;
  --sil-line:#17A98A;

  /* radius 는 아트보드 단위(unitless). calc(N * var(--u)) 로 쓴다 — px 를 넣으면 px*px 라 무효 */
  --r-lg:34; --r-xl:44; --r-2xl:56; --r-pill:999;
  --r-blob-a:56% 44% 52% 48% / 46% 54% 44% 56%;
  --r-blob-b:44% 56% 47% 53% / 55% 45% 56% 44%;
  --r-blob-c:50% 50% 44% 56% / 44% 56% 50% 50%;
  --sp-gutter:28;
  --sh-card:0 0 0 0 transparent;
  --sh-float:0 12px 40px rgba(30,16,60,.28);
  --e-out:cubic-bezier(.2,.85,.3,1);
  --e-pop:cubic-bezier(.2,.9,.3,1.25);
  --t-fast:.18s; --t-base:.3s; --t-slow:.45s;
  --ff:'Paperlogy',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;

  /* 레이아웃 (DESIGN.md §9.9) */
  --stage-w:1620; --stage-h:920; --stage-top:140;
  --board-w:1560; --board-h:880; --board-top:20;
  --tile:164;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden; font-family:var(--ff); background:#8FD3F4;
  -webkit-user-select:none; user-select:none; touch-action:none}

.app{position:fixed; inset:0; overflow:hidden; display:grid; place-items:center;
  --inset-t:env(safe-area-inset-top,0px); --inset-b:env(safe-area-inset-bottom,0px);
  --inset-l:env(safe-area-inset-left,0px); --inset-r:env(safe-area-inset-right,0px)}
.app__bg{position:absolute; inset:0; z-index:1; width:100%; height:100%;
  object-fit:cover; object-position:center bottom; pointer-events:none}
.app__bg.is-missing{display:none}
.scene{position:absolute; inset:0; z-index:0; width:100%; height:100%; pointer-events:none}
.safe{position:relative; z-index:5;
  width:calc(var(--design-w) * var(--u)); height:calc(var(--design-h) * var(--u)); overflow:hidden}

/* ---------- 상단바 ---------- */
.topbar{position:absolute; z-index:30; display:flex; align-items:center;
  left:calc(var(--sp-gutter) * var(--u) + var(--inset-l));
  right:calc(var(--sp-gutter) * var(--u) + var(--inset-r));
  top:calc(var(--sp-gutter) * var(--u) + var(--inset-t))}
.topbar__side{display:flex; gap:calc(16 * var(--u)); flex:1}
.topbar__side--r{justify-content:flex-end}
.ibtn{width:calc(104 * var(--u)); height:calc(104 * var(--u)); border:0; padding:0;
  border-radius:var(--r-blob-a); background:#FFFFFF; color:var(--c-primary); cursor:pointer;
  display:grid; place-items:center; box-shadow:none;
  transition:transform var(--t-fast) var(--e-out), background var(--t-fast)}
.topbar__side--r .ibtn--lang{border-radius:var(--r-blob-b)}
.topbar__side--r #btnListen{border-radius:var(--r-blob-c)}
@media(hover:hover){.ibtn:hover{background:#F3ECFC}}
.ibtn:active{transform:scale(.93); background:#E4D9F6}
#btnListen{background:var(--c-primary); color:#fff}
@media(hover:hover){#btnListen:hover{background:var(--c-primary-light)}}
#btnListen:active{background:var(--c-primary-dark)}
#btnListen svg{width:calc(56 * var(--u)); height:calc(56 * var(--u)); fill:#fff; stroke:none}
#btnListen .sound-wave{fill:none; stroke:#fff; stroke-width:2.8;
  stroke-linecap:round; stroke-linejoin:round}
/* 아이콘은 선(stroke)이 아니라 면(fill)으로 그린다 — DESIGN.css .topbar .ibtn svg 와 같은 규칙.
   선 아이콘은 같은 52u 안에서도 광학적으로 한 단계 작아 보인다 [stated] */
.ibtn svg{width:calc(52 * var(--u)); height:calc(52 * var(--u));
  fill:currentColor; stroke:none; display:block}
.ibtn--lang{font-family:inherit; font-weight:800; line-height:1}
.ibtn--lang .lg{display:flex; align-items:baseline; gap:calc(5 * var(--u)); color:inherit}
.ibtn--lang .lg b,.ibtn--lang .lg i{font-style:normal; font-weight:800;
  transition:font-size var(--t-fast) var(--e-out), opacity var(--t-fast)}
.ibtn--lang .lg .on{font-size:calc(40 * var(--u)); opacity:1}
.ibtn--lang .lg .off{font-size:calc(30 * var(--u)); opacity:.5}

/* ---------- 진행 별 ---------- */
.edge-bottom{position:absolute; z-index:30; display:flex; justify-content:center;
  left:0; right:0; bottom:calc(var(--sp-gutter) * var(--u) + var(--inset-b))}
.track{display:flex; align-items:center; gap:calc(11 * var(--u));
  padding:calc(11 * var(--u)) calc(18 * var(--u)); border-radius:calc(var(--r-pill) * var(--u));
  background:var(--c-track)}
/* 별은 다른 화면(§진행 표시)과 같은 24 viewBox · 같은 path 를 쓴다.
   paint-order:stroke fill 이 없으면 1.8u 획이 글자처럼 안쪽을 파먹어 별이 한 단계 얇아 보이고,
   overflow:visible 이 없으면 viewBox 밖으로 나가는 획이 잘린다 [stated] */
.track svg{width:calc(32 * var(--u)); height:calc(32 * var(--u));
  display:block; overflow:visible;
  fill:var(--c-star-off); stroke:#fff; stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round;
  paint-order:stroke fill; transform-origin:50% 50%;
  transition:fill var(--t-base) var(--e-out)}
.track svg.on{fill:var(--c-star); animation:starPop .5s var(--e-pop)}
@keyframes starPop{
  0%{transform:scale(.55) rotate(-30deg)}
  60%{transform:scale(1.24) rotate(8deg)}
  100%{transform:scale(1) rotate(0)}}

/* ---------- 무대 ---------- */
.stage{position:absolute; left:50%; transform:translateX(-50%);
  top:calc(var(--stage-top) * var(--u));
  width:calc(var(--stage-w) * var(--u)); height:calc(var(--stage-h) * var(--u)); z-index:5}
.board{position:absolute; left:50%; margin-left:calc(var(--board-w) * var(--u) / -2);
  top:calc(var(--board-top) * var(--u));
  width:calc(var(--board-w) * var(--u)); height:calc(var(--board-h) * var(--u))}

/* 연결선 레이어 — 타일보다 아래(z3). 선은 카드 사이에서만 보인다 */
.links{position:absolute; inset:0; z-index:3; width:100%; height:100%; overflow:visible}
.links .hit{stroke:transparent; stroke-width:40; fill:none; cursor:pointer; pointer-events:stroke}
.links .ln{fill:none; stroke-linecap:round; pointer-events:none}
.links .ln--halo{stroke:#fff; stroke-width:22; opacity:1}
.links .ln--core{stroke:var(--c-link); stroke-width:8}
.links .ln--draft{stroke:var(--c-link); stroke-width:10; opacity:.9;
  stroke-dasharray:22 16; animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-38}}
.links g.is-gone{animation:lnGone .3s var(--e-out) forwards}
@keyframes lnGone{to{opacity:0; transform:scale(.97)}}

/* ---------- 포트 ---------- */
.port{position:absolute; width:calc(26 * var(--u)); height:calc(26 * var(--u));
  margin:calc(13 * var(--u) * -1) 0 0 calc(13 * var(--u) * -1);
  border-radius:50%; background:var(--c-link); z-index:4; pointer-events:none;
  /* 배경이 하늘 → 덤불 → 잔디로 바뀌므로 점은 어느 면에서도 읽혀야 한다.
     흰 링을 불투명하게 잡아 실루엣으로 띄운다 (DESIGN.md §1 「대비는 요소가 실제로 얹히는 면 기준으로」) */
  box-shadow:0 0 0 calc(5 * var(--u)) #fff;
  transition:background var(--t-fast), transform var(--t-fast) var(--e-pop)}
.port.is-on{background:var(--c-link-deep); transform:scale(1.18)}

/* ---------- 타일 ---------- */
.tile{position:absolute; width:calc(var(--tile) * var(--u)); height:calc(var(--tile) * var(--u));
  margin:calc(var(--tile) * var(--u) / -2) 0 0 calc(var(--tile) * var(--u) / -2);
  border:0; padding:0; z-index:6; cursor:pointer; background:transparent;
  display:grid; place-items:center; overflow:visible;
  transition:transform var(--t-fast) var(--e-out)}
.tile__card{position:absolute; inset:0; border-radius:calc(var(--r-lg) * var(--u));
  background:#fff; box-shadow:var(--sh-card);
  border:calc(2 * var(--u)) solid rgba(255,255,255,.95);
  transition:box-shadow var(--t-fast),background var(--t-fast)}
.tile__card::before{content:''; position:absolute; inset:calc(8 * var(--u));
  border:calc(1 * var(--u)) solid #DFEBE5; border-radius:calc(26 * var(--u)); pointer-events:none}
.tile__art{position:relative; width:calc(122 * var(--u)); height:calc(122 * var(--u));
  display:grid; place-items:center}
.tile__art > *{grid-area:1/1}
.tile:active{transform:scale(.96)}
.tile:focus-visible{outline:calc(4 * var(--u)) solid #147D70; outline-offset:calc(8 * var(--u)); border-radius:calc(var(--r-lg) * var(--u))}
@media(hover:hover){.tile:hover .tile__card{background:#FBF3E4}}
.tile.is-armed .tile__card{box-shadow:none; background:#F5F0FA}
.tile.is-shake{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  45%{transform:translateX(7px)}70%{transform:translateX(-4px)}}
.tile.is-hint .tile__card{animation:hintRing 1.2s ease-out 3}
@keyframes hintRing{0%{box-shadow:0 0 0 0 var(--c-accent-3),var(--sh-card)}
  70%{box-shadow:0 0 0 calc(22 * var(--u)) rgba(255,159,28,0),var(--sh-card)}
  100%{box-shadow:0 0 0 0 rgba(255,159,28,0),var(--sh-card)}}

/* 실루엣 — 인라인 SVG. 상태에 따라 fill/stroke 만 바꾼다 */
.sil{width:100%; height:100%; overflow:visible; transition:opacity var(--t-base);
  filter:none}
.sil path{fill:var(--sil-idle); stroke:none;
  transition:fill var(--t-base) var(--e-out), stroke var(--t-base)}
.tile.is-outlined .sil path{fill:#B7A4D3; stroke:none}
.tile.is-outlined .tile__card{background:#F5F0FA}
.tile.is-bloomed .sil{opacity:0}

/* 컬러 꽃 — 완성되면 실루엣 자리에 핀다 */
.flw{width:100%; height:100%; object-fit:contain; opacity:0; transform:scale(.6);
  transition:opacity var(--t-base), transform var(--t-base) var(--e-pop)}
.tile.is-bloomed .flw{opacity:1; transform:scale(1)}
.tile.is-bloomed .tile__card{animation:bloomPop .52s var(--e-pop)}
@keyframes bloomPop{0%{transform:scale(1)}22%{transform:scale(.94)}55%{transform:scale(1.05)}100%{transform:scale(1)}}

/* 꽃 열 · 색 열 아트 */
.tile--flw .art{width:100%; height:100%; object-fit:contain}
.tile--clr .tile__card{padding:calc(10 * var(--u))}
.tile--clr .tile__card::before{display:none}
.chip{position:absolute; inset:calc(14 * var(--u)); border-radius:calc(20 * var(--u));
  border:0; box-shadow:none}
.tile--done .tile__card{box-shadow:none}

/* 꽃가루 파편 */
.pollen{position:absolute; left:50%; top:86%; width:calc(11 * var(--u)); height:calc(11 * var(--u));
  border-radius:50%; pointer-events:none; z-index:8;
  animation:pollen .72s cubic-bezier(.25,.7,.4,1) forwards}
@keyframes pollen{0%{transform:translate(-50%,-50%) scale(.4); opacity:1}
  70%{opacity:1} 100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.85); opacity:0}}

/* 인트로 동안에는 문제판과 화면 크롬을 감춘다 */
.stage,.topbar,.edge-bottom{transition:opacity var(--t-slow) var(--e-out)}
body.is-intro .stage,body.is-intro .topbar,body.is-intro .edge-bottom{opacity:0; pointer-events:none}

/* ---------- 인트로 ---------- */
.intro{position:absolute; inset:0; z-index:20; display:grid; place-items:center;
  background:#FFF3E0; overflow:hidden; isolation:isolate}
.intro__bushes{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
.intro__hill{position:absolute; z-index:0; left:50%; top:calc(920 * var(--u));
  width:calc(1900 * var(--u)); height:calc(1050 * var(--u));
  transform:translateX(-50%); border-radius:50%; background:#83C85B; pointer-events:none}
.intro__cat{position:absolute; z-index:2; left:50%; top:calc(630 * var(--u));
  width:calc(206 * var(--u)); height:calc(290 * var(--u)); transform:translateX(-50%);
  object-fit:contain; pointer-events:none; transform-origin:50% 100%;
  animation:catSway 3.6s ease-in-out infinite}
@keyframes catSway{
  0%,100%{transform:translateX(-50%) rotate(-2deg)}
  50%{transform:translateX(-50%) rotate(2deg) scaleY(.98)}}
.intro__wildflowers{position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none}
.intro.is-out{opacity:0; pointer-events:none; transition:opacity var(--t-slow)}
.intro__scene{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  object-position:center bottom}
/* 인트로 타이틀 — 형태(바 칩 + 스티커 타이틀)·비율은 DESIGN.css .intro-title (DESIGN.md §2.3, v1.6).
   이 화면은 섹션 색·크기·간격만 덮어쓴다. 색은 B-2_00.home 의 ABSTRACTION 패널 팔레트
   (panel #F2789B / stroke #B33C63 / shadow #7B2442 / rim #FFB6CA) 에 맞춘 핑크 계열 [stated] */
.intro-title{--intro-title-top:120; --intro-title-gap:32; --tt-size:104;
  --tt-chip:#D45A83; --tt-chip-ink:#FFFFFF; --tt-fill:#FFFDF2;
  --tt-stroke:#F2789B; --tt-shadow:#B33C63; --tt-rim:#FFE0C7;
  --tt-color:#D45A83}
.intro__row{position:absolute; inset:0; z-index:1; pointer-events:none}
.intro__row img{position:absolute; left:calc(var(--flower-x) * var(--u)); top:calc(var(--flower-y) * var(--u));
  width:calc(150 * var(--u)); height:calc(150 * var(--u)); object-fit:contain;
  animation:sway 3.2s ease-in-out infinite}
.intro__row img:nth-child(1){--flower-x:490; --flower-y:755}
.intro__row img:nth-child(2){--flower-x:630; --flower-y:535; animation-delay:.3s}
.intro__row img:nth-child(3){--flower-x:885; --flower-y:430; animation-delay:.6s;
  width:calc(125 * var(--u)); height:calc(125 * var(--u))}
.intro__row img:nth-child(4){--flower-x:1150; --flower-y:545; animation-delay:.9s}
.intro__row img:nth-child(5){--flower-x:1300; --flower-y:760; animation-delay:1.2s}
@keyframes sway{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(calc(-10 * var(--u)))}}
/* 시작 버튼 — DESIGN.css .btn-bar (DESIGN.md §3.8). 이 화면은 위치·섹션 색만 */
.intro__cta{position:absolute; left:50%; margin-left:calc(var(--bb-w) * -.5 * var(--u));
  bottom:calc(126 * var(--u)); z-index:3;
  --face:var(--c-accent); --face-hover:#FFB13A; --face-active:var(--c-accent-dark,#C97A00)}

/* 다시하기 — DESIGN.css .btn-bar (DESIGN.md §3.8). 이 화면은 섹션 색만 */
/* .btn--retry / .btn--exit 색은 DESIGN.css 가 정한다 — DESIGN.md §8.3 */

/* ---------- 완료 팝업 ---------- */
.result{position:absolute; inset:0; z-index:40; display:none; place-items:center;
  background:rgba(20,12,36,.62)}
.result.is-on{display:grid}
.result__rays{position:absolute; width:calc(1500 * var(--u)); height:calc(1500 * var(--u));
  border-radius:50%; animation:spin 26s linear infinite; opacity:.22;
  background:repeating-conic-gradient(rgba(255,226,120,.9) 0 6deg, rgba(255,226,120,0) 6deg 20deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 18%,transparent 66%);
  mask-image:radial-gradient(closest-side,#000 18%,transparent 66%)}
@keyframes spin{to{transform:rotate(360deg)}}
.result__stack{position:relative; display:flex; flex-direction:column; align-items:center;
  gap:calc(104 * var(--u)); animation:pop .42s var(--e-pop)}   /* 꽃 아치가 넓어 버튼을 더 내린다 */
@keyframes pop{from{transform:scale(.82); opacity:0}to{transform:scale(1); opacity:1}}
.result__ring{position:relative; width:calc(1040 * var(--u)); height:calc(378 * var(--u))}
  /* 378u = 가장 낮은 꽃의 바닥(190 + 188). 박스가 내용을 감싸야 아래 gap 이 실제 간격이 된다 */
/* 글로우 — 꽃다발을 문제판에서 떼어 낸다 (§9.7 「완료 팝업」 760u radial) */
.result__glow{position:absolute; left:50%; top:calc(50% - 39 * var(--u)); width:calc(900 * var(--u)); height:calc(900 * var(--u));
  margin:calc(450 * var(--u) * -1) 0 0 calc(450 * var(--u) * -1); border-radius:50%; pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,243,180,.62), rgba(255,243,180,0) 72%);
  animation:glowPulse 3.4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1); opacity:.8}50%{transform:scale(1.06); opacity:1}}
.result__ring img{position:absolute; width:calc(188 * var(--u)); height:calc(188 * var(--u));
  object-fit:contain; filter:drop-shadow(0 calc(10 * var(--u)) calc(18 * var(--u)) rgba(0,0,0,.32));
  animation:bloomIn .5s var(--e-pop) backwards}
.confetti{position:absolute; width:calc(18 * var(--u)); height:calc(26 * var(--u));
  border-radius:calc(4 * var(--u)); animation:conf 2.4s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0); opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0}}
@keyframes bloomIn{from{transform:scale(.3) rotate(-24deg); opacity:0}}

/* ---------- 회전 안내 ---------- */
.rotate-gate{display:none}
@media (orientation:portrait){
  .app > :not(.rotate-gate){display:none}
  .rotate-gate{position:fixed; inset:0; z-index:99; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px; background:#8FD3F4; color:#174963;
    font-weight:800; font-size:26px; text-align:center; padding:32px}
  .rotate-gate svg{width:120px; height:120px; fill:none; stroke:#174963; stroke-width:2.4;
    stroke-linecap:round; stroke-linejoin:round; animation:tip 2s ease-in-out infinite}
  @keyframes tip{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 다른 활동과 동일한 1920×1200 프레임 -->
  <div class="safe">

  <!-- 문제풀이 배경 — 크림 베이지 바탕의 은은한 반복 꽃무늬 -->
  <svg class="scene" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <g id="gameFlower" fill="#F7EBD2">
        <ellipse cy="-11" rx="10.5" ry="13"/>
        <ellipse cy="-11" rx="10.5" ry="13" transform="rotate(72)"/>

var AC=null, master=null, bgmBus=null, bgmTimer=null, soundOn=true;
function ac(){

    bgmBus = AC.createGain(); bgmBus.gain.value = 1; bgmBus.connect(master);
  }
  if(AC.state === 'suspended') AC.resume();

}
function voice(f,dur,type,gain,cut,bus,delay){
  var c = ac(); if(!c || !soundOn) return;
  var t = c.currentTime + (delay||0);
  var o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
  o.type = type||'triangle'; o.frequency.setValueAtTime(f,t);

  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(gain||.08, t+.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(lp); lp.connect(g); g.connect(bus||master);
  o.start(t); o.stop(t+dur+.05);
}
function marimba(f,d,delay,gain){ voice(f,d||.42,'triangle',gain||.09,f*4+700,null,delay); }
function bell(f,d,delay,gain){ voice(f,d||.9,'sine',gain||.07,f*7+2000,null,delay); }

  var c = ac(); if(!c || !soundOn) return;
  var t = c.currentTime, o = c.createOscillator(), g = c.createGain();

    art.innerHTML = '<img class="art" src="' + FLOWER[id] + '" alt="">';
    b.setAttribute('aria-label','Flower ' + (row+1));
  } else {
    var chip = el('i','chip', b);
    chip.style.background = CHIP[id].face;
    chip.style.setProperty('--edge', CHIP[id].edge);
    b.setAttribute('aria-label','Color ' + (row+1));
  }
  var rec = { el:b, kind:kind, id:id, row:row };
  b.__rec = rec; tiles.push(rec); return rec;
}
function build(){
  tiles.length = 0;
  Array.prototype.slice.call(board.querySelectorAll('.tile,.port')).forEach(function(n){ n.remove(); });
  links.innerHTML = '';
  for(var r=0;r<5;r++){
    makeTile('sil', COL_SIL[r], r);
    makeTile('flw', COL_FLW[r], r);
    makeTile('clr', COL_CLR[r], r);
    port(X.p1, ROW_Y[r], 's'+COL_SIL[r]);
    port(X.p2, ROW_Y[r], 'fl'+COL_FLW[r]);
    port(X.p3, ROW_Y[r], 'fr'+COL_FLW[r]);
    port(X.p4, ROW_Y[r], 'c'+COL_CLR[r]);
  }
  linkAB = {}; linkBC = {}; stars = 0; armed = null;
  drawStars();
}
/* 진행 별 path — sequencing · pattern 과 동일한 24 viewBox 공용 별 [stated] */
var STAR_PATH = 'M12 2.45C12.62 2.45 13.16 2.82 13.41 3.39L15.15 7.34C15.34 7.77 15.75 8.07 16.22 8.12L20.52 8.56C21.78 8.69 22.28 10.24 21.33 11.07L18.08 13.92C17.72 14.24 17.56 14.72 17.66 15.19L18.58 19.42C18.85 20.66 17.53 21.62 16.44 20.97L12.73 18.76C12.28 18.49 11.72 18.49 11.27 18.76L7.56 20.97C6.47 21.62 5.15 20.66 5.42 19.42L6.34 15.19C6.44 14.72 6.28 14.24 5.92 13.92L2.67 11.07C1.72 10.24 2.22 8.69 3.48 8.56L7.78 8.12C8.25 8.07 8.66 7.77 8.85 7.34L10.59 3.39C10.84 2.82 11.38 2.45 12 2.45Z';
function drawStars(){
  var t = document.getElementById('track'); t.innerHTML = '';
  for(var i=0;i<5;i++){
    var s = document.createElementNS(SVGNS,'svg');
    s.setAttribute('viewBox','0 0 24 24');
    if(i < stars) s.setAttribute('class','on');
    var p = document.createElementNS(SVGNS,'path');
    p.setAttribute('d',STAR_PATH);
    s.appendChild(p); t.appendChild(s);
  }
}
function rowOf(kind, id){
  var col = kind === 'sil' ? COL_SIL : kind === 'flw' ? COL_FLW : COL_CLR;
  return col.indexOf(id);
}
function anchor(kind, id, side){
  var y = ROW_Y[rowOf(kind,id)];
  if(kind === 'sil') return [X.p1, y];
  if(kind === 'clr') return [X.p4, y];
  return [side === 'left' ? X.p2 : X.p3, y];
}

/* ============================================================
   4. 연결선
   ============================================================ */
function curve(a,b){
  var mx = (a[0]+b[0])/2;
  return 'M' + a[0] + ' ' + a[1] + ' C ' + mx + ' ' + a[1] + ', ' + mx + ' ' + b[1] + ', ' + b[0] + ' ' + b[1];
}
function addLink(type, id){
  var a = type === 'AB' ? anchor('sil',id) : anchor('flw',id,'right');
  var b = type === 'AB' ? anchor('flw',id,'left') : anchor('clr',id);
  var g = document.createElementNS(SVGNS,'g');
  g.dataset.type = type; g.dataset.id = id;
  var d = curve(a,b);
  ['ln ln--halo','ln ln--core','hit'].forEach(function(cls){
    var p = document.createElementNS(SVGNS,'path');
    p.setAttribute('d', d); p.setAttribute('class', cls); g.appendChild(p);
  });
  g.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); removeLink(type,id); sfxTap(); });
  links.appendChild(g);
  setPort(type === 'AB' ? 's'+id : 'fr'+id, true);
  setPort(type === 'AB' ? 'fl'+id : 'c'+id, true);
}
function removeLink(type,id){
  var g = links.querySelector('g[data-type="'+type+'"][data-id="'+id+'"]');
  if(g){ g.classList.add('is-gone'); setTimeout(function(){ g.remove(); }, 300); }
  if(type === 'AB'){ delete linkAB[id]; setPort('s'+id,false); setPort('fl'+id,false); }
  else { delete linkBC[id]; setPort('fr'+id,false); setPort('c'+id,false); }
  refresh(); armHint();
}
function setPort(key,on){
  var p = board.querySelector('.port[data-key="'+key+'"]');
  if(p) p.classList.toggle('is-on', !!on);
}
function tileOf(kind,id){
  for(var i=0;i<tiles.length;i++) if(tiles[i].kind === kind && tiles[i].id === id) return tiles[i];
  return null;
}
function refresh(){
  for(var id=1; id<=5; id++){
    var s = tileOf('sil',id), f = tileOf('flw',id), c = tileOf('clr',id);
    var ab = !!linkAB[id], bc = !!linkBC[id], done = ab && bc;
    s.el.classList.toggle('is-outlined', ab && !done);
    s.el.classList.toggle('is-bloomed', done);
    f.el.classList.toggle('tile--done', done);
    c.el.classList.toggle('tile--done', done);
  }
}

/* ============================================================
   5. 입력 — 탭·탭과 드래그를 모드 전환 없이 함께 받는다
   ============================================================ */
function toLocal(ev){
  var r = board.getBoundingClientRect();
  return [ (ev.clientX - r.left) / r.width * 1560, (ev.clientY - r.top) / r.height * 880 ];
}
function startDraft(rec, pt){
  clearDraft();
  var side = (rec.kind === 'flw') ? (pt[0] < X.flw ? 'left' : 'right') : null;
  var a = anchor(rec.kind, rec.id, side);
  draftEl = document.createElementNS(SVGNS,'path');
  draftEl.setAttribute('class','ln ln--draft');
  draftEl.setAttribute('d', curve(a, pt));
  draftEl.__a = a; draftEl.__side = side;
  links.appendChild(draftEl);
}
function moveDraft(pt){
  if(!draftEl) return;
  var rec = drag;
  if(rec && rec.kind === 'flw'){
    var side = pt[0] < X.flw ? 'left' : 'right';
    if(side !== draftEl.__side){ draftEl.__side = side; draftEl.__a = anchor('flw',rec.id,side); }
  }
  draftEl.setAttribute('d', curve(draftEl.__a, pt));
}
function clearDraft(){ if(draftEl){ draftEl.remove(); draftEl = null; } }
function shake(rec){
  rec.el.classList.remove('is-shake'); void rec.el.offsetWidth; rec.el.classList.add('is-shake');
  setTimeout(function(){ rec.el.classList.remove('is-shake'); }, 360);
}
function complete(a,b){
  clearDraft();
  if(!a || !b || a === b){ return; }
  var kinds = [a.kind, b.kind].sort().join('-');
  var type = null;
  if(kinds === 'flw-sil') type = 'AB';
  else if(kinds === 'clr-flw') type = 'BC';
  if(!type){ return; }                                   /* 무효 — 소리·흔들림 없음 */
  if(a.id !== b.id){ shake(a); shake(b); return; }        /* 오답 — 선이 사라질 뿐 */
  var id = a.id;
  if(type === 'AB'){ if(linkAB[id]) return; linkAB[id] = 1; }
  else { if(linkBC[id]) return; linkBC[id] = 1; }
  addLink(type, id);
  sfxLink(type === 'AB' ? 0 : 2);
  refresh();
  if(linkAB[id] && linkBC[id]) chainDone(id);
  armHint();
}
function chainDone(id){
  sfxChain();
  var s = tileOf('sil',id);
  pollen(s.el);
  stars++; drawStars();
  if(stars === 5) setTimeout(finish, 900);
}
function pollen(host){
  var cols = ['#FDE751','#FFF3B0','#E86FA7','#F0BDD9','#7E9ED3','#4FA84A'];
  for(var i=0;i<12;i++){
    var p = el('i','pollen', host);
    var ang = -Math.PI + (i+.5)/12 * Math.PI;
    var d = 60 + (i % 4) * 22;
    p.style.setProperty('--dx', (Math.cos(ang)*d).toFixed(1)+'px');
    p.style.setProperty('--dy', (Math.sin(ang)*d - 14).toFixed(1)+'px');
    p.style.background = cols[i % cols.length];
    p.style.animationDelay = (i*.012)+'s';
    (function(n){ setTimeout(function(){ n.remove(); }, 900); })(p);
  }
}

/* 힌트 — 8초 무입력이면 아직 안 이어진 그림자 하나만 */
function armHint(){
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){
    for(var id=1; id<=5; id++){
      if(!linkAB[id]){ var t = tileOf('sil',id); t.el.classList.add('is-hint'); sfxHint();
        setTimeout(function(){ t.el.classList.remove('is-hint'); }, 3700); break; }
      if(!linkBC[id]){ var f = tileOf('flw',id); f.el.classList.add('is-hint'); sfxHint();
        setTimeout(function(){ f.el.classList.remove('is-hint'); }, 3700); break; }
    }
    armHint();
  }, 8000);
}

board.addEventListener('pointerdown', function(ev){
  var t = ev.target.closest ? ev.target.closest('.tile') : null;
  if(!t){ if(armed){ armed.el.classList.remove('is-armed'); armed = null; } clearDraft(); return; }
  ev.preventDefault(); ac();
  var rec = t.__rec, pt = toLocal(ev);
  if(armed && armed !== rec){
    armed.el.classList.remove('is-armed');
    complete(armed, rec); armed = null; return;
  }
  if(armed === rec){ armed.el.classList.remove('is-armed'); armed = null; clearDraft(); return; }
  drag = rec; armed = rec; rec.el.classList.add('is-armed');
  startDraft(rec, pt);
  board.setPointerCapture && board.setPointerCapture(ev.pointerId);
});
board.addEventListener('pointermove', function(ev){
  if(!drag) return;
  moveDraft(toLocal(ev));
});
board.addEventListener('pointerup', function(ev){
  if(!drag) return;
  var over = document.elementFromPoint(ev.clientX, ev.clientY);
  var t = over && over.closest ? over.closest('.tile') : null;
  if(t && t.__rec !== drag){
    if(armed){ armed.el.classList.remove('is-armed'); armed = null; }
    complete(drag, t.__rec);
  } else {
    clearDraft();                 /* 제자리에서 뗐다 = 탭. armed 유지 */
  }
  drag = null;
});
board.addEventListener('pointercancel', function(){ drag = null; clearDraft(); });

/* ============================================================
   6. 완료 · 인트로 · 상단바
   ============================================================ */
function finish(){
  clearTimeout(hintTimer);
  var seq = 0;
  var iv = setInterval(function(){
    if(seq >= 5){ clearInterval(iv); showResult(); return; }
    var t = tileOf('sil', COL_SIL[seq]);
    t.el.style.transform = 'scale(1.08)';
    (function(n){ setTimeout(function(){ n.style.transform = ''; }, 300); })(t.el);
    marimba([N.C5,N.E5,N.G5,N.A5,N.C6][seq], .4);
    seq++;
  }, 340);
}
function showResult(){
  var ring = document.getElementById('resultRing');
  ring.innerHTML = '<i class="result__glow"></i>';
  [1,2,3,4,5].forEach(function(id,i){
    var img = document.createElement('img');
    img.src = FLOWER[id]; img.alt = '';
    var f = (i-2)/2;                                   /* -1 … 1 */
    var x = 520 + f*396, y = 190 - (1 - f*f)*100;      /* 아치 : 가운데가 가장 높다 */
    img.style.left = 'calc(' + (x-94) + ' * var(--u))';
    img.style.top  = 'calc(' + y + ' * var(--u))';
    img.style.animationDelay = (i*.11)+'s';
    ring.appendChild(img);
  });
  var res = document.getElementById('result');
  Array.prototype.slice.call(res.querySelectorAll('.confetti')).forEach(function(n){ n.remove(); });
  var cols = ['#FDE751','#E86FA7','#7E9ED3','#E83F39','#F0BDD9','#4FA84A','#FFF3B0'];
  var seed = 20260907;
  function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }
  for(var i=0;i<34;i++){
    var c = el('i','confetti', res);
    c.style.left = (10 + rnd()*80) + '%';
    c.style.top  = (16 + rnd()*28) + '%';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', ((rnd()-.5)*460).toFixed(0)+'px');
    c.style.setProperty('--dy', (140 + rnd()*520).toFixed(0)+'px');
    c.style.setProperty('--rot', ((rnd()-.5)*900).toFixed(0)+'deg');
    c.style.animationDelay = (rnd()*.5)+'s';
  }
  res.classList.add('is-on');
  swoosh(500, 4200, .5);
  fanfare();
}
document.getElementById('btnRetry').addEventListener('click', function(){
  sfxTap(); bgmStop();
  document.getElementById('result').classList.remove('is-on');
  build(); refresh(); armHint();
});
function startPlay(){
  sfxTap(); ac();
  document.body.classList.remove('is-intro');
  document.getElementById('intro').classList.add('is-out');
  setTimeout(function(){ say('instr'); armHint(); }, 400);
}
document.getElementById('btnStart').addEventListener('click', function(ev){ ev.stopPropagation(); startPlay(); });
document.getElementById('intro').addEventListener('click', startPlay);
document.getElementById('btnListen').addEventListener('click', function(){ sfxTap(); say('instr'); });
document.getElementById('btnBack').addEventListener('click', function(){ sfxTap(); location.href = 'B-2_00.home.html#abstraction'; });
  document.getElementById('btnExit').addEventListener('click', function(){ sfxTap(); location.href = 'B-2_00.home.html#abstraction'; });
document.getElementById('btnLang').addEventListener('click', function(){
  sfxTap();
  lang = (lang === 'en') ? 'ko' : 'en';
  document.getElementById('lgA').className = lang === 'en' ? 'on' : 'off';
  document.getElementById('lgK').className = lang === 'ko' ? 'on' : 'off';
  document.documentElement.lang = lang;
  document.getElementById('introMain').innerHTML = STR[lang].title;
  document.getElementById('btnStart').textContent = STR[lang].start;
  document.getElementById('btnRetry').querySelector('span').textContent = STR[lang].retry;
    document.getElementById('btnExit').querySelector('span').textContent = STR[lang].exit;
  document.getElementById('rotateMsg').textContent = STR[lang].rotate;
  say('instr');
});

/* 배경 씬의 들꽃 — 코드로 흩뿌린다 (고정 시드) */
(function(){
  var g = document.getElementById('fieldFlowers'); if(!g) return;
  var seed = 7, cols = ['#FFFFFF','#FDE751','#F0BDD9','#E86FA7'];
  function rnd(){ seed = (seed*1103515245 + 12345) % 2147483648; return seed/2147483648; }
  for(var i=0;i<70;i++){
    var x = rnd()*1920, y = 620 + rnd()*560, r = 5 + rnd()*7;
    var c = document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx',x.toFixed(0)); c.setAttribute('cy',y.toFixed(0));
    c.setAttribute('r',r.toFixed(1)); c.setAttribute('fill',cols[(i*3)%cols.length]);
    c.setAttribute('opacity','.55'); g.appendChild(c);
  }
})();
/* 인트로 꽃 줄 */
(function(){
  var row = document.getElementById('introRow');
  [1,2,3,4,5].forEach(function(id){
    var img = document.createElement('img'); img.src = FLOWER[id]; img.alt = ''; row.appendChild(img);
  });
})();

document.body.classList.add('is-intro');
build(); refresh();
})();
</script>
