<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노리팩토리 · 불러오는 중</title>
<link rel="preload" as="image" href="_img_svg/B_1/img_버스와아이들.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="DESIGN.css?v=20261014">
<style>
/* ============================================================
   공통 로딩 화면 — DESIGN.md §9.1 · §11 · §12.9 (글자·일러스트·점 스타일은 DESIGN.css 의 .pp-loader*)
   사용: loading.html?to=이동할상대경로&title=화면명&subtitle=영문명
   ============================================================ */
:root{--design-w:1920;--design-h:1200}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
html{background:#123f44}
body{position:relative;isolation:isolate;background-color:#1d7169!important;color:var(--pp-cream,#f0e2c4);font-family:Paperlogy,"Noto Sans KR",sans-serif}

/* 원본 크기를 유지한 공통 종이결. 크게 늘리지 않고 반복해 배경 전체를 덮는다. */
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:url("_img_png/paper/tx-paper-grain.webp") 0 0/calc(460 * var(--u)) calc(160 * var(--u)) repeat;
  opacity:.24;mix-blend-mode:soft-light}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(circle at 50% 46%,rgba(124,184,139,.20) 0 18%,rgba(14,61,63,0) 54%),linear-gradient(180deg,rgba(5,44,53,.08),rgba(5,44,53,.28));}

.stage{position:fixed!important;left:calc(50% - 960 * var(--u));top:calc(50% - 600 * var(--u));overflow:hidden!important}
</style>
<link rel="stylesheet" href="RESPONSIVE.css?v=3">
</head>
<body class="pp-kit">
<main class="stage theme-paper" aria-labelledby="loadingTitle">
  <section class="pp-loader" role="status" aria-live="polite" aria-busy="true">
    <div class="pp-loader__art" aria-hidden="true">
      <img src="_img_svg/B_1/img_버스와아이들.svg" alt="">
    </div>
    <h1 class="pp-loader__title" id="loadingTitle">잠시만 기다려 주세요</h1>
    <p class="pp-loader__subtitle" id="loadingSubtitle">LOADING</p>
    <div class="pp-loader__dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <span class="pp-loader__sr" id="loadingStatus">페이지를 불러오고 있습니다.</span>
  </section>
</main>
<noscript><p style="position:fixed;inset:auto 0 24px;text-align:center;color:#fff">JavaScript를 켜 주세요.</p></noscript>
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  const savedLang=(()=>{try{return localStorage.getItem('noriLang')}catch(e){return null}})();
  const lang=q.get('lang')||savedLang||'ko';
  const ko=lang!=='en';
  const title=(q.get('title')||'').trim().slice(0,48);
  const subtitle=(q.get('subtitle')||'').trim().slice(0,48);
  const titleEl=document.getElementById('loadingTitle');
  const subtitleEl=document.getElementById('loadingSubtitle');
  const statusEl=document.getElementById('loadingStatus');

  document.documentElement.lang=ko?'ko':'en';
  titleEl.textContent=title||(ko?'로딩중':'Loading');
  /* 화면 이름(title)이 있으면 그 아래에 '로딩중'/'LOADING', 없으면 제목이 곧 로딩 문구이므로 부제는 숨긴다 */
  subtitleEl.textContent=subtitle||(title?(ko?'로딩중':'LOADING'):'');
  subtitleEl.hidden=!subtitleEl.textContent;
  statusEl.textContent=ko?'페이지를 불러오고 있습니다.':'The page is loading.';
  document.title=`${titleEl.textContent} · Nori Factory`;

  const rawTarget=(q.get('to')||'').trim();
  if(!rawTarget)return;
  let target;
  try{
    const candidate=new URL(rawTarget,location.href);
    if(!/^(https?:|file:)$/.test(candidate.protocol))return;
    if(location.protocol!=='file:'&&candidate.origin!==location.origin)return;
    if(candidate.href===location.href)return;
    target=candidate.href;
  }catch(e){return}

  const started=performance.now();
  const requested=Number.parseInt(q.get('delay')||'1100',10);
  const minimum=Math.min(4000,Math.max(500,Number.isFinite(requested)?requested:1100));
  let moved=false;
  const go=()=>{
    if(moved)return;
    moved=true;
    const wait=Math.max(0,minimum-(performance.now()-started));
    setTimeout(()=>location.replace(target),wait);
  };

  const preload=document.createElement('iframe');
  preload.hidden=true;
  preload.tabIndex=-1;
  preload.setAttribute('aria-hidden','true');
  preload.addEventListener('load',go,{once:true});
  preload.addEventListener('error',go,{once:true});
  preload.src=target;
  document.body.appendChild(preload);
  setTimeout(go,5000);
})();
</script>
</body>
</html>
